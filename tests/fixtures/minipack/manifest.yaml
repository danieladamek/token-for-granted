title: 'Mini Token pack: a fixture'
short_title: Token for Granted
question: For a university researcher, a research office or a non-profit that wants grant money in the United States, what routes exist (research project grants, fellowships and training awards, programme and service grants, capacity and infrastructure money, from federal agencies and from foundations), what does each require, who actually decides, and what changed in 2025-26 that the official pages have not caught up with?
purpose: orientation
as_of: '2026-10-05'
authors:
- Manuscript Interrogator (commissioned guide)
venue: Commissioned guide — NOT PEER REVIEWED, NOT LEGAL, TAX OR COMPLIANCE ADVICE. Written by an AI research builder from public sources for a public audience; every record links to its governing text. No affiliation with any university, non-profit, foundation or agency.
year: 2026
plain_abstract: 'Token for Granted is a map for anyone at a university or a non-profit who needs grant money and has not applied before. It starts by asking who you are, what the money is for and where you stand, and leads to the routes that fit: research project grants, fellowships and training awards, grants for a programme or a service, and money for equipment and capacity, from federal agencies and from 65 foundations and other private grantmakers chosen as a sample. Each route carries what it requires, the registrations and standing you need first, the official text that governs it, and a search of open and forecast federal opportunities. A long read explains how grant money moves and who decides, and a dated page tracks what changed in 2025 and 2026, because much of it did. Written by an AI research builder from 2,563 public sources read on 4 and 5 October 2026; not peer reviewed; not advice.'
reading_minutes: 45
audience: a researcher, a research administrator or the director of a non-profit with no prior grant experience, with a second layer for the experienced applicant; assumes no grants vocabulary
