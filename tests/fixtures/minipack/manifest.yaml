opportunity_search:
  harvest:
  - 'Grants.gov daily XML extract (public, no key): every posted and forecast notice with who may apply, award limits and listing numbers; the main feed'
  - 'Grants.gov search2 and fetchOpportunity (no key): counts and single-record cross-checks at harvest time only'
  - 'Federal Register API (no key): funding notices, secondary'
  - NSF funding RSS
  - 'IRS exempt-organisation master file: the foundation directory'
  - 'IRS Form 990 e-file index: ties each foundation to its latest filing'
  live:
  - 'USAspending API (no key, CORS open): who has won under an Assistance Listing, split by universities and non-profits'
  - 'NSF Awards API (no key, CORS open): NSF award history'
  links_only:
  - ProPublica Nonprofit Explorer (no browser access; terms forbid redistribution)
  - NIH RePORTER (browser preflight refused)
  - each foundation's own page and grants database
  - Candid (paid data)
  not_probed:
  - the IRS Form 990-PF e-file filings themselves (grants paid, Part XIV line 2)
  note: Probed from GitHub Actions on 2026-10-04 and 2026-10-05 (source/probe-*.json). A page cannot query Grants.gov live, so the search is built wholly from the nightly harvest and says when that harvest ran. Harvested data is built into the Pages deployment and never committed.
disclaimer: Not legal, tax, financial or compliance advice. Rules, deadlines and court orders change; every record shows its own as-of date and links to the governing text. Nothing here is tailored to any institution.
