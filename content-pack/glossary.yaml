- id: grant
  term: Grant
  kind: methods
  variants:
  - grants
  short: Money a federal agency transfers to an outside body to carry out a public purpose set in law, without expecting
    to be closely involved in the work.
  definition: An award of money, or of another thing of value, that a federal agency transfers to an outside body to carry
    out a public purpose of support or stimulation that a law authorises [1851]. Under 31 U.S.C. 6304 an agency uses a grant
    agreement when substantial involvement between the agency and the recipient is not expected while the work is carried
    out; where it is expected, the instrument is a cooperative agreement [1851]. A newcomer may picture money handed to
    a person, yet at NSF an organisation submits the proposal and an unaffiliated individual is not eligible for direct
    funding [156]. A rule OMB proposed on May 29, 2026, which is not final, would remove fixed amount awards as a form of
    grant [1803].
  concept: grants-and-agreements-101
