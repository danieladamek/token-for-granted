- id: expenditure-responsibility
  term: Expenditure responsibility
  kind: methods
  variants: []
  short: The steps a private foundation must take when it funds an organisation that is not a public charity, to see that
    the grant is spent for its purpose and to report on it to the IRS.
  definition: 'The duty a private foundation takes on when it makes a grant to an organisation that is not a public charity:
    to make all reasonable efforts and set up procedures to see that the grant is spent only for its purpose, to get full
    reports from the grantee, and to report in detail to the IRS [2381]. Without it such a grant is a taxable expenditure
    under section 4945, while a grant to a public charity needs none of these steps [2380]. For this purpose grants include
    loans and program-related investments [2380]. Walmart''s page gives the foreign case: an organisation outside the United
    States must show equivalency to a public charity or be funded under expenditure responsibility [2433]. Some funders
    require public charity status outright: the Bank of America Charitable Foundation requires applicants to be "not classified
    as a private foundation" [2439].'
