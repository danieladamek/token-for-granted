- id: program-solicitation
  term: Program solicitation (NSF)
  kind: methods
  variants:
  - program solicitation
  - program solicitations
  - programme solicitation
  - solicitation
  - solicitations
  short: NSF's name for a focused funding notice that runs for a limited period and sets its own rules on who may submit
    and how.
  definition: 'One of NSF''s four kinds of funding opportunity, more focused than a programme description or a programme
    announcement [156]. It applies for a limited period and is used when NSF departs from the generic rules of its policy
    guide: limiting who may submit or how many proposals, restricting indirect costs, requiring preliminary proposals, adding
    review criteria or requiring cost sharing [156] [158]. Programme descriptions and programme announcements use the guide''s
    generic eligibility and preparation rules and are longer lasting [156] [158]. In August 2026 NSF called its twelve new
    solicitations Notices of Funding Opportunity [192]. An NSF opportunity page marked "Waiting for new publication", with
    no upcoming due dates, belongs to a programme whose last solicitation has run out of deadlines and has not been replaced
    [827] [857].'
