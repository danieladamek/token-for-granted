- id: center-for-scientific-review
  term: Center for Scientific Review (CSR)
  kind: science
  variants:
  - CSR
  - Center for Scientific Review
  short: The NIH centre that receives grant applications and organises their first level of peer review in study sections.
  definition: The part of NIH that organises the peer review of all NIH research proposals, cooperative agreements and research
    and development contracts [40]. It receives grant applications for NIH and some other HHS components and reviews them
    in study sections, which are grouped into review branches by discipline [40]. Until the change of 2025 it handled over
    78% of NIH grant review, and 23 institutes and centers reviewed the other 22% [55]. NIH announced on March 6, 2025 that
    all review would be centralised in CSR, which took over first-level review from the 23 institute review branches during
    2025 [55] [54]. An applicant may use the optional PHS Assignment Request Form to ask for assignment to a particular
    institute and review group [94] [97].
