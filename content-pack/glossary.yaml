- id: continuation
  term: Non-competing continuation
  kind: methods
  variants:
  - continuation
  - continuations
  - non-competing continuation
  - noncompeting continuation
  short: Funding for the next budget period of an award already made, issued without a new competition.
  definition: 'An award for a further budget period of a project that is already funded, issued without a new competition
    [21] [1151]. HRSA''s Bureau of Primary Health Care, for example, lists a Budget Period Progress Report noncompeting
    continuation among the funding for existing health centres [1151]. At NIH an annual progress report is due about 45
    or about 60 days before the next budget period starts, depending on the award [1954]. The amount can move with appropriations:
    NIH said FY 2026 continuation awards would generally be issued at the commitment level on the Notice of Award, and under
    the continuing resolution that opened fiscal year 2027 it stated that institutes may issue them below that level [21]
    [83]. The Indian Health Service has non-competing continuations submitted in GrantSolutions, while its new and competing
    continuation announcements are posted on Grants.gov [1186]. At HHS the Departmental Appeals Board hears a denial of
    a noncompeting continuation for failure to comply [1888].'
