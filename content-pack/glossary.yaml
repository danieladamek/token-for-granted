- id: budget-period
  term: Budget period and period of performance
  kind: methods
  variants:
  - budget period
  - budget periods
  - project period
  - period of performance
  - competitive segment
  short: The period of performance is the whole span of an award, from start date to end date. It is divided into budget
    periods, each funded in turn.
  definition: 'The period of performance is the time between the start and end date of a federal award, and it may contain
    one or more budget periods [1799]. A budget period is the funded portion during which the recipient is authorised to
    incur financial obligations; NIH''s policy glossary gives its length as usually 12 months [1799] [106]. Both pairs of
    dates are printed in the award document [1810]. Costs are incurred during the approved budget period, and an agency
    may let unobligated balances be carried forward to later ones [1831] [1815]. Some notices say project period for the
    whole span: one ACF notice funds a three-year project period with three one-year budget periods [1235]. NIH uses competitive
    segment for the initial project period of an award, of up to 5 years, or each extension from a renewal award [106].
    A renewal award begins a new and distinct period of performance [1816].'
