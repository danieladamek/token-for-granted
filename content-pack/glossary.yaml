  short: A summary of a project idea, about two pages long, that NSF asks for before certain kinds of proposal so that a
    programme officer can judge fit.
  definition: 'A concise summary of a project idea, sent to NSF before certain proposal types so that a programme officer
    can judge whether it fits [156] [250]. It goes by email or through NSF''s ProSPCT tool and is generally limited to two
    pages or 6000 characters [156]. For RAPID, EAGER, RAISE and planning proposals the principal investigator sends one
    first, and in BIO the proposal may follow only once the directorate has approved submission [156] [251] [185]. A solicitation
    can set a date for it: NSF 26-524 required concept outlines by November 19, 2026, ahead of a full proposal deadline
    of February 11, 2027 [267]. ARPA-E''s first stage has a similar name, the concept paper, and a "discourage" notice on
    one does not bar a full application [301] [302].'
