- id: supporting-organization
  term: Supporting organization
  kind: science
  variants:
  - supporting organizations
  - supporting organisation
  - supporting organisations
  short: A charity that counts as a public charity because of its relationship to one or more other public charities that
    it supports.
  definition: 'A charity that is a public charity because of its relationship to one or more other public charities that
    it supports [2238]. It must satisfy an organizational test, an operational test, a control test and a relationship test,
    and comes in three types [2372]. Type I is operated, supervised or controlled by its supported organisation, Type II
    is supervised or controlled in connection with it, and Type III is either functionally integrated or not [2372]. A Type
    III organisation that is not functionally integrated has its own payout rule: the greater of 85 percent of adjusted
    net income and 3.5 percent of the value of its non-exempt-use assets [2372]. Supporting organisations cannot use the
    short application, Form 1023-EZ [2050].'
