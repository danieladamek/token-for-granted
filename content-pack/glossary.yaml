  short: The Treasury system through which some federal agencies pay grant money to recipient organisations. The paying
    agency, not the recipient, starts the enrolment.
  definition: The Treasury system through which federal agencies transfer money to recipient organisations [1937]. NIFA
    describes it as a secure web-based payment and information system built by Treasury's Bureau of the Fiscal Service and
    the Federal Reserve Bank of Kansas City [1931]. The paying agency enrols the recipient, authorises its payments and
