- id: institutional-nomination
  term: Institutional nomination
  kind: methods
  variants:
  - nomination
  - nominations
  - nominating institution
  - nomination cap
  short: 'A rule under which a person cannot apply directly for an award: the institution puts the candidate forward, and
    the funder caps how many it may name.'
  definition: 'An arrangement in which a candidate for an award cannot apply directly and is put forward by the institution,
    or by a named officer of it, under a cap the funder sets, so that the institution chooses among its own faculty before
    the funder sees anything [2174] [2175]. The cap and the nominator are set on each programme page [2146] [2206] [2149].
    For the 2027 Pew Scholars award one nominee is invited from each of 212 participating institutions, and for the 2026
    Packard Fellowships the president of each of 50 invited institutions may make up to two nominations [2174] [2149]. Some
    fellowships are closed to all but a list of institutions the funder has chosen, and none of the pages read gives a way
    for an institution to ask to be added [2149] [2174] [2212]. A federal case: NEH''s Summer Stipends page states that
    institutions may nominate only one faculty member at a deadline [989].'
