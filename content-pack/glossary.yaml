  - authorized organizational representative
  - signing official
  short: The person an organisation authorises to submit applications on its behalf and to sign the certifications that
    go with them.
  definition: 'The person who holds an organisation''s authority to submit a federal application for it [1965] [548]. On
    Grants.gov it is a role: the E-Business Point of Contact named in SAM.gov holds the Expanded AOR role automatically
    and assigns roles to others, and an application can be submitted only by a user with the AOR role or an equivalent privilege
    [1916] [1895] [1965]. The holder also certifies for the organisation: at NSF, where the title is Authorized Organizational
    Representative, that person makes nine certifications with a proposal, among them conflict of interest and responsible
    and ethical conduct of research [257]. Only the Authorized Organizational Representative may submit a proposal through
    NASA''s NSPIRES [1921]. In eRA Commons the like role is the Signing Official, a business official with authority to
    bind the organisation, whom SAMHSA requires to hold the AOR role in Grants.gov [1911] [1909] [548].'
