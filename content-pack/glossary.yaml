  short: 'Two NSF proposal types: EAGER for early exploratory work on untested ideas, RAPID for time-sensitive work. Each
    starts with a concept outline to the programme officer.'
  definition: 'Two types of proposal defined in Chapter II.F of NSF''s proposal guide, the PAPPG: EAGER for exploratory
    work in its early stages on untested but potentially transformative research ideas, and RAPID for time-sensitive work
    [257] [251] [212]. The investigator first sends a concept outline to the programme director, and a full proposal follows
    once NSF allows it [166] [185]. Since December 8, 2025 a request may be for up to $400,000 over up to two years for
    EAGER and up to $300,000 over up to one year for RAPID, indirect costs included; the ceilings before were $300,000 and
    $200,000 [149]. NSF''s early-career page says EAGER proposals are reviewed internally, and a declined EAGER or RAPID
    proposal is not eligible for reconsideration [251] [258]. NSF proposed on June 24, 2026 to replace the PAPPG with a
    Guidance on Financial Assistance, which it aims to issue for use in early to mid FY2027 [152] [151].'
