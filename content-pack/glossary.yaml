- id: data-management-plan
  term: Data management and sharing plan
  kind: methods
  variants:
  - data management plan
  - DMS plan
  - data management and sharing plan
  short: 'A document in an application that says what will be done with the data a project produces: where the data will
    be kept, and when others may use them.'
  definition: A document in which an applicant says what will be done with the scientific data a project produces, including
    when the data will be shared and in which repositories [2029]. NIH's policy, in effect since January 25, 2023, applies
    to all NIH-funded research that generates scientific data, whatever the size of the award; training, fellowship and
    conference awards are among those that need no plan [124]. NIH programme staff, not peer reviewers, assess the plan,
    and the approved plan becomes a term and condition of the award [124]. NSF proposals carry a plan as well, created from
    April 27, 2026 with a tool in Research.gov [150]. NIH's list of initiatives in progress, last updated September 17,
    2026, includes eliminating the requirement on career development (K) awards and gives no effective date [2087].
