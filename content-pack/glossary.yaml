  definition: The system, run by NIH's electronic Research Administration (eRA), in which an applicant organisation and
    its people hold accounts for applications, awards and reports [1911] [1910]. The agencies eRA lists as supported include
    NIH, FDA, CDC, SAMHSA, AHRQ, the National Institute of Food and Agriculture and the Department of Defense [1913]. A
