- id: supplement
  term: Supplement (to an award)
  kind: methods
  variants:
  - supplements
  - administrative supplement
  - administrative supplements
  short: Extra money added to an award that is already running, asked for by the organisation that holds the award.
  definition: 'Additional funds added to an award that is already running [808]. At NIH an administrative supplement is
    a request for more funds during a current project period; it goes in under the administrative supplement parent announcement,
    PA-26-001, and does not require peer review [808] [1]. NIH tells the grant holder to contact the grants management and
    programme officials assigned to the award before submitting [808]. Some supplements pay for a person: at NSF the REU
    and INTERN supplements bring an undergraduate, or a graduate student''s internship, onto an existing award, and the
    awardee asks for the money, not the student [830] [870]. NSF advertises supplements in Dear Colleague Letters [158].
    A notice can lapse while the mechanism remains: NIH''s notice for re-entry supplements expired on September 9, 2025,
    and its supplements page, updated April 9, 2026, still names re-entry among the uses [793] [808].'
