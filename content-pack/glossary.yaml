- id: applicant-organization
  term: Applicant organization
  kind: science
  variants:
  - applicant organisation
  - applicant organizations
  - recipient organization
  short: The legal body that submits an application and, if it succeeds, holds the award. In most federal research funding
    it is an institution and not a person.
  definition: 'The organisation that submits an application and to which the award is made; the investigator is named in
    the application and is not the applicant [815] [816] [4]. NSF''s proposal guide says unaffiliated individuals are not
    eligible for direct funding, and NIH says the organisations it funds can be domestic or foreign, public or private,
    non-profit or for-profit [156] [117]. Registrations belong to it: for an NIH application the organisation registers
    in SAM, Grants.gov and eRA Commons [4] [117]. Before an award the agency reviews the risk the applicant poses, in an
    assessment that may weigh financial stability, management systems and audit findings [1809]. Some fellowships depart
    from the pattern: in NSF''s Graduate Research Fellowship the student applies, though the funds are awarded to the institution
    where the fellow enrols [818].'
