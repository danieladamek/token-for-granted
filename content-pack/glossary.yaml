- id: block-grant
  term: Block grant
  kind: methods
  variants:
  - block grants
  short: Federal money paid to a state, territory, tribe or local government, which then funds local providers. A non-profit
    applies to that government, not to the federal agency.
  definition: Federal money paid to a state, territory, tribe or local government, which then funds local providers [1292]
    [1259]. The two SAMHSA block grants and the Title V Maternal and Child Health block grant are awarded to states and
    territories, and a state agency applies [1130] [1219] [1168]. HUD likewise gives no Community Development Block Grant
    money directly to non-profits [1292]. How the term differs from a formula grant is not set out in the Grants.gov glossary,
    which had no entry for it when read on October 4, 2026 [1880]. 2 CFR 200.101(e) takes block grants authorised by the
    Omnibus Budget Reconciliation Act of 1981 out of subparts C, D and E of the Uniform Guidance, except for specified provisions
    [1805]. State plans for the SAMHSA block grants are made public for comment [1219]. The FY 2027 President's budget,
    a request, proposes to consolidate the two SAMHSA block grants and State Opioid Response grants into one new block grant
    [535].
  concept: formula-and-pass-through-101
