- id: operating-foundation
  term: Private operating foundation
  kind: science
  variants:
  - operating foundation
  - operating foundations
  short: A private foundation that devotes most of its resources to carrying out its own charitable activities. The tax
    on failing to pay out a minimum amount does not apply to it.
  definition: A private foundation that devotes most of its resources to the active conduct of its own exempt activities
    [2371]. It is not subject to the excise tax on failure to distribute income, and it still pays the tax on net investment
    income and follows the other private foundation rules [2371]. A foundation claiming the status completes Part XIII of
    Form 990-PF, and any grants it paid still appear in Part XIV, line 3 [2388] [2387]. The other kind, the non-operating
    foundation, filed 91.2% of private foundation returns for tax year 2022 [2410]. The short application for tax exemption,
    Form 1023-EZ, is closed to private operating foundations [2050].
