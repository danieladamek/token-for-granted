  short: The identifier an agency gives to one funding notice. It appears in the notice's summary on Grants.gov.
  definition: 'The identifier an agency assigns to a single funding notice [1800]. 2 CFR 200.204(a) lists it among the summary
    items displayed on Grants.gov, with the agency name, the opportunity title, the announcement type, the Assistance Listing
    number, funding details and key dates [1800]. It marks one notice, where the Assistance Listing number marks the programme
    [1800] [1808]. Agencies each write it their own way: one of NIH''s parent R01 notices is PA-25-301, the Department of
    Energy''s FY 2027 annual notice is DE-FOA-0003665, and HRSA''s FY 2027 Service Area Competition notice is HRSA-27-005
    [1] [277] [1204]. One competition can run under several numbers: the FY 2027 MURI announcement carries one from each
    of three offices, N0001426SF002, W911NF26S1000 and NOFOAFRLAFOSR20260002 [325].'
