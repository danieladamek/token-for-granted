- id: federal-audit-clearinghouse
  term: Federal Audit Clearinghouse
  kind: science
  variants:
  - FAC
  short: The government site, run by GSA, where an organisation files its single audit and where anyone may search the audits
    that have been filed.
  definition: The repository of record to which an organisation submits its single audit, run by GSA's Technology Transformation
    Services [1881] [1939]. An auditee uploads a PDF of the audit reporting package and submits the SF-SAC data collection
    form as a series of XLSX workbooks [1938]. Everyone who edits or certifies a submission needs a Login.gov account; credentials
    from the former Census Bureau clearinghouse do not work [1938] [1881]. The site makes reporting packages public, and
    anyone may search filed audits [1939] [1881]. It has a helpdesk and a list of cognizant agency contacts [1881]. No fee
    for submission is stated on the pages read [1881].
