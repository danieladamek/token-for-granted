  short: A member of a funder's staff who looks after a field or a programme and is the person an applicant asks whether
    a project fits.
  definition: 'A member of a funding agency''s staff who looks after a scientific area or a programme and is named in the
    funding notice as its contact [120] [158]. At NIH, where the title is programme official, such staff can say whether
    a plan fits their institute and help interpret review feedback, and they do not co-write or edit applications or discuss
    review details [92] [120]. At NSF the programme officer obtains the reviews and makes the recommendation to award or
    decline; NSF''s biology directorate calls the post program director [157] [186]. At the Air Force Office of Scientific
    Research the contact is the programme officer for the research area, while the DOE Office of Science and DARPA say programme
    manager [339] [281] [343]. The "Program Director" in NIH''s PD/PI is a different person: the title belongs to the investigator
    named in the application [12] [4].'
