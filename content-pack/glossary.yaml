  - Graduate Research Fellowship Program
  short: An NSF fellowship that gives a graduate student three years of support for a research-based degree in a STEM field.
    The student applies directly to NSF.
  definition: An NSF fellowship that gives a graduate student three years of support, to be used within a five-year fellowship
    period, for a research-based master's or doctoral degree in a STEM field [818] [817]. The student applies directly to
    NSF; the funds are awarded to the institution where the fellow enrols, and there is no post-graduate service requirement
    [818] [819]. A year of support is a $37,000 stipend and a $16,000 cost-of-education allowance paid to the institution
    [817] [818]. Under the solicitation for the FY 2027 competition an applicant must be a U.S. citizen, national or permanent
    resident, a graduate student may apply only once, in the first year of the first graduate programme, and second-year
    graduate students are not eligible [818]. The FY 2027 budget request, which is not enacted, asks for $246.54 million
    for the programme against $433.00 million in the FY 2025 current plan [255].
