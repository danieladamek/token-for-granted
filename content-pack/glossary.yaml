  - Institutional Development Award
  short: NIH's programme to build biomedical research capacity in states that have had low levels of NIH funding. An institution
    qualifies by being in a listed state.
  definition: 'A congressionally mandated NIH programme that builds research capacity in states that historically have had
    low levels of NIH funding; the Division for Research Capacity Building at the National Institute of General Medical
    Sciences administers it [1543]. An institution is eligible by its location, and the list is 23 states and Puerto Rico
    [1546] [1584]. The programme has five components: COBRE, INBRE, the clinical and translational research programmes,
    co-funding, and the regional entrepreneurship programme I-RED [1543]. Under co-funding NIGMS adds up to $350,000 in
    total costs for each of the first two years to R01, R15 and MIRA R35 applications from investigators in IDeA states
    that an NIH institute did not select for funding [1553]. The pages and notices read do not state the rule by which a
    state enters or leaves the list, which is not the same as the NSF EPSCoR list [1543] [1545] [1517].'
