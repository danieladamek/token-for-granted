  - National Research Service Award
  - Kirschstein
  short: The family of NIH research training awards, named for Ruth L. Kirschstein, that pay a stipend to a student or postdoctoral
    researcher on a fellowship or a training grant.
  definition: NIH's family of research training awards that pay a stipend as a subsistence allowance; the full name adds
    Ruth L. Kirschstein [736]. They come as individual fellowships, such as the F31 and F32, and as trainee places on institutional
    training grants, such as the T32 [736] [737] [750]. To hold one a person must be a citizen or a non-citizen national
    of the United States, or lawfully admitted for permanent residence [736] [750]. Support is limited in aggregate to 5
    years at the predoctoral level, 6 for dual-degree training, and to 3 years at the postdoctoral level, counting training
    grant appointments and individual fellowships together [736] [737]. NIH sets the stipend levels once a fiscal year in
    a notice, and the first 12 months of postdoctoral support bring a service payback obligation [732] [737].
