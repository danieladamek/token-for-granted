- id: donor-advised-fund
  term: Donor-advised fund (DAF)
  kind: science
  variants:
  - DAF
  - DAFs
  - donor-advised fund
  - donor-advised funds
  short: A separately identified fund held by a sponsoring charity. The sponsor has legal control of the money, and the
    donor keeps the right to advise where grants go.
  definition: A separately identified fund or account that a section 501(c)(3) organisation, called a sponsoring organisation,
    maintains and operates [2373]. Once the donor gives, the sponsoring organisation has legal control of the money, and
    the donor or the donor's representative keeps advisory privileges over distributions and investments [2373]. Community
    foundations are among the sponsors, and a grant from such a fund starts with the donor's advice, not with an application
    to the sponsor [2428] [2373]. The New York Community Trust tells applicants "We cannot refer you to donors" [2416].
    Gifts to donor-advised funds do not qualify for the deduction for non-itemisers that begins with tax year 2026 [2389].
