  short: 'NIH''s code for its research project grant: one defined project, led by a named investigator or investigators,
    for up to five years.'
  definition: The NIH activity code for the research project grant, which supports a discrete, specified project carried
    out by the named investigator or investigators in their area of competence [3]. NIH calls it its "most commonly used
    grant program for independent research projects" [42]. Under the parent notice the budget is not capped and the project
    may run up to five years, and an R01 can be renewed by competing for a further project period [4] [42]. New applications
    have three standard due dates a year and go in through a parent announcement [2] [1]. NIH reported an R01-equivalent
    success rate of 13.0% for FY 2025, against 18.7% for FY 2024, and an average FY 2025 award of $664,005 [81].
