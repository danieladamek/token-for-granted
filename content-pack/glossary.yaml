  short: The numbered collection in which federal regulations are printed. A citation such as 2 CFR part 200 gives the title
    first and the part after it.
  definition: 'The collection in which the regulations of federal agencies are printed, arranged in numbered titles that
    are divided into parts and sections [1067] [1013] [2103]. A citation gives the title first and the part after it: 2
    CFR part 200 is part 200 of title 2, and 34 CFR part 662 is a Department of Education programme regulation in title
    34 [2103] [1013]. A reader meets the text in two forms. One is an annual edition, such as the one revised as of January
    1, 2025 [1805]. The other is the eCFR, an online text that shows the date to which a title is current and the date it
    was last amended, and keeps a record of each change to a part [2102] [2103].'
