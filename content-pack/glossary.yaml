- id: lobbying-certification
  term: Lobbying certification
  kind: methods
  variants:
  - SF-LLL
  - certification regarding lobbying
  short: A statement, required for larger awards, that the applicant has made no unallowable lobbying payments and will
    report non-federal funds used for lobbying.
  definition: 'A statement that a person who requests or receives a federal grant or cooperative agreement of more than
    $100,000 files, with a disclosure form if one is required [2039]. HHS describes it as a statement that the applicant
    has not made unallowable lobbying payments and will report non-federal funds used for lobbying [528]. The rule comes
    from 31 U.S.C. 1352 and each agency codifies it; HHS''s version is 45 CFR part 93 [2039]. At NSF the governmentwide
    certification is made in SAM.gov [257]. The disclosure form is Standard Form LLL, Disclosure of Lobbying Activities:
    the Office of Justice Programs requires it if the applicant has paid or will pay anyone to lobby and the award exceeds
    $100,000 [619]. A recipient collects certifications from subrecipients above $100,000 [2039]. Under the cost principles,
    lobbying costs are themselves unallowable [1841].'
