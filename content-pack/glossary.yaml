- id: other-support
  term: Other support (current and pending support)
  kind: methods
  variants:
  - other support
  - current and pending support
  - current and pending (other) support
  short: A disclosure by each senior person on an application of their sources of support, foreign ones included, made on
    a government-wide form.
  definition: A disclosure in which each senior/key person on an application lists sources of support, foreign ones included
    [247] [31]. It is made on the Current and Pending (Other) Support form, one of two government-wide Common Forms written
    to implement NSPM-33, and the form is produced in SciENcv [249] [1943]. NIH has required the Common Forms for due dates
    on or after January 25, 2026, and each person, not a delegate, certifies in SciENcv that the forms are current, accurate
    and complete [31]. NSF requires each person to certify the information before submission, and undisclosed current support
    identified later is reported within 30 calendar days [257] [2004]. From October 1, 2025 NIH recipient institutions train
    senior/key personnel on disclosing other support and keep a written, enforced policy [128].
