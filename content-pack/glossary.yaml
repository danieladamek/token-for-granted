  short: A court order that bars an agency from carrying out or enforcing a policy or action. It protects the parties the
    order names.
  definition: 'A court order that bars an agency from carrying out or enforcing a policy or action [24] [1479]. In the cases
    this guide records a preliminary injunction comes early in a suit and a permanent one with the judgment: a district
    court enjoined NIH''s notice of a 15 percent indirect cost rate on March 5, 2025, later made the injunction permanent
    and vacated the notice, and the First Circuit affirmed on January 5, 2026 [24]. A court order protects only the parties
    and classes it names; the order of September 21, 2026 against five departments'' notices on public benefits bars enforcement
    against the plaintiff states and the District of Columbia [1867] [1879] [1479]. An injunction can itself be undone on
    appeal: on February 6, 2026 the Fourth Circuit vacated a nationwide preliminary injunction against provisions of Executive
    Orders 14151 and 14173 [1865].'
