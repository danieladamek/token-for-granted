- id: assistance-listing
  term: Assistance Listing
  kind: notation
  variants:
  - Assistance Listings
  - assistance listing number
  - CFDA number
  - CFDA
  short: The entry, with its number, that each federal assistance programme has in the public catalogue kept at SAM.gov.
  definition: 'A programme''s entry in the Assistance Listings, the public catalogue of federal assistance programmes that
    the General Services Administration keeps at SAM.gov [1799] [1808]. Each programme has a listing and a number, and that
    number appears in the funding notice and in the award document [1800] [1810]. A listing gives the programme''s purpose
    and goals, whether its awards are discretionary or non-discretionary, the projected funds, the general eligibility requirements
    and whether single audit requirements apply [1808]. Under 2 CFR 200.203 an agency assigns a listing before making awards,
    except in exigent circumstances [1808]. A NIAID cooperative agreement notice, for example, carries Assistance Listing
    93.855 [116]. The label CFDA appears beside the number on some pages: CDMRP''s announcement of its FY 2026 appropriation
    gives Assistance Listing (CFDA) 12.420 [295]. A pass-through entity gives the listing''s title and number to each subrecipient
    [1823].'
