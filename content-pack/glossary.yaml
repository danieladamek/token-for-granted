  - payback obligation
  short: 'A condition of some training awards and scholarships: the recipient owes a period of qualifying work afterwards,
    or may have to repay the money.'
  definition: 'A duty attached to some awards made for a person''s training: to do a set period of qualifying work afterwards,
    or to repay [769] [919]. Under NIH''s NRSA the first 12 months of postdoctoral support bring a payback obligation, discharged
    by an equal number of months of further postdoctoral NRSA support or of health-related research, research training or
    teaching averaging at least 20 hours a week, begun within 2 years of the end of support [737] [769]. A signed Payback
    Agreement Form (PHS 6031) accompanies the activation notice, and NIH may extend the time, waive the obligation or require
    repayment with interest within 3 years [737] [769]. The defence SMART scholarship leads to civilian employment at a
    department facility, and a 2019 Federal Register document set the period owed at the period of degree study covered
    [917] [919]. NSF''s Graduate Research Fellowship has no post-graduate service requirement [819].'
