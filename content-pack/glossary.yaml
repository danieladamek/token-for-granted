  short: The office inside an applicant organisation that explains the application process and roles to its researchers
    and sets up their system accounts.
  definition: 'The office of an applicant organisation to which NIH''s help and planning pages send a researcher first:
    it explains the process and the roles and sets up system accounts [146] [119]. System accounts are an example: in eRA
    Commons the organisation''s Signing Official or Account Administrator creates the accounts of PD/PIs and other personnel
    [1910] [548]. Where a foundation takes only one or a few nominees from an institution, the institution holds an internal
    competition first, and research offices run that selection [2175] [2134]. Research offices administer foundation awards
    that are made to the institution on behalf of a named researcher, and not those paid to the person [2165]. Names vary;
    NIH''s pages say office of sponsored research [146] [119].'
