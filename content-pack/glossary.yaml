  short: A regulation in its adopted form, published in the Federal Register with the date on which it takes effect.
  definition: 'The document, published in the Federal Register, by which an agency adopts or changes a regulation and states
    when it takes effect [2096] [2008]. The Department of Energy''s final rule on conflict of interest policies was published
    July 16, 2026 at 91 FR 43511 and took effect August 17, 2026, when it superseded an interim policy [2096]. A rule can
    be in effect before all of it applies: the HHS final rule revising 42 CFR part 93 on research misconduct was published
    September 17, 2024, was effective January 1, 2025, and all of its requirements apply on or after January 1, 2026 [2008].
