  short: 'The agency official responsible for the business side of an award, as distinct from its science: review, negotiation,
    award and administration.'
  definition: 'The official of a funding agency who is responsible for the business management of awards, as distinct from
    their scientific content [106] [117]. NIH''s policy statement defines the post as "An NIH official responsible for the
    business management aspects of grants and cooperative agreements, including review, negotiation, award, and administration."
    [106] At NIH, grants management officers and specialists handle the business side while programme officials handle the
    scientific and programmatic side [117] [120] [106]. Other agencies have like posts: each SAMHSA notice names a contact
    in its Division of Grants Management for budget questions, NSF''s Division of Grants and Agreements carries out a business
    review, and in one Labor Department announcement the Grant Officer makes the selection [1112] [157] [1300].'
