- id: status-label
  term: Status of a programme record
  kind: science
  variants:
  - status label
  - status labels
  short: The one-word label this guide puts on each programme record to say where its competition stood on the day the funder's
    pages were read.
  definition: 'A label of this guide''s own on every programme record, saying where the programme''s competition stood on
    the day its pages were read; each record carries that date. The labels are: open (a notice is in force and takes applications,
    or its next due date is still ahead); forecast (no open notice, and a forecast or an announced date for the next one);
    closed (the last deadline has passed and the funder''s page shows the programme continuing); expired (the announcement
    lapsed, was archived or was ended early, and nothing replaces it); not-competed; no-current-notice; formula (money allotted
    by formula or block grant, with no federal competition a non-profit can enter); and unconfirmed (the pages would not
    load or do not settle the question). A programme with several notices takes the status of the notice a new applicant
    would use. A status is a reading on one day and goes out of date quickly.'
  concept: reading-a-funding-notice
