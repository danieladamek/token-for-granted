- id: financial-assistance
  term: Federal financial assistance
  kind: methods
  variants:
  - financial assistance
  short: The federal term for grants, cooperative agreements and other aid given to carry out a public purpose, as distinct
    from the Government buying something for itself.
  definition: What a federal agency gives when it transfers money, or another thing of value, to an outside body to carry
    out a public purpose that a law authorises, as against buying property or services for the Government's own use [1851].
    The grant agreement and the cooperative agreement are the two instruments the Federal Grant and Cooperative Agreement
    Act provides for such a transfer [1851]. Subparts A and B of the Uniform Guidance apply to all federal financial assistance,
    and its audit subpart also reaches loans and other assistance under the Single Audit Act [1805]. The Grants.gov glossary
    describes the Assistance Listings as covering programmes that provide grants, loans, scholarships, insurance and other
    assistance [1880]. An organisation needs an active SAM.gov entity registration before it applies for such assistance
    as a prime awardee [1897] [1899]. OMB's proposed rule of May 29, 2026 is titled "Regulation for Federal Financial Assistance";
    it is not final, and Public Law 119-103 bars a rule arising from it through December 11, 2026 [1858] [1480].
  concept: grants-and-agreements-101
