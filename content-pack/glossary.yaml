  - earmarks
  - congressionally directed project
  - congressionally directed projects
  short: Money that Congress directs to a named recipient and project in an appropriations act. The House and the Senate
    each have a name for it.
  definition: 'Money for a specific recipient, project and amount that Congress names in an appropriations act; the House
    calls it Community Project Funding and the Senate Congressionally Directed Spending [1667] [1674]. An organisation cannot
    apply to either committee: it asks its House Member or a Senator, on that office''s own deadline, and the office decides
    whether to submit the request [1667] [1674]. Recipients may be state, local or tribal governments and certain eligible
    non-profits, and for-profit entities are excluded in both chambers [1667] [1675]. Being named does not release the money,
    since the named recipient still applies to the agency [1686] [1672]. Congress designated no such funds in FY 2025 [1680]
    [1755]. FY2026 projects were enacted in four laws signed between November 12, 2025 and April 30, 2026, and FY27 requests
    were due to the committees between March 13 and May 7, 2026 [1677] [1668] [1675].'
