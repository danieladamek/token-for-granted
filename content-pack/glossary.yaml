- id: cooperative-agreement
  term: Cooperative agreement
  kind: methods
  variants:
  - cooperative agreements
  short: An award like a grant, except that the agency expects to be substantially involved in the work while it is carried
    out.
  definition: 'An instrument that transfers a thing of value to carry out a public purpose authorised by law, as a grant
    does, and that an agency uses under 31 U.S.C. 6305 when substantial involvement is expected between it and the recipient
    during the work [1851]. The statute does not define that involvement, and Appendix I to 2 CFR part 200 requires the
    funding notice to describe what the agency expects [1848]. A pass-through entity may also be the substantially involved
    party [1799]. At NIH these awards carry U codes, such as the U01, and each notice names the roles of NIH staff and a
    dispute panel [116]. One NIAID notice puts it this way: "After award, NIH scientific or program staff will assist, guide,
    coordinate, or participate in project activities." [116]'
  concept: grants-and-agreements-101
