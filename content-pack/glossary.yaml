- id: direct-costs
  term: Direct costs
  kind: methods
  variants:
  - direct cost
  short: Costs that can be tied to one particular award, such as the salaries and supplies of the project it funds.
  definition: Costs that can be identified specifically with a particular final cost objective, such as a federal award
    [1835]. Under 2 CFR 200.413 it is the association of a cost with an award that decides whether the cost is direct or
    indirect [1835]. Salaries of administrative and clerical staff may be charged directly only if the services are integral
    to the award, the individuals can be specifically identified with it, and the costs are not also recovered as indirect
    costs [1835]. A cost may not be charged as direct if the same kind of cost in like circumstances is treated as indirect
    [1831]. Most direct costs, among them salaries and wages, materials and supplies, and travel, form the base to which
    an indirect cost rate is applied [1799].
