  - cognizant agency
  - cognizant federal agency
  short: The one federal agency that reviews, negotiates and approves an organisation's indirect cost rate on behalf of
    all federal agencies.
  definition: The single federal agency that reviews, negotiates and approves an organisation's indirect cost rate proposal
    on behalf of all federal agencies [1799]. For an institution of higher education it is HHS or the Department of Defense's
    Office of Naval Research, normally whichever provided more funds directly to the institution for the most recent three
    years, and the assignment continues for five years [1849]. For a non-profit it is the federal agency with the largest
    dollar value of awards directly funded to the organisation [1850]. HHS does the work through Cost Allocation Services,
    which takes proposals through its Indirect Cost Allocation System portal [1860]. NSF's Cost Analysis and Pre-Award Branch
    negotiates for about 100 organisations [163]. Where a cost item needs prior approval as an indirect cost, the approval
    comes from this agency [1834].
