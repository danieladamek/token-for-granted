- id: de-minimis-rate
  term: De minimis rate
  kind: methods
  variants:
  - de minimis
  - de minimis indirect cost rate
  short: A flat indirect cost rate that an organisation with no negotiated rate may charge without negotiating one with
    the government.
  definition: 'A flat percentage at which an organisation with no current federally negotiated rate may charge indirect
    costs without negotiating [1802]. Under 2 CFR 200.414(f) it is up to 15 percent of modified total direct costs; no documentation
    is needed to justify it, and it may be used indefinitely [1802]. HRSA records that HHS raised it from 10 to 15 percent
    effective October 1, 2024 [529]. Two agency texts still print the older figure: NIH''s policy statement as fetched and
    NSF''s guide as printed in 2024 give 10% [64] [257]. A programme whose statute or notice sets a lower limit, such as
    the 8 percent HHS limit on training grants, is governed by that limit [1884]. This 15 percent is a different thing from
    the 15 percent caps that four agencies tried to place on negotiated rates in 2025 [1802] [24].'
