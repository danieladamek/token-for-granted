- id: procurement-contract
  term: Procurement contract
  kind: methods
  variants:
  - procurement contracts
  short: The instrument an agency uses to buy property or services for the Government's own use. It is not a grant, and
    this guide does not cover it.
  definition: 'The legal instrument a federal agency uses when the principal purpose of a transaction is to acquire property
    or services for the direct benefit or use of the United States Government, under 31 U.S.C. 6303 [1851]. It is one of
    three instruments that federal law gives an agency, beside the grant and the cooperative agreement, and the choice among
    them follows from the purpose of the transaction [1851]. 2 CFR 200.201 requires the agency or pass-through entity to
    decide on the instrument under these sections [1807]. Contracts under the Federal Acquisition Regulation are outside
    this guide [1851]. One announcement can still lead to either kind of instrument: ONR''s long-range broad agency announcement
    lists procurement contracts, grants, cooperative agreements and other transaction agreements [334].'
  concept: grants-and-agreements-101
