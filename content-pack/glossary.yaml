    [2054]. An organisation is presumed to be a private foundation unless it requests and qualifies for a determination
    as a public charity [2054]. The class includes churches, schools, hospitals, medical research organisations, publicly
    supported organisations that receive a specified portion of their support from public sources, and certain supporting
    organisations [2054]. The difference shows in the annual return and the rules: a private foundation files Form 990-PF
    whatever its size and is subject to operating restrictions and excise taxes [2055] [2054]. Some funders ask for this
    class by name; one community trust limits grants to section 501(c)(3) agencies "that are not classified as private foundations"
    [2423].'
