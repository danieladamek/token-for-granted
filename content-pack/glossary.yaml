- id: nih-grants-policy-statement
  term: NIH Grants Policy Statement
  kind: methods
  variants:
  - NIHGPS
  short: NIH's governing policy guide for its grants. By accepting an award a recipient agrees to follow it unless the notice
    of award says otherwise.
  definition: The policy guide that governs NIH grant awards [35]. By accepting a grant award a recipient agrees to comply
    with its requirements unless the notice of award states otherwise [118]. The version in force is dated March 2026; it
    folds in Guide notices in effect as of March 17, 2026 and supersedes the April 2024 version [98] [35]. NIH continues
    to publish interim policy changes and clarifications as Guide notices, and a later notice can supersede the statement
    [98] [35]. It is a separate document from the HHS Grants Policy Statement, which covers other HHS agencies and does
    not apply to awards made by NIH [527]. Its section on termination lists, among other grounds, that an award no longer
    effectuates programme goals or agency priorities [139].
