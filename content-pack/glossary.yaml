- id: letter-of-intent
  term: Letter of intent
  kind: methods
  variants:
  - letters of intent
  short: A short notice sent to a funder before the application, saying that one is coming. Some notices require it and
    others make it optional.
  definition: 'A short notice sent to the funder ahead of the application [412] [404]. At NSF it is non-binding and lets
    staff gauge the size of a competition, yet where a solicitation requires one and it is missing, the full proposal is
    not accepted [156]. Whether it is required varies by notice: AFRI workshop grants require one, the FY 2026 AFRI Strengthening
    Agricultural Systems notice set a letter of intent date of February 26, 2026 ahead of its application deadlines, and
    NOAA''s FY 2026 RISA notice made it optional [404] [412] [434]. PCORI makes it a gate: an applicant submits one by a
    fixed deadline, is notified of its status, and only then may submit a full application [599] [591]. In the two FY26
    CDMRP announcements read, the pre-application that starts every application is a letter of intent [330] [356].'
