  - Form 1023-EZ
  - 1023-EZ
  short: The application an organisation files with the IRS to be recognised as tax-exempt under section 501(c)(3). Form
    1023-EZ is a shorter version open only to small organisations.
  definition: 'The application on which an organisation asks the IRS to recognise it as exempt under section 501(c)(3),
    a step separate from becoming a non-profit under state law; Form 1023-EZ is the shorter version [2046] [2049] [2047].
    The short form is open only to an organisation that answers "No" to every question on its eligibility worksheet, whose
    first questions ask whether annual gross receipts exceed $50,000 and whether total assets have a fair market value above
    $250,000 [2050]. Supporting organisations and private operating foundations are among those that cannot use it [2050].
    Both are completed on Pay.gov, where the user fee is paid: $600 for Form 1023 and $275 for Form 1023-EZ [2046] [2049]
    [2051]. The IRS says it issues 80% of Form 1023-EZ determinations within 22 days and 80% of Form 1023 determinations
    within 191 days, on a page last updated June 28, 2026 [2053].'
