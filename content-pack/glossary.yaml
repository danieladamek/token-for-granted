- id: subrecipient
  term: Subrecipient
  kind: science
  variants:
  - subrecipients
  short: An organisation that receives a subaward and carries out part of a federal programme, as distinct from a contractor
    that sells goods or services.
  definition: An organisation that receives a subaward from a pass-through entity to carry out part of a federal award,
    with the federal terms flowing down to it [1799] [1805]. Under 2 CFR 200.331 the pass-through entity decides case by
    case whether the other party is a subrecipient or a contractor, on the substance of the relationship [1822]. A subrecipient
    determines who is eligible for assistance, has its performance measured against programme objectives and is responsible
    for programme requirements; a contractor sells goods or services in its normal business and is not subject to the programme's
    compliance requirements [1822]. The classification decides whether the money counts toward the single audit threshold
    [1845]. A subrecipient has a Unique Entity ID and is not required to complete full SAM.gov registration [1899] [1900].
    A non-profit funded through a state block or formula grant is a subrecipient of the state [1823] [1880].
  concept: formula-and-pass-through-101
