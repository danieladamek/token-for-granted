- id: termination
  term: Termination (of an award)
  kind: methods
  variants:
  - termination
  - terminations
  - terminated
  short: The ending of an award, in whole or in part, before the planned end of its period of performance.
  definition: 'The action an agency or pass-through entity takes to end an award, in whole or in part, before the planned
    end of the period of performance [1799]. 2 CFR 200.340 lists four ways: for failure to comply with the terms and conditions;
    with the recipient''s consent; by the recipient on written notice; and under the terms of the award, including, to the
    extent authorised by law, if an award no longer effectuates the programme goals or agency priorities [1801]. Every such
    provision has to be stated clearly and unambiguously in the award terms [1801]. On July 17, 2026 the District of Massachusetts
    declared that the fourth ground does not allow termination based on goals or priorities identified after the award was
    made; it granted no vacatur or injunction [1869]. OMB''s proposed rule of May 29, 2026 would revise the section, and
    no rule arising from it may take effect through December 11, 2026 [1803] [1480].'
