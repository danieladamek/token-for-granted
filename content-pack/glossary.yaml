- id: medical-research-organization
  term: Medical research organization
  kind: science
  variants:
  - medical research organizations
  - medical research organisation
  - medical research organisations
  short: A public charity whose main purpose is medical research and which carries that research out itself, in conjunction
    with a hospital.
  definition: A public charity whose principal purpose or function is to engage in medical research and that is directly
    engaged in the continuous active conduct of medical research in conjunction with a hospital [2374]. The IRS lists qualified
    medical research organisations affiliated with hospitals among the public charities [2238]. Under 26 CFR 1.170A-9(d)(2)
    one meets the test if it devotes more than one half of its assets to that research or spends 3.5 percent or more of
    the fair market value of its endowment on it [2239]. It states its status on Schedule A of Form 990 and does not file
    Form 990-PF [2374] [2238]. The Howard Hughes Medical Institute files Form 990 and calls itself "a medical research organization";
    its Investigators are its employees and receive no grant [2164] [2160] [2161].
