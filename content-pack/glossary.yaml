  short: An NIH award that gives a named researcher salary and research support, with protected time, to develop a research
    career. The institution applies for the candidate.
  definition: 'An NIH award in the K series of activity codes that gives a named candidate salary and research support,
    with protected time, for career development; the applicant is the candidate''s institution [744] [3]. In the mentored
    awards, such as the K01, K08 and K23, the candidate works under a mentor and commits at least 75 percent of full-time
    professional effort, and the project period may not exceed 5 years [744] [745] [746]. Each participating institute sets
    its own salary and research support levels, and indirect costs are reimbursed at 8% of modified total direct costs [744].
    The K99/R00 joins up to 2 years of mentored support to up to 3 years of independent research support for a postdoctoral
    researcher moving to a faculty post [743]. NIH announced on August 12, 2026 that for due dates on or after October 12,
    2027 most individual K codes are replaced by four: KR1, KC1, KS1 and KT1/R00 [742].'
