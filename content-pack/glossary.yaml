  - principal investigators
  - PD/PI
  - project director
  short: The person named in an application to lead the project and answer for the conduct of the work. NIH writes PD/PI,
    for program director/principal investigator.
  definition: 'The individual named in an application to lead the project; in the ordinary case the organisation submits,
    and the investigator is named in what it submits [4] [815]. An IES notice states the duties: the principal investigator
    has the authority and responsibility for the proper conduct of the research, including the use of federal funds and
    the submission of progress reports [663]. NIH''s form of the title is PD/PI, and for an R01 any individual with the
    skills, knowledge and resources to carry out the research may hold it [4] [117]. Since September 25, 2025 NIH accepts
    six applications per PD/PI per calendar year, for all activity codes except T codes and the R13 [12]. Some agencies
    say project director: NIFA tells the Project Director of an award recommendation, and SAMHSA asks for the project director''s
    eRA Commons username [409] [548].'
