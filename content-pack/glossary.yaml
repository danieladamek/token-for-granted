  - notices of award
  short: The official document by which an agency makes an award. It states the amount, the dates, and the terms and conditions.
  definition: 'The official document an agency issues to tell a recipient that an award has been made [122]. 2 CFR 200.211
    lists sixteen data items every award document carries, among them the start and end dates of the period of performance
    and of the budget period, the Assistance Listings number and title, and the indirect cost rate for the award [1810].
    HRSA''s Notice of Award states the budget period, the amount, the terms and conditions and the reporting requirements
    [1147]. At NIH the recipient accepts by drawing down or requesting funds, and is then bound by the NIH Grants Policy
    Statement unless the notice says otherwise [122] [118]. Later years can change: NIH''s fiscal policy for FY 2026 said
    non-competing continuation awards would generally be issued at the commitment level on the Notice of Award, and under
    the continuing resolution that opened fiscal year 2027 on October 1, 2026 NIH stated that its institutes may issue them
    below that level [21] [83].'
