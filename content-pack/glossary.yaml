- id: subaward
  term: Subaward
  kind: methods
  variants:
  - subawards
  - subgrant
  - subgrants
  short: Part of a federal award that the recipient passes to another organisation to carry out part of the programme, with
    the federal terms attached.
  definition: 'An award that a pass-through entity makes to another organisation, the subrecipient, to carry out part of
    a federal programme [1799]. The terms and conditions of the federal award flow down to it unless a section of the Uniform
    Guidance or the award terms say otherwise [1805]. The pass-through entity identifies it as a subaward and gives 14 data
    items, among them the federal award number, the Assistance Listing and the indirect cost rate [1823]. Only the first
    $50,000 of each subaward counts in the pass-through entity''s modified total direct cost base [1799]. With the federal
    agency''s prior written approval a recipient may make fixed amount subawards of up to $500,000; OMB''s proposed rule
    of May 29, 2026, which is not final, would eliminate them [1824] [1803]. Some agencies say subgrant: OVC''s victim assistance
    money goes to states, which subgrant it to local community-based organisations and public agencies [1280].'
