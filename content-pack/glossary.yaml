  definition: 'NSF''s programme, in full the Established Program to Stimulate Competitive Research, to raise the research
    competitiveness of targeted jurisdictions, each a state, territory or commonwealth [866]. NSF lists 28 eligible jurisdictions,
    and its eligibility page says the CHIPS and Science Act of 2022 in effect freezes jurisdiction eligibility through FY
    2027 [878] [877]. An institution''s location in an eligible jurisdiction decides whether it can apply to the EPSCoR
    Graduate Fellowship Program and EPSCoR Research Fellows, and EPSCoR often co-funds proposals sent to other NSF programmes
    without a separate application [825] [867] [1518]. Other agencies keep lists for their own capacity programmes and the
    lists are not the same: DOE and NASA follow the NSF list, DEPSCoR lists 36 states and territories, and USDA lists 19
    states for FY 2026 plus the District of Columbia and insular areas [1567] [1574] [1565] [1576].'
