  term: Grants.gov Workspace
  kind: methods
  variants: []
  short: The shared space in Grants.gov where a team fills in the forms of one application package before an authorised
    person submits it.
  definition: The shared space in Grants.gov in which members of a team fill in the forms of one application package, online
    or as downloaded PDFs, before a user with an Authorized Organization Representative (AOR) role submits it [1915] [1965].
    Grants.gov calls it the standard way for organisations or individuals to apply [1915]. A Workspace Manager, the minimum
    role needed to create a workspace, may not submit, while a Standard AOR may create workspaces and submit [1916] [1965].
    An application can be submitted when all required forms are complete and pass error checks, the organisation's SAM.gov
    registration is active and the deadline has not passed; submitted packages are kept for 5 years [1965] [1966]. The Simpler.Grants.gov
    roadmap lists a simpler application workflow under test with partner agencies, and that site's home page says a user
    may need to visit Grants.gov to apply for most opportunities [1919] [1967].
