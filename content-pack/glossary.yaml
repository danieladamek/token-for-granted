  short: A cut-off in overall impact scores that an NIH institute used to settle which applications it would fund. NIH institutes
    no longer rely on paylines.
  definition: 'A cut-off in overall impact scores that an NIH institute, center or office used to determine which applications
    it would fund [123]. About half of them had used paylines before NIH adopted its unified funding strategy [13]. From
    the January 2026 council round they do not rely on paylines: each funding policy follows six tenets, among them mission
    alignment, scientific merit, career stage and availability of funds, and each institute publishes the factors it weighs
    [123] [15]. The National Cancer Institute, for one, states that it no longer uses paylines to choose competing grants,
