  short: The interagency online system in which recipients of federal funding report inventions made under their awards
    to the funding agency.
  definition: 'The interagency online system in which recipients of federal funding agreements report subject inventions
    to the funding agency and complete other reporting required under the Bayh-Dole Act [1951]. NIH built it in the 1990s
    and NIST has run it since around summer 2022 [1951]. The organisation registers at iedison.nist.gov, and each user holds
    an iEdison account and a Login.gov account under the same email address [1951]. The deadlines it serves are in the standard
    patent rights clause at 37 CFR 401.14: a subject invention is disclosed to the agency within two months after the inventor
