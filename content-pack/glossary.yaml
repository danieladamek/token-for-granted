- id: uniform-guidance
  term: Uniform Guidance (2 CFR part 200)
  kind: methods
  variants:
  - Uniform Guidance
  - 2 CFR part 200
  - 2 CFR 200
  short: 'The government-wide rules for federal grants and cooperative agreements: how an award is administered, what costs
    it may pay and when the recipient is audited.'
  definition: The government-wide set of administrative requirements, cost principles and audit requirements for federal
    awards, issued by the Office of Management and Budget [1799] [1805]. It binds the federal agencies that make awards
    and, through the award terms, recipients and subrecipients; a federal statute or regulation governs where it conflicts
    with the part [1805]. Each agency adopts it in its own chapter of 2 CFR, as HHS does at 2 CFR 300.106 [1884]. The text
    in force is the revision published April 22, 2024 and effective October 1, 2024 [1883]. A proposed replacement was published
    May 29, 2026; under section 157 of Public Law 119-103 it may not be issued or take effect through December 11, 2026
    [1458] [1480].
