- id: renewal
  term: Renewal (competing)
  kind: methods
  variants:
  - renewal
  - renewals
  - competing renewal
  short: An application to carry a funded project into a further project period. It competes again for the money.
  definition: 'An application that competes for a further project period for a project already funded [42]. NIH says of
    the R01 that applications "can be renewed by competing for an additional project period" [42]. Under 2 CFR 200.309 the
    start date of a renewal award begins a new and distinct period of performance [1816]. NIH gives it separate standard
    due dates: new R01 applications are due February 5, June 5 and October 5, and renewals, resubmissions and revisions
    March 5, July 5 and November 5 [2]. A renewal counts toward NIH''s limit of six applications per principal investigator
    per calendar year [12]. At NSF, planning, RAPID and EAGER awards may be renewed only through a renewal proposal subject
    to full external merit review [252].'
