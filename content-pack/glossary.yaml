  short: A college or university placed in a class defined by the students it enrols or by its history. Funders define the
    class in different ways, so the notice in hand decides.
  definition: A college or university that a funder places in a class defined by the students it enrols or by its history;
    the definitions differ from one funder to the next [423] [579]. NIFA counts an institution where one or more minority
    groups exceed 50 percent of enrolment [423]. A NIDILRR notice counts a historically black college or university, a Hispanic-serving
    institution, an American Indian tribal college or university, or another institution where minority student enrollment
    is at least 50 percent [579]. NASA checks eligibility against its own NASA MSI List, while the Department of Education's
    FY 2025 Eligibility Matrix holds programme lists for the minority-serving classes, HBCUs and TCCUs [1629] [1595]. On
    December 2, 2025 the Office of Legal Counsel concluded that the Department of Education's three HSI programmes and its
    AANAPISI programme are unconstitutional and inseverable [1592].
