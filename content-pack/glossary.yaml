- id: executive-order-14332
  term: Executive Order 14332
  kind: methods
  variants:
  - EO 14332
  short: A presidential order of August 7, 2025 on how federal agencies decide on and manage discretionary grants, including
    review by a senior appointee.
  definition: A presidential order, signed August 7, 2025 and titled Improving Oversight of Federal Grantmaking, that changes
    how federal agencies decide on and manage discretionary grants [246]. It has each agency head designate a senior appointee
    to review new funding opportunity announcements and discretionary grants for consistency with agency priorities and
    the national interest [246]. It also directs the OMB Director to revise the Uniform Guidance so that discretionary grants
    permit termination for convenience and so that the use of grant funds for facilities and administrative costs is limited
    [246]. The order creates no enforceable rights and is to be implemented consistent with applicable law [246]. The revision
    it calls for was proposed on May 29, 2026 and cannot be issued or take effect through December 11, 2026 [1458] [1480].
    The Uniform Guidance in force still requires agencies to accept negotiated indirect cost rates and limits termination
    to the four grounds in 200.340 [1802] [1801].
  concept: law-in-motion-101
