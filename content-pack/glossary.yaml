  short: A draft regulation that an agency publishes in the Federal Register for public comment. It applies to no one until
    a final rule is published and takes effect.
  definition: A draft of a regulation that an agency publishes in the Federal Register and opens to public comment, also
    called a notice of proposed rulemaking or NPRM; until it is finalised it applies to no one [1858] [1480] [1803]. The
    case this guide follows is OMB's "Regulation for Federal Financial Assistance", a proposal to revise the government-wide
    grant rules that include the Uniform Guidance, published May 29, 2026 at 91 FR 32198 with comments due on or before
    July 13, 2026 [1858] [1803]. The Federal Register record shows 496,606 comments, and OMB's regulatory agenda of August
    14, 2026 lists the rule in the proposed rule stage with no date for final action [1858] [1859]. Section 157 of Public
    Law 119-103 bars a rule arising from it from being issued or finalised through December 11, 2026, and the Uniform Guidance
    as revised in 2024 remains the rule in force [1480] [1857] [1801].
