  short: An NIH grant to an institution to run a research training programme. The institution, not NIH, selects the trainees,
    who receive NRSA stipends.
  definition: An NIH award made to an institution to run a research training programme for a group of predoctoral students,
    postdoctoral researchers or both [750]. The institution applies through a programme director, then selects and appoints
    the trainees, who receive NRSA stipends; a student or postdoctoral researcher does not apply to NIH for a place [750]
    [730]. Project periods run up to five years and are renewable, and application budgets are not limited [750]. Eligible
    organisations are domestic, and a trainee must be a citizen or noncitizen national of the United States, or lawfully
    admitted for permanent residence, at the time of appointment [750]. Indirect costs are reimbursed at 8% of modified
    total direct costs, a base that leaves out tuition and fees, consortium costs in excess of $25,000 and equipment [750].
