- id: nih
  term: National Institutes of Health (NIH)
  kind: science
  variants:
  - NIH
  - National Institutes of Health
  short: The federal biomedical research agency, part of the Department of Health and Human Services. Its institutes and
    centers fund research at universities, medical schools and other organisations.
  definition: The federal agency that describes itself as the largest public funder of biomedical research in the world;
    it is made up of 27 institutes and centers, each with its own research agenda [117] [143]. Organisations that receive
    its grants can be domestic or foreign, public or private, non-profit or for-profit [117]. From fiscal year 2026 Grants.gov
    is its single official source for grant and cooperative agreement funding opportunities [9]. Review has two levels,
    a scientific review group and then the national advisory council or board of the institute that would pay, after which
    the institute or center director decides [38]. Under the unified funding strategy, effective with the January 2026 council
    round, institutes do not rely on paylines [123] [13].
