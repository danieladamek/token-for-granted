- id: nofo
  term: Notice of funding opportunity (NOFO)
  kind: methods
  variants:
  - NOFO
  - NOFOs
  - notice of funding opportunity
  - notices of funding opportunity
  - funding opportunity announcement
  - FOA
  short: The formal public announcement that a federal agency has money to award under a programme, with the rules for applying.
  definition: 'The formal announcement that federal funding is available through a financial assistance programme [1799].
    The Uniform Guidance fixes what a notice contains and in what order: nine sections, from Basic Information and Eligibility
    to Award Notices and post-award requirements, written in plain language [1848]. A summary of each is displayed on Grants.gov
    [1800]. 2 CFR 200.204 sets an expectation, not a requirement, that an opportunity stay open for at least 60 calendar
    days, and for no fewer than 30 calendar days absent exigent circumstances [1800]. Executive Order 14332, signed August
    7, 2025, calls these notices funding opportunity announcements and has a senior appointee review new ones before they
    issue [246]. In August 2026 NSF called its twelve new solicitations Notices of Funding Opportunity [192]. OMB''s proposed
    rule of May 29, 2026, which is not final, would require every federal funding opportunity to be posted on Grants.gov
    [1803].'
