  definition: 'A cancelling of something already in place, met in two forms in this guide''s records. Congress can take
    back money it has appropriated: the Rescissions Act of 2025 (Public Law 119-28), approved July 24, 2025, rescinded the
    amounts made available for the Corporation for Public Broadcasting for fiscal years 2026 and 2027, and the Corporation
