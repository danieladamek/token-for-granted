- id: closeout
  term: Closeout
  kind: methods
  variants:
  - close-out
  short: 'The steps that finish an award after its period of performance ends: final reports, settling of obligations and
    the return of money not spent.'
  definition: The process by which the agency or pass-through entity determines that the administrative work of an award
    is complete [1830]. It follows the end of the period of performance, including an end brought about by termination [1801]
    [1816]. Under 2 CFR 200.344 a recipient submits all financial, performance and other reports, and liquidates all financial
    obligations, no later than 120 calendar days after the end of the period of performance; a subrecipient has 90 calendar
    days [1830]. Funds paid and not authorised to be retained are refunded promptly [1830]. The agency is to make every
    effort to finish no later than one year after the end of the period of performance, and it reports a recipient's material
    failure to comply in SAM.gov [1830].
