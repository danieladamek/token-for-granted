  - S10
  short: NIH's code for a one-year grant that buys a research instrument for a group of NIH-funded investigators to share.
    It pays no indirect costs.
  definition: The NIH activity code for instrumentation grants, which buy a commercially available research instrument,
    or an integrated system, for NIH-funded investigators to share [1534] [1536]. The Shared Instrumentation Grant notice
    posted June 25, 2026 consolidates the former Shared, High-End and Basic Instrumentation Grant programmes; awards run
    from $300,000 to $5,000,000 for one year, and the application names at least three NIH-funded Major Users [1536]. A
    second notice, Seed Instrumentation Support, covers a single instrument costing $50,000 to $400,000 and asks for at
    least two NIH-funded users, at least one of them from the applicant institution [1537]. S10 awards do not allow indirect
    costs, and neither notice requires cost sharing [1536] [1537]. NIH's Office of Research Infrastructure Programs runs
    the programmes through its Division of Construction and Instruments [1538].
