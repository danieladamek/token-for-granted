- id: study-section
  term: Study section (scientific review group)
  kind: science
  variants:
  - study section
  - study sections
  - scientific review group
  - scientific review groups
  short: At NIH, the committee of reviewers that gives an application its first level of peer review. NIH's formal name
    for it is scientific review group.
  definition: A committee of reviewers that carries out the first of NIH's two levels of peer review; the formal name is
    scientific review group, or SRG [38]. Study sections are organised by the Center for Scientific Review and grouped by
    discipline into review branches [38] [40]. For most research project applications with due dates from January 25, 2025,
    the reviewers score two factors from 1 to 9 and rate a third as sufficient or insufficient [39] [41]. Under modified
    practices in force through the January 2027 council round, about 30-35 percent of applications are discussed, and the
    committee's middle third is labelled "competitive but not discussed" [16] [84] [85]. The advisory council of the institute
    gives the second level of review [38].
