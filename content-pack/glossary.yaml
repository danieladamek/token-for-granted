  short: A short first-stage submission that a funder reads before the full application, to invite, encourage or discourage
    it.
  definition: 'A first-stage submission that the funder reads before deciding who goes on to submit in full [414] [471].
    The name and the force of the answer differ by funder: an NSF preliminary proposal ends either in a binding invite or
    not-invite decision or in an advisory encourage or discourage [156]. In defence research the step is a white paper,
    a short description sent so that a programme officer can encourage or discourage a proposal; ONR limits it to 5 pages,
    and the Army Research Laboratory encourages but does not require one [334] [341]. The DOE Office of Science takes pre-applications
    through PAMS, and its FY 2027 annual notice requires one for certain review panels and makes it optional otherwise [277].
    Every CDMRP application starts with a pre-application in eBRAP [330] [356]. NIFA''s Specialty Crop Research Initiative
    judges pre-applications by industry relevance [414].'
