  - Employer Identification Number
  short: An identifying number the IRS issues to an organisation. A new organisation obtains one before it applies for tax
    exemption, and its filings are looked up by it.
  definition: 'An identifying number that the IRS issues to an organisation; obtaining one is among the things the IRS says
    an organisation does before it applies for tax-exempt status [2047] [2089]. The online application is free, an approved
    number is issued immediately, and a corporation is formed with the state before applying [2089]. Agencies ask for it:
    the agency that starts an ASAP.gov payment enrolment uses the recipient''s UEI and EIN, and a request for an IRS affirmation
    letter gives the organisation''s name and EIN [1956] [2066]. ProPublica''s Nonprofit Explorer, a database of non-profit
    tax filings, gives each organisation a page reached by its EIN [2398] [2415].'
