- id: rppr
  term: Research Performance Progress Report (RPPR)
  kind: methods
  variants:
  - RPPR
  - progress report
  - progress reports
  short: The government-wide standard format in which a recipient reports progress on a research award. Each agency collects
    it in its own system.
  definition: 'The government-wide standard format for reporting progress on research awards [1955]. Each agency collects
    it in its own system: NIH in eRA Commons, NSF in Research.gov [1954] [1955]. NIH has three types: annual, interim (filed
    with a renewal application) and final (part of closeout) [1954]. At NIH only the PD/PI or a delegate can start one,
    and only a Signing Official, or a PI the Signing Official has delegated, can submit it [1954]. NIH''s interim and final
    reports are due 120 days from the end of the period of performance for the competitive segment [1954]. At NSF an annual
    project report is due no later than 90 days before the end of the current budget period [1955].'
