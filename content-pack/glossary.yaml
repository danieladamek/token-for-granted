  short: NSF's five-year award for untenured, tenure-track faculty who combine research and education. The employing organisation
    submits for one investigator.
  definition: 'A five-year NSF award for early-career faculty who combine research and education; the programme''s full
    name is the Faculty Early Career Development Program [814]. The employing organisation submits the proposal on behalf
    of one investigator, and co-investigators are not allowed [815] [816]. The investigator must hold a doctoral degree
    and at least a 50% tenure-track or equivalent post as an assistant professor or equivalent, be untenured, and may submit
    one proposal per annual competition in no more than three competitions [815]. The award has a floor and no ceiling:
    at least $400,000 over five years including indirect costs, and at least $500,000 in BIO, ENG and the Office of Polar
    Programs [815] [816]. NSF chooses its nominees for the Presidential Early Career Awards for Scientists and Engineers
    from recent CAREER awardees [814].'
