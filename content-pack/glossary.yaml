  short: A fixed yearly sum paid to the institution that hosts a fellow, for costs such as health insurance, supplies and
    administration. A fellowship that pays one often pays no indirect costs.
  definition: A fixed sum paid with a fellowship to the fellow's institution to meet the costs of hosting and administering
    it, where no indirect costs are paid [736] [960]. On an NIH individual fellowship it covers health insurance, supplies,
    equipment, books and travel; for FY 2026 it is $4,750 predoctoral and $12,400 postdoctoral, or $3,650 and $11,300 for
    fellows at federal and for-profit institutions [732] [736]. NIH training grants carry training-related expenses in its
    place, at $4,750 and $12,400 as well [732]. NIFA's AFRI predoctoral and postdoctoral fellowships pay the institution
    $3,000 a year and do not permit indirect costs [960]. NSF's counterpart is the cost-of-education allowance, $16,000
    per tenure year in the Graduate Research Fellowship, for which the institution must exempt the fellow from tuition and
    required fees [818].
