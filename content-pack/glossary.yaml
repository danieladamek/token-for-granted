- id: minimum-distribution
  term: Minimum distribution (payout)
  kind: methods
  variants:
  - payout
  - minimum distribution
  - distributable amount
  - payout rate
  short: The amount a grantmaking private foundation must pay out for charitable purposes each year, worked out from 5 percent
    of its investment assets.
  definition: The least that a private non-operating foundation must pay out for charitable purposes each year [2375]. The
    sum starts from the minimum investment return, which is 5 percent of the excess of the value of the foundation's assets
    not used for its exempt purposes over the debt incurred to buy them, and the distributable amount is that return reduced
    by income taxes and the tax on investment income [2377] [2376]. A foundation that fails to pay it out in time owes a
    30 percent excise tax on the undistributed income under section 4942, and a further 100 percent if the shortfall is
    not made up within 90 days of IRS notification [2375]. Private operating foundations are not subject to this tax [2371].
    The median payout rate for tax year 2022 was 5.71%, and MacArthur set its own baseline at 6 percent through 2028 [2410]
    [2326] [2328].
