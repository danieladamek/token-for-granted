- id: group-exemption
  term: Group exemption
  kind: methods
  variants:
  - group exemptions
  - group ruling
  - group exemption letter
  short: An IRS letter to a central organisation that also recognises the organisations under its supervision as tax-exempt,
    so that they do not apply one by one.
  definition: 'A letter by which the IRS recognises as exempt the subordinate organisations under a central organisation''s
    general supervision or control; a subordinate included in the letter does not file its own application [2060]. Subordinates
    must all be described in the same paragraph of section 501(c), and a central organisation needs at least five subordinates
    to obtain a letter and at least one to keep it [2060]. The procedure changed in 2026: Revenue Procedure 2026-8, effective
    January 20, 2026, superseded Revenue Procedure 80-27, and the IRS resumed accepting group applications after that date
    [2060] [2061]. As the bulletin was returned when read, section 501(c)(3) subordinates must be public charities with
    the same foundation classification [2061]. The IRS pages read do not say how a funder verifies that a particular subordinate
    is covered [2060].'
