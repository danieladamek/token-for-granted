- id: corporate-foundation
  term: Corporate foundation
  kind: science
  variants:
  - corporate foundations
  - corporate giving programme
  - corporate giving program
  - company-sponsored foundation
  short: 'A private foundation whose assets come mainly from a for-profit company. A corporate giving programme is a different
    thing: it is run inside the company and files no public return of its own.'
  definition: A private foundation whose assets come mainly from the contributions of a for-profit business, which Candid's
    glossary calls a company-sponsored foundation; a company can also give through a corporate giving programme, set up
    and run inside the company itself [2408]. The first is a separate legal body that files Form 990-PF, and the second
    files no public return of its own [2408] [2387]. The IRS pages read for this guide do not define a corporate foundation
    as a class of its own; as a private foundation it falls under the general rule [2237]. The corporate funders read pair
    an open route for small local grants, or a fixed annual window, with national grants by invitation [2433] [2441] [2438].
    From tax years beginning after December 31, 2025 a corporation may deduct charitable gifts only above 1 percent of taxable
    income [2392] [2395].
