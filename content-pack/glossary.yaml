- id: no-cost-extension
  term: No-cost extension
  kind: methods
  variants:
  - no-cost extensions
  short: 'More time to finish a funded project: the end date of the award moves later, under rules the award sets.'
  definition: 'An extension of an award''s period of performance, which moves its end date later [1816]. Under 2 CFR 200.308
    an agency may let a recipient start a one-time extension of up to 12 months on its own, with notice at least 10 calendar
    days before the period ends; a no-cost extension beyond that one needs the agency''s prior approval [1815]. NSF''s terms
    follow that pattern: a recipient may extend a grant once by up to 12 months on notice to NSF at least ten calendar days
    before the end date, and a further extension needs NSF approval requested at least 45 days before the end date [259].
    Each agency''s terms say which approvals it has waived [1815]. At NSF late project reports delay no-cost extensions
    [1955].'
