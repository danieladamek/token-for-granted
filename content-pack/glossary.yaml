- id: allowable-cost
  term: Allowable cost
  kind: methods
  variants:
  - allowable costs
  - unallowable
  short: A cost that an award is permitted to pay under the cost principles and the award's own terms.
  definition: 'An expense that a federal award may pay because it passes the tests in 2 CFR 200.403 [1831]. It must be necessary
    and reasonable and allocable to the award, conform to limits in the principles or the award, be treated consistently
    as direct or indirect, be adequately documented and be incurred in the approved budget period, among other tests [1831].
    Some items are unallowable outright, such as alcoholic beverages and lobbying costs [1836] [1841]. Others depend on
    prior written approval: special purpose equipment with a unit cost of $10,000 or more is one [1839]. After a termination,
    costs are allowable only if they result from obligations properly incurred before the effective date and not in anticipation
    of it, or are expressly authorised [1829].'
