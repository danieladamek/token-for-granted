- id: animal-welfare-assurance
  term: Animal Welfare Assurance
  kind: methods
  variants:
  - IACUC
  short: The document in which an institution describes its animal care programme and commits to federal policy on laboratory
    animals. It is needed before funded animal work starts.
  definition: 'The document in which an institution describes its animal care and use programme and commits to the Public
    Health Service Policy on Humane Care and Use of Laboratory Animals [1994] [1999]. No PHS-supported activity with live
    vertebrate animals may be conducted until the institution has one, negotiated with the NIH Office of Laboratory Animal
    Welfare (OLAW); OLAW''s pages say the same document covers NSF- and NASA-funded animal activities [1994] [1995]. An
    institution cannot apply unasked: the funding component notifies OLAW of a pending award, and OLAW then contacts the
    institution [1994]. A domestic institution needs an institutional animal care and use committee (IACUC), which has at
    least five members [1996] [1999]. On how long approval lasts the sources differ: OLAW''s pages say up to 4 years for
    Domestic and Foreign Assurances, and the PHS Policy page, as returned, says no longer than five years [1996] [1998]
    [1999].'
  concept: uniform-guidance-101
