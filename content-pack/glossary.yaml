- id: no-current-notice
  term: No current notice
  kind: science
  variants:
  - no-current-notice
  short: This guide's label for a programme with no notice for the current cycle and no statement from the funder that it
    has ended. It reports an absence, not a closure.
  definition: A label of this guide's own. It marks a programme record for which no notice for the current cycle was found
    on the funder's page or on Grants.gov, while the funder has not said that the programme has ended. It reports an absence
    on the day of reading, with the listing cited in the record, and does not say that the programme is over or that a notice
    is coming. One record so marked rests on a programme page that states "There are no open NOFOs at this time" and gives
    no date for a next solicitation and no statement that the programme has ended [312]. Where the funder has said that
    a competition is cancelled or will not be held, the label is not-competed; where a forecast exists, it is forecast.
  concept: reading-a-funding-notice
