    registers there, holding an active SAM registration and a Unique Entity ID first, and each person holds one NSF ID,
    the identifier NSF assigns to a user [161] [156]. A proposal may instead be sent through Grants.gov, after which it
    passes to Research.gov for processing; a subrecipient named in a proposal obtains a UEI and registers in Research.gov
