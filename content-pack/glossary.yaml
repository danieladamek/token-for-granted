  short: A law in which Congress provides money to federal agencies for a fiscal year. It can also carry conditions on how
    grant money is used.
  definition: 'A law in which Congress provides money for federal agencies and their programmes for a fiscal year [173]
    [1480]. Fiscal year 2026 was funded by twelve appropriations acts, among them the Consolidated Appropriations Act, 2026
    (Public Law 119-75), signed February 3, 2026 [1480] [21]. An act carries conditions as well as amounts: section 224
    of that law keeps the indirect cost provisions of 45 CFR part 75 applying to NIH grants, and Congress may also name
    a specific recipient, project and amount in an act [62] [1667] [1674]. The amounts are set by Congress and can differ
    from the President''s request: for NSF''s Graduate Research Fellowship Program in fiscal year 2026 the request was $127.3
    million and a society summary reports $285 million in the final bill [884] [174]. Award amounts and new competitions
    for fiscal year 2027 depend on acts not yet enacted on 2026-10-04 [1480].'
