- id: loan-repayment
  term: Loan repayment program
  kind: science
  variants:
  - loan repayment
  - LRP
  - loan repayment programs
  short: A programme that pays down a person's educational debt in return for a period of qualifying work, such as research
    or teaching. The person applies, not the employer.
  definition: A programme that pays down part of a person's educational debt in return for a period of work [762] [763]
    [1033]. NIH's Extramural Loan Repayment Program repays up to $50,000 of qualified educational debt a year, under a two-year
    award that can be renewed, for health professionals who do research outside NIH for at least 20 hours a week [762] [763].
    The individual applies and the employer does not receive the award; the debt must be at least 20 percent of institutional
    base salary, the research must be supported by a domestic non-profit institution or a U.S. government agency, and NIH
    research funding is not required [762]. For the cycle that opened on September 1, 2026 NIH has three subcategories,
    coded L30, L40 and L70, after a consolidation [762] [765] [1085]. HRSA's Faculty Loan Repayment Program repays up to
    $40,000 over two years in return for service on the faculty of an approved health professions school [1033].
