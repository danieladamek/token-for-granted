  short: The federal website where most agencies post funding opportunities and receive applications.
  definition: The federal site where most agencies post funding opportunities and receive applications [1895]. An organisation
    registers there after SAM.gov, using its Unique Entity ID; the person named in SAM.gov as Electronic Business Point
    of Contact assigns roles, and a user with an Authorized Organization Representative role or an equivalent privilege
    submits [1895] [1965]. Applications are prepared and submitted in Workspace, and every user signs in with a Login.gov
    account [1915] [1965]. A person applying on their own behalf adds an Individual Applicant profile and does not register
    with SAM.gov [1896]. Since December 23, 2025 the default search for opportunities has been on Simpler.Grants.gov, the
    site on which HHS is building the next generation of Grants.gov; its roadmap announces 2027 as the stage at which it
    replaces the legacy site, with no day or month given [1920] [1967] [1919].
