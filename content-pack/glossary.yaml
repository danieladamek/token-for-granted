- id: merit-review
  term: Merit review
  kind: methods
  variants:
  - peer review
  - merit review process
  short: The assessment of applications against criteria set out beforehand, usually by reviewers who know the field, before
    an agency decides what to fund.
  definition: The assessment of applications on their merits, against stated criteria, that precedes a funding decision;
    some agencies say peer review [333] [38]. Defense Department regulations, for example, require merit-based competitive
    procedures and impartial review against the criteria in the notice [333]. NSF judges every proposal on two criteria,
    using ad hoc reviewers, a panel or both, while NIH, which says peer review, has two levels of it [157] [160] [38]. Since
    Executive Order 14332 of August 7, 2025 a senior appointee's review of new announcements and discretionary grants sits
    on top of merit or peer review [246]. A rule that OMB proposed on May 29, 2026 would describe peer review as advisory;
    it is a proposal and not in force [1878] [2092].
