- id: advisory-council
  term: National advisory council
  kind: science
  variants:
  - advisory council
  - advisory councils
  - council review
  short: The body of an NIH institute that gives an application its second level of review and makes funding recommendations
    to the institute's director.
  definition: 'A body attached to an NIH institute or center, called a national advisory council or board, that performs
    the second level of peer review for research grant applications, after the study section [38]. It makes funding recommendations
    to the director of the institute or center, who makes the funding decision [38] [15]. NIH notices are dated by council
    round: the unified funding strategy took effect with the January 2026 council round, and a notice of April 15, 2026
    applies from the October 2026 round forward [123] [16]. After the council meets, an institute fixes the funds available,
    runs compliance checks and balances its portfolio, and decisions come in batches [91]. Councils exist outside NIH as
    well: at NEH the National Council on the Humanities must by law review applications before the Chair decides, and SAMHSA
    requires National Advisory Council approval for awards over $250,000 [638] [1112].'
