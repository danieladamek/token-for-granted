  - Hispanic-serving institutions
  short: A college that meets the Title V tests for an eligible institution and whose full-time-equivalent undergraduate
    enrolment is at least 25 percent Hispanic. The status follows enrolment.
  definition: 'An eligible institution under Title V whose undergraduate full-time-equivalent enrolment is at least 25 percent
    Hispanic at the end of the award year before it applies [1647]. The status follows enrolment and is shown when an institution
    applies; it is not a permanent list [1642]. In the Department of Education''s last competition the applicant documented
    the 25 percent and the Department checked it against IPEDS and other data [1642]. The definition is in litigation: the
    Justice Department told Congress on July 25, 2025 that it would not defend it in State of Tennessee v. U.S. Department
    of Education, and on December 2, 2025 the Office of Legal Counsel concluded that the Department''s three HSI programmes
    are unconstitutional and inseverable [1606] [1592]. A law firm summary of September 30, 2026 reports that the court
    had not ruled on the intervenor''s motions [1650].'
