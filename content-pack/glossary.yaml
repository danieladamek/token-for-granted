- id: indirect-rate-cap
  term: Indirect cost rate cap
  kind: methods
  variants:
  - rate cap
  - rate caps
  - 15 percent cap
  - indirect cost cap
  short: A ceiling on the indirect cost rate an award will pay, set by statute, regulation or a funder's policy, whatever
    rate the organisation has negotiated.
  definition: 'A ceiling on the percentage of indirect costs an award pays, applied in place of an organisation''s negotiated
    rate [1802]. An agency may use a rate other than the negotiated one only when a federal statute or regulation requires
    it or when it approves a deviation under a published procedure [1802]. HHS regulations, for example, limit indirect
    costs on training grants to 8% of modified total direct costs [1884]. In 2025 four agencies announced that they would
    pay universities 15 percent in place of negotiated rates: NIH, DOE, NSF and the Department of Defense [24] [1852] [237]
    [1855]. Each policy was set aside by the District of Massachusetts, and none was in effect on October 4, 2026 [24] [237]
    [289] [1855]. Appropriations conditions on indirect cost rates continue under Public Law 119-103 through December 11,
    2026 [1480]. NIH''s FY 2027 budget request proposes a 15 percent cap on F&A costs; it is a request [57]. Foundations
    set limits of their own, often a flat percentage of direct costs and sometimes nothing [2120] [2133].'
