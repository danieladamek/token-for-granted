  short: A fixed sum paid to a fellow or trainee to live on during training, at a level the funder sets.
  definition: 'A payment made to a fellow or trainee as a subsistence allowance during training [736]. NIH sets NRSA stipends
    once a fiscal year: for awards made with FY 2026 funds the level is $29,364 a year for predoctoral trainees and fellows
    and from $63,480 to $77,076 for postdoctoral ones, by years of experience, and earlier awards are not adjusted [732].
    NSF''s Graduate Research Fellowship carries a stipend of $37,000 for a 12-month tenure period, paid by the fellow''s
    institution [818]. Sums for the institution come beside it, such as a contribution to tuition and fees and an institutional
    or cost-of-education allowance [736] [818]. An NRSA fellowship may not be held together with another federally sponsored
    fellowship or similar federal award that provides a stipend [737].'
