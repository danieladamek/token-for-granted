- id: cost-sharing
  term: Cost sharing (matching)
  kind: methods
  variants:
  - cost sharing
  - cost share
  - cost-sharing
  - matching funds
  - matching requirement
  - non-federal share
  short: The part of a project's cost that federal funds do not pay. Also called matching.
  definition: 'The portion of a project''s costs not paid by federal funds, also called matching [1880]. Whether a programme
    requires it is stated in the funding notice, which also says so when it is not required [1848]. For research grants
    the Uniform Guidance says voluntary committed cost sharing is not expected, and an agency may not use it as a factor
    in merit review unless a statute or agency regulation authorises that and the notice says so [1814]. NSF prohibits voluntary
    committed cost sharing [257]. Where it is required the terms vary: every NEA award requires a non-federal share of at
    least 1 to 1, and a Head Start recipient contributes 20 percent each budget period unless a waiver is approved [651]
    [652] [1249]. A contribution counts only if, among other tests, it is verifiable in the recipient''s records and is
    not counted for any other federal award [1814]. OMB''s proposed rule of May 29, 2026, which is not final, lists a revision
    to the section [1458].'
