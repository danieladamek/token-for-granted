- id: open-call
  term: Open call (request for proposals)
  kind: methods
  variants:
  - open call
  - open calls
  - request for proposals
  - requests for proposals
  - RFP
  - RFPs
  short: A dated competition that a foundation opens to organisations it has not approached, with its own page, deadline
    and eligibility rule.
  definition: 'A route that an invitation-only foundation opens to organisations it has not approached; request for proposals
    (RFP) is another name for it [2274] [2349]. Each call has its own page, dates and eligibility rule, and any organisation
    that meets the call''s own rule may apply [2321] [2355]. Foundations post calls on a dedicated page, such as Kresge''s
    current funding opportunities and Wallace''s requests for proposals, and Hewlett issues open calls occasionally [2274]
    [2349] [2280]. A foundation may have none posted: neither of those two pages listed a call when read on 2026-10-04 [2274]
    [2349]. Community foundations use the same form: Silicon Valley Community Foundation ran its Community Action Grants
    by a request for proposals open from March 2 to March 31, 2026 [2412].'
