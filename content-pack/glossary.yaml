  term: Participant support costs
  kind: methods
  variants:
  - participant support
  short: A separate budget category that, in NSF's undergraduate research programme, holds student stipends, housing and
    travel. It is left out of the base for indirect costs.
  definition: A budget category of its own that, in NSF's Research Experiences for Undergraduates proposals, holds student
    stipends, housing and travel [830]. The Uniform Guidance makes these costs allowable and requires an organisation to
    document how it classifies them in written policies and to treat them consistently across all federal awards [1842].
    They are left out of modified total direct costs, the base to which an indirect cost rate is usually applied [1799].
    NSF's REU solicitation states the point outright and prohibits recovery of indirect costs on them [830]. Moving money
    from this category to another needs the agency's prior approval under 2 CFR 200.308 [1815].
