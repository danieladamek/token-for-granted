- id: resubmission
  term: Resubmission
  kind: methods
  variants:
  - resubmissions
  short: An application sent again, in revised form, after an earlier version was not funded.
  definition: 'A proposal sent to the funder again after an earlier version was declined [258]. Each funder sets the terms:
    NSF allows a declined proposal to be resubmitted only after substantial revision, and its Engineering directorate also
    requires that 12 months have elapsed [258] [166]. NIH''s standard due dates set resubmissions apart: for the R01 they
    are March 5, July 5 and November 5, against February 5, June 5 and October 5 for new applications [2]. It counts toward
    NIH''s limit of six applications per principal investigator per calendar year [12]. An FDA notice for clinical studies
    of orphan products sets separate dates for resubmissions only [561]. A foundation may cap the number, as the American
    Cancer Society does in allowing two resubmissions of a Research Scholar Grant [2248]. At NSF a principal investigator
    may also ask for reconsideration within 90 days of a declination [258].'
