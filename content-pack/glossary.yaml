  - community trust
  short: A grantmaking public charity that serves one local area. Part of what it pays out follows the advice of its donors
    and is not open to application.
  definition: 'A charity that attracts large contributions for the benefit of a particular community or area and makes grants
    there; the IRS''s term is community trust [2374] [2405]. One that meets a public support test is a public charity, not
    a private foundation, and files Form 990 with Schedule A, so it has no Form 990-PF line on unsolicited requests [2374].
    The Council on Foundations counts more than 900 of them [2405]. A community foundation pays out money in two ways, and
    only one takes applications: competitive grants decided by its staff and board, and donor-advised grants that follow
    the advice of the donor who set up the fund [2416] [2428] [2373]. Its own website is the place to learn how it takes
    applications [2374] [2432].'
