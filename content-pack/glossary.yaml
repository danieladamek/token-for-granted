  short: The letter in which the IRS says it has recognised an organisation as tax-exempt. Funders look it up to check a
    non-profit's standing.
  definition: The letter the IRS issues on an application for recognition of tax exemption; section 501(c)(3) status is
    decided by it [2059] [2046]. Determination letters can be looked up in the IRS Tax Exempt Organization Search, the tool
    in which a funder checks a non-profit, and the IRS warns of delays in that tool's data [2059]. The IRS says it issues
    80% of Form 1023-EZ determinations within 22 days and 80% of Form 1023 determinations within 191 days, on a page last
    updated June 28, 2026 [2053]. A subordinate covered by a central organisation's group exemption letter holds the status
    without its own application [2060]. An organisation asked for proof of status can also request an affirmation letter
    from the IRS [2066].
