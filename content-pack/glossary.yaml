- id: invitation-only
  term: Invitation only
  kind: methods
  variants:
  - by invitation only
  - invitation-only
  - invited proposal
  - invited proposals
  short: A foundation's rule that it takes proposals only from organisations it has itself approached. A proposal sent without
    an invitation is not accepted.
  definition: 'A way of making grants in which a foundation''s staff find organisations themselves and invite a proposal,
    and a proposal from an organisation the foundation has not approached is not accepted [2300] [2304]. Each foundation
    states the rule in its own words: Ford''s are "We do not accept any unsolicited grant proposals by mail, email or phone.",
    and Walmart adds that "invitations are not granted upon request" [2259] [2433]. Of the 25 large national foundations
    in this guide''s records, 17 are marked invitation-only [2259] [2298] [2307]. Such foundations say that an invitation
    follows from staff coming to know an organisation''s work, and a few name a first contact an outsider may make, as Kresge
    does with its contact form [2307] [2348]. Some also post open calls [2274] [2349].'
