- id: prior-approval
  term: Prior approval
  kind: methods
  variants:
  - prior written approval
  short: Written permission a recipient needs from the funding agency before it makes certain changes to a project or charges
    certain kinds of cost.
  definition: Written consent that a recipient obtains from the agency before making certain changes to a funded project
    or charging certain kinds of cost [1815] [1834]. Under 2 CFR 200.308 it is needed for a change in scope or objective,
    a change in key personnel, and disengagement of the project director for more than three months or a 25 percent reduction
    in time, among other changes [1815]. 2 CFR 200.407 lists sixteen sections under which it is a condition of a cost being
    allowable, among them the sections on equipment, pre-award costs and travel [1834]. The agency is to say within 30 days
    of receipt whether a requested revision is approved; the section says "should", not "must" [1815]. A subrecipient asks
    its pass-through entity [1815].
