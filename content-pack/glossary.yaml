  term: DOE Office of Science
  kind: science
  variants:
  - Office of Science
  short: The part of the Department of Energy that funds basic research in the physical sciences and related fields at universities,
    non-profits, firms and national laboratories.
  definition: The office of the Department of Energy that funds basic research in the physical sciences, computing, biology
    and environment, fusion, high energy physics, nuclear physics and isotopes, at universities, non-profits, firms and
    its national laboratories [277] [287]. DOE describes it as the nation's largest supporter of basic research in the physical
    sciences and the steward of 10 national laboratories [367]. Its annual open notice is posted at the end of September
    and stays open for the fiscal year, and targeted notices carry their own dates; both appear on its own site and on Grants.gov
    [277] [282] [364]. The notice lists programme manager contacts by programme office and strongly encourages pre-applications
    [281]. A programme manager screens each application and sends it to at least three reviewers, and a selection official
    decides, weighing the reviews, relevance to the mission, available funds and cost [286].
