- id: discretionary-grant
  term: Discretionary grant
  kind: methods
  variants:
  - discretionary grants
  - discretionary award
  - discretionary awards
  - discretionary funding
  short: A grant for which the agency selects the recipient, through a competition or on the merit of proposals, and decides
    the amount.
  definition: 'An award for which the agency may select the recipient from among all eligible applicants, may decide whether
    to make an award on the content of an application, and decides the amount [1880]. 2 CFR 200.1 defines it as one in which
    the agency, under statutory authority to exercise judgment, selects the recipient or the amount through a competitive
    process or on the merit of proposals [1894]. This is the money announced in notices of funding opportunity: the notice
    rules in 2 CFR 200.204 apply to discretionary funding opportunities [1800]. Each Assistance Listing states whether a
    programme''s awards are discretionary or non-discretionary [1808]. Executive Order 14332, signed August 7, 2025, applies
    to discretionary grants only, and under it a senior appointee reviews new funding opportunity announcements and discretionary
    grants [246].'
  concept: grants-and-agreements-101
