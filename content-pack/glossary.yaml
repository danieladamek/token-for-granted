  term: Form 990
  kind: notation
  variants:
  - Form 990-EZ
  - Form 990-N
  - e-Postcard
  short: The annual return a tax-exempt organisation files with the IRS. Small organisations file the shorter Form 990-EZ
    or the electronic notice Form 990-N.
  definition: The annual return that a tax-exempt organisation files with the IRS; which form in the series it files depends
    on its size and on whether it is a private foundation [2055]. Form 990-N, the e-Postcard, is for gross receipts normally
    of $50,000 or less; Form 990-EZ may be used with gross receipts under $200,000 and total assets under $500,000; at or
    above either of those two figures the organisation files Form 990 [2055]. Churches are excepted from filing, and an
    organisation that files nothing for three consecutive years loses its tax-exempt status automatically [2056] [2057].
    Returns are open to public inspection for three years, and the IRS Tax Exempt Organization Search holds filed returns
    [2461] [2059]. On Schedule A a public charity states the reason it is not a private foundation [2374].
