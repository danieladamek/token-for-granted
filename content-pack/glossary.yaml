- id: unsolicited-request
  term: Unsolicited request
  kind: methods
  variants:
  - unsolicited
  - unsolicited proposal
  - unsolicited proposals
  - unsolicited requests
  short: A request for money that the funder did not invite. A private foundation states on its annual return whether it
    accepts such requests.
  definition: A proposal or request for funds that a foundation has not invited; whether a private foundation accepts such
    requests is stated on its Form 990-PF, at Part XIV, line 2, which opens with a check box [2387]. The box reads "Check
    here if the foundation only makes contributions to preselected charitable organizations and does not accept unsolicited
    requests for funds." [2387] A foundation that leaves it unchecked fills in lines 2a to 2d with the contact, the form
    of application, the deadlines and the restrictions; the entry is the foundation's own statement for the tax year of
    the return, and its website may say something newer [2387]. Public charities such as community foundations file Form
    990 and have no such line [2374]. Packard reports that less than one percent of its grants come from unsolicited proposals
    [2283].
