  - executive orders
  short: A numbered presidential order that directs federal agencies, published in the Federal Register. It tells agencies
    what to do and does not itself rewrite a regulation.
  definition: 'A numbered presidential document, signed and then published in the Federal Register, that directs federal
    agencies to act [246] [2097]. Executive Order 14332, signed August 7, 2025 and published at 90 FR 38929, requires a
    senior appointee''s review of new funding announcements and discretionary awards and directs OMB to revise the Uniform
    Guidance [246]. Its section 7 says that the order creates no enforceable rights and is to be implemented consistent
    with applicable law [246]. The revision it directs was published as a proposed rule on May 29, 2026 and had not been
    finalised on 2026-10-04; Public Law 119-103 bars a final rule through December 11, 2026 [1803] [1858] [1480]. Steps
    taken under an order can be challenged in court: a district court vacated the actions that implemented Executive Order
    14238 at the Institute of Museum and Library Services [688] [687].'
