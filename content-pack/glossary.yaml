  short: An independent non-profit research funder, authorised by Congress, that pays for studies comparing how well clinical
    options work for patients. Its awards are contracts.
  definition: An independent non-profit funder of patient-centered comparative clinical effectiveness research, which Congress
    authorized in 2010 and reauthorized in December 2019 [586]. It is paid for by the Patient-Centered Outcomes Research
    Trust Fund, which receives appropriations and a fee on private insurance and self-insured health plans for fiscal years
    2020 through 2029; PCORI receives 80 percent of the Trust Fund [587]. Its awards are contracts, and a letter of intent
    is required before an application [599]. It posts on its own funding opportunities page and runs three research cycles
    a year [590]. Invited full applications go to merit review panels of scientific, patient and other stakeholder reviewers
    whose scores are weighted equally [597].
