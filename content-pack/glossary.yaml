- id: nicra
  term: Negotiated indirect cost rate agreement (NICRA)
  kind: methods
  variants:
  - NICRA
  - negotiated rate
  - negotiated rates
  - negotiated indirect cost rate
  - negotiated indirect cost rate agreement
  short: The document recording the indirect cost rate that one federal agency has negotiated with an organisation on behalf
    of all federal agencies.
  definition: The record of the rate, or rates, for indirect costs that one federal agency has negotiated with an organisation
    on behalf of all federal agencies [1799]. The agency that negotiates is the organisation's cognizant agency for indirect
    costs [1799]. Once a rate is negotiated every federal agency must accept it, unless a federal statute or regulation
    requires a different rate or the awarding agency approves a deviation under a published procedure [1802]. An organisation
    with an established rate submits a new proposal within six months after the close of each fiscal year, and one with
    a current rate may ask once for an extension of up to four years [1850] [1802]. For a university award, the rates in
    effect at the time of the initial award apply for the life of each competitive segment [1849]. The HHS, ONR and NSF
    pages read state no fee [1860] [1861] [163].
