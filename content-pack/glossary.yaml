  short: NIH's code for a research project funded as a cooperative agreement, in which NIH staff take part in the work after
    the award is made.
  definition: 'The NIH activity code for a research project cooperative agreement: the same kind of discrete research project
    as the R01, funded under a cooperative agreement instead of a grant [49] [3]. What marks a cooperative agreement off
    from a grant is that substantial involvement is expected between the agency and the recipient while the work is carried
    out [1851]. A NIAID notice puts it so: "After award, NIH scientific or program staff will assist, guide, coordinate,
    or participate in project activities." [116] The terms of each notice name the NIH roles and a dispute panel [116].
    There is no parent U01; a search of Grants.gov on October 4, 2026 returned 33 open notices, each for a defined programme,
    and NIH''s simplified review framework lists other codes that begin with U beside it, among them U34, UG3 and UH3 [111]
    [41].'
