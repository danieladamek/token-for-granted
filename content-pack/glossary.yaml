- id: general-operating-support
  term: General operating support
  kind: methods
  variants:
  - general operating
  - unrestricted support
  - core support
  short: A grant that pays for an organisation's work as a whole and is not tied to one project.
  definition: 'A grant that pays for an organisation''s work as a whole [2261]. Ford defines it as funds for day-to-day
    work, often as multi-year commitments, and Open Society as support "that cover the day-to-day costs of operations" [2261]
    [2293]. Foundations differ on it: Hewlett says it "Provides long-term, general operating support whenever possible",
    while Woodruff says most of its grants support one-time needs [2280] [2313]. Ford reported in November 2022 that 81%
    of its grantmaking was general or core support, up from 36% [2333]. The kind of grant can decide the indirect cost rule:
    Ford''s and MacArthur''s indirect cost rates apply to project grants and not to general operating support [2332] [2265].'
