  - new investigators
  short: An NIH standing for a lead investigator within 10 years of the final research degree or clinical training who has
    not yet won a substantial independent NIH research award.
  definition: A standing NIH gives to a PD/PI who is within 10 years of the terminal research degree or the end of post-graduate
    clinical training, whichever is later, and has not yet won a substantial independent NIH research award [138]. NIH computes
    it from the degree date and award history in the investigator's eRA Commons profile, and takes requests to extend it
    for lapses in research [138]. It applies to R01-equivalent applications; every PD/PI on the application must hold it,
    and NIH says such applications with meritorious scores are prioritised for funding [138]. New Investigator is a separate
    NIH term, for a person who "has not previously competed successfully for Substantial research grants from NIH" [138].
    In May 2025 NIH extended the status automatically for people whose window ran out during the first half of 2025 [787].
