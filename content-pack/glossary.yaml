  - DCL
  short: A letter NSF publishes to give information, clarify policy or announce its interest in proposals or supplements
    on a topic.
  definition: A published letter from NSF that gives information, clarifies policy, or announces the agency's interest in
    planning, RAPID, EAGER, RAISE or conference proposals, or in supplements, on a topic [156] [158]. It is one of NSF's
    four kinds of funding opportunity, beside programme descriptions, programme announcements and programme solicitations
    [156]. NSF's entry page says the letters advertise supplements to existing awards and NSF's interest in specific topics
    [158]. The INTERN supplement, which pays for a graduate student's internship outside academia through an existing NSF
    award, rests on a letter posted October 8, 2020 [870]. A letter can be archived while the policy guide still lists the
    request type, as with the Career-Life Balance supplement letter [846] [257].
