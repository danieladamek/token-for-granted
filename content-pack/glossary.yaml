  term: Federal Financial Report (SF-425)
  kind: methods
  variants:
  - SF-425
  - FFR
  - Federal Financial Report
  short: The standard form on which a recipient reports to the agency on the money of an award, at intervals the award sets.
  definition: 'The standard report a recipient files with the agency on the money of an award [1820]. Under 2 CFR 200.328
    financial reports use OMB-approved data elements such as this form, and are collected no less than annually and no more
    often than quarterly [1820]. An annual report is due no later than 90 calendar days after the reporting period, a quarterly
    or semiannual one no later than 30 calendar days after, and the final report no later than 120 calendar days after the
    period of performance [1820]. Each report carries a signed certification that it is true, complete and accurate [1885].
    Where it is filed depends on the funder: recipients paid through the HHS Payment Management System file it there, and
    NIFA''s research grantees at 1890 land-grant institutions file it through the ezFedGrants portal [1936] [1961] [1635].'
