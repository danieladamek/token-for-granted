  short: A court's cancelling of an agency policy, notice or decision, so that it is no longer in effect. Court orders also
    say that the action is set aside.
  definition: 'A court''s cancelling of an agency policy, notice or decision; the orders pair the words, as in "The PRWORA
    Notices are declared unlawful under the APA and ordered set aside and vacated." [1479] The District of Massachusetts
    vacated NSF''s 15 percent indirect cost policy on June 20, 2025, and NSF states that the policy is not in effect [238]
    [237] [154]. It is a separate remedy from an injunction: on August 7, 2026 the District of Rhode Island set aside HUD''s
    fiscal year 2026 Continuum of Care notice in its entirety and denied a permanent injunction [1478]. A vacatur can be
    paused, as when the First Circuit stayed that ruling pending appeal on September 16, 2026 [1283]. A court may grant
    neither, as in the declaratory judgment of July 17, 2026 in New Jersey v. OMB [1869].'
