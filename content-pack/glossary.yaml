- id: r21-r03
  term: R21 and R03
  kind: notation
  variants:
  - R21
  - R03
  short: 'Two NIH codes for small grants of up to two years: the R21 for exploratory work and the R03 for small projects.
    Neither can be renewed.'
  definition: 'Two NIH activity codes for grants limited in amount and to a project period of two years [5] [6]. The R21,
    the Exploratory/Developmental Research Grant, encourages new research activities: combined direct costs may not exceed
    $275,000 over the period, with no more than $200,000 in a single year, and preliminary data are not required [3] [5]
    [43]. The R03, the Small Research Grant, allows $50,000 in direct costs a year for uses such as pilot studies, secondary
    analysis of existing data and development of methods or technology [6] [44]. Neither can be renewed, and in both the
    research strategy is limited to 6 pages [43] [44]. Not all NIH institutes and centers take part in every parent announcement
    [43].'
