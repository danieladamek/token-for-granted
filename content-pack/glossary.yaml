- id: single-audit
  term: Single audit
  kind: methods
  variants:
  - single audits
  short: The audit an organisation must have for any fiscal year in which its spending of federal awards reaches a set threshold.
  definition: The audit a non-federal entity must have for any fiscal year in which its spending of federal awards reaches
    a set amount [1845]. The threshold in force is $1,000,000 or more in federal awards expended during the entity's fiscal
    year; the Federal Audit Clearinghouse applies $750,000 to fiscal years that began before October 1, 2024 [1845] [1938].
    Money received as a subrecipient counts as federal awards expended, and payments received as a contractor do not [1845].
    The audit is filed within 30 calendar days after the auditee receives the auditor's report or nine months after the
    end of the audit period, whichever is earlier [1846]. An entity below the threshold is exempt from federal audit requirements
    for that year, though its records must remain available for review [1940]. The requirement does not apply to for-profit
    organisations [1940].
  concept: uniform-guidance-101
