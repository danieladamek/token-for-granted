- id: indirect-costs
  term: Indirect costs (facilities and administrative costs)
  kind: methods
  variants:
  - indirect costs
  - indirect cost
  - F&A
  - F&A costs
  - facilities and administrative costs
  - overhead
  short: Costs of running an organisation that serve many projects at once and cannot readily be assigned to one award.
    An award pays them as a percentage of its direct costs.
  definition: Costs incurred for a common or joint purpose that benefit more than one cost objective and cannot readily
    be assigned to the award that benefits [1799]. At major institutions of higher education and major non-profits they
    are classified in two groups, Facilities and Administration, which is why they are also called F&A costs [1802]. An
    award pays them as a percentage, the indirect cost rate, applied to a base of direct costs that is normally modified
    total direct costs [1849] [1850] [1799]. An organisation gets its rate through a negotiated agreement with its cognizant
    federal agency or by electing the de minimis rate [1802]. The rate used for an award is printed in the award document
    [1810]. Appendix III limits the administrative categories at a university to 26% of modified total direct costs [1849].
    Programme notices state any limit that applies to a particular programme [1802].
