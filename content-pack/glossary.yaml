  term: Application package
  kind: methods
  variants:
  - application packages
  short: The set of forms that make up one application to one funding notice, filled in and submitted through Grants.gov.
  definition: 'The set of forms that makes up one application to one funding opportunity on Grants.gov [1915] [1918]. The
    forms an opportunity requires are loaded into its Workspace package, where members of a team fill them in, online or
    as downloaded PDFs, before an Authorized Organization Representative submits it [1918] [1915] [1965]. The SF-424, the
    standard federal application form, comes in several sets for different kinds of applicant and programme [1918]. The
    PDFs in the Grants.gov forms repository are samples and cannot be submitted with a package [1918]. A package can be
    submitted when all required forms pass error checks, the SAM.gov registration is active and the deadline has not passed,
    and Grants.gov keeps submitted packages for 5 years [1965] [1966]. NIH names its package versions: its letters of collaboration
    take effect in fiscal year 2027 with the Forms J application package [131].'
