- id: risk-review
  term: Pre-award risk review
  kind: methods
  variants:
  - risk review
  - risk assessment
  short: The check a federal agency makes of an applicant's finances, systems and record before it makes an award. It can
    end in extra conditions on the award.
  definition: 'The assessment a federal agency makes, before an award, of the risk an applicant poses [1809]. Under 2 CFR
    200.206 the agency checks eligibility and financial integrity information in OMB-designated databases, and keeps written
    procedures for an assessment that may weigh financial stability, management systems, history of performance, and audit
    reports and findings [1809]. The criteria must be described in the funding announcement [1809]. The review can end in
    specific conditions under 200.208, such as payment by reimbursement in place of advance, and the agency must remove
    a condition promptly once it is satisfied [1886]. Agencies ask for different papers: the Office of Justice Programs
    has applicants complete a Financial Management and System of Internal Controls Questionnaire in JustGrants [619]. OMB''s
    proposed rule of May 29, 2026 lists revisions to both sections [1458].'
