  - individual fellowship
  short: An NIH fellowship for one named doctoral student or postdoctoral researcher, who trains under a sponsor. It pays
    a stipend and allowances, and no indirect costs.
  definition: A fellowship in NIH's F series of activity codes that supports one named person's mentored research training
    under a faculty sponsor; it is one of the Kirschstein National Research Service Awards [736] [737]. The F31 is for doctoral
    students, the F30 for students in a combined MD/PhD or other dual-doctoral degree programme, and the F32 for postdoctoral
    researchers [736] [738] [737]. The applicant organisation submits the application, and by the time of award the candidate
    must be a citizen or non-citizen national of the United States, or lawfully admitted for permanent residence [784] [736].
    The award pays a stipend, a contribution to tuition and fees and an institutional allowance, with no separate payment
    for indirect costs [736]. Applications are scored on three criteria, which replaced five for due dates on or after January
    25, 2025 [736] [794].
