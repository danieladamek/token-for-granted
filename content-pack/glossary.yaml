  short: The naming of two or more people to lead one project. NIH speaks of multiple PD/PIs; NSF names a PI and co-PIs.
  definition: 'The naming of more than one person to lead a single project: NIH speaks of multiple PD/PIs, and NSF of a
    principal investigator with co-PIs [12] [265]. Each notice says whether it is allowed: NIH''s Transformative Research
    Award permits multiple PD/PIs, a NIAID programme project notice allows them only for the overall programme leader, and
    NSF''s CAREER and TRAILBLAZER awards go to one investigator with no co-PIs [103] [113] [814] [269]. Limits follow the
    person in either role: NIH''s six applications a year count those made as PD/PI or multiple PD/PI, and NSF''s SaTC programme
    caps the proposals on which a person may be PI or co-PI [12] [265]. At NIH an application is treated as an early stage
    investigator application only when every PD/PI on it holds that status [138].'
