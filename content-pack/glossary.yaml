  short: The Department of Agriculture's agency for funding agricultural research, education and extension outside the department.
    AFRI is its largest competitive programme.
  definition: 'The Department of Agriculture''s extramural funding agency for agricultural research, education and extension
    [422]. It has three kinds of funding: competitive grants; capacity grants to land-grant institutions, schools of forestry
    and schools of veterinary medicine; and non-competitive grants directed by Congress [422]. Its Agriculture and Food
    Research Initiative (AFRI) is, in NIFA''s words, "The nation''s leading competitive grants program for agricultural
    sciences" [406]. Notices are posted on NIFA''s funding opportunities page and on Grants.gov, through which applications
    are submitted; peer review panels then rank the applications [408] [409] [422]. USDA''s FY 2027 Budget Summary proposes
    a cut of $510 million to NIFA formula grants, which is a request and has not been enacted [426].'
