  - fiscally sponsored
  short: An arrangement in which one organisation oversees the money side for a project or group that has no tax-exempt
    status of its own. Funders differ on whether they accept it.
  definition: 'An arrangement in which one body handles the finances of another: a fiscal sponsor, in the Arts Endowment''s
    words, is an entity that oversees the fiscal activities of another organisation, company, or group of independent artists
    or projects [2065]. A newcomer might assume it opens federal grants to a group without its own status, but the two federal
    pages read for this guide do not accept an application made that way [2065] [648]. At the Arts Endowment an organisation
    without its own non-profit status may not use a fiscal sponsor or agent to submit an application, and an NEH notice
    of March 12, 2026 says fiscal sponsors applying on behalf of an ineligible organisation are not eligible [2065] [648].
    Foundations differ: Open Society Foundations lets informal groups come through a fiscal sponsor or intermediary, and
    the Simons Foundation does not fund fiscal sponsors or agents [2357] [2120].'
