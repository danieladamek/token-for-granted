  - SF 424
  short: The standard federal application form, issued in several sets for different kinds of applicant and programme and
    filled in through Grants.gov.
  definition: 'The standard federal application form, issued in several sets for different kinds of applicant and programme
    [1918]. Grants.gov''s forms repository divides them into families, among them the SF-424 Family, the R&R (Research and
    Related) Family and the SF-424 Short Organization Family [1918]. The forms an opportunity requires are loaded into its
    Workspace package; the PDFs shown in the repository are samples and cannot be submitted with an application [1915] [1918].
    Agencies call for different sets: the NEA''s Part 1 application, for example, uses the Short Organization form [1934].
    The governmentwide assurances that applicants once signed on Standard Form 424B are now made in SAM.gov when an organisation
    registers or renews its registration [2035].'
