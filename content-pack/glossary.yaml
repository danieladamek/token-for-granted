- id: omb
  term: Office of Management and Budget (OMB)
  kind: science
  variants:
  - OMB
  short: The federal office that issues the government-wide rules for grants, the Uniform Guidance, which each grant-making
    agency then adopts.
  definition: The federal office that issues the Uniform Guidance, the government-wide rules for federal awards, as 2 CFR
    part 200 [1799] [1805]. The part binds the federal agencies that make awards and, through the award terms, recipients
    and subrecipients [1805]. An agency that approves a deviation from a negotiated indirect cost rate must notify this
    office, and agencies check applicants in databases it designates [1802] [1809]. Financial reports use data elements
    it approves [1820]. Executive Order 14332 directs its Director to revise the Uniform Guidance, and on May 29, 2026 it
    published a proposed rule with the grant-making agencies as co-proposers [246] [1458]. Section 157 of Public Law 119-103
    bars a rule arising from that proposal from being issued or taking effect through December 11, 2026 [1480]. The proposal
    gives its Office of Federal Financial Management as the contact [1458].
