- id: pending-implementation
  term: Pending implementation
  kind: science
  variants:
  - pending-implementation
  short: This guide's label for a change that has been signed, announced or enacted but has not yet taken effect or been
    carried out in full.
  definition: A label of this guide's own on a record of change; it is not a legal term. It marks a change that has been
    signed, announced or enacted and whose effect lies ahead, or whose carrying-out is unfinished. Records so marked include
    an NIH notice of July 27, 2026 that replaces letters of support with letters of collaboration from fiscal year 2027
    [131], Executive Order 14332 of August 7, 2025, whose directed revision of the Uniform Guidance has not been made final
    [246] [1480], and the Department of Education's interagency agreements announced November 18, 2025 [672]. The label
    says nothing about whether the change will arrive on the date given. The other labels on records of change are proposed,
    announced, enacted, final, enjoined, vacated, in-litigation, on-appeal, rescinded and frozen-by-appropriations.
