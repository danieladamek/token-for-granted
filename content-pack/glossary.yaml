- id: cost-principles
  term: Cost principles
  kind: methods
  variants: []
  short: The part of the Uniform Guidance that decides what an award may pay for. A cost has to be allowable, and to be
    allowable it has to be reasonable and allocable.
  definition: 'The rules in subpart E of the Uniform Guidance that decide what an award may pay for [1831]. A cost charged
    to an award has to be allowable, and to be allowable it has to be reasonable and allocable, among other tests [1831].
    A cost is reasonable if it does not exceed what a prudent person would incur in the circumstances, and it is allocable
    to an award according to the relative benefits received [1832] [1833]. Subpart E then gives rules for named items of
    cost: alcoholic beverages and organised fundraising are unallowable, for example [1836] [1840]. The subpart does not
    apply to fixed amount awards, with limited exceptions [1805]. OMB''s proposed rule of May 29, 2026 lists revisions to
    several of its sections and a new 200.477; it remains a proposal [1458].'
