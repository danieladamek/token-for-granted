  term: National Endowment for the Arts (NEA)
  kind: science
  variants:
  - NEA
  short: The federal agency that funds arts projects by organisations, and research on the value and impact of the arts.
  definition: 'A federal grant-maker for the arts: it funds arts projects by organisations and, through two research programmes,
    studies of the value and impact of the arts [650]. Its Grants for Arts Projects programme gives standard applicants
    awards of $10,000 to $100,000 and requires a 1:1 cost share [654]. It does not accept applications from individuals
    in these programmes, and an organisation without its own non-profit status may not use a fiscal sponsor or agent to
    submit an application [651] [654] [2065]. Guidelines are posted on arts.gov and the opportunity on Grants.gov; the second
    part of each application is filed in the NEA Applicant Portal [650] [652]. Advisory panelists review applications in
    closed session, the National Council on the Arts votes on the panel''s recommendations, and the Chair makes the final
