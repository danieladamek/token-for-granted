- id: mtdc
  term: Modified total direct costs (MTDC)
  kind: methods
  variants:
  - MTDC
  - modified total direct costs
  short: The base of direct costs to which an indirect cost rate is usually applied. It leaves out equipment and several
    other kinds of cost.
  definition: The portion of an award's direct costs to which an indirect cost rate is usually applied [1799]. 2 CFR 200.1
    defines it as all direct salaries and wages, applicable fringe benefits, materials and supplies, services, travel, and
    up to the first $50,000 of each subaward [1799]. It excludes equipment, capital expenditures, charges for patient care,
    rental costs, tuition remission, scholarships and fellowships, participant support costs, and the portion of each subaward
    in excess of $50,000 [1799]. Equipment for this purpose is property with a useful life of more than one year and a unit
    cost at or above the lesser of the organisation's capitalisation level or $10,000 [1799]. The $50,000 and $10,000 figures
    date from the revision effective October 1, 2024 [1883]. Every award that uses the de minimis rate is charged on this
    base [1802].
