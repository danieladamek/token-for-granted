- id: private-foundation
  term: Private foundation
  kind: science
  variants:
  - private foundations
  short: A tax-exempt charity that falls outside the tax code's categories of public charity. It files a public return,
    Form 990-PF, every year.
  definition: 'The class into which the tax code puts every section 501(c)(3) organisation that does not fall into an excluded
    category; the excluded organisations are the public charities [2237] [2238]. It files Form 990-PF each year whatever
    its size and is subject to excise taxes and operating restrictions that a public charity is not [2055] [2054]. The grantmaking
    kind, the non-operating foundation, must also pay out a minimum amount each year [2375] [2377]. The return is public
    and lists every grant paid, so a reader can see what the foundation has funded [2387] [2461]. The word in an organisation''s
    name does not settle the class: a community foundation that meets a public support test is a public charity [2374].'
