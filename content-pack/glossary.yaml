- id: title-iii-v-eligibility
  term: Title III and Title V eligibility
  kind: science
  variants:
  - Title III
  - Title V
  short: A yearly Department of Education designation of colleges that enrol many needy students and spend little per student.
    Certain Higher Education Act grant programmes require it.
  definition: 'A designation the Department of Education makes each year under section 312 of the Higher Education Act:
    an "eligible institution" is a college that enrols a high share of needy students and has low core expenses per student
    compared with institutions of its type [1596] [1595]. A designated institution may apply for the grant programmes that
    require it and may receive a one-year waiver of certain non-Federal cost-sharing requirements [1595]. The Department
    pre-determines eligibility from IPEDS data in the Eligibility Matrix; an institution checks its status in the Grant
    Eligibility Application system at HEPIS.ed.gov and, if not shown as eligible, applies for reconsideration or a waiver
    within the yearly window [1596]. The FY 2026 notice is titled for programmes under section 312 only, where the FY 2025
    notice was titled for Parts A and F of Title III and Title V [1596] [1597].'
