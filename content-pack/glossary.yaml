  term: National Endowment for the Humanities (NEH)
  kind: science
  variants:
  - NEH
  short: The federal agency that funds the humanities, with grants to colleges, museums, libraries, research institutions,
    independent scholars and other non-profits.
  definition: A federal grant-maker that describes itself as the largest federal funder of the humanities; it makes grants
    to colleges, universities, museums, libraries, historic sites, research institutions, independent scholars and other
    nonprofits [630]. Since August 20, 2025 its grantmaking sits in four divisions [641]. NEH posts each programme page
