- id: formula-grant
  term: Formula grant
  kind: methods
  variants:
  - formula grants
  - formula money
  - formula funding
  - mandatory grant
  - mandatory grants
  short: Federal money that a law divides among states, territories or local governments by a set formula, with no competition
    among applicants.
  definition: 'An allocation of federal funding to states, territories or local units of government, set by a distribution
    formula in the authorising law and regulations [1880]. For a mandatory grant the authorising statute requires an award
    to each eligible entity in the amount or by the formula it sets [1880]. The Uniform Guidance''s own term is non-discretionary
    award: one made to specific recipients under statutory, eligibility and compliance requirements, such that the agency
    cannot exercise judgment [1894]. ACL describes mandatory, or formula, grants as ongoing programmes that need no application
    or competition [1259]. The government that receives the money, not the federal agency, then funds local organisations,
    so a non-profit applies to that state or local body [1280] [1292]. Older Americans Act money, for one, passes from ACL
    to 56 state agencies on aging, then to 618 area agencies on aging, then to local service providers [1260].'
  concept: formula-and-pass-through-101
