- id: pappg
  term: Proposal and Award Policies and Procedures Guide (PAPPG)
  kind: methods
  variants:
  - PAPPG
  short: NSF's governing guide to preparing a proposal and managing an award. NSF has proposed to replace it.
  definition: The guide in which NSF sets its rules for proposals and for awards [147] [148]. The version in force, NSF
    24-1, applies to proposals submitted or due on or after May 20, 2024, as amended by Supplement 1 for awards from December
    8, 2025 and Supplement 2 for awards from January 22, 2026 [147] [149] [150]. It has twelve chapters in two parts, the
    first on proposals and the second on awards [148]. NSF grants also carry the Grant General Conditions dated July 31,
    2026 [262]. On June 24, 2026 NSF published for comment a draft Guidance on Financial Assistance to replace it; comments
    closed August 24, 2026, and NSF's stated goal is to issue the new guidance for use in early to mid FY2027 [152] [151].
