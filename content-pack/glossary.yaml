- id: state-administering-agency
  term: State administering agency
  kind: science
  variants:
  - state administering agencies
  - state agency on aging
  - state agencies on aging
  - State Administrative Agency
  short: The state body that receives a federal formula or block grant and passes it on. A local organisation applies to
    it, not to the federal agency.
  definition: 'The body in a state that receives a federal formula or block grant and to which local governments and organisations
    turn for pass-through funding [1343] [1320]. The name differs by programme: for Byrne JAG only the designated state
    administering agencies for the 56 states, territories and the District of Columbia receive the state awards [1343].
    For the Nonprofit Security Grant Program it is the State Administrative Agency, which takes non-profits'' applications,
    scores them and applies to FEMA, on its own earlier deadline [1320]. Older Americans Act money goes to 56 state agencies
    on aging, and the State Mental Health Authority submits for the mental health block grant [1260] [1219]. The calendar
    belongs to that body, and federal pages do not always describe the local step: those for the Title V block grant do
    not say how a local organisation applies [1399] [1168].'
