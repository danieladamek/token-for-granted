  - forecasts
  - forecasted
  short: An agency's advance listing on Grants.gov of a notice it plans to publish, with estimated dates. It is not yet
    open for applications.
  definition: 'An advance listing, posted on Grants.gov, of a funding notice an agency intends to publish; it is a statement
    of intent, not an open notice [1064]. A forecast gives estimates: one NIOSH forecast posted September 1, 2026 shows
    an estimated post date of November 30, 2026, an estimated application due date of January 29, 2027, the expected number
    of awards and the award range [1064]. NIH''s policy statement says its notices "are forecasted on Grants.gov prior to
    publication" [145]. The estimated dates can pass with no notice: a forecast for an NIH centres notice showed an estimated
    post date of September 24, 2025, and no posted notice was found on October 4, 2026 [1587] [1586]. Nine forecasts from
    one HHS office, dating from August 2024 and July 2025, remained on Grants.gov without posting dates [1179] [1185].'
