  term: Activity code
  kind: notation
  variants:
  - activity codes
  - mechanism code
  short: A three-character code by which NIH labels each kind of award, such as R01, K08 or T32. The first character usually
    shows the funding category.
  definition: 'The three-character label NIH gives to each kind of award; the first character usually identifies the funding
    category, with R for research, T for training, F for fellowship and K for career development [3]. A reader meets it
    in the title of a funding notice, and each parent announcement is for one activity code, such as R01, R21, R03 or R15
    [4] [1]. Rules attach to codes: each has three standard due dates a year, and NIH''s limit of six applications per investigator
    per calendar year covers all codes except T codes and the R13 [2] [12]. One code can serve more than one programme;
    the Director''s Transformative Research Award uses the R01 code under its own yearly notice [103].'
