- id: project-grant
  term: Project grant (from a foundation)
  kind: methods
  variants:
  - project support
  short: A foundation grant that pays for one named piece of work with its own budget, as distinct from support for the
    organisation as a whole.
  definition: 'A foundation grant that pays for one named piece of work with its own budget; foundations also call it project
    support, and it is one of the two main kinds of foundation grant, the other being general operating support [2261].
    Ford describes project support as funds for distinct initiatives that are "usually time-bound, and aimed at achieving
    specific goals" [2261]. Some funders prefer it: Woodruff says "Most grants support one-time needs rather than ongoing
    program or operating needs" [2313]. Ford''s and MacArthur''s indirect cost rates apply to project grants and not to
    general operating support [2332] [2265]. The term here is not NIH''s "research project grants", which NIH''s budget
    documents count among its own awards [57].'
