  definition: 'The state of a court ruling that a party has asked a higher court to review; whether the ruling is in force
    meanwhile turns on a stay pending appeal, an order that pauses it while the appeal proceeds [30] [543] [1283]. The First
    Circuit denied one on September 17, 2025 in State of New York v. Kennedy, which left the district court''s injunction
    of July 1, 2025 in place [543]. It granted one on September 16, 2026 against the ruling that vacated HUD''s fiscal year
    2026 Continuum of Care notice, and HUD reopened the notice on September 18, 2026 [1283]. On August 21, 2025 the Supreme
    Court did both in one order: it stayed the judgments vacating NIH grant terminations and left in place the vacatur of
    the guidance documents [28]. Orders on stay applications are not final rulings on the merits [1804] [28].'
