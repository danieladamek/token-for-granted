  - funding rates
  short: The share of applications in a year that receive an award. A funding rate may count something else, such as applicants
    in place of applications.
  definition: The share of applications that receive an award in a fiscal year, as a funder reports it [81]. NIH reported
    a research project grant success rate of 13.0% for FY 2025, from 8,161 new and renewal awards and 62,592 applications,
    against 18.5% in FY 2024 [81]. Its applicant funding rate is a different measure, unique awardees divided by unique
    applicants on new applications; for early stage investigators on R01-equivalent applications it was 18.9% in FY 2025
    [82]. NIH publishes success rates by activity code and institute as downloadable report files, with a definition of
    the term [26]. NSF's budget request for FY 2027 shows a research-grant funding rate of 18% in the FY 2025 plan and 7%
    under the request, which is not enacted [255].
