  - Automatic Revocation List
  short: Loss of tax-exempt status that follows of itself when an organisation files no annual return or notice for three
    years in a row.
  definition: The loss of tax-exempt status that follows of itself when an exempt organisation files no annual return or
    notice for three consecutive years; it takes effect on the original filing due date of the third return or notice [2057].
    The organisation is removed from the IRS list of organisations eligible for deductible contributions and appears on
    the Automatic Revocation List, which a funder will find in the Tax Exempt Organization Search [2057] [2059]. A revoked
    organisation must apply again, with the user fee, by one of four procedures in Revenue Procedure 2014-11 [2058]. One
    that was eligible to file Form 990-EZ or 990-N and has not been revoked before may use streamlined retroactive reinstatement
    if it applies within 15 months [2058]. Others may seek retroactive reinstatement with a statement of reasonable cause,
    or be reinstated from the post-mark date of the new application [2058].
