  term: Congressionally Directed Medical Research Programs (CDMRP)
  kind: science
  variants:
  - CDMRP
  short: A defence office that funds biomedical research in programmes named by Congress, with money Congress adds each
    year.
  definition: 'A defence funder of biomedical research that began in 1992 with a congressional appropriation and works through
    programmes named by Congress [350]. Its money is added by Congress each year and is not in the President''s budget request
    [351]. The totals move with the defense appropriation: $650 million for 12 programmes in FY 2025 and $1.27 billion for
    34 programmes in FY 2026 [353] [295]. Universities, medical schools, non-profits, firms and foreign organisations may
    apply as extramural organisations, and announcements appear on the CDMRP website, Grants.gov and eBRAP [330] [295].
    Review has two tiers, peer review for scientific merit and impact and then programmatic review for fit with the programme''s
    vision and portfolio; consumer reviewers vote in both [352].'
