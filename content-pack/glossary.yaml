  short: The federal registry, run by the General Services Administration, in which an organisation holds an active registration
    before it applies for federal grant money in its own name.
  definition: The federal registry, run by the General Services Administration, in which an organisation holds an active
    entity registration before it applies for federal financial assistance as a prime awardee [1897] [1899]. Registration
    assigns the Unique Entity ID and, for a domestic organisation, a CAGE code; an entity may register for financial assistance
    awards only, which asks for less than a registration for all awards [1898] [784]. SAM.gov states that registering is
    free, that a registration can take up to 10 business days to become active and that it is renewed every 365 days; NIH
    says to allow three weeks or more for a first registration [1898] [1897] [1909]. A subrecipient needs only a Unique
    Entity ID [1900]. Since March 8, 2025 subaward reports have been made in SAM.gov too, and on January 28, 2026 GSA proposed,
    for comment until March 30, 2026, to update the financial assistance certifications made there, stating no effective
    date [1903] [1866].
