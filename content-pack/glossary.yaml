  - BAA
  - BAAs
  - broad agency announcement
  - broad agency announcements
  short: A standing notice, used by the defence research offices among others, that invites research proposals across the
    whole range of an office's interests.
  definition: 'A standing notice that invites research proposals across an office''s interests and can lead to a grant,
    a cooperative agreement, a contract or another transaction [334] [323]. The defence research offices use it: ONR''s
    long-range announcement, the Army Research Laboratory''s announcement for foundational research and DARPA''s six office-wide
    announcements are examples [334] [323] [344]. Under the Army Research Laboratory announcement, valid from 21 November
    2022 to 20 November 2027, proposals may be submitted at any time while it is open [341]. DARPA says its office-wide
    announcements exist "to enable researchers to propose ideas that may fall outside our current priorities but have potential
    value to national security" [344]. NSF also uses broad agency announcements for some use-inspired research and innovation
    priorities [158].'
