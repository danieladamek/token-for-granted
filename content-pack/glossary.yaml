  short: The identifier SAM.gov assigns to an organisation. Every federal application carries it, and a subrecipient needs
    one before a subaward can be made.
  definition: The identifier that SAM.gov assigns to an organisation; 2 CFR 25.400 defines it as "the universal identifier
    assigned by SAM.gov to uniquely identify an entity" [1899]. It replaced the DUNS number on April 4, 2022 [1969] [1909].
    Every applicant includes it in each application, and a subrecipient must have one before a subaward can be made [1899]
    [1900]. An organisation can get the identifier alone, by giving its legal business name and physical address, but with
    that alone it cannot apply directly for federal awards; a prime applicant needs the full SAM.gov registration, which
    also assigns the identifier [1897]. SAM.gov makes no charge for it, and the same one is used in every later registration,
    such as Grants.gov and eRA Commons [1898] [784].
