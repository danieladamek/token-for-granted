  short: A college that awards associate's, bachelor's or master's degrees and few doctorates. NSF uses the class for its
    RUI and ROA opportunities.
  definition: 'An accredited college or university, two-year community colleges included, that awards associate''s, bachelor''s
    or master''s degrees in NSF-supported fields and few doctorates [254]. NSF''s test is a count: the institution has awarded
    20 or fewer Ph.D./D.Sci. degrees in all NSF-supported fields during the combined previous two academic years [254].
    The institution certifies its own standing, and an RUI proposal carries a Certification of RUI/ROA Eligibility [254].
    NIH''s R15 AREA programme uses a different test of undergraduate focus: undergraduate enrolment greater than graduate
    enrolment, and limited NIH support [7].'
