  - institute or center
  short: One of the component bodies of NIH, each with its own research agenda. The institute or center that would pay for
    an award decides whether to fund it.
  definition: One of the component bodies of the National Institutes of Health, which says it is made up of 27 Institutes
    and Centers, each with a specific research agenda, often focusing on particular diseases or body systems [143]. After
    peer review the advisory council makes funding recommendations to the institute or center director, who makes the funding
    decision [38]. Each publishes the factors it weighs on its own funding-policy page, built on an NIH-wide framework that
    bars reliance on paylines from the January 2026 council round [67] [123]. Some state rules that go beyond the NIH-wide
    ones, as NIAID does on multi-year funding [68]. The FY 2027 budget request proposes to merge NIDA and NIAAA and to eliminate
    NCCIH, the Fogarty International Center and NIMHD; this is a request and has not been enacted [57].
