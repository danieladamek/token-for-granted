  - parent notice
  - parent notices
  short: A standing, broad NIH notice through which an investigator sends in an application on a topic of the investigator's
    own choosing.
  definition: A standing, broad notice of funding opportunity that an applicant uses to send NIH an investigator-initiated
    application, one whose topic the investigator chose and NIH did not ask for [1] [145]. Each is for one activity code,
    such as R01, R21, R03 or R15, and not every institute joins every one [1] [43]. Every NIH application answers a specific
    notice, so an unsolicited idea still goes in through one of these [120]. They typically use the standard due dates,
    with three cycles a year, and are usually reissued when they expire [1] [2]. During 2025 NIH cut the number of narrow
    notices and leaned more on parent announcements; active funding opportunities fell from over 800 at the start of 2025
    to fewer than 500 at its end [90] [10]. The P01 and the R34 have none, and each institute that uses those codes issues
    its own notice [1].
