  short: A lender certified by the Treasury's CDFI Fund to lend and invest in its community. Certification is the gate to
    the Fund's Financial Assistance awards.
  definition: 'A lender that the Community Development Financial Institutions Fund has certified; the Fund''s Financial
    Assistance awards go to certified institutions to lend and invest in their communities [1433]. Certification is the
    gate to those awards: each Financial Assistance applicant must be a certified CDFI [1434]. An Emerging CDFI, an organisation
