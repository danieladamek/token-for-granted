- id: form-990-pf
  term: Form 990-PF
  kind: notation
  variants:
  - 990-PF
  short: The annual return every private foundation files with the IRS. It is public and shows the foundation's assets,
    every grant paid, and whether it takes unsolicited requests.
  definition: 'The annual return that every private foundation files with the IRS, whatever its size; a 2025 return must
    be filed electronically [2388] [2055]. It is public: a foundation must make it available for inspection and copying
    for three years [2461]. Four places answer most of a grant seeker''s questions: the asset figure on page 1, the grants
    paid line in Part I, the balance sheet in Part II, and Part XIV, which lists every grant and says whether the foundation
    takes requests [2387]. A foundation that checks the box on Part XIV, line 2 is saying that it gives only to charities
    it has chosen itself [2387]. A community foundation or other public charity files Form 990 with Schedule A instead [2374].'
