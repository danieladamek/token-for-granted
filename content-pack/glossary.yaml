  term: National Science Foundation (NSF)
  kind: science
  variants:
  - NSF
  - National Science Foundation
  short: The federal agency that funds research and education across science and engineering, through grants, cooperative
    agreements and fellowships.
  definition: The federal agency that funds research and education across science and engineering through grants, cooperative
    agreements and fellowships [155]. It is organised in eight directorates and posts its opportunities in its own Funding
    Search, on directorate pages and on Grants.gov [167] [155]. Every proposal is judged on two criteria, Intellectual Merit
    and Broader Impacts; a programme officer obtains reviews from ad hoc reviewers, a panel or both, and then puts the proposal
    forward for award or decline [157] [160]. NSF states that it receives approximately 43,000 proposals a year and makes
    roughly 8,300 awards [152]. It has proposed to replace its Proposal and Award Policies and Procedures Guide with a Guidance
    on Financial Assistance; comments closed August 24, 2026, and NSF's stated goal is to issue it for use in early to mid
    FY2027 [152] [151].
