  - Academic Research Enhancement Award
  - Research Enhancement Award Program
  short: 'NIH''s code for research grants to institutions that have had little NIH support: AREA for undergraduate-focused
    ones, REAP for health professional and graduate schools.'
  definition: 'The NIH activity code for small-scale research projects at educational institutions that train many of the
    nation''s research scientists but have not been major recipients of NIH support [3]. It has two versions: AREA, for
    undergraduate-focused institutions, and REAP, for health professional schools and graduate schools [7] [8]. In both
    the institution must not have received NIH support of more than $6 million per year in 4 of the last 7 years, and an
    award is up to $375,000 in direct costs for a project of up to three years [7] [8]. NIH states three goals: to support
    meritorious research, expose students to research and strengthen the institution''s research environment [45]. The PD/PI
    may not lead an active NIH research grant and may hold only one R15 at a time [7] [45].'
