- id: not-competed
  term: Not competed
  kind: science
  variants:
  - not-competed
  short: This guide's label for a programme whose funder has said that the competition is cancelled, paused or will not
    be held.
  definition: 'A label of this guide''s own. It marks a programme record whose funder has said that the competition is cancelled,
    paused or will not be held. It differs from no-current-notice, which records only that no notice was found, and from
    closed, where a deadline has passed and the programme continues. One record so marked is the Social Security Administration''s
    Retirement and Disability Research Consortium: the agency''s release of February 21, 2025 states that it terminated
    the consortium''s cooperative agreements [626]. The label reports what the funder had said when its pages were read
    and does not say whether a competition will return.'
