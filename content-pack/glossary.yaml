  - limited submissions
  short: A competition in which the funder caps how many applications one institution may send, so the institution chooses
    internally first.
  definition: 'A funding competition in which the funder caps the number of applications or nominations one institution
    may put forward, so that the institution chooses among its own people before the funder sees anything [1516] [2174].
    Each notice sets its own cap: NSF''s Major Research Instrumentation programme allows two submissions in Track 1 and
    one each in Tracks 2 and 3, the NIH C06 allows one application per institution, and NASA EPSCoR R3 allows three proposals
    per institution [1516] [1542] [1573]. Among NSF''s training programmes an organisation may send two NRT proposals per
    competition [828]. Foundations use the same device for awards to people: each of 212 participating institutions puts
    forward one nominee for the Pew Scholars, and the institution runs an internal competition to choose that person [2174]
    [2175]. Some programmes state no limit, CAREER and DURIP among them [815] [1563].'
