- id: research-security
  term: Research security
  kind: methods
  variants:
  - research security training
  - research security program
  - research security programme
  short: Federal requirements on training, disclosure and institutional safeguards that attach to research funding. People
    certify training; large institutions certify a programme.
  definition: 'A group of federal requirements that attach to research funding and cover training of people and safeguards
    at institutions [2014] [2017]. Section 10634 of the CHIPS and Science Act of 2022 requires training for the people named
    on federal research and development applications, and each agency has put it into effect on its own date: NSF for all
    proposals from December 2, 2025, NIH for due dates on or after May 25, 2026 [33] [2014]. Each person certifies training
    completed within the 12 months before submission, and the organisation''s authorised representative certifies as well
    [2014] [33]. Separately, National Security Presidential Memorandum 33 requires institutions that receive more than 50
    million dollars a year in federal science and engineering support to certify that they operate a research security programme
    [247]. NIH rescinded its notice on that certification on September 29, 2025 and said an implementation date had not
    been finalised [127].'
