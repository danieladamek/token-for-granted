  - biosketches
  - biographical sketch
  - Common Forms
  short: A standard document about each senior person on an application, giving their appointments and affiliations. It
    is now a government-wide form prepared in SciENcv.
  definition: 'A standard document about each senior/key person on an application, in which appointments and affiliations
    are disclosed [247] [31]. It is one of the two government-wide Common Forms, the other being the Current and Pending
    (Other) Support form; both were written by the National Science and Technology Council Research Security Subcommittee
    to implement NSPM-33, with NSF as steward [249]. The forms are produced in SciENcv, and NIH states that there is no
    blank template to complete outside it [1943] [1942]. Each agency adopts them on its own date: NIH required them for
    due dates on or after January 25, 2026, with an NIH Biographical Sketch Supplement, and DOE for funding opportunities
    published on or after January 1, 2026 [31] [1945]. At NIH a person also certifies research security training through
    this form [33].'
