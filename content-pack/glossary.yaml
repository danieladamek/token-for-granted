- id: human-subjects
  term: Human subjects protections
  kind: methods
  variants:
  - human subjects
  - IRB
  - institutional review board
  - Federalwide Assurance
  - FWA
  short: The federal rules for research that involves people. An institution files an assurance with the government, and
    a review board approves each study.
  definition: The federal rules for research with people as its subjects, set out in the Common Rule, which HHS codifies
    at 45 CFR part 46 and twenty departments and agencies follow [1992]. An institution engaged in non-exempt research of
    this kind files a Federalwide Assurance (FWA) with the Office for Human Research Protections in HHS, a written promise
    to follow the rule, effective for 5 years [1986] [1981] [1988] [1984]. An institutional review board (IRB) reviews and
    approves the research, and each such board must be registered with that office [1983] [1989]. Federal support is given
    only if the institution has an assurance and, where certification is required, has certified that an IRB reviewed and
    approved the research [1981]. When several United States institutions take part in one federally supported study, they
    rely on one IRB [1982].
  concept: uniform-guidance-101
