  definition: An institution that qualifies under the Tribally Controlled College or University Assistance Act of 1978 or
    the Navajo Community College Assistance Act of 1978, or is named in section 532 of the Equity in Educational Land-Grant
    Status Act of 1994 [1617]. Section 532 names 36 colleges in the 2023 edition of the United States Code, and the Act
