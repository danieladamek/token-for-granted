    by its state and accredited or preaccredited [1602]. The class is closed: it is fixed by statute and by a list in the
    Department of Education''s regulation at 34 CFR 608.2, not by current enrolment [1649]. Executive Order 14283 defines
    the term by reference to that list, and the Defense and NIH notices read for this guide use the same statutory definition
    [1618] [1627] [1656]. That order, signed April 23, 2025, set up a White House Initiative on HBCUs and directs agencies
    to file annual plans [1618]. The Office of Legal Counsel opinion of December 2, 2025 on Department of Education programmes
    says it does not opine on HBCU programmes [1592].'
