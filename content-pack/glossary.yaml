  - concept note
  short: A short first request to a foundation. The foundation reads it and then invites a full proposal from some of those
    who sent one.
  definition: 'A brief letter outlining an organisation''s activities and its request for funding, sent to a foundation
    as the first of two steps [2408] [2216]. The foundation reads it and invites a full proposal from some applicants; a
    full proposal sent without an invitation is not read [2124] [2216]. Foundations use other names for the same step, among
    them letter of intent, concept note and online funding inquiry, and each sets its own form, length, deadline and reply
    time [2121] [2219] [2155] [2201]. Sloan takes one by email and says a reply can take up to 8 weeks, and Kellogg decides
    within 30 business days [2124] [2269]. Some foundations take none: Mott has not accepted unsolicited letters of inquiry
    or proposals since January 2025 [2298].'
