- id: pass-through-entity
  term: Pass-through entity
  kind: methods
  variants:
  - pass-through entities
  - pass-through
  short: An organisation that receives a federal award and hands part of it on to another organisation as a subaward.
  definition: A recipient or subrecipient that gives a subaward to another organisation to carry out part of a federal programme
    [1799]. A university that leads a multi-site project and a state that distributes a formula grant are both pass-through
    entities, with the same list of duties toward their subrecipients [1823]. Under 2 CFR 200.332 it verifies in SAM.gov
    that the subrecipient is not excluded, identifies the subaward with 14 data items, evaluates the subrecipient's risk
    of fraud and of noncompliance, monitors its activities and reviews its reports [1823]. It accepts a subrecipient's federally
    negotiated indirect cost rate, and may not require the de minimis rate of a subrecipient that has one [1823] [1802].
    OMB's proposed rule of May 29, 2026, which is not final, would revise these sections and require pass-through entities
    to report subawards on SAM.gov [1803].
  concept: formula-and-pass-through-101
