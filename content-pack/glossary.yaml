  - continuing resolutions
  short: A stopgap law that keeps agencies funded at a set rate for a limited time when a fiscal year starts without full-year
    appropriations.
  definition: A law that keeps agencies funded at a set rate for a limited time when a fiscal year starts without full-year
    appropriations; under one, agencies keep operating and keep making awards, with limits on how much and how fast [1480]
    [1874]. Fiscal year 2027 began on October 1, 2026 under Public Law 119-103, approved September 2, 2026, which continues
    the fiscal year 2026 acts through December 11, 2026 or the earlier enactment of an appropriation [1480] [83]. Its section
    104 bars starting a project or activity for which funds were not available in fiscal year 2026, and section 109 says
    no grants shall be awarded that would impinge on final funding prerogatives [1480]. NIH states that its institutes may
    issue non-competing awards below the level on the most recent Notice of Award [83]. When neither a full-year act nor
    a resolution is in force, appropriations lapse and an agency does not process new awards [1875] [1872].
