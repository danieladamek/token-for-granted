  short: A Commercial and Government Entity code, given to a domestic organisation as part of its SAM.gov registration.
    A foreign organisation obtains an NCAGE code first.
  definition: A Commercial and Government Entity code, which a domestic organisation is assigned as part of SAM registration,
    for grants as for contracts [784] [1898]. A U.S. entity that has none answers 'No' in the registration, and one is assigned
