  term: Salary limitation (salary cap)
  kind: methods
  variants:
  - salary cap
  - salary limitation
  - salary limit
  - Executive Level II
  short: A ceiling on the rate of salary that grant funds may pay one person, set at Executive Level II of the federal pay
    scale.
  definition: 'A ceiling on the rate of salary that grant funds may pay an individual [18]. For NIH awards Congress has
    set it by law at Executive Level II of the federal pay scale: $225,700 from October 1 to December 31, 2025 and $228,000
    from January 1, 2026 [18] [20] [19] [21]. Recipients may not draw down funds, whether direct or indirect costs, to pay
    salaries above the limit [18]. Other funders use the same level. The HHS Grants Policy Statement sets a salary rate
    limit at Executive Level II, HRSA''s application guide applies it to subrecipients as well, and a Department of Labor
    announcement bars its funds from paying a salary above it [528] [1194] [1300].'
