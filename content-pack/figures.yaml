  source: Every record in changes.yaml with a day or a month in its date, between January 1, 2025 and October 5, 2026, as
    built by make_figures.py. Date, status and references are the record's own; the what column is the record's opening,
    cut at a sentence end. Records dated to a month are drawn at the 15th of that month; nothing else was converted. Statuses
    are as recorded on October 4 and 5, 2026.
