  caption: The figure has 58 rows from 46 of the 70 programme records that carry a stipend field. The 48 rows that hold
    an annual stipend or salary figure are drawn; ten give only a weekly, monthly or ten-week rate, or a cap with no single
    amount, and have no bar. Each figure belongs to the fiscal year, class or competition named in its row, and none is
    adjusted to a common year. Predoctoral figures run from a $20,000 scholarship ceiling in NSF S-STEM [856] to $45,000
    at three DOE fellowships and the Smithsonian [903] [905] [907] [984]. Postdoctoral figures run from $60,000 at the Smithsonian
    [984] to the $85,000 stipend of NSF's biology fellowships [837]. NEH's 2026 notice for individuals does not list the
    awards for faculty at Hispanic-serving institutions or at tribal colleges, whose rows rest on the 2025 competition [987]
    [1055]. Left out are 15 records that give no dollar figure for the stipend itself (pay tied to a federal grade, to another
    agency's scale or to the fellow's own salary, or no level stated) and 9 whose only figure is a whole-award amount, a
    per-teacher supplement, a loan repayment or a two-year lump sum.
  how_to_read: Read across a row to see one programme's figure in the funder's own words, the year it belongs to and what
    else the award pays. Each bar is one published annual figure, coloured by career level; keep the year column in view
    when you compare bars, because the figures are not adjusted to a common year. Where a programme has a scale, two rows
    show its lowest and highest steps. A blank annual figure means the record gives only a weekly or monthly rate, or a
    cap with no single amount. "Not stated" means the record names no such allowance; "no year attached" means the page
    gave the figure without a year.
  explain:
  - 'on': level
    text: 'The career stage of the person paid. Predoctoral covers graduate students, master''s fellows among them [962].
      Other marks three programmes that fit no single stage: SMART, whose stipend depends on degree level [917], the Noyce
      teacher scholarships [858] and the Knauss policy fellowship [965].'
  - 'on': annual_usd
    text: The published annual figure written as a plain number. It may be a fixed stipend, a floor such as NASA's stipends
      that start at $70,000 [944], or a ceiling such as the S-STEM scholarships of up to $15,000 per undergraduate [856];
      the wording column says which.
  - 'on': NIH rows
    text: NIH sets NRSA stipend amounts for each fiscal year in a notice [732]. For FY 2026 the postdoctoral scale runs
      from $63,480 at 0 years of experience to $77,076 at 7 or more, and only the two ends are drawn [732]. The F33 senior
      fellowship has no bar because its stipend follows the fellow's home salary under the NRSA limit [739].
  - 'on': other_support
    text: Money the award pays beside the stipend. On an NIH predoctoral fellowship for FY 2026 this is 60% of actual tuition,
      up to $16,000 a year, and an institutional allowance of $4,750 [732]; the NSF graduate fellowship pays a $16,000 cost-of-education
      allowance to the institution [818].
  - 'on': who_applies
    text: Whether the person or an institution files the application. An NSF Research Traineeship stipend reaches a student
      through a grant that only institutions of higher education may submit [828], while organizations are ineligible to
      apply for NEH Fellowships [987].
  concepts:
  - who-applies-101
  discussed_in:
  - 5-money-that-follows-a-person
  source: Values are taken from the stipend, awards and applicant fields of 46 programme records in the pack, two of which
    describe the same Smithsonian programme, as published on the dates read (October 4–5, 2026). The only restatement is
    annual_usd, which repeats a published annual figure as a plain number; for the NEH awards it is the published $60,000
    maximum, which the records attach to twelve months or to awards of up to twelve months. No weekly or monthly rate was
    multiplied out.
