  data: figures/data/formula-state-door.csv
  script: figures/scripts/formula-state-door.py
  caption: 'The table lists the forty-four programme records that carry a pass-through field or the status formula: the
    twenty-eight on the formula route, eight more that send money through an intermediary, and eight formula grants paid
    straight to named colleges or experiment stations. Two federal texts say in so many words that the agency deals with
    no non-profit directly: HUD''s page states that it gives no Community Development Block Grant assistance directly to
    non-profits, and FEMA''s notice that non-profits may not apply directly for the Nonprofit Security Grant Program [1292]
    [1320]. The records say the same of SAMHSA''s substance use block grant, HRSA''s Title V and the Education Department''s
    21st Century Community Learning Centers [1130] [1168] [1399]. The longest chain the records state is the Older Americans
    Act''s: 56 state agencies on aging, 618 area agencies on aging and nearly 20,000 local service providers [1260]. Each
    row ends at the body named, because the guide''s scope ends there; no state''s own process is described. No record that
    met the rule was left out.'
  how_to_read: Read across a row. The first two columns name the programme and its federal owner, the third says who receives
    the federal award, and the fourth names the body you would approach. The fifth gives the federal source's own words
    in quotation marks, or a short paraphrase. A blank in the chain column means the record gives no count of bodies. "Does
    not describe the local process" means the federal pages read are silent on how a local organisation applies; it does
    not mean that no process exists. Where the fourth column begins "None named", the formula pays the listed institutions
    directly and there is no intermediary.
  explain:
  - 'on': nonprofit_door
    text: The body that holds the federal award and passes money on. VOCA victim assistance grants go by formula to the
      states and territories, which make subgrants to local community-based organisations and public agencies [1280].
  - 'on': by formula
    text: The amount is set by a rule, not by a contest between applicants. ACL describes formula grants as ongoing programmes
      that need no application or competition [1259].
  - 'on': chain
    text: 'The count of bodies at each level, in the record''s own wording. Most rows give the first level only, and the
      bodies counted differ by programme: OVC''s FY 2026 chart lists 56 jurisdictions, the 50 states, the District of Columbia
      and 5 territories [1470].'
  - 'on': Single State Agency, State Administrative Agency
    text: The state body has a different name in each programme. SAMHSA calls the State Substance Abuse Agency the Single
      State Agency, and under the Nonprofit Security Grant Program a non-profit applies to its State Administrative Agency
      [1219] [1320].
  - 'on': 'None named: the record''s route is direct'
    text: Eight rows are formula grants with no intermediary. Title III Part B pays each eligible historically Black college
      or university a yearly grant worked out by formula, and an institution on the list in 34 CFR 608.2 files the application
      itself [1602] [1649].
