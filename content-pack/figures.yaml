  caption: 'Four lanes, one for each system a reader may be facing. In a federal competition an organisation answers a notice
    of funding opportunity, reviewers advise and the agency decides [1799] [156] [38] [157]. Formula money goes to a state,
    territory, tribe or local government, which funds local organisations; HUD''s page and FEMA''s notice each say a non-profit
    cannot come to the federal agency directly [1880] [1292] [1320]. A foundation states its own way of taking requests:
    of the 65 recorded here, 23 fund by invitation only, 23 through open calls only, 10 begin with a letter of inquiry and
    6 accept an unsolicited request [2259] [2119] [2216] [2310]. A project named by Congress starts in the office of a House
    Member or a Senator, and the named recipient still applies to the agency [1667] [1674] [1686].'
  how_to_read: Start at the question on the left and follow the lane that matches the money you are looking at. Each box
    is a step, and the last box in a lane says what you end up holding. Boxes drawn as decisions are where someone other
    than you chooses. Select a box to see the references that state it and the glossary entry for its term. The lanes are
    separate systems, and one organisation can be in several of them at once.
  explain:
  - 'on': 'lane: a competition run by a federal agency'
    text: The applicant is an organisation. At NSF an unaffiliated individual is not eligible for direct funding [156] [158].
    concept: who-applies-101
  - 'on': 'lane: money a statute sends out by formula'
    text: A formula grant is an allocation to states, territories or local governments by a formula in law or regulation
      [1880]. The non-profit at the end is a subrecipient [1823].
    concept: formula-and-pass-through-101
  - 'on': 'lane: a foundation'
    text: The counts are of the 65 foundation and private grantmaker records in this guide, a sample chosen by the editor.
      Three more records state no policy.
    concept: foundations-101
  - 'on': 'lane: a project Congress names'
    text: The House calls it Community Project Funding and the Senate Congressionally Directed Spending. No organisation
      applies to either committee [1667] [1674].
    term: community-project-funding
  - 'on': 'box: the agency decides'
    text: Since Executive Order 14332 of August 7, 2025 a senior appointee also reviews funding notices and discretionary
      awards before they issue [246].
    term: executive-order-14332
  concepts:
  - grants-and-agreements-101
  - formula-and-pass-through-101
  - foundations-101
  discussed_in:
  - 1-why-this-matters
  - 2-how-grant-money-moves
  source: A diagram drawn by the builder from the cited sources; it is not taken from any one of them. Each box carries
    the references that state it. The foundation counts are counts of this guide's funder records by their unsolicited field,
    as read on October 4 and 5, 2026.
