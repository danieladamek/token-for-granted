  data: figures/data/registration-times.csv
  script: figures/scripts/registration-times.py
  caption: 'The table lists every registration, account or identifier in the guide''s gates records whose time entry gives
    a figure, with one row for each agency statement. SAM.gov says a registration can take up to 10 business days to become
    active [1897]. Agencies that depend on it state longer lead times: NIH gives three weeks or more for a first registration
    [1909], and NSF at least 90 days before submission [161]. Statements about one gate differ: CDMRP says Grants.gov registration
    is processed immediately with a UEI [1923], and NOAA Fisheries gives 2-4 weeks [447]. The IRS figures, 22 days and 191
    days, each cover 80% of determinations [2053]. Left out are sixteen gates whose record says no time is stated on the
    pages read, among them the Login.gov account, the ORCID iD, GrantSolutions and FEMA GO. Also left out are three gates
    whose figure is the length of a training module, an audit filing deadline or a policy timetable, and the gates with
    no time entry at all.'
  how_to_read: 'Read across a row to see one statement about one registration: what the gate is, who has to do it, the time
    in the page''s own terms, who said so, and what the record says about renewal. Where a gate has several rows, different
    pages gave different times, and you can follow each through its reference number. The days column repeats a published
    figure as a number so that rows can be sorted. It is blank where the page gives a range, a time in hours or months,
    a phrase such as "several weeks", or a figure for something other than the gate itself. "None stated on the pages read"
    means those pages gave no renewal rule.'
  explain:
  - 'on': stated_by
    text: A time stated by an agency other than the one that runs a system is that agency's planning figure for its own
      applicants. SAM.gov gives up to 10 business days for a registration to become active [1897]; NSF's page gives at least
      90 days before submission for the same registration [161].
  - 'on': days_sort
    text: Business days are counted as the page states them and are not turned into calendar days. The SAM.gov figure of
      up to 10 business days therefore appears as 10 [1897].
  - 'on': Unique Entity Identifier (UEI)
    text: The UEI is the identifier SAM.gov assigns to uniquely identify an entity [1899]. Within a full registration it
      is assigned once the name and address are validated [1898].
  - 'on': EBiz POC
    text: The Electronic Business Point of Contact is the person named in SAM.gov who controls the organisation's Grants.gov
      roles [1895]. NIH ties its figure of one business day or more for Grants.gov to how quickly that person responds [1909].
  - 'on': 80% of determinations
    text: The IRS figures are not outer limits. The page says the IRS issues 80% of Form 1023-EZ determinations within 22
      days and 80% of Form 1023 determinations within 191 days [2053].
  concepts:
  - registrations-101
  discussed_in:
  - 9-the-gates
  - 1-why-this-matters
  source: 'Values are taken from the gates records of the Token for Granted content pack and the pages those records cite:
    agency registration pages, application guides and notices, as published on the dates read (October 4–5, 2026). The days_sort
    column restates the published figure in days, with a week taken as 7 days and business days counted as stated. Nothing
    else was converted; ranges, hours, months and unnumbered phrases are left blank.'
