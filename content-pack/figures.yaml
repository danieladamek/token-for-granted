  data: figures/data/foundation-indirect-rates.csv
  script: figures/scripts/foundation-indirect-rates.py
  caption: 'Each bar is a rate for indirect costs that a foundation''s own page states, taken from the 27 foundation records
    in the pack that carry one; a record with different rates for different grants or grantees has a row for each. Just
    over half of the rows, and most of the bars drawn, are ceilings, such as the 7.5% within the William T. Grant Scholars
    award and Simons''s limit of 20 percent of direct costs [2206] [2120]. Two records state a floor: Ford sets a minimum
    of 25 percent on project grants from January 1, 2023, and Packard pays a tiered minimum set by the grantee''s annual
    budget [2332] [2341]. MacArthur states one flat rate, 29 percent applied to project costs [2265]. Only the National
    Fish and Wildlife Foundation''s record uses the federal term: a de minimis rate of up to 15% of modified total direct
    costs, the rate in force under 2 CFR 200.414(f) [2466] [1802]. The other 38 of the 65 foundation records carry no indirect
    cost statement. That means the pages read did not give one; it does not mean the foundation pays none.'
  how_to_read: 'Read along the bottom for the foundation and up for the percent its page states; the colour gives the kind
    of rate. A bar marked maximum is a ceiling, not what any one grant received. A bar at zero means the page says none
    are paid on the grants named under applies_to. A row with no bar has no single figure: the foundation uses no fixed
    rate, gives a range or a sum of money, or the pages read gave no rate. Before you compare two bars, read the base column,
    since some percents apply to direct costs and some to the whole grant. "Not stated" in that column means the record
    names no base.'
  explain:
  - 'on': rate_kind
    text: 'The kind follows the record''s words: maximum where it says up to, not more than, may not exceed, limited to
      or allowable; minimum and fixed where it says so. The bare percents for the American Heart Association, the American
      Cancer Society''s standard grants and Spencer''s large grants are classed as maximum because the pack''s record of
      foundation caps lists them among the limits [2188] [2190] [2195].'
  - 'on': base
    text: The base is what the percent is applied to. Some foundations state the limit as a share of the whole award, not
      of direct costs, and some leave equipment, tuition or subcontracts out of the base [2219] [2174] [2120] [2129].
  - 'on': minimum
    text: A minimum is a floor under the rate, the reverse of a ceiling. Ford's minimum was 20 percent through 2022; the
      rate does not apply to expedited grants, general operating and core support grants, or grant increases [2332] [2333].
  - 'on': none paid
    text: A zero belongs to the grants named under applies_to, not to the foundation as a whole. The Mellon and Burroughs
      Wellcome records each give a bar on indirect costs for one programme and say that no general or Fund-wide rule was
      returned [2212] [2168].
  - 'on': maximum, Gates rows
    text: The Gates policy sets its maximum rates by type of organisation on budgeted total direct costs, and an organisation
      whose actual rate is lower proposes its actual rate [2257].
  concepts:
  - indirect-costs-101
  - foundations-101
  discussed_in:
  - 7-foundations
  - 3-the-rules-underneath
  source: Values come from the indirect_costs field of 27 funder records in the Token for Granted content pack and the references
    beside them, which are the foundations' own policy and programme pages, with one eCFR section for the federal de minimis
    rate. They are as published on the dates read, October 4–5, 2026. The only restatement is rate_num, which repeats the
    percent in the policy as a plain number, with 0 where the record says none are paid. No rate was computed.
