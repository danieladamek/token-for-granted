  data: figures/data/foundation-doors.csv
  script: figures/scripts/foundation-doors.py
  caption: Each of the 65 foundation and private grantmaker records in this guide carries the foundation's own statement
    of how it takes requests. Twenty-three fund by invitation only and twenty-three only through calls they post; ten begin
    with a letter of inquiry; six accept an unsolicited request; for three the pages read state no policy. Ford's page reads
    "We do not accept any unsolicited grant proposals by mail, email or phone." [2259] Simons takes applications only under
    its posted calls, and The Duke Endowment is among the six that accept a request [2119] [2310]. Two of those six are
    corporate programmes that give software and services in kind [2446] [2447]. The 65 are a sample chosen by the editor
    and not a ranking or a census, so the bars describe these records and nothing wider.
  how_to_read: Each bar is one way of taking requests, and its height is the number of records that state it. The colours
    split a bar by the kind of foundation as the record gives it. Open the table to see which foundations stand behind a
    bar and follow the reference to the page where each says so. A foundation coded as invitation only may still read what
    it is sent, and one coded as taking letters of inquiry may fund few of them; the record's own note gives the wording.
  explain:
  - 'on': Invitation only
    text: The foundation says it approaches the organisations it funds and does not take proposals it did not ask for [2259].
  - 'on': Open calls only
    text: The foundation takes applications only under a call it has posted, with that call's own deadline and eligibility
      rule [2119].
  - 'on': Letter of inquiry first
    text: A short first request; the foundation invites a full proposal from some of those who send one. Carnegie Corporation
      says "applicants may be invited via email to submit a full proposal" [2216].
  - 'on': Not stated on the pages read
    text: The pages read for the record give no policy on unsolicited requests. That is a gap in what was read, not a statement
      by the foundation.
  - 'on': foundation_kind
    text: 'The label on the funder record: independent, family, corporate, community, public-charity or medical-research-organization.
      One record carries no kind.'
