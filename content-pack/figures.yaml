  data: figures/data/changes-timeline.csv
  script: figures/scripts/changes-timeline.py
  caption: 'The 477 change records dated between January 1, 2025 and October 5, 2026, each placed by its date and by the
    status it had when the guide closed. Most are final (313). Fifty are announcements and 32 are proposals, and 52 carry
    a status that comes from a court: enjoined (14), in litigation (13), on appeal (13) or vacated (12). NIH''s notice of
    February 7, 2025 setting a 15% indirect cost rate sits in the vacated row [25] [24]. The HHS termination notices of
    March 24 and 25, 2025 sit in the enjoined row [544]. OMB''s proposed rewrite of the grant rules, published May 29, 2026,
    is in the proposed row, and section 157 of Public Law 119-103, approved September 2, 2026, is one of two records marked
    frozen by appropriations [1458] [1480]. Left off the chart: 40 records dated only to a year or not dated, and 7 dated
    outside the window.'
  how_to_read: 'Time runs left to right and each row is a status, so you can see at a glance how much of what moved is settled
    and how much is proposed, announced or before a court. A point is one change record; open it to read what changed and
    follow its references. The row shows where the change stood on October 5, 2026, not where it stood on its date: a notice
    issued in February 2025 and later vacated sits in the vacated row at February 2025. A point shows when something was
    issued or announced, which is not always when it takes effect. Twenty-four records are dated to a month and are drawn
    at the 15th.'
  explain:
  - 'on': 'y: status'
    text: 'The status word on the change record: proposed, announced, enacted, final, pending-implementation, enjoined,
      vacated, in-litigation, on-appeal, rescinded or frozen-by-appropriations. The primer on law in motion explains each
      through a dated case.'
  - 'on': 'status: vacated'
    text: A court set the policy aside. NIH's 15% indirect cost notice was enjoined, then vacated, and the First Circuit
      affirmed on January 5, 2026 [24].
  - 'on': 'status: enjoined'
    text: A court order bars the agency from carrying the action out for the parties the order covers. The injunction against
      the HHS terminations was granted to the plaintiff states [544].
  - 'on': 'status: frozen-by-appropriations'
    text: Congress has barred the step for a time. Section 157 of Public Law 119-103 bars a rule arising from OMB's proposal
      from being issued or finalised through December 11, 2026 [1480].
  - 'on': 'series: recorded_under'
    text: 'Which part of the guide''s reading recorded the change: research, people, programme and service, capacity, the
      rules for every award, or foundations. A change that bears on several parts appears once.'
