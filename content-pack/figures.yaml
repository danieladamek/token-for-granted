  data: figures/data/jurisdiction-lists.csv
  script: figures/scripts/jurisdiction-lists.py
  caption: 'Six agency lists, one row for each of the 40 places named on any. NSF lists 28 jurisdictions, which its page
    says is in effect frozen through FY 2027 [878] [877]. DOE names the same 28 on its page and in its FY 2026 notice, following
    the NSF criteria [1567] [1568]. NASA''s FY 2025 notices name twenty-five states, Puerto Rico, the U.S. Virgin Islands
    and Guam, with eligibility determined by NSF [1570] [1573] [1574]. NIH''s page, last updated December 10, 2025, lists
    23 states and Puerto Rico [1543] [1584]. The FY26 DEPSCoR notices list 36 [1565] [1566]. USDA lists 19 states for FY
    2026 under a 38th-percentile rule on AFRI funding, and names seven other places as also eligible [1576]. The NSF, NIH
    and DEPSCoR sources read state no rule that produces the list [878] [1543] [1565]. By this guide''s count, 17 rows are
    on all six lists and nine on only one: American Samoa and Utah on USDA''s alone, Wisconsin on DEPSCoR''s alone [1576]
    [1565]. No list was left out: each record names its places.'
  how_to_read: Read across a row to see which agencies' lists name the place where your institution is, and read down a
    column to see one agency's whole list. A "yes" means the record for that list names the place. A blank means the record
    does not name the place on that list for the year or notice shown, and nothing more than that; the table says nothing
    about other years. The number at the end of the row counts the "yes" cells. The reference numbers show which page or
    notice each "yes" rests on.
  explain:
  - 'on': jurisdiction
    text: The row labels are the names the records use, which is why "Micronesia" and "Northern Marianas" appear in short
      form [1576]. The DOE list writes "Virgin Islands" where the others write "U.S. Virgin Islands"; the table holds both
      in one row [1567] [878].
  - 'on': nih_idea
    text: IDeA is the Institutional Development Award, a separate NIH programme with its own list. Congress authorised it
      in 1993 to build biomedical research capacity in states with historically low NIH grant funding success rates [1545].
  - 'on': doe_epscor and nasa_epscor
    text: These two columns hold the same places as the NSF column. DOE EPSCoR currently follows the NSF EPSCoR eligibility
      criteria [1567]. For NASA, jurisdiction eligibility is determined by NSF, and the FY 2025 notice used the 2023 NSF
      eligibility table [1574].
  - 'on': dod_depscor
    text: DEPSCoR is the Department of Defense programme. An institution of higher education may apply only if it is in
      a state or territory on the list in that year's notice, so the column shows the FY26 notices posted August 10, 2026
      [1565] [1566].
  - 'on': usda_epscor
    text: 'USDA labels its list by fiscal year. The 19 states qualify under a rule: funding "no higher than the 38th percentile
      of all States based on a three-year rolling average of AFRI funding levels." The District of Columbia, American Samoa,
      Guam, Micronesia, Northern Marianas, Puerto Rico and the U.S. Virgin Islands are named as also eligible [1576].'
  concepts:
  - standing-101
  discussed_in:
  - 8-standing-and-capacity
  - 1-why-this-matters
  source: Each "yes" is taken from the standing record for that agency's list, which names the jurisdictions as the agency's
    page or funding notice gave them when read on October 4–5, 2026. Nothing was converted or estimated. The lists_num column
    is a count made for this guide of the "yes" cells in each row, and the totals of rows in the caption are counts of the
    same kind; no agency publishes them.
