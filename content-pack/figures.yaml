  data: figures/data/who-decides.json
  script: figures/scripts/who-decides.py
  caption: Three lanes drawn from the funders' own descriptions. At NIH a study section scores an application, the advisory
    council or board of the institute makes recommendations and the institute or center director decides; from the January
    2026 council round institutes do not rely on paylines [38] [39] [13] [123]. At NSF a programme officer obtains reviews
    and recommends award or decline, with approval at division or office level as the policy guide is printed; a realignment
    of December 2025 leaves the post unnamed on the pages read [157] [168]. In one SAMHSA notice peer reviewers score the
    narrative, awards over $250,000 need National Advisory Council approval, and the programme office and an approving official
    make the final determination [1113] [1112]. Across all three runs the review that Executive Order 14332 added in August
    2025 [246].
  how_to_read: Read each lane from left to right. Boxes marked advise give an opinion or a score; the box marked decide
    is where the agency chooses, and it is the last box in every lane. The bar across the top applies to all three lanes.
    Select a box for its references. The lanes are three examples and other agencies arrange review in their own way, so
    check the funder record for the agency you are applying to.
  explain:
  - 'on': 'box kind: advise'
    text: Reviewers and councils advise. NIH describes two levels of review, and the institute or center director makes
      the funding decision [38].
    concept: review-and-decision-101
  - 'on': 'NIH: study section'
    text: For most research project applications due from January 25, 2025, two factors are scored from 1 to 9 and a third
      is rated sufficient or insufficient [39] [41].
    term: study-section
  - 'on': 'NSF: reviewers'
    text: Since December 8, 2025 a full proposal needs at least two reviewers, who may be NSF staff [149].
    term: merit-review
  - 'on': 'overlay: senior appointee review'
    text: Executive Order 14332, signed August 7, 2025, has a senior appointee in each agency review new funding notices
      and discretionary awards before they issue [246].
    term: executive-order-14332
  concepts:
  - review-and-decision-101
  discussed_in:
  - 2-how-grant-money-moves
  - 4-the-research-funders
  source: A diagram drawn by the builder from the cited sources; it is not taken from any one of them. Each box carries
    the references that state it, as the pages stood on October 4 and 5, 2026. The SAMHSA lane rests on one fiscal year
    2026 notice and SAMHSA's review page.
