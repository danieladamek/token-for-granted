  script: figures/scripts/indirect-cost-rules.py
  caption: The table sets the standing federal rules on indirect costs beside the rate caps of 2025 and gives the position
    of each as the records state it. Two different things are called 15 percent. One is the de minimis rate, which an organisation
    with no current negotiated rate may elect, at up to 15 percent of modified total direct costs [1802]. The other is the
    cap that NIH, DOE, NSF and the Department of Defense announced in 2025 on rates already negotiated [24] [1852] [237]
    [1855]. Each of the four was set aside by the District of Massachusetts, and none is in effect [24] [237] [289] [1855].
    The rows between them are limits written into a statute, a regulation or a programme notice, among them 30 percent of
    Total Federal Funds Awarded at NIFA and NIH fellowships that pay no indirect costs [412] [736]. One NIH policy text
    gives the de minimis rate as 10%, and both figures are kept as separate rows [64]. Modified total direct costs has no
    row of its own, being the base and not a rate. Foundation limits on indirect costs are left to a separate figure.
  how_to_read: 'Read across a row to see one rule: who it covers, the rate, what the rate is multiplied by, the text that
    sets it and where it stands. The first rows are standing rules. The middle rows are limits written into a statute, a
    regulation or a notice. The last rows are the 2025 caps, the appropriations provisions around them and two changes still
    pending. Compare the base before you compare two rates: 30 percent of total federal funds and 15 percent of modified
    total direct costs are not measured on the same thing. "Not stated" means the record gives no base or no date. A blank
    in the number column means no single figure applies.'
  explain:
  - 'on': base
    text: An indirect cost rate is a percentage applied to a base of direct costs [1849] [1850]. The usual base, modified
      total direct costs, counts salaries and wages, fringe benefits, materials and supplies, services, travel and up to
      the first $50,000 of each subaward, and leaves out equipment, tuition remission and participant support costs, among
      other items [1799].
  - 'on': 'De minimis rate: two rows'
    text: The Uniform Guidance and the HHS Grants Policy Statement give the rate as 15 percent, and HRSA records that HHS
      raised it from 10 to 15 percent effective October 1, 2024 [1802] [528] [529]. The NIH policy text as fetched gave
      10% [64].
  - 'on': 'status: vacated, enjoined'
    text: These are the words of the court orders as the records report them. For the NSF cap the court vacated the policy,
      declared it invalid and did not issue a permanent injunction [1854]. For the Department of Defense cap it vacated
      the policy and made the earlier injunction permanent [1855].
  - 'on': NSF 15 percent cap (2025)
    text: NSF states that from May 19, 2025 it issues awards at the institution's negotiated rate, and that awards issued
      on or after May 5, 2025 carry a term applying NSF 25-034 if NSF is later permitted to apply it [154].
  - 'on': 'status: in force through December 11, 2026'
    text: Public Law 119-103 continues the fiscal year 2026 appropriations acts, with their conditions on indirect cost
      rates, through December 11, 2026 [1480]. The same law bars a final rule revising the Uniform Guidance through that
      date [1480].
  concepts:
  - indirect-costs-101
  - law-in-motion-101
  discussed_in:
  - 3-the-rules-underneath
  - 10-what-changed
  source: Values are taken from the mechanics and changes records of the Token for Granted content pack and from the numbered
    references beside each fact, as published on the pages read on October 4–5, 2026. Wording and figures are as the records
    give them. The rate_num column restates a published rate as a plain percent number; awards that pay no indirect costs
    are entered as 0, and rows with no single rate are left blank.
