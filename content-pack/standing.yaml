- id: nih-lrp-eligible-researcher
  name: Researcher eligible for NIH extramural loan repayment
  applies_to: investigator
  what: |
    A researcher qualifies for the Extramural Loan Repayment Program by meeting tests of degree, citizenship, research time, debt and employer, not by holding an NIH grant [762].
  who_qualifies: A holder of a doctoral-level health or research degree who is a U.S. citizen, national or permanent resident,
    does qualified research at least 20 hours a week, has educational debt of at least 20 percent of institutional base
    salary, and whose research is supported by a domestic non-profit institution or a U.S. government agency [762]. Federal
    employees working more than 20 hours a week and employees of for-profit institutions are excluded [763].
  how_decided: The applicant states the facts and an Institutional Business Official certifies them [763].
