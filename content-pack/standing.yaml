  name: NRSA citizenship and residency requirement
  applies_to: investigator
  what: |
    To hold a Kirschstein-NRSA fellowship or a trainee place on an NRSA training grant, a person must be a citizen or a non-citizen national of the United States, or lawfully admitted for permanent residence [736] [750]. The notices name no other status [741]. The mentored K awards read in this sweep use the same wording, while the K99 has no citizenship requirement [744] [743].
  who_qualifies: U.S. citizens, non-citizen nationals and lawful permanent residents; a permanent resident holds a currently
    valid Permanent Resident Card (USCIS Form I-551) or other legal verification of status [741].
  how_decided: Set in each notice. For fellowships the status must be held by the time of award; for training grants, at
    the time of appointment [736] [750]. A June 2025 correction fixed the wording of the five parent fellowship notices
    to read 'non-citizen national' [757].
