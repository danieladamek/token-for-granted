  name: Recipient named by Congress for a Community Project Funding or Congressionally Directed Spending project
  applies_to: institution
  sweep: capacity-C
  what: An organisation has this standing when an enacted appropriations act's joint explanatory statement names it as the
    recipient of a specific project and amount [1686]. The agency then funds only the named entity, for the named purpose
    [1687] [1690].
  who_qualifies: 'State, local and tribal governments and certain eligible non-profits may be named; for-profit entities
    may not [1667] [1675]. Which non-profits may be named differs by account and by chamber: in FY27 the House names only
    colleges among non-profits in its science accounts, only certain rural and safety-net health providers at HRSA, and
    no non-profits other than fire stations in Community Facilities [1671] [1670] [1672].'
  how_decided: By Congress, on a request from a Member or Senator who certifies no financial interest and posts the request
    online; the standing lasts for that act's project only [1667] [1675].
