- id: nih-area-eligible-institution
  name: R15 AREA-eligible institution (undergraduate-focused)
  applies_to: institution
  what: |
    An institutional standing that opens the R15 AREA programme. It describes an accredited public or non-profit private school that grants baccalaureate degrees in biomedical sciences, enrols more undergraduates than graduate students, and has had limited NIH support [7].
  who_qualifies: The undergraduate enrolment is greater than the graduate enrolment, and the institution has not received
    NIH support totaling more than $6 million per year, in direct and F&A costs together, in 4 of the last 7 years; health
    professional schools are excluded from AREA [7].
  how_decided: 'The institution certifies it: a signed letter from the provost or similar official verifying eligibility
    goes in the application; for a multi-campus institution each campus with its own UEI or IPF number is assessed separately
    [45] [7].'
  opens:
  - nih-r15-area
  official_url: https://grants.nih.gov/funding/activity-codes/R15
  pending_changes: []
  as_of: '2026-10-04'
  sources:
  - 7
  - 45
  sweep: research-A
- id: nih-reap-eligible-institution
  name: R15 REAP-eligible institution (health professional school or graduate school)
  applies_to: institution
  what: |
    An institutional standing that opens the R15 REAP programme. It describes an accredited public or non-profit private school that grants baccalaureate or advanced degrees in health professions or biomedical and behavioral sciences and has had limited NIH support [8].
  who_qualifies: All components of the institution combined have not received NIH support totaling more than $6 million
    per year, in direct and F&A costs together, in 4 of the last 7 years; health professional schools are those granting
    degrees such as BSN, MD, DDS, PharmD, DVM and MPH, and graduate schools grant M.A., M.S. and Ph.D. degrees [8].
  how_decided: The institution certifies it with a signed letter from the provost or similar official [45].
  opens:
  - nih-r15-reap
  official_url: https://grants.nih.gov/funding/activity-codes/R15
  pending_changes: []
  as_of: '2026-10-04'
