- id: nih-nonprofit-other-than-higher-education
  name: Nonprofit other than an institution of higher education (with or without 501(c)(3) status)
  applies_to: nonprofit
  what: |
    The eligibility class NIH notices use for non-profits that are not universities. It appears as two lines in the eligibility section of a notice: nonprofits with 501(c)(3) IRS status and nonprofits without it, in both cases other than institutions of higher education [4].
  who_qualifies: Both lines are eligible in the parent R01, R21, R03 and R13 notices, the MIRA notices, the NIAID P01 and
    U01 notices read, and the four NIH Director's award notices; neither is eligible for the R15, which is limited to institutions
    of higher education [4] [5] [6] [52] [73] [113] [116] [75] [7].
  how_decided: Each notice of funding opportunity lists its own eligible organization types [4].
  opens:
