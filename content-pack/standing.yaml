- id: ed-title-iii-v-eligible-institution
  name: Eligible institution under section 312 of the Higher Education Act (Title III and Title V eligibility designation)
  what: An "eligible institution" is a college that enrols a high share of needy students and has low core expenses per
    student compared with institutions of its type [1596]. The Department of Education makes the designation each year;
    a designated institution may apply for the grant programmes that require it and may receive a one-year waiver of certain
    non-Federal cost-sharing requirements [1595].
  who_qualifies: 'At least 50 percent of degree-seeking students received Pell, FSEOG or Federal Work-Study aid, or the
    institution''s Pell percentage exceeds the median for comparable institutions; and Core Expenses per FTE are below the
    average for the institution type [1596]. For FY 2026 (base year 2023-2024) the thresholds are: 2-year public 44% and
    $19,004; 2-year non-profit private 48% and $17,453; 4-year public 37% and $39,350; 4-year non-profit private 36% and
    $50,027 [1596].'
  how_decided: The Department pre-determines eligibility from IPEDS data in the Eligibility Matrix; an institution checks
    its status in the Grant Eligibility Application system at HEPIS.ed.gov and, if not shown as eligible, applies for reconsideration
    or a waiver within the yearly window [1596]. The FY 2026 window ran from March 24 to April 23, 2026 [1596]. The FY 2025
    Eligibility Matrix, with programme lists for the minority-serving classes, HBCUs and TCCUs, is published as an Excel
    file on the Department's eligibility page [1595].
