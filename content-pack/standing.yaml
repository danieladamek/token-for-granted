- id: nih-k99-postdoctoral-window
  name: K99/R00 eligibility window (no more than 4 years of postdoctoral research experience)
  applies_to: investigator
  what: |
    A K99/R00 candidate must have no more than 4 years of postdoctoral research experience on the application due date [743]. There is no citizenship requirement, and the notice says a candidate may be a non-U.S. citizen [743].
  who_qualifies: Holders of a clinical or research doctorate with no more than 4 years of postdoctoral research experience;
    NIH approves a one-year extension for childbirth, and parental, medical or military leave is typically not counted [743].
  how_decided: Counted against the due date of the application; set in the notice [743]. NIH issued automatic extensions
    in June 2025 and January 2026 for windows that closed during delays in 2025 and early 2026 [791] [790].
