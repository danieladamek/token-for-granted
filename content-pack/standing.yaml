- id: nih-early-stage-investigator
  name: NIH Early Stage Investigator (ESI)
  applies_to: investigator
  what: |
    An investigator standing. An Early Stage Investigator is a PD/PI within 10 years of the terminal research degree or the end of post-graduate clinical training, whichever is later, who has not yet won a substantial independent NIH research award [138].
  who_qualifies: The status applies to R01-equivalent applications, and every PD/PI on the application must hold it for
    the application to be treated as an ESI application [138].
  how_decided: NIH computes the status from the degree date and award history in the investigator's eRA Commons profile,
    and considers extensions for lapses in research or training [138].
  opens:
  - nih-dp2-new-innovator
  - nih-r35
  - nih-r01
  official_url: https://grants.nih.gov/policy-and-compliance/policy-topics/early-stage-investigators
  pending_changes: []
  as_of: '2026-10-04'
  sources:
