- id: nih-foreign-organization
  name: Foreign (non-U.S.) organization
  applies_to: institution
  what: |
    The eligibility class for organizations outside the United States. The Grants Policy Statement says foreign and international organizations may apply for research project grants and may not apply for programme project, center, institutional training, resource, SBIR/STTR or construction grants [107].
  who_qualifies: Foreign organizations are eligible for the parent R01, R21 and R03 and for some institute notices such
    as NIAID's clinical trial U01; they are not eligible for the R15, the R13, MIRA, the NIAID P01 or the NIH Director's
    awards [4] [5] [6] [116] [7] [52] [73] [113] [75].
  how_decided: Each notice states whether non-domestic entities may apply; a foreign applicant uses a detailed budget and
    receives F&A at 8 percent of modified total direct costs [36] [64].
  opens:
  - nih-r01
  - nih-r21
  - nih-r03
  - nih-u01
  official_url: https://grants.nih.gov/grants/policy/nihgps/HTML5/section_16/16.2_eligibility.htm
  pending_changes:
  - status: final
    date: '2025-05-01'
    text: NIH no longer issues awards that include a subaward to a foreign entity; direct awards to foreign organizations
      continue, and paid foreign collaborators on a U.S.-led project are funded through linked awards under the PF5 structure
      [22] [86].
  as_of: '2026-10-04'
