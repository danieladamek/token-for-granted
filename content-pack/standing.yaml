  name: CAREER-eligible principal investigator
  applies_to: investigator
  sweep: people-B
  what: The set of conditions a person must meet to be the investigator on a CAREER proposal [815].
  who_qualifies: A person who holds a doctoral degree in a field NSF supports, holds at least a 50% tenure-track or tenure-track-equivalent
    position as an assistant professor or equivalent, is untenured, has not received a CAREER award, and has taken part
    in fewer than three CAREER competitions [815]. A tenure-track-equivalent post is a continuing appointment expected to
    last the five years of the grant, with substantial research and educational duties, where the project fits the person's
    job and the organisation's mission [815]. Associate professors are not eligible, with or without tenure [816].
  how_decided: The department head's letter in the proposal confirms eligibility; the rules are set by the solicitation
    [815].
