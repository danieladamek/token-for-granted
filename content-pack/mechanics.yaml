- id: corporate-giving-pattern
  name: How corporate foundations and giving programmes take requests
  what: |
    The six corporate funders read in this sweep take requests in three ways [2433] [2438] [2441]. Some run a small, open, local grant programme through their stores or markets [2435] [2438]. Some open a named national programme in dated cycles [2443] [2444]. Larger and national grants are by invitation [2433] [2441]. Technology companies give products, not cash, through an enrolment process [2446] [2447].
  rule: 'Each company sets its own rule [2433] [2441]. Walmart: "Local Community Grants is the only program that accepts
    applications throughout the year in the form of an open application" [2433]. Wells Fargo: an invited organisation "will
    use the invitation code provided to access the online application portal" [2441]. Bank of America: two application periods
    in 2026, 2/2/2026 - 3/2/2026 and 5/18/2026 - 6/29/2026 [2438]. Lowe''s Foundation: its Gable Grants open in March for
    community and technical colleges and by invitation for non-profits [2444].'
  figures:
  - label: Walmart local grants
    value: $250 to $5,000
    cite:
    - 2434
  - label: Home Depot Foundation Veteran Housing Grants
    value: typically $100,000 to $500,000
    cite:
    - 2443
  - label: Bank of America local grants
    value: amounts vary by market and organisation size; no multi-year grants
    cite:
    - 2438
  applies_to: 'Applicants to corporate funders [2433]. Eligibility rules differ on points that matter to universities and
    to small non-profits: Walmart''s local grants are open to colleges and universities [2434]; Bank of America does not
    fund fiscally sponsored organisations or government agencies [2439]; Google and Microsoft exclude schools, colleges
    and universities from their non-profit programmes [2445] [2447].'
