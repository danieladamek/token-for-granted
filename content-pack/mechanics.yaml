- id: individual-charitable-deduction-changes-2026
  name: Changes to the individual charitable deduction from 2026
  what: |
    Public Law 119-21 changed the charitable deduction for individuals in three ways that matter to organisations that raise gifts [2391]. Individuals who do not itemise may deduct cash gifts up to a fixed amount [2389]. Individuals who do itemise may deduct gifts only above a floor of 0.5 percent of their contribution base [2392]. For taxpayers in the top bracket the value of itemised deductions is reduced [2393].
  rule: 'Section 70424 of Public Law 119-21: a permanent deduction for non-itemisers of up to $1,000 of cash contributions,
    $2,000 for married taxpayers filing jointly, for tax year 2026 and forward; contributions to donor-advised funds and
    supporting organisations do not qualify [2389]. Section 70425, "0.5 percent floor on deduction of contributions made
    by individuals": contributions are allowed only to the extent the total exceeds 0.5 percent of the contribution base,
    Internal Revenue Code section 170(b)(1)(I) [2391] [2392]. Section 70111: the overall value of itemised deductions is
    reduced by 2/37ths for taxpayers with income in the 37% bracket, for tax years starting in tax year 2026 [2393].'
  figures:
