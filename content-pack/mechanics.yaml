- id: endowment-excise-tax
  name: Excise tax on private college and university endowments (section 4968)
  what: |
    Section 4968 taxes the net investment income of certain private colleges and universities [2390]. Public Law 119-21, enacted July 4, 2025, replaced the single rate with three tiers that rise with the size of the endowment per student [2391] [2390]. The new tiers apply to taxable years beginning after December 31, 2025 [2390].
  rule: Internal Revenue Code section 4968, as amended by section 70415 of Public Law 119-21 [2390] [2391]. The rate is
    1.4 percent for an institution with a student adjusted endowment of at least $500,000 and not in excess of $750,000;
    4 percent above $750,000 and not in excess of $2,000,000; and 8 percent above $2,000,000 [2390]. An applicable educational
    institution is one that had at least 3,000 tuition-paying students in the preceding taxable year, more than 50 percent
    of them located in the United States [2390].
  figures:
  - label: student adjusted endowment of at least $500,000 and not in excess of $750,000
    value: 1.4 percent
    cite:
    - 2390
  - label: student adjusted endowment in excess of $750,000 and not in excess of $2,000,000
    value: 4 percent
    cite:
    - 2390
  - label: student adjusted endowment in excess of $2,000,000
    value: 8 percent
    cite:
    - 2390
  - label: tuition-paying students in the preceding taxable year
    value: at least 3,000
    cite:
    - 2390
  - label: effective date
    value: taxable years beginning after December 31, 2025 (Pub. L. 119-21 section 70415(c))
    cite:
    - 2390
  - label: effective date (Joint Committee on Taxation; added by slice D)
    value: '"tyba 12/31/25" for the "Modification of excise tax on investment income of certain private colleges and universities";
      from the revenue table for the text the Senate passed on July 1, 2025'
    cite:
    - 2497
  applies_to: Private colleges and universities that meet the student count and endowment thresholds [2390]. The tax is
    on the institution's net investment income, not on a grant; it is recorded here because it bears on a university's own
    funds [2390].
