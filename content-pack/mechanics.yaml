- id: foundation-award-to-institution-or-person
  name: 'Who receives a foundation award: the institution, the person, or neither'
  what: 'Three arrangements appear in this slice. Most awards are made to the institution on behalf of a named researcher
    [2165] [2173]. A few are paid to the person, with no institution involved [2225]. HHMI makes no award at all: it hires
    the scientist, who stays at the host institution [2161].'
  rule: The Burroughs Wellcome Fund states that "most awards are made to degree-granting institutions in the United States
    and Canada on behalf of individual researchers" [2165]. The Guggenheim Foundation supports "individuals, not institutions
    or organizations" [2225]. HHMI Investigators "are HHMI employees who receive full salary and benefits from the Institute
    while maintaining academic appointments and labs at their home institutions" [2161].
  applies_to: Researchers choosing between programmes, and research offices, which administer the first kind only [2165].
