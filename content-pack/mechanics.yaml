- id: indirect-cost-rate-caps-2025
  name: 'The 2025 attempts to cap indirect cost rates at 15 percent (NIH, NSF, DOE, DoD): position on 2026-10-04'
  what: 'In 2025 four agencies announced that they would pay universities indirect costs at 15 percent in place of negotiated
    rates: NIH on February 7, DOE on April 11, NSF on May 2 and the Department of Defense on May 14 [24] [1852] [237] [1855].
    Each policy was set aside by the District of Massachusetts, and none is in effect on 2026-10-04 [24] [237] [289] [1855].
    NSF and DOE state that they apply negotiated rates, an appropriations provision keeps the earlier rules in place at
    NIH, and the Department of Defense policy is vacated and enjoined [154] [289] [1856] [1855].'
  rule: 'NIH: NOT-OD-25-068, issued February 7, 2025 and effective February 10, 2025, set a 15 percent rate on all NIH grants;
    the district court enjoined it on March 5, 2025 and later made the injunction permanent and vacated the notice; the
    First Circuit affirmed on January 5, 2026, on the appropriations rider and on 45 CFR 75.414(c) [24]. Section 224 of
    the fiscal year 2026 Labor-HHS act repeats the rider [1856]. NSF: Policy notice NSF 25-034, issued May 2, 2025 for new
    awards to institutions of higher education from May 5, 2025, was vacated and declared invalid on June 20, 2025 [1854]
    [237]. NSF states that since May 19, 2025 it issues awards at the institution''s negotiated rate, and that new awards
    carry a term applying NSF 25-034 for the whole award if a later court decision permits it [154] [237]. DOE: Policy Flash
    2025-22 of April 11, 2025 set 15 percent for institutions of higher education; the court enjoined it on May 15, 2025
    and vacated it on June 30, 2025 [1853] [1852]. DOE issued further limits for state and local governments, non-profits
    and for-profit organisations (PF 2025-25, 2025-26, 2025-27) and a limit on indirect and fringe benefit reimbursement
    (PF 2025-38) [289]. On January 27, 2026 DOE declared all of them no longer in effect from January 23, 2026, citing section
    313 of the fiscal year 2026 appropriations act [289]. DoD: Memoranda of May 14 and June 12, 2025 capped rates at 15
    percent on new and existing assistance awards to institutions of higher education; the court enjoined the policy on
    July 18, 2025 and on October 10, 2025 vacated it and made the injunction permanent for the university plaintiffs and
    the member universities of the plaintiff associations [1855]. A plaintiff association reports that the First Circuit
    dismissed the Government''s appeal on February 18, 2026 [292]. Grounds: Each ruling found a conflict with the rule that
    agencies accept negotiated rates (2 CFR 200.414(c), or its HHS counterpart 45 CFR 75.414(c)), and each found the district
    court had jurisdiction because the suit challenged an agency-wide policy and did not seek payment under particular grants
    [24] [1854] [1853] [1855]. Appropriations: Public Law 119-103 continues the fiscal year 2026 acts, with their conditions,
    through December 11, 2026 [1480].'
