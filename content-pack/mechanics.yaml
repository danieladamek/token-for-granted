- id: indirect-costs-facilities-and-administrative
  name: Indirect (facilities and administrative) costs
  what: Indirect costs are costs incurred for a common or joint purpose that benefit more than one cost objective and cannot
    readily be assigned to the award that benefits [1799]. For major institutions of higher education and major non-profits
    they are classified in two groups, Facilities and Administration, which is why they are also called F&A costs [1802].
    An award pays them as a percentage, the indirect cost rate, applied to a base of direct costs [1849] [1850].
  rule: 'For institutions of higher education Appendix III lists the F&A categories: depreciation, interest, operation and
    maintenance, general administration and general expenses, departmental administration, sponsored projects administration,
    library, and student administration and services [1849]. Appendix III, section C.8, limits the administrative categories
    at a university to 26% of modified total direct costs [1849]. For non-profits Appendix IV sets three allocation methods
    (simplified, multiple allocation base, direct allocation) and requires an organisation that receives more than $10 million
    in direct federal funding in a fiscal year to break its rate into Facilities and Administration [1850]. The base is
    normally modified total direct costs: salaries and wages, fringe benefits, materials and supplies, services, travel
    and up to the first $50,000 of each subaward, leaving out equipment, capital expenditures, patient care charges, rental
    costs, tuition remission, scholarships and fellowships, participant support costs and the part of each subaward above
    $50,000 [1799]. An organisation gets its rate in one of two ways: a negotiated indirect cost rate agreement with its
    cognizant federal agency, or the de minimis rate [1802]. The rate used for an award is printed in the award document
    [1810]. A cost may not be charged as direct if the same kind of cost in like circumstances is treated as indirect [1831].'
