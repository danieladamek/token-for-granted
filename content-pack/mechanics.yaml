- id: sam-entity-administrator-and-notarized-letter
  name: SAM.gov Entity Administrator and the notarized letter
  what: The person who registers and renews an organisation in SAM.gov is its entity administrator; NIH describes the role
    as held by the chief financial officer or an authorising official [1909]. In April 2018 GSA began requiring an original,
