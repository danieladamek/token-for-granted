  what: The Bureau of Health Workforce describes over 60 grant programmes, made to organizations such as schools and universities,
    hospitals and health departments, which train students, residents and faculty [1030]. Beside these it runs awards to
    individuals in return for service, such as the Faculty Loan Repayment Program and the National Health Service Corps
