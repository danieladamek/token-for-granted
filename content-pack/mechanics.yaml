- id: foundation-reporting-expectations
  name: Reporting on a foundation grant
  what: A foundation grant carries reporting duties that are set in the grant agreement, not in a common rule. The foundations
    read here describe narrative and financial reports and, in some cases, visits [2348] [2360] [2261].
  rule: 'Kresge: ''Program officers determine the reporting requirements for their grantees, often in consultation with
    the organization receiving the funding''; most grants require narrative updates and financial reports at set intervals
    [2348]. Commonwealth Fund: requirements are listed in the Payment and Reporting Schedule that is part of each grant
    agreement, and the Fund posts guidelines for interim and final narrative reports and a financial report template [2360].
    Ford monitors grants through ''visits, convenings, and written reports'' [2261]. Yield Giving''s gifts are for use as
    the recipient chooses, and its pages state no reporting requirement [2316].'
