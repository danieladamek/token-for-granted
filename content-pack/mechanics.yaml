- id: trust-based-grantmaking-practices
  name: '"Trust-based" and flexible grantmaking practices, where a foundation states them'
  what: 'Some foundations state commitments about how they treat grantees: fewer conditions on money, less paperwork, clearer
    communication. The wording and the commitments differ by foundation [2326] [2330] [2315].'
  rule: MacArthur committed in February 2025 to 'Where possible, use flexible, trust-based models for our charitable gifts'
    [2326]. Yield Giving says it is 'named after a belief in adding value by giving up control', and its gifts are for recipients
    to use as they see fit [2315]. Gates makes three commitments to grantees, on quality interactions, clear and consistent
    communications, and feedback, and tells a grantee who will decide on its grant and when [2330]. Packard reported that
    40 percent of its 2025 support was multi-year and unrestricted and described 'longer, more flexible funding' [2342].
