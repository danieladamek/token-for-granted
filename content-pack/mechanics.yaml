- id: modified-total-direct-costs
  name: Modified total direct costs (MTDC)
  what: Modified total direct costs are the base to which an indirect cost rate is usually applied [1799]. The definition
    decides which direct costs carry indirect costs and which do not [1799].
  rule: 2 CFR 200.1 defines MTDC as all direct salaries and wages, applicable fringe benefits, materials and supplies, services,
    travel, and up to the first $50,000 of each subaward, regardless of the period of performance of the subawards under
    the award [1799]. MTDC excludes equipment, capital expenditures, charges for patient care, rental costs, tuition remission,
    scholarships and fellowships, participant support costs, and the portion of each subaward in excess of $50,000 [1799].
    Equipment for this purpose is property with a useful life of more than one year and a unit cost at or above the lesser
    of the organisation's capitalisation level or $10,000 [1799]. The $50,000 and $10,000 figures date from the revision
    effective October 1, 2024; a negotiated rate agreed before a revision stays in place until it expires and the revised
    definitions apply when the rate is renegotiated [1883] [1806]. A second reading of 200.1 on the eCFR on 2026-10-04,
    in the text current to 10/01/2026, returned the same $50,000 subaward figure and the same $10,000 equipment figure [2102].
  figures:
  - label: subaward amount included
    value: up to the first $50,000 of each subaward
    cite:
    - 1799
    - 2102
  - label: equipment threshold
    value: $10,000 per unit or the organisation's lower capitalisation level
    cite:
    - 1799
    - 2102
  applies_to: Any award on which indirect costs are charged on an MTDC base, including every award using the de minimis
    rate [1802].
