- id: samhsa-discretionary-grants-process
  name: How SAMHSA posts, reviews and decides discretionary grants
  what: SAMHSA lists its notices on its Grants Dashboard, with a separate page of forecasts for the next fiscal year, and
    posts them on Grants.gov. Applications go through eRA Commons ASSIST or Grants.gov Workspace. An application that is
    late, over the page limit or missing a required attachment is screened out and not reviewed. Peer reviewers with relevant
    expertise score the project narrative against point-weighted sections in the notice. The programme office and approving
    official make the final determination, and awards over $250,000 need National Advisory Council approval. SAM.gov responsibility
    records are reviewed for awards likely to exceed $250,000. After award, SAMHSA releases each later year's funds on approval
    of progress reports [549] [1107] [1113] [1112] [548].
