  what: NSF returns a proposal unreviewed for listed reasons, among them missing sections, a missed deadline, duplication,
    and not being responsive to the funding opportunity; Supplement 1 added lacking sufficient content to permit effective
    merit review [258] [149]. NSF also uses the mechanism for proposals it judges not aligned with agency priorities [154].
