- id: foundation-money-lobbying-and-campaign-limits
  name: Foundation money, lobbying and campaign activity
  what: |
    A private foundation's spending to influence legislation or the outcome of a public election is a taxable expenditure, and Form 990-PF asks about both each year [2387]. A grant to a public charity that lobbies is still possible under two IRS exceptions [2383] [2384]. Separately, every section 501(c)(3) organisation, grantee and foundation alike, is barred from campaign activity for or against candidates [2385].
  rule: Internal Revenue Code sections 4945 and 501(c)(3) [2387] [2385]. A general support grant by a private foundation
    to a public charity "is generally not a taxable expenditure if the grant is not earmarked to be used in an attempt to
    influence legislation" [2383]. A grant for a specific project is not a taxable expenditure if the foundation's grants
    for the project in the year do not exceed the amount the grantee budgeted for the project's non-lobbying activities
    [2384]. All section 501(c)(3) organisations "are absolutely prohibited from directly or indirectly participating in,
    or intervening in, any political campaign" [2385].
  figures: []
  applies_to: Private foundations as grantors and public charities as grantees [2383] [2385].
