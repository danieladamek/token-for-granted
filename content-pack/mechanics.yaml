- id: assistance-listings
  name: Assistance Listings
  what: The Assistance Listings are the public catalogue of federal assistance programmes, kept by the General Services
    Administration at SAM.gov [1799] [1808]. Each programme has a listing and a number, and that number appears in the funding
    notice and in the award document [1800] [1810]. The Grants.gov glossary calls the listings the authoritative source
    of information about federal programmes that provide grants, loans, scholarships, insurance and other assistance [1880].
  rule: 2 CFR 200.203 requires each agency to keep an accurate list of its programmes in the Assistance Listings and to
    assign a listing before making awards, except in exigent circumstances [1808]. A listing gives the programme's purpose
    and goals, whether its awards are discretionary or non-discretionary, the projected funds, the source of funds, the
    general eligibility requirements and whether single audit requirements apply [1808].
