- id: recipient-procurement-standards
  name: Procurement by recipients (2 CFR 200.317 to 200.327)
  what: 'When a recipient spends award money on goods or services it follows the procurement standards in the Uniform Guidance,
    not the Federal Acquisition Regulation [1817]. The standards scale with the size of the purchase: micro-purchases, simplified
    acquisitions, and formal sealed bids or proposals [1819]. This record gives the outline only [1818].'
  rule: 'A State or Indian Tribe follows the procedures it uses for its own funds; every other recipient and subrecipient,
    including a subrecipient of a State, follows 200.318 to 200.327 [1817]. Under 200.318 a recipient keeps documented procurement
    procedures, oversees its contractors, keeps written standards of conduct on conflicts of interest, avoids unnecessary
    or duplicative purchases, awards only to responsible contractors and keeps records that detail the history of each procurement
    [1818]. Under 200.320 a micro-purchase may be made without competitive quotations if the price is considered reasonable
    and that is documented; a simplified acquisition needs price or rate quotations from an adequate number of qualified
    sources; above the simplified acquisition threshold sealed bids or competitive proposals are used [1819]. The micro-purchase
    and simplified acquisition thresholds are those set by the Federal Acquisition Regulation at 48 CFR part 2, subpart
    2.1 [1799]. FAR 2.101, as shown on Acquisition.gov with an effective date of March 13, 2026, sets the micro-purchase
    threshold at $15,000, with other amounts for construction, services and emergencies; the simplified acquisition threshold
    figure was not reached in this sweep [1890]. A recipient may self-certify a micro-purchase threshold of up to $50,000
    if it is a low-risk auditee, has an annual internal institutional risk assessment, or, for a public institution, State
    law is consistent with it; a higher threshold needs approval from the cognizant agency for indirect costs [1819]. Noncompetitive
    procurement is allowed in five cases: a micro-purchase; a single source; public exigency or emergency; written approval
    from the agency or pass-through entity; or inadequate competition after soliciting several sources [1819]. Equipment
    is tangible personal property with a useful life of more than one year and a unit cost at or above the lesser of the
    recipient''s own capitalisation level or $10,000 [1799]. The eCFR text of 200.320 current to 10/01/2026 has the same
    $50,000 ceiling for a self-certified micro-purchase threshold, with approval by the cognizant agency for indirect costs
    above it [2091]. In the eCFR text of 200.1 the definitions of micro-purchase threshold and simplified acquisition threshold
    print no dollar figure: they refer to 200.320 and to the amounts set in the FAR at 48 CFR part 2, subpart 2.1, and the
    recipient or subrecipient sets a simplified acquisition threshold no higher than the FAR value [2102].'
  figures:
  - label: micro-purchase threshold (FAR 2.101, effective March 13, 2026)
    value: $15,000
    cite:
    - 1890
  - label: self-certified micro-purchase threshold
    value: up to $50,000
    cite:
    - 1819
    - 2091
  - label: equipment threshold
    value: $10,000 per unit, or the recipient's lower capitalisation level
    cite:
