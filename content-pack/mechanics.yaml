- id: form-990-pf-unsolicited-applications-line
  name: Where Form 990-PF says whether a foundation accepts unsolicited requests (Part XIV, line 2)
  what: |
    On the 2025 Form 990-PF the statement is in Part XIV, Supplementary Information, line 2, headed "Information Regarding Contribution, Grant, Gift, Loan, Scholarship, etc., Programs" [2387]. Line 2 opens with a check box [2387]. A foundation that checks it is saying it gives only to charities it has chosen itself and takes no unsolicited requests [2387]. A foundation that does not check it fills in lines 2a to 2d with the contact, the form of application, the deadlines and the restrictions [2387].
  rule: 'The form''s wording, line 2: "Check here if the foundation only makes contributions to preselected charitable organizations
    and does not accept unsolicited requests for funds." [2387]. It continues: "If the foundation makes gifts, grants, etc.,
    to individuals or organizations under other conditions, complete items 2a, 2b, 2c, and 2d." [2387]. Part XIV carries
    the header "Complete this part only if the foundation had $5,000 or more in assets at any time during the year" [2387].'
  figures:
  - label: Part XIV, line 2, check box
    value: '"Check here if the foundation only makes contributions to preselected charitable organizations and does not
      accept unsolicited requests for funds."'
    cite:
    - 2387
  - label: Part XIV, line 2a
    value: '"The name, address, and telephone number or email address of the person to whom applications should be addressed"'
    cite:
    - 2387
  - label: Part XIV, line 2b
    value: '"The form in which applications should be submitted and information and materials they should include"'
    cite:
    - 2387
  - label: Part XIV, line 2c
    value: '"Any submission deadlines"'
    cite:
    - 2387
  - label: Part XIV, line 2d
    value: '"Any restrictions or limitations on awards, such as by geographical areas, charitable fields, kinds of institutions,
      or other factors"'
    cite:
    - 2387
  - label: who completes Part XIV
    value: only a foundation that had $5,000 or more in assets at any time during the year
    cite:
    - 2387
  - label: the same line on older forms
    value: Part XV, line 2 on the 2020 form, which had 17 parts; Part XIV, line 2 on the 2021 and 2022 forms, which have
      16 parts
    cite:
    - 2467
    - 2468
    - 2469
  - label: the same line on the 2023 and 2024 forms (added by slice D)
    value: Part XIV, line 2 on both; each form has Parts I to XVI, and the check-box sentence and lines 2a to 2d were returned
      with the same wording as the 2025 form
    cite:
    - 2471
    - 2470
  - label: Part XIV, line 2, heading and full check-box text (added by slice D)
    value: 'Heading: "Information Regarding Contribution, Grant, Gift, Loan, Scholarship, etc., Programs:". The sentence
      after the box ends "complete items 2a, 2b, 2c, and 2d. See instructions."'
    cite:
    - 2387
  - label: Part XIV, line 3 (added by slice D)
    value: '"Grants and Contributions Paid During the Year or Approved for Future Payment"; line 3a "Paid during the year"
      and line 3b "Approved for future payment", each with a Total; columns for recipient name and address, relationship
      of an individual recipient to a foundation manager or substantial contributor, foundation status of recipient, purpose
      of grant or contribution, and amount'
    cite:
    - 2387
  - label: the check box in the e-file XML (added by slice D)
    value: element OnlyContriToPreselectedInd inside SupplementaryInformationGrp; it held the value "X" in the Kavli Foundation's
      return for tax year 2024 and was absent from the Dreyfus Foundation's return for the same year
    cite:
    - 2481
    - 2480
  - label: lines 2a to 2d in the e-file XML (added by slice D)
    value: group ApplicationSubmissionInfoGrp with RecipientPersonNm, RecipientUSAddress and RecipientPhoneNum (line 2a),
      FormAndInfoAndMaterialsTxt (line 2b), SubmissionDeadlinesTxt (line 2c) and RestrictionsOnAwardsTxt (line 2d)
    cite:
    - 2480
  - label: the check box in GivingTuesday's data marts (added by slice D)
    value: variable SUINONCOTOPR in the "990PF Basic Fields" mart, described as "Part_14_Supplementary_Information_2_Checkbox_foundation_only_makes_contributions";
      the line 2a contact is in SIASIRNAME and the SIASIR address, telephone and email variables; no variable for lines
      2b, 2c or 2d was returned from that tab
    cite:
    - 2477
  applies_to: 'Private foundations that file Form 990-PF and had $5,000 or more in assets during the year [2387]. It does
    not exist for public charities such as community foundations, which file Form 990 [2374]. The box is the foundation''s
    own statement for the tax year of the return, and the foundation''s website may say something newer [2387]. The part
    number depends on the year of the form: the line is Part XV, line 2 on the 2020 form and Part XIV, line 2 on the 2021,
    2022 and 2025 forms; the 2023 and 2024 forms were not read [2467] [2468] [2469] [2387]. Added by slice D: the 2023 and
    2024 forms were then read, and on both the line is Part XIV, line 2 [2471] [2470]. A foundation''s answer to lines 2b
    to 2d can be a pointer and nothing more: the Dreyfus Foundation''s return for tax year 2024 gives "SEE WEBSITE. WWW.DREYFUS.ORG"
    for both deadlines and restrictions [2480].'
  open_data: Added by slice D. The check box and the application details are separate fields in the e-filed return, so they
    can be read by machine for any foundation that files electronically [2481] [2480]. The check box is the XML element
    OnlyContriToPreselectedInd [2481]. The application details are the group ApplicationSubmissionInfoGrp [2480]. GivingTuesday's
    990 data marts publish the check box as the variable SUINONCOTOPR, one row per return, keyed by EIN and tax year [2477]
    [2475]. The element names were read from two returns filed under schema version 2024v5.2; the IRS schema page lists
    the schema sets by tax year and names no elements [2480] [2472].
