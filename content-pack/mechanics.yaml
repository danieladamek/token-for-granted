- id: general-operating-support-and-project-support
  name: General operating support and project support
  what: Foundations make two main kinds of grant. General operating support pays for an organisation's work as a whole;
    project support pays for one named piece of work with its own budget [2261].
  rule: 'Ford defines general operating support as funds for day-to-day work, often as multi-year commitments, and project
    support as funds for distinct initiatives that are ''usually time-bound, and aimed at achieving specific goals'' [2261].
    Hewlett says it ''Provides long-term, general operating support whenever possible'' [2280]. Open Society gives both
    project grants and general operating support ''that cover the day-to-day costs of operations'' [2293]. Yield Giving''s
    gifts are for recipients ''to use as they see fit'' [2315]. Some funders prefer the other kind: Woodruff says ''Most
    grants support one-time needs rather than ongoing program or operating needs'', and the Commonwealth Fund does not fund
    ongoing activities [2313] [2324]. Ford''s and MacArthur''s indirect cost rates apply to project grants and not to general
    operating support [2332] [2265].'
