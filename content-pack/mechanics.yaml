- id: private-foundation-public-charity-medical-research-organization
  name: Private foundation, public charity that funds research, and medical research organization
  what: Three kinds of private body pay for research in this slice, and the tax law classes them differently. A private
    foundation is the default class for a 501(c)(3) organisation; it files Form 990-PF and must distribute income each year
    [2237]. A public charity is an organisation outside that class, for example one with an active programme of fundraising
    and contributions from many sources [2238]. A medical research organization conducts medical research itself, in conjunction
    with a hospital, and is listed by the IRS among public charities [2238] [2239].
  rule: 'The IRS states the default: every organization exempt under section 501(c)(3) "is a private foundation unless it
    falls into one of the categories specifically excluded" [2237]. A private foundation files Form 990-PF each year, pays
    an excise tax on net investment income and is bound by rules on self-dealing, annual distribution, business holdings
    and expenditures [2237]. Public charities include hospitals, "qualified medical research organizations affiliated with
    hospitals", schools, colleges and universities, and organisations that "have an active program of fundraising and receive
    contributions from many sources" [2238]. Under 26 CFR 1.170A-9(d)(2) a medical research organization must be organized
    for the principal purpose of engaging primarily in the conduct of medical research, and meets the test if it devotes
    more than one half of its assets to that research or spends 3.5 percent or more of the fair market value of its endowment
    on it [2239].'
  figures:
  - label: 'medical research organization: asset test'
    value: more than one half of its assets devoted to the continuous active conduct of medical research
    cite:
    - 2239
  - label: 'medical research organization: spending test'
    value: 3.5 percent or more of the fair market value of its endowment
    cite:
    - 2239
  - label: return filed by a private foundation
    value: Form 990-PF
    cite:
    - 2237
  applies_to: 'In this slice: private foundations that file Form 990-PF include Simons, Sloan, Moore, Keck, Kavli, Templeton,
    Burroughs Wellcome, Helmsley, Spencer, Russell Sage, William T. Grant, Mellon, Carnegie, Luce and Guggenheim [2123]
    [2126] [2132] [2136] [2139] [2157] [2169] [2186] [2199] [2204] [2208] [2215] [2218] [2221] [2226]. The American Heart
    Association, the American Cancer Society and The Pew Charitable Trusts file Form 990 [2189] [2192] [2176]. HHMI files
    Form 990 and calls itself "a medical research organization"; it employs its Investigators rather than awarding them
    grants [2164] [2160] [2161]. The Chan Zuckerberg Initiative gives through four entities, one of them a private foundation
    and one a limited liability company [2171].'
