- id: nsf-funding-opportunity-types
  name: Programme description, programme announcement, solicitation, Dear Colleague Letter
  what: A programme description is a broad, general description of a programme that uses the PAPPG's generic eligibility
    and preparation rules [156]. A programme announcement is a formal NSF publication announcing a programme, also on the
    generic rules [156]. A programme solicitation is more focused, applies for a limited period, and is used when NSF departs
    from the generic rules — limiting who may submit or how many proposals, restricting indirect costs, requiring preliminary
    proposals, adding review criteria or requiring cost sharing [156] [158]. A Dear Colleague Letter gives information,
    clarifies policy, or announces interest in planning, RAPID, EAGER, RAISE or conference proposals or supplements on a
    topic [156] [158]. In August 2026 NSF called its twelve new solicitations Notices of Funding Opportunity [192].
  official_url: https://www.nsf.gov/policies/pappg/24-1/ch-1-pre-submission
  sources:
  - 156
  - 158
  - 192
  sweep: research-B
- id: nsf-concept-outline
  name: Concept outline
  what: A concise summary of a project idea sent before certain proposal types so that a programme officer can judge fit;
    it goes by email or through the ProSPCT tool and is generally limited to two pages or 6000 characters [156] [250].
  official_url: https://www.nsf.gov/policies/pappg/24-1/ch-1-pre-submission
  sources:
  - 156
  - 250
  sweep: research-B
- id: nsf-letter-of-intent
  name: Letter of intent
  what: A non-binding notice some solicitations require so that staff can gauge the size of a competition; if a required
    letter is missing the full proposal is not accepted [156].
  official_url: https://www.nsf.gov/policies/pappg/24-1/ch-1-pre-submission
  sources:
  - 156
  sweep: research-B
- id: nsf-preliminary-proposal
  name: Preliminary proposal
  what: A short first-stage proposal some solicitations require; the outcome is either a binding invite or not-invite decision,
    or an advisory encourage or discourage [156]. Expeditions in Computing uses one [191].
  official_url: https://www.nsf.gov/policies/pappg/24-1/ch-1-pre-submission
  sources:
  - 156
  - 191
  sweep: research-B
- id: nsf-target-date-deadline-window
  name: Target date, deadline date, submission window, accepted anytime
  what: After a target date a proposal is still accepted but may miss a panel; after a deadline date it is not accepted;
