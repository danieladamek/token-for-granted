- id: omb-2-cfr-revision-2026
  name: OMB's proposed "Regulation for Federal Financial Assistance" (91 FR 32198, May 29, 2026)
  what: 'On May 29, 2026 OMB, with the grant-making agencies as co-proposers, published a proposed rule to revise 2 CFR,
    including the Uniform Guidance in part 200 [1458]. It would turn the guidance into a regulation that takes effect government-wide
    on one date, and would change rules on notices, payments, subawards, termination, national policy requirements and cost
    items [1803] [1458]. On 2026-10-04 it is a proposal: no final rule has been published, and section 157 of Public Law
    119-103 provides that a rule arising from it shall not be issued, finalised or take effect through December 11, 2026
    [1858] [1480]. The Uniform Guidance as revised in 2024 remains the rule in force [1857] [1801].'
  rule: 'Comment period: Comments were due on or before July 13, 2026 in docket OMB-2026-0034; the Federal Register record
    shows 496,606 comments [1458] [1858]. Status: OMB''s regulatory agenda of August 14, 2026 lists the rule (RIN 0348-AB88)
    in the proposed rule stage with no date for final action [1859]. Section 157 of the continuing resolution signed September
    2, 2026 bars a rule "arising out of" the proposal "or a substantially similar rule" from being issued or finalised through
    December 11, 2026, and says a rule finalised before enactment has no force through that date; the Senate committee summary
    says the section retains existing guidance through December 11, 2026 [1480] [1857]. NIH states that the resolution prohibits
    it from implementing the revisions through December 11, 2026 [83]. The chair of the Senate Appropriations Committee
    stated on September 21, 2026 that the resolution blocks OMB''s proposed rule or any substantially similar one [1891].
    Stated objectives: improved transparency, accountability and oversight; clarification of regulatory structure; reduced
    recipient burden [1803]. Section by section, in outline, from the Federal Register text as far as it was read (through
    200.111) and from its table of contents for the rest: Part 1: "guidance" becomes "regulation", relying on 31 U.S.C.
    503 and 6307, with a new 1.221 for agencies that implement by policy [1803]. 200.1: definitions of fixed amount award
    and protected PII removed; Federal award date, improper payment, PII and unobligated balance changed [1803]. 200.101
    and 200.102: a new paragraph on conflicts with agency regulations, under which subpart F and 200.340 govern [1803].
    200.110: OMB amendments would apply government-wide on the effective date of a final rule without separate agency rulemakings
    [1803]. 200.201 and 200.333: fixed amount awards and subawards eliminated [1803]. 200.202: programme design aligned
    with law and executive branch policy; multi-year awards encouraged [1803]. 200.204 to 200.206: all funding opportunities
    posted on Grants.gov, with changes to merit review and risk review [1803]. 200.208 and 200.211: specific conditions
    and award contents revised [1803]. New 200.218, 200.219 and 200.220: prohibitions concerning disparate-impact liability
    theories, discriminatory event services and covered foreign collaborations; 200.300 revised [1458]. 200.305: justification
    required for payment requests [1803]. 200.329 to 200.332: subaward reporting on SAM.gov [1803]. 200.339 to 200.343:
    termination and suspension, to clarify termination of discretionary awards for discretionary reasons consistent with
    law [1803]. Subpart E: changes to 200.421, 200.429, 200.432, 200.438, 200.442, 200.444, 200.450, 200.454, 200.455, 200.461,
    200.467 and a new 200.477 [1458]. Subpart F: 200.503, 200.513, 200.514 [1458]. Appendices I, II, VIII and IX revised;
    agency chapters in Subtitle B of 2 CFR revised or added [1458]. From an association summary, not checked against the
    Federal Register text: five termination grounds including agency discretion; no hearing required for terminations other
    than for noncompliance; senior political appointee review of each notice under a new 200.205; advertising, conference,
    membership and publication costs restricted; no change to negotiated indirect cost rates; an intended effective date
    of October 1, 2026 for new awards only [1878]. Checked on 2026-10-04 against the Federal Register text, from its HTML
    version as far as page 32212 and from short passages of the later preamble and regulatory text returned by the Federal
    Register''s full-text search [2092] [2093] [2104]. Termination: proposed 200.340(a) lists five grounds, (1) noncompliance
    by the recipient or subrecipient, including a failure to report subawards, (2) a determination by the agency or pass-through
    entity, to the extent permitted by law, that termination is in its interest, including where the award no longer effectuates
    programme goals, agency priorities or the national interest as they exist at the time of termination, (3) mutual agreement,
    (4) notification by the recipient or subrecipient, and (5) additional termination provisions in the award; awards must
    always include grounds (1) to (4) [2093] [2104]. A new 200.340(d) would allow a written order to stop work, which the
    preamble likens to a provision of the FAR [2104]. On 200.342 the preamble says hearing rights continue for a remedy
    for noncompliance and would not be required for other types of termination unless other law expressly requires them
    [2093]. Review: proposed 200.205 keeps peer review advisory and adds a pre-issuance review, by senior appointees, of
    proposals selected for funding; the review must be described in the notice of funding opportunity and may form the basis
    of a decision not to select an applicant [2092] [2093]. New sections: 200.218 bars the use of awards in support of disparate-impact
    studies, litigation or related activities unless expressly required by law; 200.219 is headed "Prohibition of Discriminatory
    Event Services" and concerns public entities that are recipients or subrecipients; 200.220 prohibits obligating federal
    funds for covered foreign collaborations and does not prohibit collaborations paid for with non-federal funds [2104]
    [2093]. Cost items: advertising and public relations costs unallowable with limited exceptions (200.421); conference
    attendance allowable only if expressly approved by the agency and included in the award terms (200.432); three new paragraphs
    in 200.450, one prohibiting the funding of voter registration activities; a new prior approval requirement in 200.454;
    publication costs unallowable unless expressly required by statute (200.461) [2093]. Indirect costs: part IX of the
    preamble states that OMB is not proposing updates to the indirect cost rate negotiation system through the document
    and asks commenters not to comment on that system [2093]. Effective date: part XI states that OMB proposes a final rule
    effective by October 1, 2026, so that a single set of government-wide requirements applies to Federal awards made during
    fiscal year 2027, and gives a 45-day comment period [2093] [2104]. The Federal Register record on 2026-10-04 shows no
    correction and no effective date for the document [1858]. Section 157 was re-read in the public law text on govinfo:
    subsection (a) bars issuing or finalising a rule to revise the Uniform Guidance through December 11, 2026, and subsection
    (b) denies force or effect through that date to one issued before enactment [1480].'
