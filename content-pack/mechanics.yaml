- id: award-termination
  name: Termination of an award (2 CFR 200.340)
  what: Termination is the action an agency or pass-through entity takes to end an award, in whole or in part, before the
    planned end of the period of performance [1799]. 2 CFR 200.340 lists four ways an award may be terminated and requires
    every termination provision to be stated in the award terms [1801]. The fourth ground, for an award that "no longer
    effectuates the program goals or agency priorities", is the ground that NSF's public statements and NIH's award terms
    use for priority-based terminations, and it is the subject of a July 2026 court ruling [1801] [154] [65] [1869].
  rule: 'Under 2 CFR 200.340(a) an award may be terminated: (1) by the agency or pass-through entity if the recipient fails
    to comply with the terms and conditions; (2) by the agency or pass-through entity with the recipient''s consent, on
    agreed conditions; (3) by the recipient, on written notice giving the reasons and effective date; or (4) by the agency
    or pass-through entity pursuant to the terms and conditions of the award, including, to the extent authorised by law,
    if an award no longer effectuates the programme goals or agency priorities [1801]. Under 200.340(b) the agency or pass-through
    entity must clearly and unambiguously specify all termination provisions in the award terms [1801]. Under 200.341 the
    agency must give written notice, which is to state the reasons, the effective date and the portion terminated [1827].
    Where termination is for material failure to comply, the agency reports it in SAM.gov, where it stays available for
    five years, and the recipient may post comments there [1801] [1827]. Under 200.343 costs after termination are allowable
    only if they result from obligations properly incurred before the effective date and not in anticipation of it, or are
    expressly authorised [1829]. After termination both sides remain responsible for closeout [1801]. The District of Massachusetts
    declared on July 17, 2026 that 200.340(a)(4), and its 2021 predecessor 200.340(a)(2), do not allow termination based
    on new programme goals or agency priorities identified after the award was made [1869]. A second reading of 200.340
    on the eCFR on 2026-10-04, in the text current to 10/01/2026, returned the same four grounds; paragraph (c) has a termination
    for material noncompliance reported in SAM.gov only after the recipient has exhausted its opportunities to object or
    30 calendar days have passed without notice of an appeal [1801].'
