  what: 'Congress may name a specific recipient, project and amount in an appropriations act; the House calls this Community
    Project Funding and the Senate Congressionally Directed Spending [1667] [1674]. An organisation cannot apply to either
    committee: it asks its House Member or a Senator, on that office''s own deadline, and the office decides whether to
    submit the request to the committee [1667] [1674]. Recipients may be state, local or tribal governments and certain
    eligible non-profits; for-profit entities are excluded in both chambers [1667] [1675]. Projects are listed in a table
    in the joint explanatory statement of the enacted act, and the agency then awards only to the named recipient [1679]
    [1686]. Congress designated no such funds in FY 2025: the full-year continuing resolution gave prior-year project language
    no legal effect [1680] [1755]. FY2026 projects were enacted in four laws signed between November 12, 2025 and April
    30, 2026 [1677]. FY27 requests were due to the committees between March 13 and May 7, 2026; on the sweep date no FY2027
    act had been enacted and continuing appropriations ran through December 11, 2026 [1668] [1675] [61].'
