- id: civil-rights-obligations
  name: Civil rights obligations of recipients (outline)
  what: Title VI of the Civil Rights Act of 1964 prohibits discrimination on the basis of race, color and national origin
    in programmes and activities receiving federal financial assistance [2040]. Title IX of the Education Amendments of
    1972 prohibits sex discrimination in any education program or activity receiving federal financial assistance [2045].
    Section 504 of the Rehabilitation Act prohibits discrimination on the basis of disability [2043]. An HHS applicant agrees
    to all of these, with the Age Discrimination Act of 1975, on Form HHS-690 [2036].
  rule: 'Agencies may begin fund termination proceedings or refer a matter to the Department of Justice, and individuals
    may file complaints or sue [2040]. The Justice Department''s own Title VI regulation no longer carries its paragraph
    on criteria or methods of administration with a discriminatory effect: 28 CFR 42.104(b)(2) is shown as reserved after
    a final rule of December 10, 2025 (90 FR 57148) [2041] [2086]. HHS''s section 504 rule requires recipients'' web content
    and mobile apps to meet WCAG 2.1 Level A and Level AA, beginning May 11, 2027 for recipients with fifteen or more employees
    and May 10, 2028 for smaller recipients (45 CFR 84.84(b)), as amended May 11, 2026 [2044].'
  figures:
  - label: HHS web and mobile accessibility, recipients with fifteen or more employees
    value: beginning May 11, 2027
    cite:
    - 2044
  - label: HHS web and mobile accessibility, recipients with fewer than fifteen employees
    value: beginning May 10, 2028
    cite:
    - 2044
