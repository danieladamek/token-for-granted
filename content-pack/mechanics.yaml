- id: notice-of-funding-opportunity
  name: 'Notice of funding opportunity: required content and time open'
  what: A notice of funding opportunity is the formal announcement that federal funding is available through a financial
    assistance programme [1799]. The Uniform Guidance fixes what a notice must contain, in what order, and how long it is
    expected to stay open [1800] [1848]. A summary of each notice is displayed on Grants.gov ahead of the full text [1800].
  rule: '2 CFR 200.204(a) lists the summary items: agency name, opportunity title, announcement type, funding opportunity
    number, Assistance Listing number, funding details, key dates, an executive summary and agency contact information [1800].
    2 CFR 200.204(b) sets a standard of at least 60 calendar days open for application, allows a shorter period, and states
    that no opportunity is to be open for fewer than 30 calendar days unless the agency determines that exigent circumstances
    justify it; the paragraph is worded as an expectation ("should"), not as a requirement [1800]. Appendix I sets nine
    sections for the full text: Basic Information; Eligibility; Program Description; Application Contents and Format; Submission
    Requirements and Deadlines; Application Review Information; Award Notices; Post-Award Requirements and Administration;
    and Other Information, which is optional [1848]. The notice must state whether cost sharing is required, and say so
    if it is not; must list every type of eligible applicant; must describe each review criterion and its relative weight
    where weights differ; must describe the risk review under 200.206; and must state the agency''s policies on indirect
    cost rate reimbursement [1848] [1802]. The notice must be written in plain language [1848]. The eCFR''s version record
    for part 200, read on 2026-10-04, lists no issue of 200.204 after the amendment dated October 1, 2024 [2103].'
