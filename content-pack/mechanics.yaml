    value: WCAG 2.1 Level A and Level AA
    cite:
    - 2044
  applies_to: Recipients of federal financial assistance [2040]. On language access, the executive order of March 1, 2025
    revoked Executive Order 13166, and the Justice Department has suspended lep.gov pending new guidance [2040] [2042].
    The Title IX regulations in force were not read in this sweep [2045].
  pending_changes:
