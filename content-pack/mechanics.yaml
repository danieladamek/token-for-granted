- id: sam-uei-only-versus-full-registration
  name: Unique Entity ID only, or full SAM.gov registration
  what: SAM.gov offers two things that newcomers confuse. 'Get a Unique Entity ID' gives an identifier only; 'Register Entity'
    is the full registration that lets an organisation apply for federal awards as a prime awardee [1897].
  rule: Under 2 CFR 25.200 an applicant must be registered in SAM.gov before submitting an application and include its UEI
    in it; under 2 CFR 25.300 a subrecipient must have a UEI and is not required to complete full registration [1899] [1900].
    The eCFR showed title 2 as last amended 8/17/2026 when read on 2026-10-04 [2102]. Of the six rule documents citing title
    2 published since January 1, 2025, the one effective August 17, 2026 is the Department of Energy's rule adding subpart
    C to 2 CFR part 910; all six are in agency chapters of Subtitle B and none is an OMB rule on parts 25, 170 or 200 [2095]
    [2096].
