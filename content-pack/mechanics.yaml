- id: community-foundation-grantmaking-pattern
  name: How a community foundation gives (competitive grants and donor-advised grants)
  what: |
    A community foundation pays out money in two ways, and only one of them takes applications [2416] [2428]. Competitive or discretionary grants are decided by the foundation's staff and board and are open to application under its guidelines [2411] [2416]. Donor-advised grants follow the advice of the donor who set up the fund [2373] [2428]. The five large community foundations read in this sweep differ in how much of each they do and in how they take applications [2412] [2426] [2422] [2429].
  rule: 'There is no single rule: the New York Community Trust takes proposals through its portal under published guidelines
    and also posts requests for proposals [2418] [2417]. The Cleveland Foundation keeps a standard application open year-round
    [2426]. Silicon Valley Community Foundation ran its Community Action Grants by a request for proposals open from March
    2 to March 31, 2026 [2412]. The Chicago Community Trust lists named funding opportunities and takes applications through
    its GrantCentral portal [2422]. The Greater Kansas City Community Foundation says most of its donors hold donor-advised
    funds and lists the few funds that take applications [2428] [2429].'
  figures:
  - label: geographic limit, examples
    value: San Mateo and Santa Clara counties (Silicon Valley); New York City, Long Island and Westchester (New York); Cook
      County for endowment grants (Chicago); Cuyahoga, Lake and Geauga counties (Cleveland)
    cite:
    - 2411
    - 2418
    - 2423
    - 2425
  - label: common exclusions, examples
    value: individuals, endowments, capital campaigns, religious purposes (New York); individuals, endowment campaigns,
      annual appeals, religious purposes (Cleveland)
    cite:
    - 2416
    - 2425
  applies_to: Community foundations [2405]. A reader approaching a local one can expect a defined service area, a list of
    excluded uses, an online portal, and a statement about donor-advised funds; each of these was found on at least three
    of the five sites read [2416] [2425] [2423] [2428] [2411].
