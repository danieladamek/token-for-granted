  what: 'The Research Performance Progress Report is the government-wide standard format for progress reports on research
    awards [1955]. Each agency collects it in its own system: NIH in eRA Commons, NSF in Research.gov, and NASA as annual
    performance reports built on the RPPR data elements [1954] [1955] [1947].'
  rule: 'NIH has three types: annual, interim (filed with a renewal application) and final (part of closeout) [1954]. At
    NIH only the PD/PI or a delegate can start an RPPR, and only a Signing Official, or a PI the Signing Official has delegated,
    can submit it [1954]. At NSF late reports delay further funding, no-cost extensions and the processing of pending proposals
