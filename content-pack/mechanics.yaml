- id: sam-entity-validation
  name: SAM.gov entity validation
  what: Before SAM.gov assigns a Unique Entity ID it validates the entity's legal business name and physical address; an
    entity it cannot validate may open a help ticket [1898]. NSF notes that a registration becomes active only after SAM
    completes entity validation [156].
  rule: The name, physical address, start year and state of incorporation entered must match the documents attached; GSA's
    guide for government entities lists bank statements, utility bills, charters and similar records as documents [1968].
    GSA's 2022 forum slides add that a P.O. box is not accepted as a physical address, that bank statements and utility
    bills must be less than five years old, and that documents not in English need a certified translation [1979]. For U.S.
    entities the Taxpayer Identification Number and the CAGE code are also validated, and a failure produces an email with
    instructions [1898].
