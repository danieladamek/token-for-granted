- id: common-rule
  name: The Common Rule (45 CFR part 46, subpart A)
  what: The Common Rule is the federal policy for the protection of human subjects, codified for HHS at 45 CFR part 46 and
    in identical language by the other agencies that follow it [1992]. Twenty departments and agencies follow the revised
    rule [1992].
  rule: The revised Common Rule was published in January 2017, amended in January 2018 and took effect in July 2018 [1992].
    It requires an assurance from each institution engaged in covered non-exempt research (45 CFR 46.103) and review by
    a registered IRB (45 CFR part 46, subpart E) [1981] [1983].
  figures:
