- id: foundation-payout-rate
  name: Foundation payout rate
  what: Payout is the share of its assets that a private foundation spends for charitable purposes in a year. Several announcements
    in 2025 and 2026 were stated as payout rates [2326] [2327].
  rule: MacArthur's February 2025 statement refers to the 5 percent minimum that the law requires and raises its own baseline
    to 6 percent [2326]. It later reported a 2025 rate of 7.1 percent, extended the 6 percent commitment through 2028, and
    said it intends then to revert to a target of 5.25 percent [2327] [2328]. Gates states its plan as an annual payout
    in dollars, $9 billion for 2026, on the way to closing in 2045 [2329]. The statute and Treasury rule behind the 5 percent
    minimum were not read in this sweep [2326]. Of the foundations in this slice, MacArthur is the only one found to have
    announced a higher payout rate on its own pages; a Candid post of July 6, 2026 on payout names no other foundation [2365]
    [2326].
