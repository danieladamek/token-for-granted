- id: foundation-giving-size-of-field
  name: The size of foundation giving
  what: |
    Giving USA put giving by foundations at $117.15 billion in 2025, 19.0 percent of total charitable giving of $617.20 billion [2409]. Corporations gave $43.67 billion, 7.1 percent [2409]. IRS statistics for tax year 2022 show that nonoperating foundations filed 91.2% of private foundation returns and that foundations with $100 million or more in assets were 1.5% of returns [2410].
  rule: Giving USA is published by Giving USA Foundation and researched and written by the Indiana University Lilly Family
    School of Philanthropy; its figures are estimates for the calendar year [2409].
