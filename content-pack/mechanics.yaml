- id: discretionary-formula-and-block-awards
  name: Discretionary, mandatory, formula and block awards
  what: Federal awards divide by how the recipient and the amount are chosen [1880]. For a discretionary grant the agency
    may select the recipient from among all eligible applicants, may decide whether to make an award on the content of an
    application, and decides the amount [1880]. For a mandatory grant the authorising statute requires an award to each
    eligible entity in the amount or by the formula the statute sets, and a formula grant is an allocation to states, territories
    or local governments by a distribution formula in the law or regulations [1880].
  rule: 2 CFR 200.1 defines a discretionary award as one in which the agency, under statutory authority to exercise judgment,
    selects the recipient or the amount through a competitive process or on the merit of proposals, and a non-discretionary
    award as one made to specific recipients under statutory, eligibility and compliance requirements such that the agency
    cannot exercise judgment [1894]. Each Assistance Listing states whether a programme's awards are discretionary or non-discretionary
    [1808]. The notice rules in 2 CFR 200.204 apply to discretionary funding opportunities [1800]. 2 CFR 200.101(e) takes
    block grants authorised by the Omnibus Budget Reconciliation Act of 1981, and certain other listed programmes, out of
    subparts C, D and E except for specified provisions, and 200.101(f) takes listed entitlement programmes, among them
    TANF, Medicaid and CHIP, out of subpart C [1805]. Executive Order 14332 applies to discretionary grants only, and takes
    its definition from 2 CFR 200.1 [246]. The Grants.gov glossary read on 2026-10-04 has no entry for "block grant" [1880].
  figures: []
  applies_to: All federal financial assistance; the distinction decides whether an organisation competes with a federal
    agency or applies to a state or local recipient [1880] [1805]. The pack's record pass-through-subaward describes the
    second route [1823].
