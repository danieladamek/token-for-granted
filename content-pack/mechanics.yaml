- id: form-990-pf-part-by-part
  name: Form 990-PF, part by part
  what: |
    Form 990-PF is the annual return every private foundation files with the IRS [2388]. It is public: a foundation must make it available for inspection and copying for three years [2461]. The 2025 form has Parts I to XVI [2388]. Four places answer most of a grant seeker's questions: the asset figure on page 1, the grants paid line in Part I, the balance sheet in Part II, and Part XIV, which lists every grant and says whether the foundation takes requests [2387].
  rule: Filers are exempt private foundations, taxable private foundations, section 4947(a)(1) nonexempt charitable trusts
    treated as private foundations, and organisations making section 507 terminations [2388]. A 2025 Form 990-PF must be
    filed electronically [2388].
  figures:
  - label: Page 1, item H
    value: 'type of organisation: section 501(c)(3) exempt private foundation, section 4947(a)(1) nonexempt charitable trust,
      or other taxable private foundation'
