- id: required-certifications
  name: Certifications on reports, payment requests and rate proposals (2 CFR 200.415)
  what: The Uniform Guidance itself requires an authorised official to sign a certification on each financial report and
    payment request [1885]. The certification names the federal false-statement and false-claims statutes, so the tie between
    grant paperwork and the False Claims Act predates the certifications added in 2025 [1885].
  rule: Under 2 CFR 200.415(a) the official certifies that the report is true, complete and accurate and that the expenditures,
    disbursements and cash receipts are for the purposes set out in the award, and acknowledges that false, fictitious or
    fraudulent information may bring criminal, civil or administrative penalties under 18 U.S.C. 1001 and 31 U.S.C. 3729-3730
    and 3801-3812 [1885]. Under 200.415(b) a subrecipient makes a parallel certification to the pass-through entity when
    it applies for funds, requests payment and reports [1885]. Under 200.415(c) an indirect cost rate proposal is certified
    by an official no lower than vice president or chief financial officer; without it the agency may disallow indirect
    costs or set a rate itself [1885]. The eCFR's version record for part 200, read on 2026-10-04, gives October 1, 2024
    as the latest amendment date of the part; the only later issues are of 200.1, 200.405, Appendix VII and Appendix XII,
    each marked not substantive [2103].
