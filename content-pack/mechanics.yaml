- id: negotiated-rate-acceptance-rule
  name: Rule that agencies must accept a negotiated rate, and its exceptions
  what: 'A negotiated indirect cost rate binds every federal agency, not only the one that negotiated it [1802]. The rule
    has two exceptions: a statute or regulation that requires a different rate, and a deviation the awarding agency approves
    under a published procedure [1802]. The courts that set aside the 2025 rate caps relied on this rule [1854] [1853] [1855].'
  rule: 'Under 2 CFR 200.414(c)(1) negotiated indirect cost rates must be accepted by all federal agencies; an agency may
    use a different rate for a class of awards or a single award only when a federal statute or regulation requires it or
    when the awarding agency approves it under paragraph (c)(3) [1802]. The agency must notify OMB of any approved deviation,
    must make public the policies, procedures and decision criteria it follows for deviations, and must state its indirect
    cost policies in the notice of funding opportunity [1802]. Under 200.414(d) a pass-through entity must accept a subrecipient''s
    federally negotiated rate [1802]. For universities, Appendix III requires agencies to use the negotiated rates in effect
    at the time of the initial award throughout each competitive segment [1849]. Limits set by statute or regulation: HHS
    regulations limit indirect costs on training grants to 8% of modified total direct costs and allow foreign organisations
    an 8% rate [1884] [528]. Appropriations provisions: Section 224 of the Labor-HHS division of Public Law 119-75 keeps
    the indirect cost provisions of 45 CFR part 75, including approval of deviations from negotiated rates, applying to
    NIH as in the third quarter of fiscal year 2017 and bars spending to develop or implement a modified approach [1856].
    DOE describes section 313 of the fiscal year 2026 Energy and Water act as requiring it to apply 2 CFR 200.414, including
    approval of deviations, as in fiscal year 2024 [289]. Public Law 119-103 continues the fiscal year 2026 acts under their
    authority and conditions through December 11, 2026 [1480]. A second reading of 200.414(c) on the eCFR on 2026-10-04
    returned the same rule that negotiated rates must be accepted by all Federal agencies [1802]. Part IX of the preamble
    to OMB''s proposed rule states that OMB is not proposing updates to the indirect cost rate negotiation system through
    that document and may consider a request for information later [2093].'
