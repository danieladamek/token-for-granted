    value: no later than the end of the month following the month in which the subaward was issued
    cite:
    - 1908
  - label: executive compensation test
    value: 80 percent or more of annual gross revenue, and $25,000,000 or more, from federal contracts and awards
    cite:
    - 1908
  - label: exemption
    value: gross income under $300,000 in the previous tax year
    cite:
    - 1908
  - label: date FSRS.gov was retired
    value: March 8, 2025
    cite:
    - 1903
  applies_to: Prime recipients of federal financial assistance that make subawards; the person who reports needs a Data
    Entry role or a subaward reporting permission for the entity in SAM.gov [1904]. USDA's award terms point recipients
    to https://sam.gov/fsrs with the same threshold and deadline [1948].
