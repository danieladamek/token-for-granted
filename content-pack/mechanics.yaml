- id: pre-award-risk-review
  name: Pre-award risk review and specific conditions
  what: Before it makes an award a federal agency reviews the risk the applicant poses [1809]. The review can end in an
    award with extra conditions attached [1886]. The criteria the agency uses must be described in the funding announcement
    [1809].
  rule: 'Under 2 CFR 200.206(a) the agency checks eligibility and financial integrity information in OMB-designated databases,
    and reviews the non-public segment of SAM.gov where the Federal share is expected to exceed the simplified acquisition
    threshold over the period of performance [1809]. Under 200.206(b) the agency keeps written procedures for a risk assessment,
    which may consider financial stability, management systems and standards, history of performance, audit reports and
    findings, and the ability to implement requirements effectively [1809]. The assessment may be changed at any time during
    the period of performance [1809]. Under 200.206(d) awards, subawards and contracts with debarred, suspended or excluded
    parties are restricted under 2 CFR part 180 [1809]. Under 200.208 the agency or pass-through entity may impose specific
    conditions: payment by reimbursement instead of advance, withholding authority to proceed to the next phase, more detailed
    financial reports, additional monitoring, required technical or management assistance, or additional prior approvals
    [1886]. The agency must tell the recipient the nature of the condition, the reason, the action needed, the time allowed
    and how to ask for reconsideration, and must remove the condition promptly once it is satisfied [1886].'
  figures: []
  applies_to: Every applicant for a federal grant or cooperative agreement; a pass-through entity runs a parallel review
    of each subrecipient under 200.332 [1809] [1823].
