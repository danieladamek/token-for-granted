- id: grant-cooperative-agreement-contract
  name: Grant, cooperative agreement and procurement contract
  what: Federal law gives an agency three instruments for giving money to an outside body, and the choice follows from the
    purpose of the transaction [1851]. A grant agreement and a cooperative agreement both transfer something of value to
    carry out a public purpose that a law authorises; a procurement contract buys property or services for the Government's
    own direct benefit or use [1851]. The difference between a grant and a cooperative agreement is whether substantial
    involvement is expected between the agency and the recipient while the work is carried out [1851].
  rule: Under 31 U.S.C. 6304 an agency uses a grant agreement when the principal purpose is to transfer a thing of value
    for a public purpose of support or stimulation and substantial involvement is not expected; under 31 U.S.C. 6305 it
    uses a cooperative agreement on the same test when substantial involvement is expected; under 31 U.S.C. 6303 it uses
    a procurement contract when the principal purpose is to acquire property or services for the direct benefit or use of
    the Government [1851]. 2 CFR 200.201 requires the agency or pass-through entity to decide on the instrument under these
    sections [1807]. 2 CFR 200.1 defines both instruments in the same terms and adds that a pass-through entity may also
    be the substantially involved party in a cooperative agreement [1799]. The statute does not define "substantial involvement";
    Appendix I to Part 200 requires a notice for a cooperative agreement to describe the substantial involvement the agency
    expects [1848]. 31 U.S.C. 6307 lets the Director of OMB issue interpretative guidelines and exempt a transaction or
    programme [1851].
