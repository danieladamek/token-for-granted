- id: single-audit
  name: Single audit (2 CFR part 200, subpart F)
  what: A single audit is the audit a non-federal entity must have for any fiscal year in which its spending of federal
    awards reaches a set amount [1845]. The threshold in force is $1,000,000 in federal awards expended in the entity's
    fiscal year [1845]. The audit is filed with the Federal Audit Clearinghouse, which GSA runs [1846] [1881].
  rule: Under 2 CFR 200.501(a) and (b) a non-federal entity that expends $1,000,000 or more in federal awards during its
    fiscal year must have a single audit, or a programme-specific audit where it qualifies, for that year [1845]. Under
    200.501(e) an entity that expends less than $1,000,000 is exempt from federal audit requirements for that year, except
    as 200.503 provides [1845]. A programme-specific audit may be elected where the entity spends under only one federal
    programme, excluding research and development, and no financial statement audit is required [1845]. Money received as
    a subrecipient counts as federal awards expended; payments received as a contractor do not [1845]. Under 200.512 the
    audit, data collection form and reporting package are submitted electronically to the Federal Audit Clearinghouse within
    30 calendar days after the auditee receives the auditor's report or nine months after the end of the audit period, whichever
    is earlier [1846]. A pass-through entity must verify that each subrecipient is audited when the rule requires [1823].
    An auditee that meets the conditions in 200.520 for two audit periods is a low-risk auditee with reduced audit coverage
    [1847]. Audit reports and findings are among the factors in an agency's pre-award risk review [1809]. The eCFR text
    of 200.501 current to 10/01/2026 carries the same $1,000,000 threshold, and the same exemption below it, with the source
    note 89 FR 30136, April 22, 2024 [1940]. The eCFR's version record for part 200 lists no issue of 200.512 or 200.520
    after the amendment dated October 1, 2024 [2103]. The eCFR text of 200.512 current to 10/01/2026 has the same filing
    deadline [1939].
