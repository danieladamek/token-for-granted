- id: executive-order-14332-grant-oversight
  name: Executive Order 14332, Improving Oversight of Federal Grantmaking (August 7, 2025)
  what: Executive Order 14332 changes how federal agencies decide on and manage discretionary grants [246]. It puts a senior
    appointee's review ahead of every new funding announcement and discretionary award, sets principles those awards are
    to follow, and directs changes to the Uniform Guidance and to award terms on termination, indirect costs and drawdowns
    [246]. It was signed August 7, 2025 and published at 90 FR 38929 [246].
  rule: 'Scope: The order applies to discretionary grants, which it defines by reference to "discretionary award" in 2 CFR
    200.1; one fetch of the order returned that the term excludes entitlement, formula-based and disaster recovery awards
    [246]. Section 3: each agency head designates a senior appointee to review new funding opportunity announcements and
    discretionary grants for consistency with agency priorities and the national interest; the process includes subject-matter
    expert review for scientific research, pre-issuance review, interagency coordination, and a yearly review of discretionary
    awards [246]. Section 4: senior appointees use independent judgment and do not ministerially ratify or routinely defer
    to what others propose; awards are to demonstrably advance the President''s policy priorities; listed uses of funds
    are excluded; and, all else being equal, preference goes to institutions with lower indirect cost rates [246]. Section
    5: the OMB Director revises the Uniform Guidance to streamline application requirements, to clarify that discretionary
    grants permit termination for convenience, with listed exceptions, and to limit the use of discretionary grant funds
    for facilities and administrative costs [246]. Section 6: within 30 days each agency head reviews the agency''s standard
    grant terms and reports to OMB; agencies revise the terms of existing discretionary grants to permit immediate termination
    for convenience and add terms requiring written explanation for each drawdown [246]. Section 7: the order creates no
    enforceable rights and is to be implemented consistent with applicable law [246]. Implementation read in this sweep:
    DOE issued procedures for review of funding announcements on February 19, 2026 (Policy Flash 2026-33), with review of
    discretionary awards left to a later directive [314]. NIH''s award terms from October 1, 2025 state the priority-based
    termination ground [65]. OMB''s proposed rule of May 29, 2026 is the revision of the Uniform Guidance that section 5
    calls for; it has not been finalised and section 157 of Public Law 119-103 bars a final rule through December 11, 2026
    [1803] [1480]. The Uniform Guidance in force still requires agencies to accept negotiated indirect cost rates and limits
    termination to the four grounds in 200.340 [1802] [1801].'
