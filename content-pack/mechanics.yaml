- id: single-irb-requirement
  name: Single IRB for multi-site research
  what: 'When several United States institutions take part in one federally supported study, they rely on one institutional
    review board, not one each [1982]. Two requirements say this and they are separate: the Common Rule''s cooperative research
    provision and NIH''s own single IRB policy [1990].'
  rule: '45 CFR 46.114(b)(1): any institution located in the United States that is engaged in cooperative research must
    rely upon approval by a single IRB for the portion of the research conducted in the United States [1982]. The reviewing
    IRB is identified by the supporting federal agency or proposed by the lead institution [1982]. The exceptions are research
    for which law, including tribal law, requires more than single IRB review, and research for which the agency determines
    and documents that a single IRB is not appropriate [1982].'
  figures:
  - label: NIH single IRB policy applies to applications submitted on or after
    value: January 25, 2018
    cite:
    - 1990
  - label: Common Rule cooperative research provision applies to studies initially approved on or after
    value: January 20, 2020
    cite:
    - 1990
  applies_to: The NIH policy applies to multi-site non-exempt studies using the same protocol; the Common Rule provision
    reaches further, including K awards, F awards and Other Transaction awards [1990]. An NIH applicant does not submit
    a single IRB plan with the application; it names the single IRB of record at Just-in-Time and includes the costs in
    the budget [1990]. Since the end of the COVID-19 public health emergency NIH has no authority to approve exceptions
    to the Common Rule provision (NOT-OD-23-097) [1990].
