- id: minimum-distribution-requirement
  name: Minimum distribution requirement (the 5 percent payout)
  what: |
    A private non-operating foundation must pay out a minimum amount for charitable purposes each year [2375]. The amount starts from the minimum investment return, which is 5 percent of the value of the foundation's assets that are not used for its exempt purposes [2377]. A foundation that fails to pay out the distributable amount in time owes an excise tax under section 4942 [2375].
  rule: Internal Revenue Code section 4942 [2375]. The distributable amount equals the minimum investment return reduced
    by income taxes and the tax on investment income [2376]. The minimum investment return is 5 percent of the excess of
    the fair market value of assets not used or held for exempt purposes over the debt incurred to buy them [2377]. Private
    operating foundations are not subject to this tax [2371].
  figures:
  - label: minimum investment return
    value: 5 percent of the excess of the combined fair market value of non-exempt-use assets over acquisition indebtedness
    cite:
    - 2377
  - label: initial tax on undistributed income
    value: 30 percent
    cite:
    - 2375
  - label: additional tax if not corrected within 90 days of IRS notification
    value: 100 percent
    cite:
