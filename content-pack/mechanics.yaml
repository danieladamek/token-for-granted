- id: cost-sharing-uniform-guidance
  name: Cost sharing and matching under the Uniform Guidance
  what: Cost sharing, also called matching, is the part of project cost not paid by federal funds [1880]. Whether a programme
    requires it is stated in the funding notice, which must also say so when it is not required [1848]. For research grants
    the Uniform Guidance says voluntary committed cost sharing is not expected [1814].
  rule: Under 2 CFR 200.306(a) an agency may not use voluntary committed cost sharing as a factor in merit review of research
    proposals unless a statute or agency regulation authorises it and the notice says so [1814]. Under 200.306(b) a contribution
    counts as cost sharing only if it is verifiable in the recipient's records, is not counted for any other federal award,
    is necessary and reasonable, is allowable under subpart E, is not paid by the Federal Government under another award
    unless a statute allows it, is in the approved budget when the agency requires, and conforms to the rest of the part
    [1814]. Paragraphs (c) to (k) cover unrecovered indirect costs and the valuation and documentation of donated services,
    property and volunteer time [1814]. A fixed amount award may not be used in a programme that requires cost sharing [1807].
    A change in approved cost sharing needs prior approval [1815]. The eCFR page for 200.306 returned rate-limit errors
    twice on 2026-10-04 and was not re-read there; the eCFR's version record for part 200 gives October 1, 2024 as the latest
    amendment date of the part and lists no later issue of 200.306 [2103].
  figures: []
  applies_to: Any award whose statute, regulation or notice requires a non-federal share; the pack records programme-specific
    rules under ids such as nsf-cost-sharing, nifa-matching and nea-one-to-one-cost-share [1814].
