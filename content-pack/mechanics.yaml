- id: grants-termination-for-convenience
  name: Termination for convenience under Executive Order 14332
  what: 'Executive Order 14332 directs that discretionary grants permit termination for convenience, meaning termination
    at the Government''s choice, including when an award no longer advances agency priorities or the national interest [246].
    The order works through two channels: a revision of the Uniform Guidance by OMB, and new terms that agencies add to
    their awards [246]. On 2026-10-04 the first channel is a proposal that cannot be finalised before December 11, 2026,
    and the second depends on each agency''s terms [1480] [65].'
  rule: Section 5 of the order directs the OMB Director to revise the Uniform Guidance to clarify that discretionary grants
    permit termination for convenience [246]. Section 6 directs agencies to revise the terms of existing discretionary grants
    to permit immediate termination for convenience, and to require written explanation for each drawdown of funds [246].
    The rule in force, 2 CFR 200.340, has no ground called termination for convenience; its fourth ground allows termination
    under the award terms, including, to the extent authorised by law, where an award no longer effectuates programme goals
    or agency priorities, and requires every termination provision to be stated clearly and unambiguously in the award [1801].
    The District of Massachusetts declared on July 17, 2026 that this ground does not reach priorities adopted after the
    award was made [1869]. OMB's proposed rule would revise 200.340 to clarify termination of discretionary awards for discretionary
    reasons consistent with law [1803].
  figures: []
  applies_to: Discretionary awards whose terms include such a clause; what a particular award allows depends on its own
    terms and on any court order that covers the recipient [1801] [65].
  pending_changes:
  - status: frozen-by-appropriations
    date: '2026-09-02'
    text: The proposed revision of 200.340 cannot be issued or take effect through December 11, 2026 [1480].
  - status: in-litigation
    date: '2026-07-17'
    text: Declaratory judgment in New Jersey v. OMB on the meaning of 200.340(a)(4); appeal status not found [1869].
