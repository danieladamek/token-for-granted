- id: foundation-relationship-before-invitation
  name: How a relationship with a foundation begins, as the foundations describe it
  what: Invitation-only foundations say that an invitation follows from staff coming to know an organisation's work. A few
    name a first contact an outsider may make; most name none [2210] [2307] [2348].
  rule: 'Mellon: ''Our staff seek out and get to know innovative organizations, scholars, and creators before inviting them
    to submit a proposal'' [2210]. Surdna says its staff build long-term relationships with organisations and that an invitation
    to apply may follow [2307]. Knight says funding ''typically emerges through relationships, research and ongoing work''
    [2296]. Ford says its programme teams ''seek out people and organizations'', and takes ideas through a short online
    form that is not a proposal [2261] [2259]. Kresge takes introductions through its contact form and aims to answer within
    three business days [2348]. Woodruff asks for an informal email inquiry before an application [2313]. Yield Giving does
    not invite messages suggesting candidates [2317].'
