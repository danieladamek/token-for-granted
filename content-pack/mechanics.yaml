  what: A foundation does not pay a university's federally negotiated indirect-cost rate. Each sets its own limit, often
    a flat percentage of direct costs, sometimes nothing, and the limit can differ between programmes of one foundation
    [2120] [2133] [2194] [2195]. Some state the limit as a share of the whole award rather than of direct costs, and some
    exclude equipment, tuition or subcontracts from the base [2219] [2174] [2120] [2129].
  rule: 'The rule is whatever the foundation''s own policy or programme page says; there is no common rule [2129] [2156].
