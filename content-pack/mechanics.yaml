  what: FY 2026 SAMHSA notices are laid out in six steps (Review the Opportunity; Get Ready to Apply; Build Your Application;
    Learn About Review and Award; Submit Your Application; Learn What Happens After Award). Each notice refers to the FY
    2026 Application Guide, dated June 2026, for registration, format, budget, funding restrictions and standard terms.
    The project narratives in the notices read were limited to 10 or 15 pages [1112] [548] [1205].
