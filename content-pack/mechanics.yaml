- id: samhsa-fy2026-funding-restrictions
  name: SAMHSA FY 2026 funding restrictions
  what: The FY 2026 application guide lists what award funds may not pay for. The list includes syringes, pipes, drug test
    strips for people using drugs and other drug paraphernalia; overdose hotlines whose primary function is facilitating
    drug use; marijuana; promotional items; building purchase or construction; inpatient treatment; direct payments to individuals
    to enter treatment; housing other than sober or recovery housing; housing first policies as the guide describes them;
    firearms; and salaries above Executive Level II. Discretionary awards may not fund racial preferences, denial of the
    sex binary, illegal immigration, or other initiatives that compromise public safety. Minor alteration and renovation
    is allowed up to 25 percent of a budget period or $150,000, whichever is less [548] [1135].
