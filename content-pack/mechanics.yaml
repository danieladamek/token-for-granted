- id: nsf-funding-opportunity-types
  name: Programme description, programme announcement, solicitation, Dear Colleague Letter
  what: A programme description is a broad, general description of a programme that uses the PAPPG's generic eligibility
    and preparation rules [156]. A programme announcement is a formal NSF publication announcing a programme, also on the
    generic rules [156]. A programme solicitation is more focused, applies for a limited period, and is used when NSF departs
    from the generic rules — limiting who may submit or how many proposals, restricting indirect costs, requiring preliminary
    proposals, adding review criteria or requiring cost sharing [156] [158]. A Dear Colleague Letter gives information,
    clarifies policy, or announces interest in planning, RAPID, EAGER, RAISE or conference proposals or supplements on a
    topic [156] [158]. In August 2026 NSF called its twelve new solicitations Notices of Funding Opportunity [192].
  official_url: https://www.nsf.gov/policies/pappg/24-1/ch-1-pre-submission
  sources:
  - 156
  - 158
  - 192
  sweep: research-B
