- id: continuing-resolution-and-grants
  name: 'Continuing resolutions: what they mean for notices and awards'
  what: When a fiscal year starts without full-year appropriations, Congress may pass a continuing resolution that keeps
    agencies funded at a set rate for a limited time [1480]. Fiscal year 2027 began on October 1, 2026 under Public Law
    119-103, which continues the fiscal year 2026 acts through December 11, 2026 [1480] [83]. Under a continuing resolution
    agencies keep operating and keep making awards, with limits on how much and how fast [1480] [1874].
  rule: 'Section 101 of Public Law 119-103 provides amounts at the rate for operations in the fiscal year 2026 appropriations
    acts, under the authority and conditions of those acts [1480]. Section 104 bars using the funds to start or resume a
    project or activity for which funds were not available in fiscal year 2026 [1480]. Section 109 bars the complete distribution
    of a programme''s appropriation at the start of the year and says no grants shall be awarded for such programmes that
    would impinge on final funding prerogatives; section 110 requires the most limited funding action [1480]. The Senate
    committee summary describes section 109 as prohibiting agencies from spending money on grant programmes too quickly
    [1857]. OMB Circular A-11, section 123, apportions funds automatically at the rate for operations multiplied by the
    share of the year the resolution covers, and requires a new apportionment within 10 calendar days after a full-year
    act [1874]. Conditions in the prior year''s acts carry over: NIH states that all legislative mandates and fiscal policies
    in effect in fiscal year 2026 remain in effect, and that its institutes may issue non-competing awards below the level
    on the most recent Notice of Award [83]. Public Law 119-103 also bars a final rule from OMB''s proposed revision of
    the Uniform Guidance through December 11, 2026 [1480].'
  figures:
  - label: end date of the fiscal year 2027 continuing resolution
    value: December 11, 2026, or earlier enactment of the applicable appropriation
    cite:
    - 1480
