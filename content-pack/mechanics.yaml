- id: ffata-subaward-reporting
  name: Subaward and executive compensation reporting under the Transparency Act
  what: A recipient that makes subawards reports each one to the public record, under the Federal Funding Accountability
    and Transparency Act as carried into award terms by 2 CFR part 170 [1908]. Since March 8, 2025 the reports are made
    in SAM.gov, because FSRS.gov was retired on that date [1903] [1904]. The text of 2 CFR part 170 read on 2026-10-04 still
    names FSRS as the reporting site [1908].
  rule: The recipient reports each subaward that equals or exceeds $30,000 in federal funds, no later than the end of the
    month following the month in which the subaward was issued (2 CFR part 170, Appendix A, I(a)) [1908]. Executive compensation
    is reported, in the recipient's SAM.gov registration profile, where the entity received 80 percent or more of its annual
    gross revenue and $25,000,000 or more from federal contracts and awards [1908]. A recipient with gross income under
    $300,000 in the previous tax year is exempt from subaward reporting [1908].
