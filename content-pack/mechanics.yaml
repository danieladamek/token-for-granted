- id: foundation-indirect-cost-policies
  name: Foundation indirect cost policies
  what: Each foundation sets its own rule for overhead on a project grant, and the rules read here differ in kind. Some
    set a ceiling, some a floor, one a single flat rate, and one no rate at all [2257] [2332] [2265] [2280].
  rule: Gates caps indirect costs by type of organisation, on budgeted total direct costs [2257]. Ford sets a minimum of
    25 percent on project grants and accepts a rate documented by a federal negotiated agreement, another funder or the
    grantee's own calculation [2332]. MacArthur adds a flat 29 percent to project costs [2265]. Packard pays a tiered minimum
    by the grantee's budget size [2341]. The Commonwealth Fund allows up to 20 percent of total direct costs, leaving consultants,
    contractors and sub-awards out of the base [2361]. Hewlett uses no fixed rate and expects the budget to show actual
    indirect costs [2280]. RWJF's rate varies by type of organisation [2336]. The rates do not apply to general operating
    support [2332] [2265].
