- id: internal-controls
  name: Internal controls
  what: Internal controls are the processes that give reasonable assurance that an award is managed in compliance with federal
    statutes, regulations and the award terms [1812]. 2 CFR 200.303 makes them a duty of every recipient and subrecipient
    [1812].
  rule: 2 CFR 200.303 requires a recipient or subrecipient to establish, document and maintain effective internal control
    over the award; to comply with the Constitution, federal statutes, regulations and the award terms; to evaluate and
    monitor its own compliance; to take prompt action when noncompliance is identified; and to take reasonable cybersecurity
    and other measures to safeguard information, including protected personally identifiable information [1812]. The eCFR's
    version record for part 200, read on 2026-10-04, gives October 1, 2024 as the latest amendment date of the part; the
    only later issues are of 200.1, 200.405, Appendix VII and Appendix XII, each marked not substantive [2103].
