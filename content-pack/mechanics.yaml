- id: audit-below-single-audit-threshold
  name: Audit requirement below the single-audit threshold
  what: 'An organisation that spends less than the single-audit threshold in federal awards in its fiscal year is exempt
    from federal audit requirements for that year [2069]. An agency may still ask for financial statements before a first
    award: NSF asks prospective new awardees for audited financial statements from the previous two years [2072].'
  rule: '2 CFR 200.501: a non-federal entity that expends $1,000,000 or more in federal awards during its fiscal year must
    have a single or programme-specific audit; one that expends less is exempt, but its records must be available for review
    or audit by the federal agency, the pass-through entity and the Government Accountability Office [2069].'
