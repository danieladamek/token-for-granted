- id: period-of-performance-and-pre-award-costs
  name: Period of performance, budget period and pre-award costs
  what: The period of performance is the time between the start and end date of an award, and it may contain one or more
    budget periods [1799]. A budget period is the funded portion during which the recipient is authorised to incur financial
    obligations [1799]. Both pairs of dates are printed in the award document [1810]. Costs incurred before the start date
    are pre-award costs and are allowable only on the terms below [1843].
  rule: Under 2 CFR 200.403(h) costs must be incurred during the approved budget period, except administrative closeout
    costs, which may be incurred until the due date of the final reports [1831]. Under 200.458 pre-award costs are those
    incurred before the start date directly pursuant to the negotiation and in anticipation of the award, where necessary
    for efficient and timely performance; they are allowable only to the extent they would have been allowable after the
    start date and only with the agency's written approval [1843]. Under 200.308 an agency may waive that approval so that
    a recipient may incur project costs up to 90 calendar days before the award date, may let a recipient start a one-time
    extension of the period of performance of up to 12 months on notice at least 10 calendar days before the period ends,
    and may let unobligated balances be carried forward to later budget periods [1815]. Under 200.309 an extension moves
    the end date, a termination ends the period on its effective date, and a renewal award begins a new and distinct period
    of performance [1816]. A funding notice must tell applicants that work begun before the award is at the applicant's
    own risk [1848]. The eCFR's version record for part 200, read on 2026-10-04, gives October 1, 2024 as the latest amendment
    date of the part; the only later issues are of 200.1, 200.405, Appendix VII and Appendix XII, each marked not substantive
    [2103]. The eCFR text of 200.308 current to 10/01/2026 has the same 90-day pre-award period and the same one-time extension
    of up to 12 months [2118].
