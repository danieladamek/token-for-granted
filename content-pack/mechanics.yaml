- id: senior-appointee-review
  name: Senior appointee review of funding announcements and awards
  what: Since Executive Order 14332 a senior appointee in each agency reviews new funding opportunity announcements and
    discretionary grants before they issue [246]. The review sits on top of merit or peer review and checks consistency
    with agency priorities and the national interest [246].
  rule: Section 3 of the order requires each agency head to designate a senior appointee to run the review; the order defines
    a senior appointee as an individual appointed by the President, a non-career member of the Senior Executive Service,
    or an employee in a Senior Level, Scientific and Professional, or Grade 15 position in Schedule C of the excepted service
    [246]. The process must include the appointee's approval of announcements, review by subject-matter experts for scientific
    research, review before awards issue, and coordination between agencies to remove duplication [246]. The appointee also
    reviews discretionary awards each year for consistency with agency priorities and substantial progress [246]. Section
    4 says appointees are not to ministerially ratify or routinely defer to what others propose [246]. DOE's implementing
    procedures of February 19, 2026 cover funding announcements only [314].
  figures: []
  applies_to: Discretionary funding announcements and awards at every executive agency [246].
  pending_changes:
  - status: proposed
    date: '2026-05-29'
    text: OMB's proposed rule lists a revised 200.205 on agency review of the merit of proposals; an association summary
      says it would write senior appointee review of each notice into the regulation and describe peer review as advisory
      [1458] [1878].
  - status: proposed
    date: '2026-09-22'
    text: The chair of the Senate Appropriations Committee wrote to the OMB and NIH Directors on September 22, 2026 about
      an executive order reported to be in preparation that would add a review of NIH grant applications after merit review;
      no such order was found in this sweep [1892].
  - status: proposed
    date: '2026-05-29'
    text: 'Read in the Federal Register text of OMB''s proposal: proposed 200.205 would establish a pre-issuance review,
      described as consistent with Executive Order 14332, in which senior appointees review proposals selected for funding
      against applicable law, agency priorities and the national interest; the review must be described in the notice of
      funding opportunity and may form the basis of a decision not to select an applicant; peer review remains advisory
      [2092] [2093] [2104].'
  official_url: https://www.federalregister.gov/documents/2025/08/12/2025-15344/improving-oversight-of-federal-grantmaking
  as_of: '2026-10-04'
