- id: nsf-data-management-sharing-plan
  name: NSF Data Management and Sharing Plan (DMSP)
  what: NSF proposals carry a Data Management and Sharing Plan that describes how the project will meet NSF's policy on
    dissemination and sharing of research results [150]. Guidance on its content varies by directorate [2032].
  rule: Under Supplement 2 to PAPPG 24-1, issued and effective January 22, 2026, the plan is created with a tool in Research.gov
    from April 27, 2026, replacing a document of no more than two pages; proposals submitted before that date upload a PDF
    [150]. Recipients share all data supporting NSF-funded publications at the time of publication, and any exception is
    described and justified in the plan [150]. A change to the plan that changes the objectives or scope needs the programme
    officer's prior written approval [150].
