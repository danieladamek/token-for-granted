- id: award-closeout
  name: Closeout
  what: Closeout is the process by which the agency or pass-through entity determines that the administrative work of an
    award is complete [1830]. It follows the end of the period of performance, including an end brought about by termination
    [1801] [1816].
  rule: Under 2 CFR 200.344 a recipient must submit all financial, performance and other reports, and liquidate all financial
    obligations, no later than 120 calendar days after the end of the period of performance; a subrecipient has 90 calendar
    days [1830]. Funds paid and not authorised to be retained must be refunded promptly [1830]. The agency must make every
    effort to complete closeout actions no later than one year after the end of the period of performance [1830]. Where
    a recipient does not comply, the agency must report the material failure in SAM.gov [1830]. Administrative closeout
    costs may be incurred until the due date of the final reports [1831]. After a termination both parties remain responsible
    for closeout under 200.344 and for later adjustments under 200.345 [1801]. The eCFR page for 200.344 returned server
    errors twice on 2026-10-04 and was not re-read there; the eCFR's version record for part 200 gives October 1, 2024 as
    the latest amendment date of the part and lists no later issue of 200.344 [2103].
