- id: financial-management-standards
  name: Financial management standards for recipients
  what: A recipient's accounting system has to be able to show, award by award, what federal money came in and how it was
    spent [1811]. The standard is in 2 CFR 200.302, and the payment rules that go with it are in 200.305 [1811] [1813].
  rule: '2 CFR 200.302(b) requires a system that provides: identification of every federal award received and expended and
    its programme; accurate, current and complete disclosure of financial results; records that identify the amount, source
    and expenditure of federal funds; effective control over and accountability for all funds, property and assets; comparison
    of expenditures with budget amounts; written procedures to implement the payment rules in 200.305; and written procedures
    for determining the allowability of costs [1811]. States account for awards under their own laws and procedures [1811].
    Under 200.305 advance payments are limited to the minimum amounts needed and timed to actual, immediate cash requirements;
    where payment is by reimbursement the agency or pass-through entity pays within 30 calendar days of receiving the request
    [1813]. Advances are kept in interest-bearing accounts unless the recipient receives less than $250,000 in federal funding
    a year or the account would not be expected to earn more than $500 a year, and up to $500 a year of interest may be
    kept for administrative expenses [1813]. The eCFR''s version record for part 200, read on 2026-10-04, gives October
    1, 2024 as the latest amendment date of the part; the only later issues are of 200.1, 200.405, Appendix VII and Appendix
    XII, each marked not substantive [2103].'
