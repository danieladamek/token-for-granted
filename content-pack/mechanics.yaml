  - label: House position on July 17, 2026
    value: twelve bills through full committee; three passed the House
    cite:
    - 1876
  applies_to: Every programme funded by annual appropriations; award amounts and new competitions for fiscal year 2027 depend
    on acts not yet enacted [1480].
