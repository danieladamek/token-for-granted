  name: Merit review
  what: Review against Intellectual Merit and Broader Impacts, with five elements considered under each; reviewers are ad
    hoc, panel or both, and since December 8, 2025 at least two reviewers, who may be NSF staff, are required [157] [149].
    The National Science Board recommended in 2025 pursuing a rename of Broader Impacts to Societal Benefits [271].
