- id: irs-990-e-file-data
  name: What the IRS e-file data for Form 990 series returns covers
  what: |
    The IRS publishes electronically filed Form 990 series returns as XML files for bulk download, by year and month, each year with an index file [2397]. On 2026-10-04 the page listed downloads for 2019 through 2026 [2397]. A 2025 Form 990-PF must be filed electronically [2388].
  rule: The download page describes its contents as "all the most recent 990 Series filings on record in XML formats" [2397].
    The Tax Exempt Organization Search page carries the notice "We are still processing paper-filed 990 series received
    2021 and later" [2059].
  figures:
  - label: years listed for download on 2026-10-04
    value: 2019 through 2026
    cite:
    - 2397
  - label: page last reviewed or updated
    value: 18-Sep-2026
    cite:
    - 2397
  - label: Form 990-PF Part XIV in the XML (added by slice D)
    value: element SupplementaryInformationGrp
    cite:
    - 2480
  - label: preselected-only check box, Part XIV line 2 (added by slice D)
    value: OnlyContriToPreselectedInd; value "X" when checked
    cite:
    - 2481
  - label: application information, Part XIV lines 2a to 2d (added by slice D)
    value: 'ApplicationSubmissionInfoGrp: RecipientPersonNm, RecipientUSAddress, RecipientPhoneNum, FormAndInfoAndMaterialsTxt,
      SubmissionDeadlinesTxt, RestrictionsOnAwardsTxt'
    cite:
    - 2480
  - label: each grant paid during the year, Part XIV line 3a (added by slice D)
    value: 'one GrantOrContributionPdDurYrGrp per grant: RecipientBusinessName/BusinessNameLine1Txt, RecipientUSAddress,
      RecipientRelationshipTxt, RecipientFoundationStatusTxt, GrantOrContributionPurposeTxt, Amt'
    cite:
    - 2480
  - label: totals, Part XIV lines 3a and 3b (added by slice D)
    value: TotalGrantOrContriPdDurYrAmt and TotalGrantOrContriApprvFutAmt; grants approved for future payment are in GrantOrContriApprvForFutGrp
    cite:
    - 2480
  - label: grants paid and total charitable disbursements, Part I lines 25 and 26 (added by slice D)
    value: ContriPaidRevAndExpnssAmt and ContriPaidDsbrsChrtblAmt (line 25, columns a and d); TotalExpensesRevAndExpnssAmt
      and TotalExpensesDsbrsChrtblAmt (line 26, columns a and d)
    cite:
    - 2480
  - label: assets (added by slice D)
    value: FMVAssetsEOYAmt (page 1, item I); TotalAssetsEOYAmt and TotalAssetsEOYFMVAmt (Part II, line 16)
    cite:
    - 2480
  - label: schema version of the two returns read (added by slice D)
    value: 2024v5.2, tax year 2024
    cite:
    - 2480
    - 2481
  - label: GivingTuesday data marts for Form 990-PF (added by slice D)
    value: '"990PF Basic Fields" (one row per return; includes SUINONCOTOPR for the line 2 check box, ARECPREXPNSS and ARECGPDCPRPS
      for Part I line 25, ASSEOYOYY for fair market value of assets), "990PF Current Grants" (one row per grant paid: SIGOCPYRBNBN1
      name, SIGOCPYRFSTA foundation status, SIGOCPYPOGOC purpose, SIGOCPYAMOUN amount) and "990PF Future Grants"'
    cite:
    - 2477
    - 2475
    - 2476
  applies_to: 'Returns filed electronically [2397]. The page read does not say which line items of Form 990-PF the XML carries,
    or how long after filing a return appears [2397]. Added by slice D: two e-filed Forms 990-PF for tax year 2024 were
    read as XML, and they carry Part XIV in full: the preselected-only check box, the application contact, form, deadlines
    and restrictions, and one group for each grant with recipient, recipient status, purpose and amount [2480] [2481]. The
    IRS publishes the schemas for the Form 990 family by tax year (2023 to 2026 on 2026-10-04); its index page names no
    elements [2472].'
  second_host: Added by slice D. GivingTuesday's 990 Data Infrastructure project keeps a copy of the e-filed returns, which
    it calls the 990 Data Lake, and cuts tables from them, which it calls data marts [2473] [2474]. The raw files are in
    the Amazon S3 bucket "gt990datalake-rawdata", with XML returns under "EfileData/XmlFiles" and indices under "Indices/990xmls"
    [2478]. The access page says a free Amazon Web Services account is required and that users are not charged for using
    the lake [2478]. The licence page names the Open Database License 1.0 and the Database Contents License 1.0 [2479].
    Its data dictionary lists the columns of each mart against the form part and line they come from [2474] [2475]. In the
    grants mart each row carries the EIN, the tax year and the address of the underlying XML file [2475].
