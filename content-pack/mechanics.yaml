- id: nonprofit-indirect-cost-rate-negotiation
  name: Where a non-profit gets an indirect cost rate
  what: 'A non-profit with no negotiated indirect cost rate has two routes: charge the de minimis rate, which needs no negotiation,
    or negotiate a rate with its cognizant federal agency [2070] [2071].'
  rule: '2 CFR 200.414(f): a recipient without a current negotiated rate may elect a de minimis rate of up to 15 percent
    of modified total direct costs, without documentation, and may use it indefinitely [2070]. Appendix IV to part 200,
    section C.2.a: the cognizant agency for a non-profit is the federal agency with the largest dollar value of federal
    awards directly funded to it, unless agencies agree otherwise, and the assignment changes only after a shift in dollar
    volume lasting at least three years [2071]. An organisation without established rates sends its first indirect cost
    proposal no later than three months after the effective date of the award, and a new proposal within six months after
    the close of each fiscal year [2071].'
  figures:
  - label: de minimis rate
    value: up to 15 percent of modified total direct costs
    cite:
    - 2070
  - label: first indirect cost proposal due
    value: no later than three months after the effective date of the Federal award
    cite:
    - 2071
  - label: later proposals due
    value: within six months after the close of each fiscal year
    cite:
    - 2071
  - label: one-time extension of a current negotiated rate
    value: up to four years
    cite:
    - 2070
  applies_to: 'Non-profit organisations receiving federal awards directly [2071]. The offices that negotiate: where HHS
    is cognizant, Cost Allocation Services in the HHS Program Support Center, through the Indirect Cost Allocation System
    portal [1860]; the Interior Business Center''s Indirect Cost Services, for Interior and as a shared service for other
    cognizant agencies [2073]; and at NSF the Cost Analysis and Pre-Award Branch, for about 100 organisations [163]. NSF
    does not negotiate rates for subrecipients or foreign organisations [163].'
