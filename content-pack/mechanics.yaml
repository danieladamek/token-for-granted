- id: lapse-in-appropriations-and-grants
  name: 'Lapse in appropriations (shutdown): what it means for notices and awards'
  what: 'A lapse in appropriations occurs when neither a full-year act nor a continuing resolution is in force [1875]. The
    Antideficiency Act then bars an agency from incurring obligations, with limited exceptions, so an agency in a lapse
    does not process new awards; at NIH extramural staff and help desks are unavailable [1875] [1872]. Money already awarded
    is a different matter: at NIH, work under active awards may continue [1872].'
  rule: 'OMB Circular A-11, section 124, directs agencies to carry out an orderly shutdown under their plans and lists the
    excepted functions: those authorised by statute or court order, those necessarily implied by law, and those needed for
    the safety of human life or protection of property [1875]. The section as read gives no specific rule for grants; each
    agency publishes its own guidance [1875]. NIH''s guidance for the lapse that began January 31, 2026: work under active
    awards may continue; recipients may draw funds through the Payment Management System unless a restriction applies; applications
    are still submitted through Grants.gov by the original due dates and are reviewed after operations resume; no awards
    are processed; peer review and council meetings do not take place; prior approval requests are not reviewed; progress
    reports are still due on time; staff and help desks are unavailable [1872]. After the lapse that began October 1, 2025
    NIH accepted applications for due dates between October 1 and December 5, 2025 through December 8, 2025, and reported
    cancelling over 370 peer review meetings affecting over 24,000 applications [1889]. Under Circular A-11, section 123,
    funding provided by a continuing resolution and not obligated is not available once appropriations lapse [1874].'
  figures:
  - label: lapses recorded by NIH in fiscal year 2026
    value: beginning October 1, 2025 and beginning January 31, 2026
    cite:
    - 1873
    - 1872
  - label: NIH peer review meetings cancelled in the October 2025 lapse
    value: over 370, affecting over 24,000 applications
    cite:
    - 1889
  applies_to: Applicants to and recipients from any agency whose appropriation has lapsed; the practice above is NIH's,
    and other agencies' guidance was not read in this sweep [1872].
