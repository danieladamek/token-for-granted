- id: de-minimis-indirect-rate
  name: De minimis indirect cost rate
  what: The de minimis rate lets an organisation with no current federally negotiated rate charge indirect costs at a flat
    percentage without negotiating [1802]. The rate in force is up to 15 percent of modified total direct costs [1802].
    This 15 percent is an option for organisations that have no negotiated rate; it is a different thing from the 15 percent
    caps that four agencies tried to place on negotiated rates in 2025 [1802] [24].
  rule: Under 2 CFR 200.414(f) a recipient or subrecipient that does not have a current federal negotiated indirect cost
    rate may elect a de minimis rate of up to 15 percent of modified total direct costs; no documentation is needed to justify
    it, and it may be used indefinitely [1802]. A pass-through entity may not require a subrecipient that has a federally
    negotiated rate to use the de minimis rate instead [1823]. The award document states the indirect cost rate, including
    whether the de minimis rate is charged [1810]. NSF states that recipients may elect the 15% rate for any award executed
    on or after October 1, 2024 and that the rate must be applied consistently across all of an organisation's federal awards
    [163]. HHS states the de minimis rate as 15% of modified total direct costs [528]. A second reading of 200.414 on the
    eCFR on 2026-10-04, in the text current to 10/01/2026, returned the same rate of up to 15 percent of modified total
    direct costs in paragraph (f) [1802]. OMB's proposed rule would have each award show the indirect cost rate, including
    whether the de minimis rate is charged under 200.414 [2104].
  figures:
  - label: de minimis rate
    value: up to 15 percent of modified total direct costs
    cite:
    - 1802
    - 1802
  - label: date from which the 15 percent rate applies, as NSF states it
    value: awards executed on or after October 1, 2024
    cite:
    - 163
  applies_to: Recipients and subrecipients without a current federal negotiated rate, which includes many small non-profits
    [1802]. A programme whose statute or notice sets a lower limit, such as the 8 percent HHS limit on training grants,
    is governed by that limit [1884].
  pending_changes: []
  official_url: https://www.ecfr.gov/current/title-2/section-200.414
  as_of: '2026-10-04'
