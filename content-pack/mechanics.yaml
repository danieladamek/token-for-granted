- id: remedies-for-noncompliance
  name: Remedies for noncompliance
  what: When a recipient fails to comply with the Constitution, a federal statute or regulation, or the award terms, the
    agency or pass-through entity has a graded set of remedies short of and including termination [1826]. The first step
    is specific conditions under 200.208 [1826] [1886].
  rule: 'Under 2 CFR 200.339 the agency or pass-through entity may impose specific conditions, and where noncompliance cannot
    be remedied that way it may: temporarily withhold payments until corrective action is taken; disallow costs for all
    or part of the activity; suspend or terminate the award in part or in its entirety; initiate suspension or debarment
    proceedings under 2 CFR part 180; withhold further federal funds, whether new awards or continuation funding, for the
    project or programme; or pursue other legally available remedies [1826]. Under 200.342, on initiating a remedy the agency
    must give the recipient an opportunity to object and to provide information challenging the action [1828]. Under 200.343
    costs from obligations incurred during a suspension or after termination are unallowable unless expressly authorised,
    except obligations properly incurred before the effective date and not in anticipation of it [1829]. The eCFR''s version
    record for part 200, read on 2026-10-04, gives October 1, 2024 as the latest amendment date of the part; the only later
    issues are of 200.1, 200.405, Appendix VII and Appendix XII, each marked not substantive [2103].'
