- id: foundation-letter-of-inquiry
  name: Letters of inquiry and phased foundation applications
  what: 'Most foundations that take requests from outside do so in two steps. The first is short: a letter of inquiry (LOI),
    also called a letter of intent, concept note, pre-proposal, expression of interest or online funding inquiry. The foundation
    reads it and invites a full proposal from some applicants; a full proposal sent without an invitation is not read [2124]
    [2216] [2154] [2219].'
  rule: 'Form, length, deadline and reply time are set by each foundation [2124] [2155] [2201]. At some foundations the
    first step can itself win a small grant: the William T. Grant Foundation awards its Officers'' research grants "on the
    merit of the letter of inquiry alone" [2207]. At others the door is narrower than a letter: the Moore Foundation accepts
    only "a brief, ~100-word email", and several foundations take no unsolicited approach at all [2128] [2184] [2138].'
