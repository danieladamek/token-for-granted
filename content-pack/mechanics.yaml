- id: negotiated-indirect-cost-rate
  name: Negotiated indirect cost rate agreement (NICRA)
  what: A negotiated indirect cost rate agreement records the rate, or rates, that one federal agency has negotiated with
    an organisation on behalf of all federal agencies [1799]. The agency that negotiates is the organisation's cognizant
    agency for indirect costs [1799]. Once a rate is negotiated every federal agency must accept it, with the exceptions
    in negotiated-rate-acceptance-rule [1802].
  rule: 'Who negotiates: For an institution of higher education the cognizant agency is HHS or the Department of Defense''s
    Office of Naval Research, normally whichever of the two provided more funds directly to the institution over the most
    recent three years, and the assignment lasts five years [1849]. For a non-profit it is the federal agency with the largest
    dollar value of awards made directly to the organisation [1850]. HHS negotiates through Cost Allocation Services, which
    handles colleges and universities, non-profits, hospitals and state and local governments; ONR negotiates for the domestic
    universities and non-profits for which it has cognizance; NSF''s Cost Analysis and Pre-Award Branch negotiates for about
    100 organisations [1860] [1861] [163]. What is submitted and when: A non-profit with no established rate submits its
    first indirect cost proposal immediately after it is told an award will be made and no later than three months after
    the effective date of the award; an organisation with an established rate submits a new proposal within six months after
    the close of each fiscal year [1850]. Universities use the standard format in Appendix III, and those with no more than
    $10 million a year in covered direct costs may use a simplified method [1849]. HHS takes all proposals through its Indirect
    Cost Allocation System portal [1860]. The proposal is certified by an official no lower than vice president or chief
    financial officer [1885]. How long a rate lasts: The appendices define predetermined, fixed, provisional and final rates;
    a predetermined rate at a university may cover two to four years [1849] [1850]. An organisation with a current negotiated
    rate may ask once for an extension of up to four years, subject to the cognizant agency''s approval, and must then renegotiate
    [1802]. For a university award, the rates in effect at the time of the initial award apply for the life of each competitive
    segment [1849].'
  figures:
  - label: cognizance period for a university
    value: five years
    cite:
    - 1849
  - label: first proposal from a non-profit
    value: no later than three months after the effective date of the Federal award
    cite:
    - 1850
  - label: later proposals
    value: within six months after the close of each fiscal year
    cite:
    - 1850
  - label: one-time extension of a negotiated rate
    value: up to four years
    cite:
    - 1802
    - 1802
  - label: simplified method for small institutions
    value: total direct cost of covered work not above $10 million in a fiscal year
    cite:
    - 1849
  applies_to: Organisations that receive federal awards directly; a subrecipient with no federal rate may negotiate one
    with its pass-through entity or use the de minimis rate [1823]. ONR does not negotiate rates for foreign entities [1861].
