- id: research-misconduct-rule
  name: PHS research misconduct rule (42 CFR part 93) and its 2025-2026 dates
  what: 42 CFR part 93 sets how institutions that receive Public Health Service research support handle allegations of fabrication,
    falsification or plagiarism [2006]. HHS revised the whole part by a final rule published September 17, 2024 at 89 FR
    76280 [2008].
  rule: The final rule was effective January 1, 2025, and all of its requirements apply on or after January 1, 2026 [2008].
    Institutions follow the revised part for allegations received on or after January 1, 2026 and implement the required
    policies and procedures by the due date of the annual report covering the 2025 reporting year [2006]. ORI takes annual
    reports between January 1 and April 30 [2009].
