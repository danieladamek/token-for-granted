- id: cost-principles
  name: 'Cost principles: allowable, reasonable, allocable'
  what: The cost principles in subpart E of the Uniform Guidance decide what an award may pay for [1831]. A cost charged
    to an award has to be allowable, and to be allowable it has to be reasonable and allocable, among other tests [1831].
    Subpart E then gives rules for named items of cost, of which a few are outlined here [1834].
  rule: 'Under 2 CFR 200.403 a cost must be necessary and reasonable and allocable to the award; conform to limits in the
    principles or the award; be consistent with policies the organisation applies to its non-federal activities; be treated
    consistently as direct or indirect; follow generally accepted accounting principles; not be used as cost sharing for
    another federal programme; be adequately documented; and be incurred in the approved budget period [1831]. Under 200.404
    a cost is reasonable if it does not exceed what a prudent person would incur in the circumstances when the decision
    was made [1832]. Under 200.405 a cost is allocable to an award according to the relative benefits received, and a cost
    allocable to one federal award may not be moved to another to overcome a funding shortfall [1833]. Under 200.413 direct
    costs are those identified specifically with a final cost objective such as an award; salaries of administrative and
    clerical staff may be charged directly only if the services are integral to the award, the individuals can be specifically
    identified with it, and the costs are not also recovered as indirect costs [1835]. Selected items: compensation (200.430)
    is allowable when reasonable, consistent with the organisation''s policy and supported by records that reflect the work
    performed, and budget estimates alone do not qualify as support [1837]; alcoholic beverages are unallowable (200.423)
    [1836]; entertainment is unallowable unless it has a specific and direct programmatic purpose and is in the award (200.438)
    [1838]; equipment and other capital expenditures are unallowable as indirect costs, and special purpose equipment with
    a unit cost of $10,000 or more needs prior written approval (200.439) [1839]; organised fundraising is unallowable (200.442)
    [1840]; lobbying costs are unallowable, with further restrictions for non-profits and institutions of higher education
    (200.450) [1841]; participant support costs are allowable and are left out of the indirect cost base (200.456, 200.1)
    [1842] [1799]; travel is allowable within the organisation''s written policy, and airfare above the least expensive
    unrestricted class is unallowable with five exceptions (200.475) [1844]. The eCFR''s version record for part 200, read
    on 2026-10-04, gives October 1, 2024 as the latest amendment date of the part; the only later issues are of 200.1, 200.405,
    Appendix VII and Appendix XII, each marked not substantive [2103].'
