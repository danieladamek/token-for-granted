- id: hrsa-programme-grants-process
  name: How HRSA posts, reviews and decides programme grants
  what: HRSA lists open and closed opportunities on its find-funding page and posts notices and forecasts on Grants.gov;
    on 2026-10-04 a Grants.gov search for HRSA returned 50 opportunities, one open and the rest forecasts posted between
    July and September 2026. The Bureau of Primary Health Care lists supplemental and continuation funding for existing
