- id: fy2027-appropriations-status
  name: Status of fiscal year 2027 appropriations on 2026-10-04
  what: On 2026-10-04 the Government is funded by a continuing resolution, Public Law 119-103, approved September 2, 2026,
    which runs until December 11, 2026 or the earlier enactment of a fiscal year 2027 appropriation [1480]. NIH's notice
    of September 28, 2026 states that it operates under that resolution at the fiscal year 2026 enacted level [83]. No enacted
    fiscal year 2027 appropriations act was found in this sweep [1873].
  rule: Public Law 119-103 continues the twelve fiscal year 2026 appropriations acts, which it lists as divisions of Public
    Laws 119-37, 119-74 and 119-75 and Public Law 119-86 [1480]. The House Appropriations Committee majority stated on July
    17, 2026 that all twelve fiscal year 2027 bills had advanced through full committee and three had passed the House [1876].
    The Senate Appropriations Committee majority's release list, read to September 24, 2026, shows the continuing resolution
    and no release on committee or floor action on the twelve regular bills in the part read [1893]. A status table for
    the two chambers on 2026-10-04 could not be read because congress.gov refuses automated reading [1893].
  figures:
