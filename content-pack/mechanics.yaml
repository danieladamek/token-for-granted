- id: simpler-grants-gov-transition
  name: The move from Grants.gov to Simpler.Grants.gov
  what: Simpler.Grants.gov is the site on which HHS is building the next generation of Grants.gov [1967]. On 2026-10-04
    its search is the default search for opportunities, and its home page says a user may need to visit Grants.gov to apply
    for most opportunities [1920] [1967]. Sign-in is through Login.gov [1967].
  rule: 'The roadmap gives three stages: ''Early 2026'', with Simpler Search as the default and a simpler application workflow
    tested with partner agencies; ''Mid-2026'', with new budget forms piloted and support scaled for all agencies; and ''2027'',
    when Simpler.Grants.gov replaces legacy Grants.gov and becomes the default experience [1919]. What is already delivered:
    Login.gov sign-in (early 2025), an end-to-end application pilot (mid-2025), two opportunities open for application through
    the site and a repository of 15 forms (late 2025), default search (December 23, 2025), and saving opportunities to an
    organisation (May 18, 2026) [1919] [1920].'
