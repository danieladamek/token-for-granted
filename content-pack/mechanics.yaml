- id: uniform-guidance-2-cfr-200
  name: The Uniform Guidance (2 CFR part 200)
  what: The Uniform Guidance is the government-wide set of administrative requirements, cost principles and audit requirements
    for federal awards, issued by the Office of Management and Budget as 2 CFR part 200 [1799] [1805]. The text in force
    on 2026-10-04 is the revision published April 22, 2024 at 89 FR 30046, effective October 1, 2024 [1883] [1801]. A proposed
    replacement was published May 29, 2026 and, under section 157 of Public Law 119-103, may not be issued or take effect
    through December 11, 2026 [1458] [1480].
  rule: 'Subpart A holds definitions and subpart B general provisions; both apply to all federal financial assistance [1805].
    Subparts C (pre-award) and D (post-award) apply to grants and cooperative agreements; subpart E (cost principles) applies
    to them except fixed amount awards and certain other cases; subpart F (audit) applies to grants and cooperative agreements,
    cost-type contracts and other assistance under the Single Audit Act [1805]. The part binds federal agencies that make
    awards and, through the award terms, recipients and subrecipients; the terms flow down to subawards unless a section
    or the award says otherwise [1805]. A federal statute or regulation governs where it conflicts with the part [1805].
    An agency may apply subparts A to E to for-profit organisations, foreign public entities and foreign organisations where
    its regulations or a statute allow [1805]. Under 200.110 the standards take effect once implemented by federal agencies
    or when an amendment becomes final [1806]. Each agency adopts the part in its own chapter of 2 CFR; HHS, for example,
    adopts it at 2 CFR 300.106 with additions, and applied it from October 1, 2025 in place of 45 CFR part 75 [1884] [528]
    [65]. In the text "must" marks a requirement and "should" or "may" a discretionary matter [1805]. Checked on 2026-10-04:
    the eCFR showed title 2 as up to date as of 10/01/2026 and last amended 8/17/2026 [2102] [1940]. The eCFR''s version
    record for part 200 gives October 1, 2024 as the latest amendment date of the part and lists four later issues, each
    marked not substantive: section 200.1, section 200.405, Appendix VII and Appendix XII [2103]. The source note of 200.1
    reads 89 FR 30136, April 22, 2024, as amended at 89 FR 79732, October 1, 2024 [2102]. The Federal Register index holds
    two rule documents citing 2 CFR part 200 since April 23, 2024, both from 2024, one of them OMB''s corrections of October
    1, 2024, and none dated 2025 or 2026 [2094]. Six rule documents citing title 2 were published from January 1, 2025 to
    2026-10-04, all in agency chapters of Subtitle B; the one effective August 17, 2026 is the Department of Energy''s rule
    adding subpart C to 2 CFR part 910 [2095] [2096].'
