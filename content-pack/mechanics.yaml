- id: taxable-expenditures
  name: Taxable expenditures (what a private foundation may not pay for)
  what: |
    Section 4945 taxes a private foundation on certain kinds of spending, called taxable expenditures [2379]. Form 990-PF asks each year whether the foundation paid anything for lobbying, for elections or voter registration, for grants to individuals, for grants to organisations that are not public charities, or for non-charitable purposes [2387].
  rule: Internal Revenue Code section 4945 [2379]. The initial tax on the foundation is 20 percent of the amount expended,
    with a further 100 percent if the expenditure is not corrected; a manager's initial tax is five percent, up to $10,000
    [2379]. The five kinds of expenditure are listed on Form 990-PF, Part VI-B, line 5a [2387].
  figures:
