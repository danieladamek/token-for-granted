    value: $394.2 billion (63.8%)
    cite:
    - 2409
  - label: giving by bequest, 2025
    value: $62.19 billion (10.1%)
    cite:
    - 2409
  - label: giving by corporations, 2025
    value: $43.67 billion (7.1%)
    cite:
    - 2409
  - label: giving to education, 2025
    value: $92.01 billion
    cite:
    - 2409
  - label: giving to foundations, 2025
    value: $79.05 billion (down 16.2% in current dollars)
    cite:
    - 2409
  - label: share of private foundation returns filed by nonoperating foundations, tax year 2022
    value: 91.2%
    cite:
    - 2410
  - label: share of returns from foundations with $100 million or more in total assets, tax year 2022
    value: 1.5%
    cite:
    - 2410
  - label: community foundations in the United States (Council on Foundations)
    value: more than 900
    cite:
    - 2405
  applies_to: The field as a whole [2409]. The IRS sheet read gives shares and rates and no absolute count of private foundations
    [2410].
