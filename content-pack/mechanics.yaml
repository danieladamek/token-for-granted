- id: foundation-giving-figures-and-their-bases
  name: 'Why one foundation has several giving figures: grants paid, grants approved, charitable disbursements'
  what: 'A foundation''s giving for one year is stated on several bases, and the figures differ [2483] [2511]. Foundations
    report grants approved, or awarded, and grants paid as separate figures: the Ford Foundation''s 2025 statements show
    $773,443 thousand approved and $854,322 thousand paid, with $450,384 thousand still payable at the end of the year [2487].
    Lilly Endowment reports $3.58 billion approved and $3.85 billion paid in 2025 [2483]. The charitable disbursements figure
    that a filing host shows for a Form 990-PF is larger than grants paid in each of the three returns read, because it
    is the total on Part I, line 26, column (d), and grants paid are line 25 of that part [2480] [2510] [2511] [2387].'
  rule: Form 990-PF, Part I, line 25 is "Contributions, gifts, grants paid" and line 26 is total expenses and disbursements;
    column (a) is per books and column (d) is disbursements for charitable purposes [2387]. In the e-filed return the line
    25 amounts are ContriPaidRevAndExpnssAmt and ContriPaidDsbrsChrtblAmt, and the line 26 amounts are TotalExpensesRevAndExpnssAmt
    and TotalExpensesDsbrsChrtblAmt [2480]. Part XIV, line 3a ends in the total of the grants listed as paid during the
    year, TotalGrantOrContriPdDurYrAmt [2480]. The audited statements read give a grants expense in the statement of activities
    and a different grants paid figure in the statement of cash flows [2484] [2491].
  figures:
  - label: Camille and Henry Dreyfus Foundation, 2024, from its return
    value: grants paid (line 25) $2,874,967; total charitable disbursements (line 26, column d) $4,644,900; Part XIV line
      3a total 2,874,967
    cite:
    - 2480
  - label: Gordon and Betty Moore Foundation, 2024, from its return
    value: grants paid per books $391,128,264; grants paid as charitable disbursements $403,028,969; total charitable disbursements
      $440,277,686
    cite:
    - 2510
  - label: Gordon and Betty Moore Foundation, 2024 and 2025, from its audited statements (in thousands)
    value: grants expense $391,128 and $469,773; grants paid $394,791 and $475,964
    cite:
    - 2491
  - label: Lilly Endowment, 2024, from its return
    value: grants paid $2,260,591,222; total charitable disbursements $2,280,983,099
    cite:
    - 2511
  - label: Lilly Endowment, 2025, from its annual report
    value: grants paid $3.85 billion; grants approved $3.58 billion (1,739 grants)
    cite:
    - 2483
  - label: Ford Foundation, 2025, from its audited statements (in thousands)
    value: grants approved $773,443; grant payments $854,322; total expenditures $1,026,655
    cite:
    - 2487
  - label: Gates Foundation, 2025, from its audited statements (in thousands)
    value: grants expense $5,971,000; grants paid $6,526,520; total expenses $8,144,856
    cite:
    - 2484
  - label: W.K. Kellogg Foundation and its trust, fiscal year ending August 31, 2025, combined audited statements
    value: grants expense $314,909,604; total expenses $444,951,301
    cite:
    - 2494
  applies_to: 'Any reader comparing foundations by size of giving, and the site''s own funder records, where each giving
    entry carries its basis [2510]. Where a foundation keeps its endowment in a separate trust or reports several entities
    together, the asset figure also depends on which entities are counted: the Kellogg foundation and trust report $9,667,630,186
    in combined assets, and the Gates Foundation Trust reports its assets apart from the foundation''s [2494] [2485].'
