- id: termination-objections-appeals-and-forums
  name: 'Challenging a termination: objections, agency appeals and the courts'
  what: 'A recipient whose award is terminated has two kinds of recourse: the procedures of the agency itself, and a suit
    in federal court [1828] [28]. Agency procedures differ by agency and by the reason given for the termination [1888]
    [154]. For a court challenge the question since 2025 has been which court: the Supreme Court has twice indicated that
    a claim to be paid under a terminated grant belongs in the Court of Federal Claims, while a challenge to an agency-wide
    policy may be heard in a district court [1804] [28].'
  rule: 'Agency procedures: 2 CFR 200.342 requires each federal agency to keep written procedures for objections, hearings
    and appeals; on initiating a remedy for noncompliance the agency must give the recipient an opportunity to object and
    to provide information challenging the action, and must follow any hearing or appeal a statute or regulation provides
    [1828]. At HHS the Departmental Appeals Board hears, among discretionary grant disputes, a termination for failure to
    comply with the terms of an award, a disallowance, a denial of a noncompeting continuation for failure to comply, and
    a voiding, with a 30-day period for the notice of appeal [1888]. NSF states that terminations on the ground that an
    award no longer effectuates programme goals or agency priorities are the final agency decision and are not appealable
    to NSF [154]. Supreme Court: In Department of Education v. California (April 4, 2025) the Court stayed a district court
    order that had required continued payment of terminated teacher-training grants, stating that the APA''s waiver of sovereign
    immunity does not extend to orders to enforce a contractual obligation to pay money and that the Tucker Act gives the
    Court of Federal Claims jurisdiction over suits based on a contract with the United States [1804]. In National Institutes
    of Health v. American Public Health Association (August 21, 2025) the Court stayed the district court judgments that
    vacated NIH grant terminations and declined to stay the judgments that vacated the NIH guidance documents; Justice Barrett,
    whose vote decided each part, wrote that the challenge to the guidance belongs in district court and the challenges
    to the terminations belong in the Court of Federal Claims [28]. Both are orders on stay applications, not final rulings
    on the merits [1804] [28]. Courts of appeals in 2026: The Fourth Circuit (The Sustainability Institute v. Trump, January
    21, 2026) vacated injunctions restoring 32 grants, holding that the district court lacked jurisdiction to order relief
    designed to enforce obligations to pay money under the grants and that the plaintiffs'' constitutional claims were statutory
    claims [1879]. The First Circuit (Massachusetts v. NIH, January 5, 2026) kept a challenge to NIH''s agency-wide indirect
    cost policy in district court and affirmed its vacatur [24]. The Ninth Circuit (Thakur v. Trump, May 26, 2026) reversed
    a class injunction for researchers whose grants were ended by form letter, as an APA claim that is in essence a contract
    action, and affirmed the injunction for the class whose grants were ended under the DEI executive orders, on a First
    Amendment claim the Tucker Act does not bar [1867]. District court: In New Jersey v. OMB (July 17, 2026) the District
    of Massachusetts held that a claim about future terminations under the regulation was properly before it and that challenges
    to past terminations belong in the Court of Federal Claims [1869]. Court of Federal Claims: The opinions describe that
    court as able to award money damages for breach and not to reinstate a grant; the Ninth Circuit concurrence notes that
    a researcher who is not a party to the grant agreement faces a separate obstacle there [28] [1867]. The Federal Circuit
    held on February 4, 2026 that a grant statute with mandatory "shall award" language was money-mandating under the Tucker
    Act, in a case about the Restaurant Revitalization Fund [1868].'
  figures:
  - label: HHS Departmental Appeals Board notice of appeal
    value: 30-day period
    cite:
