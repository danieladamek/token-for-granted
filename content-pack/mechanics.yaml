- id: prior-approval-requirements
  name: Prior approval requirements
  what: 'Some changes to a funded project, and some kinds of cost, need the agency''s written approval before the recipient
    acts [1815] [1834]. The Uniform Guidance lists them in two places: 200.308 for changes to the budget and programme,
    and 200.407 for cost items [1815] [1834].'
  rule: 2 CFR 200.308 requires prior approval for a change in scope or objective; a change in key personnel; disengagement
    of the project director for more than three months or a 25 percent reduction in time; costs that need approval under
    subpart E; transfer of participant support costs to other categories; subawarding work not in the approved application;
    changes in approved cost sharing; a need for additional federal funds; and a no-cost extension beyond the one-time extension
    [1815]. An agency may also restrict transfers among cost categories where the Federal share exceeds the simplified acquisition
    threshold and the cumulative transfer exceeds or is expected to exceed 10 percent of the total budget [1815]. The agency
    should notify the recipient within 30 days of receipt whether a requested revision is approved; the section says should,
    not must [1815]. 2 CFR 200.407 lists sixteen sections where prior written approval is a condition of allowability, among
    them 200.306 cost sharing, 200.307 program income, 200.333 fixed amount subawards, 200.430(h) compensation, 200.431
    fringe benefits, 200.439 equipment, 200.455 organization costs, 200.458 pre-award costs and 200.475 travel [1834]. For
    indirect costs the approval comes from the cognizant agency for indirect costs [1834]. Absence of prior approval does
    not by itself make a cost unreasonable or unallocable unless one of the listed sections requires it [1834]. The eCFR's
    version record for part 200, read on 2026-10-04, gives October 1, 2024 as the latest amendment date of the part; the
    only later issues are of 200.1, 200.405, Appendix VII and Appendix XII, each marked not substantive [2103]. The eCFR
    text of 200.308 current to 10/01/2026 has the same figures on project director time, budget transfers and the 30-day
    agency response [2118].
