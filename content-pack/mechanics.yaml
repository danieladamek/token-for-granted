- id: pass-through-subaward
  name: Pass-through funding and subawards
  what: A pass-through entity is a recipient or subrecipient that gives a subaward to another organisation to carry out
    part of a federal programme [1799]. The organisation that receives the subaward is a subrecipient, and the award terms
    flow down to it [1799] [1805]. A university that leads a multi-site project and a state that distributes a formula grant
    are both pass-through entities, and each has the same list of duties toward its subrecipients [1823].
  rule: Under 2 CFR 200.331 the pass-through entity decides case by case whether the other party is a subrecipient or a
    contractor; a subrecipient determines eligibility, has its performance measured against programme objectives, makes
    programmatic decisions and is responsible for programme requirements, while a contractor sells goods or services in
    its normal business and is not subject to programme compliance requirements [1822]. The substance of the relationship
    matters more than the form of the agreement [1822]. Under 200.332 the pass-through entity must verify in SAM.gov that
    the subrecipient is not excluded; identify the subaward as a subaward and give 14 data items, including the federal
    award number, the Assistance Listing and the indirect cost rate; evaluate the subrecipient's fraud risk and risk of
    noncompliance; monitor its activities and review its reports; issue management decisions on audit findings; verify that
    it is audited when subpart F requires; and consider enforcement under 200.339 [1823]. On indirect costs the pass-through
    entity must accept the subrecipient's federally negotiated rate; where there is none the rate is one negotiated between
    the two parties or the de minimis rate, and the pass-through entity may not require the de minimis rate of a subrecipient
    that has a federally negotiated rate [1823] [1802]. Under 200.333 a recipient may, with the federal agency's prior written
    approval, make fixed amount subawards of up to $500,000 [1824]. A subrecipient submits its final reports and liquidates
    its obligations within 90 calendar days of the end of the subaward [1830]. Only the first $50,000 of each subaward counts
    in the pass-through entity's modified total direct cost base [1799]. The eCFR text of 200.332 current to 10/01/2026
    lists the same 14 data items and the same rule that a pass-through entity must not require the de minimis rate of a
    subrecipient that has a rate negotiated with the Federal Government [2105]. The eCFR page for 200.344 returned server
    errors twice on 2026-10-04; the eCFR's version record for part 200 lists no issue of 200.333 or 200.344 after the amendment
    dated October 1, 2024 [2103]. The eCFR page for 200.333 did load later the same day and shows the same $500,000 ceiling
    with prior written approval [2116].
  figures:
  - label: fixed amount subaward ceiling
    value: up to $500,000, with prior written approval
    cite:
    - 1824
    - 2116
  - label: subaward amount counted in MTDC
    value: up to the first $50,000 of each subaward
    cite:
    - 1799
    - 2102
  - label: subrecipient final reports and liquidation
    value: no later than 90 calendar days after the end of the subaward period of performance
    cite:
    - 1830
  - label: data items a subaward must identify
    value: '14'
    cite:
    - 1823
    - 2105
  applies_to: Any recipient that makes subawards and any organisation that receives one; a non-profit funded through a state
    block or formula grant is a subrecipient of the state [1823] [1880].
  pending_changes:
  - status: proposed
    date: '2026-05-29'
    text: OMB's proposed rule would eliminate fixed amount subawards (200.333), revise 200.331 and 200.332, and require
      pass-through entities to report subawards on SAM.gov [1803].
  - status: proposed
    date: '2026-05-29'
    text: The preamble to OMB's proposed rule says OMB proposes to revise 200.333 to remove the policy allowing recipients
      to issue fixed amount subawards, and that the change to fixed amount awards is not intended to affect awards or subawards
      issued before the effective date [2093] [2092].
