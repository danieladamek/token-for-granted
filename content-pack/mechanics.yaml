- id: foundation-invitation-only-grantmaking
  name: Invitation-only grantmaking
  what: Most of the large national foundations in this slice do not take proposals from organisations they have not approached.
    Staff find organisations themselves and invite a proposal [2210] [2300] [2304].
  rule: 'Each foundation states the rule in its own words. Ford: ''We do not accept any unsolicited grant proposals by mail,
    email or phone.'' [2259]. Annie E. Casey: it ''does not accept or review unsolicited proposals'' [2300]. Walton, Rockefeller
    and Hilton say the same in one sentence each [2288] [2290] [2302]. Wallace: ''We do not fund over-the-transom requests
    for grants.'' [2304]. Mott has not accepted unsolicited letters of inquiry or proposals since January 2025 [2298]. Gates
    says it invites proposals ''by directly contacting organizations'' [2251].'
