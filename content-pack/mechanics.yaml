- id: foundation-grants-to-individuals
  name: Private foundation grants to individuals
  what: |
    A private foundation may pay a grant to an individual for travel, study or similar purposes only under conditions, or the grant is a taxable expenditure [2382]. The conditions include a selection procedure the IRS approved in advance [2382]. Some funders make no grants to individuals at all [2433].
  rule: Internal Revenue Code section 4945 [2382]. The grant must be "awarded on an objective and nondiscriminatory basis
    under a procedure approved in advance by the Service", and must be a scholarship or fellowship for study at an educational
    institution, a prize or award excludible under section 74(b), or a grant to achieve a specific objective, produce a
    report or similar product, or improve a literary, artistic, musical, scientific, teaching or similar capacity [2382].
  figures: []
  applies_to: 'Private foundations [2382]. The public charities read in this sweep set their own policies: Walmart and the
    Walmart Foundation award no grants to individuals [2433], and the New York Community Trust and the Cleveland Foundation
    make no grants to individuals through their competitive programmes [2416] [2425].'
