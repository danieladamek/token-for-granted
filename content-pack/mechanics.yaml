- id: reporting-and-record-retention
  name: Financial and performance reporting, and record retention
  what: A recipient reports to the agency on money and on progress at intervals the award sets, and keeps its records for
    a fixed time after the last report [1820] [1821] [1825]. The Uniform Guidance sets the outer limits on frequency and
    the due dates [1820].
  rule: Under 2 CFR 200.328 financial reports use OMB-approved data elements such as the Federal Financial Report (SF-425),
    and are collected no less than annually and no more often than quarterly [1820]. Under 200.329 performance reports follow
    the same limits unless specific conditions apply; they compare accomplishments with objectives, explain why goals were
    not met, and explain cost overruns [1821]. For both kinds, an annual report is due no later than 90 calendar days after
    the reporting period, a quarterly or semiannual report no later than 30 calendar days after, and the final report no
    later than 120 calendar days after the period of performance, or 90 calendar days for a subrecipient [1820] [1821].
    A recipient must tell the agency of a significant development between reports [1821]. Under 200.334 records are kept
    for three years from the date the final financial report is submitted [1825]. The period runs longer while litigation,
    a claim or an audit finding is unresolved, or when the agency extends it in writing; property and equipment records
    are kept for three years after final disposition [1825]. Financial reports and payment requests carry a signed certification
    under 200.415 [1885]. The eCFR's version record for part 200, read on 2026-10-04, gives October 1, 2024 as the latest
    amendment date of the part; the only later issues are of 200.1, 200.405, Appendix VII and Appendix XII, each marked
    not substantive [2103]. The eCFR text of 200.328 current to 10/01/2026 has the same 90-day, 30-day and 120-day deadlines
    [2117].
