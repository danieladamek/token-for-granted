- id: anti-discrimination-certification-false-claims-act
  name: Anti-discrimination certification tied to the False Claims Act (2025-26)
  what: 'Executive Order 14173 of January 21, 2025 directs every agency to put two terms in each grant award: an agreement
    that the recipient''s compliance with federal anti-discrimination laws is material to the Government''s payment decisions
    for purposes of the False Claims Act, and a certification that the recipient does not operate any programmes promoting
    DEI that violate those laws [1862]. A false certification can therefore be pursued as a false claim, by the Government
    or by a private party suing on its behalf [1863]. Agencies have carried the term into their own award conditions in
    different words and at different times [1870] [528].'
  rule: 'The order: Section 3(b)(iv)(A) requires a term that compliance "in all respects with all applicable Federal anti-discrimination
    laws" is material for purposes of 31 U.S.C. 3729(b)(4); section 3(b)(iv)(B) requires the certification [1862]. Enforcement:
    A Deputy Attorney General memorandum of May 19, 2025 set up the Civil Rights Fraud Initiative, led by the Civil Division''s
    Fraud Section and the Civil Rights Division, to use the False Claims Act where a recipient of federal funds knowingly
    violates civil rights laws and falsely certifies compliance, and encouraged private suits under 31 U.S.C. 3730 [1863].
    An Attorney General memorandum of July 29, 2025 to all agencies lists five kinds of practice the department treats as
    unlawful and adds a list of practices it describes as non-binding suggestions [1864]. Agency terms: NIH added a civil
    rights term on April 21, 2025 (certification that the recipient does not operate programmes that advance or promote
    DEI, DEIA or discriminatory equity ideology in violation of federal anti-discrimination laws, and does not engage in
    a discriminatory prohibited boycott) and rescinded it on June 12, 2025, saying it awaited federal-wide guidance [1870]
    [1871]. The HHS Grants Policy Statement effective October 1, 2025 states that by applying for or accepting HHS funds
    a recipient certifies compliance with all federal antidiscrimination laws, and that a knowing false statement may bring
    False Claims Act liability [528]. SAM.gov: On January 28, 2026 GSA proposed to revise the financial assistance representations
    and certifications that every prime recipient makes when it registers or renews in SAM.gov, citing the Attorney General''s
    guidance and Executive Order 14173; comments closed March 30, 2026, and no later notice was found [1866]. Existing rules:
    2 CFR 200.300 already requires awards to be administered in accordance with statutes prohibiting discrimination, and
    200.415 already ties signed certifications on reports to the False Claims Act [1887] [1885]. Court rulings: The District
    of Maryland enjoined the certification provision nationwide; the Fourth Circuit vacated that injunction on February
    6, 2026, holding the plaintiffs unlikely to succeed on a facial First Amendment challenge because the provision requires
    certification of compliance with existing law, and noting that a recipient may contest an interpretation of that law
    in a specific enforcement action [1865].'
  figures:
  - label: SAM.gov registrants the GSA proposal would reach
    value: 222,760 respondents a year
    cite:
    - 1866
  - label: GSA burden estimate
    value: 2.75 hours per response; 612,590 hours a year
    cite:
    - 1866
  applies_to: Recipients of grants and cooperative agreements from any agency that has put the term in its awards; the wording
    that binds a recipient is the wording in its own award or in the agency's policy statement [1862] [528]. A court order
    against a condition covers the plaintiffs and agencies it names [65].
