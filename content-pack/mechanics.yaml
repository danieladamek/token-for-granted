- id: expenditure-responsibility
  name: Expenditure responsibility
  what: |
    When a private foundation makes a grant to an organisation that is not a public charity, the grant is a taxable expenditure unless the foundation exercises expenditure responsibility [2380]. Expenditure responsibility means the foundation makes all reasonable efforts and sets up procedures to see the grant is spent only for its purpose, to get full reports from the grantee, and to report in detail to the IRS [2381].
  rule: Internal Revenue Code section 4945 [2380]. "A private foundation's grants to organizations are taxable expenditures,
    unless the recipients are public charities, or the foundation exercises expenditure responsibility" for the grant [2380].
    For this purpose grants include loans and program-related investments [2380]. The IRS links pages on the pre-grant inquiry,
    grant terms, record-keeping and a grantor's reliance on a grantee's public charity status [2381].
  figures: []
  applies_to: 'A private foundation funding any organisation that is not a public charity [2380]. Walmart''s page gives
    the foreign case: an organisation outside the United States must show equivalency to a public charity or be funded under
    expenditure responsibility [2433]. A grant to a public charity needs none of these steps [2380]. Funders read in this
    sweep require that status: the Bank of America Charitable Foundation requires applicants to be "not classified as a
    private foundation" [2439], and Walmart limits United States funding to organisations recognised as public charities
    [2433].'
