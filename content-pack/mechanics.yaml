- id: excise-tax-on-net-investment-income
  name: Private foundation excise tax on net investment income
  what: |
    A private foundation pays a yearly excise tax on its net investment income under section 4940 [2378]. The rate is 1.39 percent, and the tax reduces the amount the foundation must distribute [2378] [2376].
  rule: Internal Revenue Code section 4940 [2378]. For tax years beginning after Dec. 20, 2019 the tax is 1.39% of net investment
    income, with no reduced rate [2378]. The 2025 Form 990-PF computes it in Part V at 1.39% (0.0139) of Part I, line 27b
    [2387]. Private operating foundations also pay it [2371].
  figures:
  - label: rate, tax years beginning after Dec. 20, 2019
    value: 1.39% of net investment income
    cite:
    - 2378
  - label: rate, tax years beginning on or before Dec. 20, 2019
    value: 2 percent, reduced to 1 percent in certain cases
    cite:
    - 2378
  applies_to: Domestic private foundations, including operating foundations [2378] [2371].
  pending_changes:
  - status: enacted
    date: '2025-07-04'
    text: Public Law 119-21 did not change the section 4940 rate; the IRS page, updated 11-Sep-2026, still gives 1.39% [2378].
      A law-firm summary says an earlier draft of the bill would have set rates from 1.39 percent to 10 percent and that
      the provision is not in the enacted law [2395].
  - status: enacted
