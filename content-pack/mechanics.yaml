- id: corporate-charitable-deduction-floor
  name: One percent floor on corporate charitable deductions
  what: |
    Public Law 119-21 added a floor to the deduction a corporation may take for charitable gifts [2391]. A corporation's contributions are deductible only to the extent the total exceeds 1 percent of its taxable income, and only up to 10 percent [2392].
  rule: 'Internal Revenue Code section 170(b)(2)(A), as amended by section 70426 of Public Law 119-21, titled "1-percent
    floor on deduction of charitable contributions made by corporations" [2391] [2392]. Practitioner sources give the effective
    date as taxable years beginning after December 31, 2025 [2394] [2395]. Added by slice D: the Joint Committee on Taxation''s
    revenue table for the bill as the Senate passed it on July 1, 2025 gives the same effective date, taxable years beginning
    after 12/31/25 [2497].'
