  - label: where it appears on Form 990-PF
    value: Part IX line 6, "Minimum investment return. Enter 5% (0.05) of line 5"; Part X, Distributable Amount; Part XI,
      Qualifying Distributions; Part XII, Undistributed Income
    cite:
    - 2387
    - 2388
  applies_to: Private foundations other than private operating foundations [2375] [2371].
