- id: nih-r01
  name: NIH Research Project Grant (R01)
  family: research
  kind: mechanism
  funder: nih
  funder_kind: federal
  owner: National Institutes of Health (HHS)
  what: |
    The R01 supports a discrete, specified research project carried out by the named investigator or investigators in their area of competence [3]. NIH calls it its most commonly used grant programme for independent research projects [42]. The budget is not capped and the project may run up to five years [4]. An R01 can be renewed by competing for a further project period [42].
