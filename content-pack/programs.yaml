    - id: DE-FOA-0003467
      opens: '2024-10-02'
      closes: '2029-09-29'
      note: SCALEUP Ready, the one ARPA-E notice a Grants.gov search returned as open on the sweep date; it is for technologies
        ARPA-E has already funded, uses cooperative agreements and requires cost sharing [370].
  awards:
  - label: federal share per award in the CATALCHEM-E example
    amount: $2.5–$3.5 million
    duration: 36 months
    cite:
    - 301
  - label: total for the two CATALCHEM-E notices
    amount: approximately $35 million; 10–12 awards
    duration: 36 months
    cite:
    - 301
  indirect_costs: Modification 03 of the example notice, dated February 6, 2026, removed a cap on indirect costs at 15%
    of total project costs [301]. A second ARPA-E notice records the same removal [302].
  cost_sharing: The base requirement in the example notice is at least 20% of total project costs, with a reduced requirement
    of 10% for small businesses, for educational institutions or domestic non-profits applying alone, and for teams made
    up of or mostly of such entities [301]. A 2019–2020 ARPA-E notice required no cost share from a domestic university
    or non-profit applying alone [400]. The regulation sets 20 percent for research and development and 50 percent for demonstration
    and commercial application [299].
  review: 'Concept papers and full applications are reviewed against criteria printed in each notice [301]. In the OPEN
    2018 notice the full-application criteria were weighted: impact of the proposed technology 30%, overall scientific and
    technical merit 30%, qualifications, experience and capabilities 30%, soundness of management plan 10% [303].'
  steps:
