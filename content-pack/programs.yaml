      good standing admitted to candidacy in a doctoral programme in modern foreign languages and area studies, planning
      a teaching career in the United States, with enough foreign language skill for the research [1013] [1012].
    note: An institution of higher education is eligible to receive an institutional grant [1013]. A non-profit that is
      not an institution of higher education cannot apply.
