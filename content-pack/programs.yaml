    NRSA support or of health-related research, research training or teaching averaging at least 20 hours a week, begun
    within 2 years of the end of support [769].
  budget_rules: Fellows train full time, normally 40 hours a week or as the sponsoring organization defines it, and may
    not hold the fellowship together with another federally sponsored fellowship or similar federal award that provides
