    library and archives staff, develop faculty and leaders, and recruit and educate the next generation of library and
    archives professionals [685]. It has six project types, among them Early Career Research Grants for untenured library
    and information science faculty [685] [990]. The FY 2027 competition was open on 2026-10-04 and closes November 13,
    2026 [990].
