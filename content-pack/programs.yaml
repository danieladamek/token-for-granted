      MIRA holders renewing, and new investigators who are not early stage investigators; PAR-27-032 is for early stage
      investigators [73] [74].
    limits: Single PD/PI only, one application per investigator; the fetched text gives a minimum effort of 45% of total
      research effort in PAR-26-121 and at least 51% in PAR-27-032 [73] [74].
