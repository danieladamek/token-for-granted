    - 403
  indirect_costs: Limited by statute. NIFA's FY 2026 AFRI Strengthening Agricultural Systems notice states the AFRI limit
    as 30 percent of Total Federal Funds Awarded under 7 U.S.C. 3310(a) and (c); the Foundational and Applied Science notice's
    own indirect-cost section was not returned by the fetch. NIFA's indirect cost page tells applicants to follow the limit
    named in each notice [412] [407].
  cost_sharing: 'Required in two cases. Equipment grants: the federal request may not exceed 50 percent of the cost or $50,000,
    whichever is less. Applied research that is commodity-specific and not of national scope: a non-federal match not less
    than the grant. The NIFA page states the rule as "For equipment grants and if commodity specific" [403] [423] [417].'
  review: Peer review panels. For research projects the FY 2026 criteria are scientific merit; qualifications of project
    personnel, adequacy of facilities and project management; and project relevance. Integrated projects are judged on merit,
    qualifications and relevance, with no more than two-thirds of the budget on one component. NIFA's regulation requires
    review against criteria fixed in advance and sends applicants their reviews without reviewer names [410] [416].
