  what: |
    The F32 supports a postdoctoral researcher who carries out mentored research training under a faculty sponsor [737]. It may provide up to three years of support [737]. The stipend rises with years of postdoctoral experience and is set each fiscal year [732]. The first 12 months of postdoctoral NRSA support bring a service payback obligation [737].
