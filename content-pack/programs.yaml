- id: nih-parent-announcements
  name: NIH parent announcements (investigator-initiated applications)
  family: research
  kind: program
  funder: nih
  funder_kind: federal
  owner: National Institutes of Health (HHS)
  what: |
    A parent announcement is a standing, broad notice of funding opportunity (NOFO) that an applicant uses to send in an investigator-initiated application, one whose topic the investigator chose and NIH did not ask for [1] [145]. Each parent announcement is for one activity code, such as R01, R21, R03 or R15 [1]. Every NIH application answers a specific NOFO, so an unsolicited idea still goes in through one of these notices [120]. During 2025 NIH cut the number of narrow notices and leaned more on parent announcements [90] [10].
  funds: grant
  mechanism_code: PA / PAR (parent)
  assistance_listings: []
  who_may_apply:
    applicant_types:
    - public-higher-ed
    - private-higher-ed
    - nonprofit-501c3
    - nonprofit-other
    standing:
    - nih-nonprofit-other-than-higher-education
    - nih-foreign-organization
    investigator: Eligibility is set in each parent notice; the parent R01 accepts any individual with the skills, knowledge
      and resources to carry out the research [4].
    limits: NIH accepts six new, renewal, resubmission or revision applications per principal investigator per calendar
      year, across all activity codes except T codes and R13 [12].
  cycle:
    pattern: Parent announcements typically use the standard due dates, with three cycles a year, and are usually reissued
      when they expire [1] [2].
    current_notices:
    - id: PA-25-301
      opens: '2025-01-05'
      closes: '2028-01-08'
      note: R01, clinical trial not allowed; posted December 18, 2024 [4] [1].
    - id: PA-25-305
      opens: '2025-01-05'
      closes: '2028-01-08'
      note: R01, clinical trial required; posted December 18, 2024 [144] [1].
    - id: PA-25-304
      opens: '2025-01-16'
      closes: '2028-01-08'
      note: R21, clinical trial not allowed; posted December 18, 2024 [5] [1].
    - id: PA-25-306
      closes: '2028-01-08'
      note: R21, clinical trial required; posted December 18, 2024 [1].
    - id: PA-25-302
      opens: '2025-01-16'
      closes: '2028-01-08'
      note: R03, clinical trial not allowed; posted December 18, 2024 [6] [1].
    - id: PAR-25-134
      opens: '2025-01-25'
      closes: '2028-01-08'
      note: R15 AREA, clinical trial not allowed; posted November 26, 2024 [7] [1].
    - id: PAR-25-148
      closes: '2028-01-08'
      note: R15 AREA, clinical trial required; posted November 21, 2024 [1].
    - id: PAR-25-298
      opens: '2025-01-08'
