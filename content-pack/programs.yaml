      investigators of an NIH R01, P01 or P50, or of another major individual career award (for example K01, K07, K08, K22,
      K23, K25, K76, K99/R00), are not eligible; holders of R03, R21/R33, R34/U34, R36 or SBIR/STTR awards and scholars
