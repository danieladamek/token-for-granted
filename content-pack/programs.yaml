  name: Fulbright U.S. Student Program
  family: people
  kind: fellowship
  funder: state-eca
  funder_kind: federal
  owner: U.S. Department of State; administered by the Institute of International Education (IIE)
  status: open
  applicant: person
  what: The Fulbright U.S. Student Program funds American citizens to study, do research or teach English abroad for an
    academic year [1022]. It is a Department of State programme, paid for by the U.S. Government and administered by the
    Institute of International Education (IIE) [1022]. The person applies; a student who is currently enrolled applies through
    the home institution's Fulbright Program Adviser [1023]. The 2027-2028 competition was open on 2026-10-04 and closes
    October 6, 2026 [1022].
  funds: fellowship
  who_may_apply:
    applicant_types:
    - individual
    investigator: U.S. citizens enrolled in undergraduate or graduate degree programmes; or U.S. citizens who will hold
      a bachelor's degree by the award start date and do not hold a Ph.D.; non-enrolled and artist applicants typically
      have seven years or less of professional experience [1023].
    limits: An enrolled student applies through the institution; others may apply at-large [1023].
    note: Only individuals apply. A non-profit that is not a university has no applicant or host role on the U.S. side;
      a person who works at one may apply at-large if otherwise eligible [1023].
  citizenship: U.S. citizens only [1023].
  career_window: From final-year undergraduates to doctoral candidates; a person who already holds a Ph.D. is not eligible
    [1023].
  cycle:
    pattern: One national deadline each October for awards in the following academic year; the 2027-2028 deadline is Tuesday,
      October 6, 2026 at 5 pm Eastern Time [1022]. Screening results come at the end of January and final decisions from
      March to June [1024].
    current_notices:
    - id: 2027-2028 competition
      closes: '2026-10-06'
      note: Open on the sweep date [1022].
  awards:
  - label: scale of the programme
    amount: over 1,800 awards annually
    duration: 2027-2028 award cycle
    cite:
    - 1022
