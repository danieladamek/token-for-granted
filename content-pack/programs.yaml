    limits: The notice sets no cap on applications per organization; NIH does not accept duplicate or highly overlapping
      applications under review at the same time [736]. NIH's limit of six applications per principal investigator per calendar
      year applies to all activity codes except T codes and R13 conference grants; the notice names no exception for F or
      K codes [12].
  eligibility_note: 'Eligible applicant organizations include nonprofits other than institutions of higher education, with
    or without 501(c)(3) status, as well as federal agencies and foreign organizations; the organization must have staff
    and facilities on site for the training [736]. NIMH was added June 18, 2025 and NIGMS on March 19, 2026 [736] [792].
    Institutes apply the parent notice differently: NCATS and the Fogarty International Center do not fund individual fellowships,
    and other institutes add their own limits [804].'
  citizenship: By the time of award the candidate must be a citizen or a non-citizen national of the United States, or lawfully
    admitted for permanent residence [736] [757].
  career_window: Students currently enrolled in a research doctoral programme. An individual may receive up to 5 years of
    aggregate NRSA support at the predoctoral level, or up to 6 years for dual-degree training [736].
  stipend: $29,364 a year ($2,447 a month) for predoctoral fellows on awards made with FY 2026 funds [732]. The FY 2025
    level was $28,788 [733].
  obligation: The payback obligation attaches to the first 12 months of postdoctoral NRSA support; the notice and the policy
    statement as read state no service obligation for predoctoral support [737] [769].
