    investigator: For Early Career Research the single project director must hold a doctoral degree, be untenured, tenure-track
      library and information science faculty with teaching and research duties, and have had no earlier federal early career
      award; a letter of departmental endorsement is required [990].
    note: The applicant must be a unit of State, local or Tribal government or a private nonprofit organization, be located
      in a state or listed territory, and be one of seven kinds of library or archives entity [990]. A non-profit that is
      not a university may apply if it is such an entity, for example a library or archives association or consortium, a
      digital library or archives, or a nonprofit whose sole mission includes supporting a specific library or archives
      [990]. A university applies through its library or a unit such as a graduate school of library and information science
      [990].
