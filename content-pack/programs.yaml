    investigator: Any individual with the skills, knowledge and resources to carry out the research may be the programme
      director/principal investigator (PD/PI); NIH's orientation page says a PD/PI need not be a U.S. citizen for most programmes
      [4] [117].
    limits: An organization may submit more than one application if each is scientifically distinct; each PD/PI is limited
      to six applications of all kinds per calendar year [4] [12].
  cycle:
    pattern: 'Standard due dates: new applications February 5, June 5 and October 5; renewals, resubmissions and revisions
      March 5, July 5 and November 5 [2].'
    current_notices:
    - id: PA-25-301
      opens: '2025-01-05'
      closes: '2028-01-08'
      note: Parent R01, clinical trial not allowed; posted December 18, 2024; still listed as open on Grants.gov, last updated
        June 2, 2026 [4] [112].
    - id: PA-25-305
      opens: '2025-01-05'
      closes: '2028-01-08'
      note: Parent R01, clinical trial required; posted December 18, 2024 [144].
  awards:
  - label: direct costs
    amount: not limited; the budget reflects the actual needs of the project
    duration: up to 5 years
    cite:
    - 4
  - label: average R01-equivalent award, FY 2025
    amount: $664,005
    duration: per award, as NIH reports it
    cite:
    - 81
  indirect_costs: F&A costs are paid on top of direct costs at the organization's negotiated rate; a foreign organization
    receives 8 percent of modified total direct costs [64] [36].
  cost_sharing: Not required [4].
  review: A study section scores Factor 1 (Importance of the Research) and Factor 2 (Rigor and Feasibility) from 1 to 9
    and rates Factor 3 (Expertise and Resources) as sufficient or insufficient; an institute advisory council gives the
    second level of review [4] [41] [38].
  success:
  - rate: 13.0%
    fiscal_year: 2025
    note: 'R01-equivalent success rate: 5,471 new and renewal awards from 42,022 applications [81].'
    cite:
    - 81
  - rate: 18.7%
    fiscal_year: 2024
    note: 'R01-equivalent success rate: 7,000 awards from 37,478 applications [81].'
    cite:
    - 81
  - rate: 18.9%
    fiscal_year: 2025
    note: 'A different measure: applicant funding rate for early stage investigators on new R01-equivalent applications
      (unique awardees over unique applicants); new non-ESI 10.0%, at-risk 16.9%, established 19.6% [82].'
    cite:
    - 82
  steps:
  - The organization registers in SAM, Grants.gov and eRA Commons, and each PD/PI links an ORCID iD to the eRA Commons account
    [4] [31].
  - The budget uses the modular format when direct costs are $250,000 a year or less and a detailed budget above that; a
    foreign applicant always uses the detailed budget [36].
  - No institute agreement is needed before requesting $500,000 or more in direct costs in a year, a step NIH removed on
    December 3, 2025 [37].
  - The application is submitted through Grants.gov by 5 p.m. local time on the due date [121].
  - After study section and council, the institute or center director decides; a just-in-time request for more information
    is not an award decision [15] [122].
