      stations, colleges and universities, university research foundations, other research institutions, federal agencies,
      national laboratories, private organizations, and individuals who are US citizens, nationals or permanent residents;
      foreign organizations are ineligible. For integrated projects only colleges and universities, 1994 land-grant institutions
      and Hispanic-serving agricultural colleges and universities may apply. A non-profit that is not a university may therefore
      apply for single-function projects but not for integrated projects [474] [403] [417].
    limits: No limit on the number of applications was found on the pages read; Part III of the notice was not returned
      by the fetch [405].
  cycle:
    pattern: One notice a year, with a separate deadline for each programme area priority. For FY 2026 the notice was posted
      on August 1, 2025 and most priorities closed on December 4, 11 or 18, 2025 after a deadline extension made on November
      14, 2025. NIFA states that FY 2027 deadlines will be announced in the FY 2027 notices; no FY 2027 notice was found
      on the sweep date [403] [404] [424] [408].
