- id: nsf-research-proposal
  name: NSF research proposal (standard proposal under the PAPPG)
  family: research
  kind: mechanism
  funder: nsf
  funder_kind: federal
  owner: U.S. National Science Foundation
  what: 'The research proposal is NSF''s ordinary route to a research grant: an organisation submits a full proposal to
    a programme description, programme announcement or solicitation, and NSF funds it as a grant if it is recommended after
    merit review [156] [157]. Research.gov lists Research first among the proposal types it supports [252].'
  funds: grant
  mechanism_code: Research
  assistance_listings: []
  who_may_apply:
    applicant_types:
    - public-higher-ed
    - private-higher-ed
    - nonprofit-501c3
    - nonprofit-other
    standing:
    - nsf-eligible-ihe
    - nsf-nonprofit-nonacademic
    - nsf-tribal-nation
    investigator: NSF invites proposals from all qualified scientists, engineers and educators through an eligible organisation;
      unaffiliated individuals are not eligible for direct funding [158] [156]. A person who is a current party to a malign
      foreign talent recruitment program may not serve as senior/key personnel [156].
    limits: No general limit on the number of proposals was found in the PAPPG chapters read; limits are set by individual
      solicitations, for example two proposals per person in twelve months in CISE Future CoRe and one per fiscal year in
      MPS Materials [189] [215].
    eligibility_note: The proposer categories of PAPPG Chapter I.E apply, which include non-profit non-academic organisations
      located in the U.S. [156].
  cycle:
    pattern: 'Set by each funding opportunity: a deadline date, a target date, a submission window, or acceptance at any
      time [156]. Proposals must be received by 5 p.m. submitting organisation''s local time on a deadline date [156]. Twelve
      foundational-research notices posted in August 2026 mostly accept proposals at any time [192] [185].'
    current_notices: []
  awards:
  - label: award size
    amount: set by the funding opportunity; no general ceiling found
    duration: up to five years (60 months) unless a solicitation specifies otherwise
    cite:
    - 252
  - label: research grants, average annualized award (FY 2027 budget request table)
    amount: $218,800
    duration: average 3.2 years
    cite:
    - 255
  - label: research grants, median annualized award (FY 2027 budget request table)
    amount: $175,100
    duration: average 3.2 years
    cite:
    - 255
  indirect_costs: Indirect costs are budgeted at the organisation's federally negotiated rate unless a solicitation says
    otherwise [257]. The 15 percent cap NSF announced in May 2025 was vacated by a court and is not in effect [237] [238].
    The PAPPG as printed in 2024 gives a de minimis rate of 10 percent of modified total direct costs for organisations
    with no negotiated rate; NSF's indirect-cost page gives up to 15 percent [257] [163].
  cost_sharing: Voluntary committed cost sharing is prohibited [257]. NSF's cost-sharing page names I-Corps, Engineering
    Research Centers and EPSCoR among the few programmes that require it [164].
  review: Proposals are judged on the two National Science Board criteria, Intellectual Merit and Broader Impacts [157].
    A programme officer checks compliance, obtains reviews from ad hoc reviewers, a panel or both, and recommends award
    or decline; the PAPPG places programmatic approval at division or office level, followed by a business review in the
    Division of Grants and Agreements [160] [157]. Since December 8, 2025 a full proposal must be reviewed by at least two
    reviewers, who may be NSF staff [149].
  steps:
  - The organisation obtains a UEI and an active SAM registration; NSF recommends doing so at least 90 days before submission
    [161].
  - The investigator finds a funding opportunity through the NSF Funding Search or a directorate page and contacts a programme
    officer listed on it [155] [158].
  - 'The proposal is prepared to PAPPG Chapter II: a one-page Project Summary, a Project Description of no more than 15
    pages, references, senior/key personnel documents, budget and justification, facilities, and a data management and sharing
    plan [159] [257].'
  - Biographical sketches and current and pending (other) support are prepared in SciENcv [248].
  - The organisation's authorised representative submits through Research.gov or Grants.gov [161].
  - NSF aims to give a decision within six months and releases the reviews to the PI with reviewer identities removed [160]
    [157].
  - A declined proposal may be resubmitted only after substantial revision; reconsideration may be requested within 90 days
    [258].
