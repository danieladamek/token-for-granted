    investigator: The candidate must have a clinical or research doctorate (PhD, MD, DO, DC, ND, DDS, DMD, DVM, ScD, DNS,
      PharmD or equivalent) and no more than 4 years of postdoctoral research experience as of the application due date
      [743].
    limits: An organization may submit more than one application if each is scientifically distinct and from a different
      candidate; an individual may not have two or more competing NIH career development applications pending review at
      the same time [743]. NIH's limit of six applications per principal investigator per calendar year applies to all activity
      codes except T codes and R13 conference grants; the notice names no exception for F or K codes [12].
  eligibility_note: Applicant organizations must be domestic; foreign organizations are not eligible, though foreign components
    are allowed [743]. The R00 institution must have suitable research infrastructure and a history of external research
    funding, and must give the awardee protected research time and a start-up and salary package equal to that of a newly
    hired faculty member [743].
  citizenship: 'There is no citizenship requirement for K99 candidates: a candidate may be a U.S. citizen, a non-citizen
    national, a lawful permanent resident or a non-U.S. citizen [743].'
  career_window: 'No more than 4 years of postdoctoral research experience at the application due date; NIH approves a one-year
    extension for childbirth within the window, and parental, medical or military leave is typically not counted [743].
    NIH twice gave automatic short extensions of the window: for eligibility ending between October 2024 and January 2026,
    with a last submission in October/November 2025, and for windows ending September to November 2025 or January to March
    2026, with submissions through February/March 2026 or June/July 2026 [791] [790].'
  budget_rules: K99 salary and research costs may be requested up to the level the awarding institute provides; R00 total
    cost may not exceed $249,000 per year, a figure that includes salary, fringe benefits, research costs and applicable
    indirect costs [743]. Effort is at least 75% (9 person-months) in both phases, or 50% for certain surgical specialties
    [743].
  cycle:
    pattern: 'Three due dates a year for new applications: February 12, June 12 and October 12; resubmissions are due one
      month later [743].'
