    recommended applications go to U.S. embassies or binational Fulbright Commissions, the Department of State and the Fulbright
    Foreign Scholarship Board [1024].
  steps:
  - Enrolled students contact the Fulbright Program Adviser on their campus; others apply at-large [1023].
  - Submit the online application by the national deadline [1022].
