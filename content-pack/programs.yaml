  funder_kind: federal
  owner: Office of Science, U.S. Department of Energy
  what: |
    A five-year research award for a scientist near the start of an independent career, at a U.S. university or at a DOE national laboratory [890]. It covers the fields of seven Office of Science programme offices [890]. The FY 2026 notice, DE-FOA-0003602, was posted March 3, 2026 and closed June 2, 2026 [909]. No FY 2027 notice was posted on 2026-10-04 [282].
