    organizations are not eligible, though foreign components as defined in the NIH Grants Policy Statement are allowed
    [744]. Nonprofits with and without 501(c)(3) status are on the eligible list [744].
  citizenship: By the time of award the candidate must be a citizen or a non-citizen national of the United States, or lawfully
    admitted for permanent residence [744].
  career_window: No fixed window in years; the notice says the award may support individuals training in a new field or
    returning after a hiatus caused by illness or pressing family circumstances [744].
  budget_rules: Salary and research development support are provided at levels set by each participating institute in a
    Table of IC-Specific Information; research development funds may pay for tuition and fees related to career development,
    research expenses such as supplies, equipment and technical personnel, travel to research meetings or training, and
    statistical services; salary for mentors and for secretarial or administrative assistants is not allowed [744]. NIH's
    table of institute considerations, as returned, shows K salary figures from $75,000 to $125,000 depending on the institute
    and the code [805]. Total salary from all federal sources may not exceed the maximum legislated salary rate, which for
    2026 is the Executive Level II limit of $228,000 [744] [21].
