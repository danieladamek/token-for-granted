  indirect_costs: Reimbursed at 8% of modified total direct costs, exclusive of tuition and fees, consortium costs in excess
    of $25,000 and equipment [753].
  cost_sharing: Not required [753].
  review: 'Criteria named in the notice: Career Development Program and Environment; Program Director(s)/Principal Investigator(s);
    Mentors; Scholars; Training Record [753].'
  steps:
  - The applicant organization holds registrations in SAM (which issues the Unique Entity Identifier), eRA Commons and Grants.gov;
    the programme director needs an eRA Commons account linked to an ORCID registration [753].
  - The institution checks which institutes take part; eleven NIH components are listed, among them NEI, NICHD, NIDCR, NIDDK,
    NIDA, NIEHS, NIGMS and NINDS [753].
  - The institution submits the application through Grants.gov; the first due date is October 12, 2026 [753].
  - After award the institution selects and appoints scholars; appointed scholars may not lead an independent clinical trial
    but may gain experience in a trial led by a mentor [753].
