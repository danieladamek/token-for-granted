  what: The Agriculture and Food Research Initiative (AFRI) is NIFA's main competitive grants programme for agricultural
    science. Its Foundational and Applied Science notice funds research, education, extension and integrated projects in
    six priority areas set in statute, through dozens of "program area priorities", each with its own code and deadline
    [406] [404] [424].
