  what: |
    The R35 supports an investigator's whole research programme within one institute's mission rather than a single project, and lets the investigator change direction inside that mission [3] [47]. NIH's R35 page shows two users, NHLBI and NIGMS [47]. The NIGMS version is the Maximizing Investigators' Research Award (MIRA), with one notice for established and new investigators and one for early stage investigators [72]. A MIRA runs five years [72].
