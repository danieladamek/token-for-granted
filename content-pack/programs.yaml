- id: nih-extramural-lrp
  name: NIH Extramural Loan Repayment Program (LRP)
  family: people
  kind: program
  funder: nih
  funder_kind: federal
  owner: National Institutes of Health (HHS)
  what: |
    The Extramural Loan Repayment Program repays part of the educational debt of health professionals who do research outside NIH [762]. It does not pay for a research project; awards rest on the applicant's potential to build and sustain a research career [762]. NIH repays up to $50,000 of qualified educational debt a year under an award of two years, which can be renewed [763]. For the cycle that opened on September 1, 2026 there are three subcategories: Clinical Research (L30), Pediatric Research (L40) and FOCUS, for emerging and high-priority areas each institute defines (L70) [762] [765].
  funds: loan-repayment
  mechanism_code: L30 / L40 / L70
  assistance_listings: []
  status: open
  applicant: person
  who_may_apply:
    applicant_types:
    - individual
    standing:
    - nih-lrp-eligible-researcher
    investigator: The applicant holds an M.D., Ph.D., Pharm.D., Psy.D., D.O., D.D.S., D.M.D., D.P.M., D.C., N.D., O.D.,
      D.V.M. or equivalent doctoral degree, does qualified research for an average of at least 20 hours a week, and has
      qualified educational debt of at least 20 percent of institutional base salary [762].
    limits: Federal employees working more than 20 hours a week, employees of for-profit institutions, people with federal
      judgment liens and people with unmet service obligations are not eligible [763].
  eligibility_note: The individual applies, and the employer does not receive the award; the research must be supported
    by a domestic non-profit foundation, university, professional association or other non-profit institution, or by a U.S.
    government agency, so a researcher employed by a non-profit that is not a university can qualify [762]. NIH research
    funding is not required [762]. An Institutional Business Official certifies the applicant's eligibility, salary, citizenship,
    research time and the institution's non-profit status [763].
  citizenship: The applicant must be a U.S. citizen, U.S. national or permanent U.S. resident by the award start date [762].
  career_window: No limit in years since degree is stated on the pages read; renewal applicants need not meet the 20 percent
    debt test [762].
  obligation: The awardee engages in qualified research for at least 20 hours each week for at least two years [763].
  cycle:
    pattern: One application period a year, from September 1 to mid-November [763] [766]. NIH's news item of September 8,
      2026 calls the cycle that opened on September 1, 2026 the FY27 cycle, says the extramural programme was consolidated
      into three subcategories and marks FOCUS (L70) as new [1085]. NIH's loan repayment landing page, updated July 10,
      2026, gives November 19, 2026 as the extramural due date and July 1, 2027 as the award start [1084].
