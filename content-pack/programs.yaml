  awards: []
  indirect_costs: F&A (indirect) costs are paid at the applicant organization's negotiated rate, fixed at the rate in effect
    at the start of the competitive segment [64] [36].
  cost_sharing: The parent notices read in this sweep do not require cost sharing [4] [5] [6] [7].
  review: Applications are reviewed by a study section organized by the Center for Scientific Review and then by an institute's
    advisory council; most research project codes use the simplified framework of three factors [38] [40] [41].
  steps:
  - The organization holds registrations in SAM (with a Unique Entity Identifier), Grants.gov and eRA Commons before it
    applies [4] [117].
  - The applicant picks the parent notice for the activity code and checks which institutes take part, because not every
    institute joins every parent announcement [43] [1].
  - The applicant may contact a programme official, found through the Matchmaker tool or Section VII of the notice, to ask
    whether the plan fits the institute [120] [92].
  - The application goes to Grants.gov by 5 p.m. local time on the due date [121] [2].
