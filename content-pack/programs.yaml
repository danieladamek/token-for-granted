    - private-higher-ed
    - other
    standing:
    - doe-sc-early-career-eligible-investigator
    investigator: The researcher must be an untenured, tenure-track assistant or associate professor at a U.S. academic
      institution, or a full-time employee at a DOE national laboratory or Office of Science user facility, and within 10
      years of the doctorate [890].
    limits: Only applicants whose pre-application DOE encourages may send a full application [890]. The FY 2026 notice allows
      one pre-application per investigator in a competition, no more than three competitions for any investigator, no co-investigators,
      and no application from a previous awardee of the programme [1078].
  eligibility_note: The programme page names U.S. academic institutions, DOE national laboratories and Office of Science
    user facilities as the places a researcher may hold the award; it names no other kind of non-profit [890]. The FY 2026
    notice itself was not read, so the full list of eligible applicants is not confirmed [909]. The notice and its Grants.gov
    listing, read in the gap-filling pass, restrict eligibility to U.S. institutions of higher education, DOE/NNSA national
    laboratories and institutions operating Office of Science scientific user facilities; other federally funded research
    and development centers and other federal agencies may not apply, so a non-profit research organisation that is not
    one of these cannot apply [1078] [1077].
  citizenship: The Office of Science does not require the investigator to be a U.S. citizen or permanent resident; all personnel
    must have the legal right to do the work where it is performed [1078].
  career_window: Within 10 years of the doctorate, and untenured on the tenure track if at a university [890]. For the FY
    2026 competition the notice set the test as a doctorate received on or after January 1, 2015; a laboratory investigator
    must be a full-time, permanent, non-postdoctoral employee at the application deadline [1078].
  cost_sharing: Not required; the notice cites the exclusion for basic and fundamental research from Section 988 of the
    Energy Policy Act of 2005 [1078].
  cycle:
