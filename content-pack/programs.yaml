  what: 'ROSES is the Science Mission Directorate''s omnibus research solicitation: one NASA Research Announcement holding
    many programme elements, each with its own scope and due dates [371] [372]. The solicitation in force on the sweep date
    was ROSES-2025, NNH25ZDA001N, released July 10, 2025 [372]. NASA said in January 2026 that ROSES-2026 would be released
    in July 2026; on the sweep date ROSES-2025 was still being amended and no ROSES-2026 release was found [294] [374] [395].'
  funds: grant
  mechanism_code: NNH25ZDA001N
  assistance_listings:
  - '43.001'
  who_may_apply:
    applicant_types:
    - public-higher-ed
    - private-higher-ed
    - nonprofit-501c3
    - nonprofit-other
    - unrestricted
    standing: []
    investigator: Organisations of every type may propose, including for-profit and not-for-profit ones [393] [377]. NASA
      does not award grants to individuals [380]. NASA funds research at U.S. institutions; work by a non-U.S. organisation
      is normally on a no-exchange-of-funds basis [377] [380]. Proposals that include participation by China or a Chinese-owned
      company are ineligible unless NASA obtains a waiver [380]. Every named team member must be registered in NSPIRES and
      confirm participation before submission [388].
    limits: Set per programme element; not read [372].
  cycle:
    pattern: 'One omnibus solicitation a year, amended through the year as elements are added or changed. ROSES-2025 was
      released in July rather than February, and NASA planned the same for ROSES-2026 [294]. Many elements use two steps:
      a Step-1 proposal or notice of intent, then the full proposal [377].'
    current_notices:
    - id: NNH25ZDA001N
      opens: '2025-07-10'
      closes: varies by programme element
      note: ROSES-2025. Eleven elements were open on Grants.gov on the sweep date with close dates from September 25, 2026
        to January 28, 2027 [394]. Amendment 77, dated October 2, 2026, added element A.18 Geosphere with notices of intent
        due November 16, 2026 and proposals due January 15, 2027 [374].
  awards:
  - label: range of annual award size across ROSES-2025
    amount: under $100K per year to more than $1M per year
    duration: typically three years; some programmes up to five years
    cite:
    - 372
  indirect_costs: Proposers budget at their institution's approved indirect rates; NASA calls inaccurate budget rates the
    number one cause of grant delays [389]. A consultant's note says Section 542 of Division A of the FY 2026 appropriations
    act bars NASA from limiting indirect cost rates; the statutory text was not reached in this sweep [361].
  cost_sharing: A ROSES-2025 element listing shows no cost sharing or matching requirement [393].
  review: 'Peer review by subject experts, in panels and by external reviewers, against intrinsic merit, programmatic relevance
    and cost reasonableness; a selection official decides [386]. Under ROSES-2025 dual-anonymous peer review is the default:
    reviewers are not told who the proposers are until rating is complete [375] [377].'
