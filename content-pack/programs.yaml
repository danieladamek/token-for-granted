  indirect_costs: Limited to 8% of modified total direct costs as defined in 2 CFR 200.1 [1063].
  cost_sharing: Not required [1063].
  budget_rules: At least 70% of requested direct costs must go to trainee costs (stipends, tuition and fees, trainee travel);
