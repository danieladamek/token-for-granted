- id: nsf-grfp
  name: NSF Graduate Research Fellowship Program (GRFP)
  family: people
  kind: fellowship
  funder: nsf-edu
  funder_kind: federal
  owner: U.S. National Science Foundation, Directorate for STEM Education
  sweep: people-B
  status: open
  applicant: person
  what: GRFP gives a graduate student three years of support, to be used within a five-year fellowship period, for a research-based
    master's or doctoral degree in a STEM field [818] [817]. The student applies directly to NSF; the money is then awarded
    to the university where the fellow enrols, which pays the stipend and receives a cost-of-education allowance [818].
    The solicitation for the FY 2027 competition is NSF 26-526, posted August 25, 2026 [817].
  funds: fellowship
  mechanism_code: GRFP (NSF 26-526)
  assistance_listings:
  - '47.076'
  - '47.074'
  - '47.070'
  - '47.041'
  - '47.050'
  - '47.049'
  - '47.084'
  - '47.083'
  - '47.079'
  who_may_apply:
    applicant_types:
    - individual
    standing:
    - nsf-grfp-eligible-applicant
    investigator: Two levels may apply [818]. Level 1 is undergraduates in the final year of a bachelor's degree, and bachelor's
      degree holders who have never enrolled in a graduate degree programme [818]. Level 2 is joint bachelor's-master's
      students in the final undergraduate or first graduate year, and first-year graduate students in their first graduate
      programme with less than one academic year completed [818] [820]. Second-year graduate students are not eligible [818].
      All graduate enrolment counts, whatever the field [821].
    limits: One application per annual competition [818]. Undergraduate seniors and bachelor's degree holders with no graduate
      enrolment may apply any number of times before enrolling; a graduate student may apply only once, in the first year
      of the first graduate programme [818].
    eligibility_note: Fellows must enrol in an accredited non-profit graduate degree-granting institution of higher education
      with a campus in the United States, its territories or possessions, or Puerto Rico [818]. A non-profit that is not
      a degree-granting institution cannot be the fellow's institution [818]. Professional and practice-oriented degree
      programmes, including MBA, MPH, MSW, JD, MD, DVM and DDS, are excluded, as are listed areas of study and kinds of
      proposed research tied to health, clinical practice, and policy or management implementation [818] [820].
  citizenship: U.S. citizens, nationals or permanent residents by the application deadline and, if offered a fellowship,
    at the time of acceptance [818].
  career_window: From the final undergraduate year to the end of the first year of the first graduate programme [818].
  stipend: $37,000 for a 12-month tenure period, paid in monthly increments of $3,083, plus a $16,000 cost-of-education
    allowance per tenure year paid to the institution; figures from the FY 2027 competition solicitation [818].
  obligation: There is no post-graduate service requirement [819].
  cycle:
    pattern: One competition a year under a new solicitation each year [818] [859]. For the FY 2027 competition the deadlines
      are in October 2026, by field, at 8:00 p.m. Eastern Time, and reference letters are due October 16, 2026 [818]. In
      the FY 2026 competition the deadlines were November 10 to 14, 2025 [859]. The last day to withdraw without penalty
      is November 15, 2026 [819].
    current_notices:
    - id: NSF 26-526
      opens: '2026-08-25'
      closes: '2026-10-23'
      note: 'Deadlines by field as printed in the solicitation: October 19 Life Sciences; October 20 Computer and Information
        Science and Engineering, Materials Research, Psychology, Social Sciences; October 22 Engineering; October 23 Chemistry,
        Geosciences, Mathematical Sciences, Physics and Astronomy [818]. The opportunity page, as fetched, paired the dates
        and fields differently [817].'
  awards:
  - label: anticipated funding per fellowship
    amount: $159,000
    duration: three years of support within a five-year fellowship period
    cite:
    - 818
  - label: annual value (stipend $37,000 plus cost-of-education allowance $16,000)
    amount: $53,000
    duration: per year, for three years
    cite:
    - 819
    - 818
  - label: estimated number of new fellowships, FY 2027 competition
    amount: 1,500
    duration: FY 2027 competition
    cite:
    - 818
    - 817
  - label: fellowship offers made, FY 2026 competition
    amount: 2,500
    duration: 2026-2027 academic year
    cite:
    - 860
    - 861
  - label: new fellowships stated in the FY 2025 competition solicitation (archived)
    amount: up to 2,300
    duration: per fiscal year
    cite:
    - 885
  indirect_costs: No indirect-cost statement was returned from the solicitation [818]. The institution receives the cost-of-education
    allowance, must exempt the fellow from tuition and required fees, and is responsible for tuition and fees above the
    allowance [818].
  review: Disciplinary and interdisciplinary scientists and engineers and other graduate-education experts, chosen by NSF
    programme officers, review applications against Intellectual Merit and Broader Impacts, giving balanced consideration
    to all parts of the application; NSF then selects fellows and Honorable Mentions [818] [886]. The solicitation says
    NSF funds fellowships in all NSF-eligible fields while emphasising high-priority research areas aligned with Administration
    priorities [818]. A Department of Justice Office of Legal Counsel opinion of August 12, 2026 states that NSF must administer
    GRFP without regard to an applicant's race or sex [876].
  success:
  - rate: 2,500 offers from nearly 14,000 applicants
    fiscal_year: 2026
    note: NSF gives counts, not a rate; a further 1,470 applicants were named Honorable Mention [860] [861].
    cite:
    - 860
    - 861
  steps:
  - The applicant checks academic level, degree programme, field of study and proposed research against Section IV of the
    solicitation; an application that fails any of these may be returned without review [818] [861].
  - The applicant opens a Research.gov account and prepares the application in the GRFP module of Research.gov; nothing
    sent another way is accepted [887] [818].
  - 'The application holds two statements, each with headings for Intellectual Merit and Broader Impacts: a Personal, Relevant
    Background and Future Goals Statement of at most three pages and a Graduate Research Plan Statement of at most two pages
    [887].'
  - The applicant names at least three reference writers and may name up to five; at least two letters must reach NSF through
    the reference letter system by the reference deadline, and the top three are considered [818] [887].
  - Official undergraduate transcripts are required; a graduate transcript may be unofficial where the institution issues
    no official one for the first term [818].
  - A fellow who accepts enrols at an eligible institution, which administers the award; the fellowship can be transferred
    to another institution after the first fellowship year [818].
