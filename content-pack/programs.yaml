  owner: Advanced Research Projects Agency–Energy (ARPA-E), U.S. Department of Energy
  what: 'ARPA-E issues a notice for each focused technology programme and funds teams by cooperative agreement, with other
    transactions in some cases [301]. A notice runs in three stages: a concept paper, a full application, and a reply to
    reviewer comments [301]. The CATALCHEM-E notice (DE-FOA-0003505), issued November 14, 2024 and modified February 6,
    2026, is used here as the worked example [301].'
  funds: cooperative-agreement
  mechanism_code: DE-FOA-0003505 (example)
  assistance_listings:
  - '81.135'
  who_may_apply:
    applicant_types:
    - public-higher-ed
    - private-higher-ed
    - nonprofit-501c3
    - nonprofit-other
    - unrestricted
    standing:
    - doe-nonprofit-not-lobbying-501c4
    investigator: In the example notice, domestic for-profit and non-profit organisations, educational institutions, FFRDCs
      and DOE laboratories may apply; foreign entities are not eligible applicants but may take part as subcontractors;
      non-profits described in section 501(c)(4) are not eligible [301]. A 2026 ARPA-E notice required a Foreign Entity
      Waiver for foreign participation [304]. Only U.S. citizens or permanent residents may apply in an individual capacity
      [302].
    limits: Not found in the parts read [301].
  cycle:
    pattern: Each programme has its own notice and dates. In the example, concept papers were due December 17, 2024, full
      applications February 25, 2026 and replies to reviewer comments March 16, 2026 [301]. An applicant may submit a full
      application after a 'discourage' notice on its concept paper [302].
