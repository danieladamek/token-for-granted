- id: nih-k12
  name: NIH Institutional Mentored Career Development Award (K12)
  family: people
  kind: training
  funder: nih
  funder_kind: federal
  owner: National Institutes of Health (HHS)
  what: |
    The K12 is awarded to a domestic institution, which then appoints later-stage postdoctoral fellows and junior faculty as "scholars" and gives them salary and research support for a period of protected time [753]. The institution, through a programme director, applies; the scholars do not [753]. NIH posted an NIH-wide parent K12 notice on June 22, 2026 [753] [1].
  funds: grant
  mechanism_code: K12
  assistance_listings:
  - '93.310'
  - '93.867'
