  owner: National Institutes of Health (HHS)
  what: |
    The K99/R00 helps a postdoctoral researcher move from a mentored position to an independent, tenure-track or equivalent faculty position [743]. The K99 phase gives up to 2 years of mentored support; the R00 phase gives up to 3 years of independent research support once the awardee has taken a faculty post [743]. Unlike the other K awards and the NRSA fellowships, the K99 has no citizenship requirement [743].
