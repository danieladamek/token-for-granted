    - public-higher-ed
    - private-higher-ed
    - nonprofit-501c3
    - nonprofit-other
    - tribal-government
    standing:
    - nih-nonprofit-other-than-higher-education
    investigator: Any individual with the skills, knowledge and resources to run the programme may be the training programme
      director, working with the organization [753]. Scholars must hold a research or clinical doctorate and commit at least
      9 person-months (75% of full-time professional effort); former principal investigators of substantial research grants
      such as the R01, and people previously supported by NIH or non-NIH career development awards, are not eligible as
      scholars [753].
    limits: An organization may submit more than one application if each is programmatically distinct [753].
  eligibility_note: 'Eligible organizations are domestic and include nonprofits with and without 501(c)(3) status, tribal
    governments, faith-based and community-based organizations and federal agencies; foreign organizations are not eligible
    [753]. Funded programmes may not use the race, ethnicity or sex of a participant or mentor candidate as an eligibility
    or selection criterion [753]. An earlier institutional K12 run by NIGMS, IRACDA, has no open notice: its last, PAR-22-212,
    closed October 3, 2024 [803]. The Grants.gov listing also shows the codes 93.T21 and 93.THR among its Assistance Listings
    [752].'
  citizenship: Scholars must be citizens or noncitizen nationals of the United States, or lawfully admitted for permanent
    residence, at the time of appointment [753].
  career_window: Later-stage postdoctoral fellows and junior faculty committed to an independent research career [753].
  budget_rules: Scholar salary follows the institution's policy for similar positions and may not exceed the congressionally
    mandated salary cap; application budgets are not limited but must reflect actual needs [753]. A Data Management and
    Sharing Plan is not applicable, and NIH does not issue awards that involve foreign subawards [753].
  cycle:
    pattern: Due dates run from October 12, 2026 through June 12, 2029 [753].
    current_notices:
    - id: PA-27-030
