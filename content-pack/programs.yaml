  sweep: people-E
  status: open
  applicant: institution
  what: A Training Project Grant pays an organization to run one occupational safety and health training programme [1063].
    Most awards support academic programmes at the undergraduate, graduate or residency level; some support non-academic
    programmes for specialised workforces [1062] [1058]. The organization applies; CDC makes no award directly to an individual
    [1063]. The notice, RFA-OH-25-003, takes applications once a year to October 2028; the next due date after the sweep
    is October 29, 2026 [1063].
  funds: grant
  mechanism_code: T03
  assistance_listings:
  - '93.262'
  who_may_apply:
    applicant_types:
    - public-higher-ed
    - private-higher-ed
    - nonprofit-501c3
    - nonprofit-other
    - state-government
    - county-government
    - city-government
    - tribal-government
    - for-profit
    - small-business
    investigator: Any individual with the skills, knowledge and resources to run the training programme may be its director
      [1063]. Trainees may be undergraduates (up to 4 years of support), graduate students (up to 5 years) or occupational
      medicine residents (up to 3 years) [1063].
    limits: An institution may submit two applications for academic training programmes; one application per organization
      is allowed for non-academic programmes; an organization may not apply for both kinds at once [1063]. A current T03
      recipient is not eligible for an Education and Research Center award or sub-award [1060].
    eligibility_note: 'A non-profit that is not a university may apply: the notice lists nonprofits with and without 501(c)(3)
      status, faith-based and community-based organizations and governments, and provides a non-academic track [1063]. Foreign
      organizations are not eligible [1062].'
  citizenship: Trainees must be U.S. citizens, noncitizen nationals of the United States or lawfully admitted permanent
    residents [1063].
  stipend: Stipends may not exceed the NIH National Research Service Award stipend levels, with an exception, on justification,
    for occupational medicine residency programmes; tuition and fees may be requested to the extent charged to students
    not supported by federal funds [1063].
  obligation: NIOSH training grants do not require payback [1063].
  cycle:
    pattern: One due date a year under a multi-year notice - January 21, 2025, October 30, 2025, October 29, 2026, October
      28, 2027 and October 24, 2028 [1063].
