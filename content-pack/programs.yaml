  indirect_costs: 'K99 phase: 8% of modified total direct costs. R00 phase: the sponsoring institution''s own indirect cost
    rate, counted inside the $249,000 yearly total [743].'
  cost_sharing: The parent K01 notice, read for this point, says it requires no cost sharing [744].
  review: 'Scored criteria: Candidate; Career Development Plan/Career Goals and Objectives; Research Plan; Mentor(s), Co-Mentor(s),
    Consultant(s), Collaborator(s); Environment and Institutional Commitment to the Candidate [743].'
  steps:
  - The applicant organization holds registrations in SAM (which issues the Unique Entity Identifier), eRA Commons and Grants.gov;
    the candidate needs an eRA Commons account and an ORCID registration [744].
  - The candidate counts postdoctoral research experience against the 4-year limit as of the due date [743].
