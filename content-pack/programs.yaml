    investigator: The candidate is enrolled in a PhD or equivalent research degree programme, is in the dissertation research
      stage at the time of award, and is expected to need 1 to 2 years to finish; the programme may not be one that requires
      post-degree clinical training [741].
    limits: Multiple applications from an institution are allowed, and there is no limit on the number of K00 awardees an
      organization may sponsor [741]. NIH's limit of six applications per principal investigator per calendar year applies
      to all activity codes except T codes and R13 conference grants; the notice names no exception for F or K codes [12].
  eligibility_note: The F99 applicant organization must grant PhD or equivalent research degrees [741]. Foreign organizations
    and non-domestic components of U.S. organizations are not eligible [741]. For the K00 phase all the listed organization
    types are eligible except federal laboratories [741]. The Grants.gov listing also shows the codes 93.T21 and 93.THR
    among its Assistance Listings [740].
  citizenship: By the time of award the candidate must be a citizen or a non-citizen national of the United States, or lawfully
    admitted for permanent residence [741].
  career_window: Dissertation stage of a research doctorate, with 1 to 2 years left; the K00 phase follows for up to 3 years
    [741].
  stipend: 'The F99 stipend and institutional allowance equal those of NRSA predoctoral fellows: $29,364 a year and $4,750
    a year for FY 2026 [741] [732]. In the K00 phase the participating institutes provide salary, fringe benefits and research
    development support at levels each institute sets [741]. K00 salary levels in NIH''s table of institute considerations,
    as returned, include up to $80,000 a year at NCI, up to $75,000 at NEI and $70,000 plus fringe benefits at NIGMS [804].'
  cycle:
    pattern: 'Three due dates a year: April 08, August 08 and December 08, starting August 08, 2026 [741].'
    current_notices:
    - id: PA-27-037
      opens: '2026-07-08'
      closes: '2029-04-09'
      note: Parent F99/K00, clinical trial not allowed; announcement type New; posted June 16, 2026; published on Grants.gov
        and not in the NIH Guide [741] [740].
  awards:
  - label: F99 phase
    amount: NRSA predoctoral stipend, tuition and fees contribution and institutional allowance
    duration: 1 to 2 years
    cite:
    - 741
  - label: K00 phase
    amount: salary, fringe benefits and research development support at levels set by the awarding institute
    duration: up to 3 years
    cite:
    - 741
  indirect_costs: The F99 phase carries no separate indirect cost payment; administration is covered by the institutional
    allowance [741].
  review: 'Three scored criteria: Candidate''s Goals, Preparedness and Potential; Research Training Plan; Commitment to
    Candidate, Mentoring and Training Environment [741].'
  steps:
  - The doctoral institution submits the F99 application on April 08, August 08 or December 08 [741].
  - 'The move to the K00 phase is not automatic: the fellow must complete the PhD and accept a full-time postdoctoral position,
    at a different institution and with a mentor other than the F99 sponsor [741].'
  - The fellow contacts the NIH programme official no later than 6 months before the proposed K00 start, and the postdoctoral
    institution sends the K00 materials no later than 4 months before it [741].
  - NIH staff check the K00 application for completeness and responsiveness and issue a notice of award to approved candidates
    [741].
