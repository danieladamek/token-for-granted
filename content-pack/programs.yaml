  family: people
  kind: training
  funder: ed-ope
  funder_kind: federal
  owner: U.S. Department of Education, Office of Postsecondary Education, Higher Education Programs
  status: no-current-notice
  applicant: institution
  what: GAANN gives a grant to an academic department of a university, which then awards fellowships to graduate students
    of superior ability who show financial need and are studying in a field the Secretary has designated as an area of national
    need [1017]. The department applies; the student does not [1016]. The last competition found was for fiscal year 2024;
    none is forecast or posted, and no page read says when the next will be [1016] [1018].
  funds: grant
  assistance_listings:
  - 84.200A
  who_may_apply:
    applicant_types:
    - public-higher-ed
    - private-higher-ed
    investigator: A fellow must have an excellent academic record, show financial need, plan to pursue the highest degree
      available in the field, and be a U.S. citizen or national, a permanent resident, a person in the United States for
      other than a temporary purpose who intends to become a permanent resident, or a citizen of a Freely Associated State
      [1016] [1017].
    note: The applicant is an academic department of an institution of higher education whose graduate programme has existed
      for at least four years [1017]. A department may work with an eligible nondegree-granting institution that has formal
      arrangements for the support of doctoral dissertation research; that is the only place a non-university research institution
      appears, and it does not apply on its own [1017] [1016].
  citizenship: U.S. citizens or nationals, permanent residents, those in the United States for other than a temporary purpose
    with the intention of becoming permanent residents, or citizens of the Freely Associated States [1017].
  stipend: The institution pays a stipend equal to that of National Science Foundation graduate fellowships, reduced where
    needed so as not to exceed the fellow's demonstrated financial need; the institutional payment was $19,051 per fellow
    for academic year 2024-25 [1017] [1016].
  cycle:
    pattern: 'Competed by notice in the Federal Register, not every year: Grants.gov shows competitions posted in 2009,
      2011, 2015, 2018, 2021 and 2024 [1018]. The fiscal year 2024 deadline was June 24, 2024 [1016]. A second Grants.gov
      search on 2026-10-04 shows seven archived notices and none posted or forecast in 2025 or 2026, so no competition was
      held in either year [1071]. The fiscal year 2024 notice says the Department may make additional awards in later years
