- id: nsf
  name: U.S. National Science Foundation
  funder_kind: federal
  parent: none stated on the pages read
  what: 'NSF funds research and education across science and engineering through grants, cooperative agreements and fellowships
    [155]. It is organised in eight directorates: BIO, CISE, ENG, GEO, MPS, SBE, STEM Education (EDU) and TIP [167]. NSF
    states that it receives approximately 43,000 proposals a year and makes roughly 8,300 awards [152].'
  how_it_decides: Every proposal is judged on two criteria approved by the National Science Board, Intellectual Merit and
    Broader Impacts [157] [160]. A programme officer checks the proposal, obtains reviews from ad hoc reviewers, a panel
    or both, and recommends award or decline; the PAPPG as printed places final programmatic approval at division or office
    level, followed by a business review in the Division of Grants and Agreements [157]. Since December 8, 2025 a full proposal
    must have at least two reviewers, who may be NSF staff [149]. In December 2025 NSF realigned its divisions into sections,
    clusters or thematic areas to reduce layers, and the pages read do not name the post that now gives programmatic approval
    [168] [177]. Executive Order 14332 requires senior-appointee review of funding announcements and discretionary awards
    at every agency [246]. NSF returns without review proposals it judges not aligned with agency priorities [154].
  cycle: NSF aims to give a decision within six months of submission and generally issues an award to an academic institution
    within 30 days of the recommendation [160] [165]. Twelve foundational-research notices posted in August 2026 mostly
    accept proposals at any time; other solicitations keep deadlines, target dates or windows [192] [156] [189]. MPS Materials
    counts its one-proposal limit by fiscal year, beginning October 1 [215].
  who_to_talk_to: Each funding opportunity lists one or more programme officers, and NSF staff hold webinars and office
    hours [158]. The 2026 core solicitations give a mailbox for each programme, for example bio-fl@nsf.gov and eccs-epmqd@nsf.gov
    [183] [200]. Policy questions go to policy@nsf.gov and system questions to the Research.gov help desk [165].
  where_it_posts: 'NSF posts opportunities in its Funding Search at nsf.gov/funding/opportunities, on directorate pages,
    and on Grants.gov [155]. It publishes four kinds of notice: programme descriptions, programme announcements, programme
    solicitations and Dear Colleague Letters; it also uses Broad Agency Announcements for some use-inspired work [156] [158].'
