    Office notice uses a peer panel of 4-7 NOAA employees, while the NCCOS notice uses mail review by individual experts
    followed by an independent peer panel. In both, a Selection Official awards in rank order unless a published selection
    factor (funding, balance, duplication, programme priorities, past performance) justifies another order. Both notices
    cite Executive Orders 14173, 14281 and 14303 [432] [477].'
