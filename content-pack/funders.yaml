- id: nih-nigms
  name: National Institute of General Medical Sciences
  funder_kind: federal
  parent: NIH
  what: |
    NIGMS is one of NIH's institutes [143]. It runs the Maximizing Investigators' Research Award (MIRA), an R35 that supports an investigator's whole NIGMS-relevant programme through one grant [72] [73].
  how_it_decides: NIGMS generally prioritises funding MIRA over R01 awards, is unlikely to award more than one NIGMS R01
    to a PI, and needs council approval when an investigator's total annual costs exceed $1.5 million; early stage investigator
    status is one of the factors it lists [71].
  cycle: MIRA has its own due dates in January and May (established and new investigators) and in October and February (early
    stage investigators) [73] [74].
  who_to_talk_to: NIGMS gives two MIRA mailboxes, one for established and new investigators and one for early stage investigators
    [72].
  where_it_posts: On Grants.gov, like all NIH institutes [9].
