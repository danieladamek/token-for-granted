  funder_kind: federal
  parent: USDA
  what: 'USDA''s extramural funding agency for agricultural research, education and extension. It has three kinds of funding:
    competitive grants; capacity grants to land-grant institutions, schools of forestry and schools of veterinary medicine;
    and non-competitive grants directed by Congress. Its largest competitive programme is the Agriculture and Food Research
    Initiative [422] [406].'
  how_it_decides: Peer review panels rank applications against criteria published with each notice; NIFA's regulation requires
    scientific peer review or merit review and gives applicants their reviews without reviewer names. After review the Project
    Director is told of a recommendation, a pre-award administrative review follows, Awards Management approves the award
    and sets terms, and Financial Management approves the funding. FY 2026 notices add that projects are to align with the
    five priorities in Secretary's Memorandum 1078-020 [422] [416] [409] [412] [418].
  cycle: One notice per programme per fiscal year. For FY 2026 the AFRI Foundational and Applied Science notice was posted
    August 1, 2025 with December 2025 deadlines; Strengthening Agricultural Systems was posted January 29, 2026; Organic
    Agriculture Research and Extension March 11, 2026; Specialty Crop Research Initiative April 13, 2026. FY 2027 AFRI deadlines
    are to be announced in the FY 2027 notices [408] [424].
  who_to_talk_to: Each programme area priority has its own contact address (for example A1102@usda.gov), and each notice
    names programme contacts; the AFRI Coordination Team is the general AFRI contact. Application questions go to GrantApplicationQuestions@usda.gov
    [404] [403] [421].
