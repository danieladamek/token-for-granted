- id: doj-ovw
  name: Office on Violence Against Women
  funder_kind: federal
  parent: DOJ
  sweep: service-B
  what: OVW administers the grant programmes authorised by the Violence Against Women Act of 1994 and later laws [1264].
    Its discretionary programmes fund victim services, legal assistance, housing and justice-system responses; its formula
    programmes (STOP, Sexual Assault Services, and coalition grants) go to states and coalitions [1263]. Eligibility differs
    from programme to programme [1264].
  how_it_decides: A responsiveness review removes ineligible or incomplete applications. Peer reviewers, who may be internal,
    external or both, score the rest. A programmatic review can deduct up to 25 points each for activities that compromise
    victim safety, for out-of-scope activities and for past performance, and add up to 10 for the notice's priorities. After
    a risk review the OVW Director decides, may consider geographic variety, and the decision is not subject to appeal [1348].
  cycle: OVW publishes a release plan. In FY2026 notices came out between June 2 and September 1, 2026, with closing dates
    from July 2 to October 8, 2026 [1266] [1263]. Awards in the notices read start October 1, 2026 [1267]. Twelve programmes
    were marked as not accepting applications in FY2026 [1263].
  who_to_talk_to: OVW.Info@usdoj.gov and 202-307-6026 [1263]. OVW publishes sample documents and a companion guide for applicants
    [1349] [1270].
