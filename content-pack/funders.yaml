    equivalency determination [2120]. The foundation does not fund institutions in China, including Hong Kong, or fiscal
    sponsors or agents [2120].
  unsolicited: open-call-only
  unsolicited_note: 'The policies page states: "The Simons Foundation will not consider unsolicited requests for funding."
    Applications come only through a posted request for applications [2120] [2119].'
  how_to_approach: A researcher finds an open request for applications on the Funding Opportunities page and applies as
    that request says; most begin with a letter of intent (LOI) [2119]. Targeted Grants in MPS takes letters of intent on
    a rolling basis [2119].
  cycle: Each request for applications has its own deadline. On 2026-10-04 six were open with deadlines from October 6,
    2026 to January 27, 2027, three were rolling, and more than 40 were marked closed [2119].
  typical_grant: Varies by programme. A Simons Collaboration receives up to $2 million per year for four years; a Pivot
    Fellowship pays one year of salary and may be followed by a research award of up to $1.5 million over five years [2121]
    [2122].
