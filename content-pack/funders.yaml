- id: nih-nhlbi
  name: National Heart, Lung, and Blood Institute
  funder_kind: federal
  parent: NIH
  what: |
    NHLBI is one of NIH's institutes [143]. Its funding-policy page sets a shorter funded period for most competing R01s than the five-year maximum in the parent notice [70] [4].
  how_it_decides: NHLBI states it has no payline or strict score cut-off; decisions rest on scientific and technical merit,
    its advisory council's recommendations, relevance to its strategic priorities, portfolio balance, workforce development
    and potential public health impact [70].
  cycle: NHLBI funds approved investigator-initiated competing R01 applications for up to four years, with exceptions that
    include early stage investigators, clinical studies and clinical trials; it gives no inflationary increases for future
    years [70].
  where_it_posts: On Grants.gov, like all NIH institutes [9].
