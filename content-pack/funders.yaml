  funder_kind: federal
  parent: U.S. Senate
  sweep: capacity-C
  what: The Committee writes the Senate's annual appropriations bills and runs the Senate side of the earmark process, which
    it calls Congressionally Directed Spending [1674]. Only a Senator may submit a request; the Committee considers only
    requests that meet its rules and that it judges appropriate for federal support [1674].
  how_it_decides: Funding for these items may not exceed one percent of discretionary spending, for-profit entities are
    ineligible, and each Senator certifies that neither the Senator nor immediate family has a financial interest in a requested
    item [1675]. Each subcommittee sets a per-Senator limit on requests, from 10 in Homeland Security to 65 in Labor-HHS-Education
    and in Transportation-HUD [1675]. Rule XLIV of the Standing Rules of the Senate applies [1676].
  cycle: For FY27 the subcommittee deadlines for Senators ran from April 7 to May 7, 2026 [1675]. Senators post their requests
    on their websites within 15 calendar days of the subcommittee deadline [1676]. The same certification and posting rules
    applied in the FY2026 cycle [1678].
  who_to_talk_to: The offices of the organisation's two Senators, each of which sets its own deadline and form and must
    publish its requests and certification on its website [1674].
  where_it_posts: General guidance and a chart of requests on its page for the fiscal year; tables of projects in Senate
    bills and in enacted laws on its Congressionally Directed Spending page for the fiscal year [1674] [1677].
  budget: []
  governing_terms: The Committee's general guidance for the fiscal year and its reforms and regulations document, which
