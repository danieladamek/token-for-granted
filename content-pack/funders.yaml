  sweep: capacity-C
  what: 'The Committee writes the House''s annual appropriations bills and runs the House side of the earmark process, which
    it calls Community Project Funding [1667]. It does not take applications from organisations: only a Member may submit
    a request, and the money, if enacted, is awarded by the federal agency whose account the project sits in [1667] [1672].'
  how_it_decides: Each Member may submit at most 20 requests across all bills, with a written federal nexus statement and
    evidence of community support for each [1667]. Each subcommittee publishes the accounts it will take requests in and
    the kinds of recipient and project it will consider [1668] [1669]. Total Community Project Funding will not exceed one
    half of one percent of discretionary spending [1667].
  cycle: For FY27 the subcommittee deadlines for Members ran from March 13 to March 27, 2026, and Members had to post their
    requests online by dates from March 27 to April 17, 2026 [1668]. For FY26 the Transportation-HUD deadline was May 23,
    2025 [1707].
  who_to_talk_to: The office of the organisation's own Member of the House, which sets its own earlier deadline and form;
    the Committee requires each Member to post every request online [1666] [1667].
  where_it_posts: Guidance by subcommittee on its Member requests guidance page, and tables of requested and included projects
    on its Community Project Funding page [1668] [1666].
