  funder_kind: federal
  parent: Department of State
  what: The Bureau of Educational and Cultural Affairs runs the Department of State's educational, professional and cultural
    exchanges [1026]. The Fulbright U.S. Student and U.S. Scholar programmes are Department of State programmes, funded
    by the U.S. Government and administered by the Institute of International Education (IIE) [1022] [1025]. Under an interagency
    agreement announced November 18, 2025 the Department of State also administers the Fulbright-Hays grant programmes of
    the Department of Education [672]. The Fulbright Program's own question-and-answer page says its primary funding is
    an annual appropriation by Congress to the Department of State, that the programme awards approximately 9,000 grants
    annually, and that the Fulbright Foreign Scholarship Board has 12 members appointed by the President [1102].
  how_it_decides: For the U.S. Student Program, IIE checks eligibility, a National Screening Committee of U.S. faculty reviews,
    and recommended applications go to U.S. embassies or binational Fulbright Commissions, the Department of State and the
    Fulbright Foreign Scholarship Board [1024].
  cycle: 'One competition a year for each programme: the U.S. Scholar deadline for 2027-2028 was September 15, 2026 and
    the U.S. Student deadline is October 6, 2026; student decisions are released from March to June [1025] [1022] [1024].'
  who_to_talk_to: An enrolled student starts with the Fulbright Program Adviser on campus [1023].
  where_it_posts: Fulbright awards for U.S. applicants are posted on the IIE-run programme sites, us.fulbrightonline.org
    and fulbrightscholars.org, not on Grants.gov [1022] [1025].
