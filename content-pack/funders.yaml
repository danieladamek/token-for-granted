# funders.yaml — Taken for Granted content pack. Written by source/sweeps/consolidate.py from the sweep files; schema in EXTENSIONS.md.
# Every quote and figure came through a summarising fetch layer. Each source was re-read against its live page on the date in its
# rechecked field (source/recheck/); recheck: true marks a source with an item the second reading did not confirm.
- id: nih
  name: National Institutes of Health
  funder_kind: federal
  parent: HHS
  what: |
    NIH describes itself as the largest public funder of biomedical research in the world [117]. It is made up of 27 institutes and centers, each with its own research agenda [143]. Its public budget page says nearly 82 percent of its funding goes out as extramural awards to universities, medical schools and other research institutions, a share computed on FY 2023 figures [56]. In FY 2025 it spent more than $26.5 billion on research project grants [27]. Organizations that receive NIH grants can be domestic or foreign, public or private, non-profit or for-profit [117].
  how_it_decides: |
    Review has two levels: a scientific review group (study section) first, then the national advisory council or board of the institute that would pay [38]. Since 2025 the Center for Scientific Review (CSR) organizes first-level review of all NIH applications; before that, 23 institute review branches handled about 22 percent of them [55] [54] [40]. For most research project codes, reviewers use the simplified framework in force for due dates from January 25, 2025: Importance of the Research and Rigor and Feasibility are each scored 1 to 9, and Expertise and Resources is rated sufficient or insufficient [39] [41]. Under modifications that began after the October 2025 lapse in appropriations and now run through the January 2027 council round, about 30-35 percent of applications are discussed, a middle third is labelled 'competitive but not discussed', and summary statements are shortened [126] [16] [84]. The council makes recommendations and the institute or center director decides [38] [15]. Under the unified funding strategy, effective with the January 2026 council round, institutes do not rely on paylines; each weighs mission alignment, scientific merit read from the whole review, breadth of topics, career stage, broad distribution and geographic balance of funding, and available funds, and each publishes the factors it uses [123] [13] [67].
  cycle: |
    NIH runs three review cycles a year [2]. Cycle I applications are due January 25 to May 7, reviewed in June-July, go to council in August or October and start in September or December at the earliest; Cycle II applications are due May 25 to September 7, reviewed in October-November, go to council in January and start in April; Cycle III applications are due September 25 to January 7, reviewed in February-March, go to council in May and start in July [2]. The federal fiscal year starts October 1, and NIH began FY 2027 under a continuing resolution that runs through December 11, 2026 [83]. NIH's yearly fiscal-policy and legislative-mandate notices follow the full-year appropriation; for FY 2026 they came out on March 18, 2026 [21] [62].
  who_to_talk_to: |
    Applicants are sent first to their own organization's sponsored programmes office [146] [119]. At NIH, programme officials handle the scientific and programmatic side and can say whether a plan fits their institute; scientific review officers manage peer review; grants management officers and specialists handle the business side [117] [120] [106]. A programme official is found through the Matchmaker tool, Section VII of a funding notice, or an institute's profile page [120]. Programme officials do not co-write applications or discuss receipt, referral or review details [92]. System problems go to the eRA Service Desk [146].
  where_it_posts: |
    From fiscal year 2026 Grants.gov is NIH's single official source for grant and cooperative agreement funding opportunities; NIH no longer posts them in the NIH Guide for Grants and Contracts, which continues for policy and informational notices [9] [10]. NIH's Explore NIH Opportunities tool searches Grants.gov with NIH-specific filters [93] [105]. The parent announcements are listed on one NIH page [1]. Highlighted Topics name research areas an institute wants to see; they are not funding opportunities, and an application answering one goes in through a parent announcement or another broad notice [11] [142].
