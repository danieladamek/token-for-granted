- id: nps-stlpg
  name: National Park Service, State, Tribal, Local, Plans & Grants Division (Historic Preservation Fund grants)
  funder_kind: federal
  parent: Department of the Interior
  sweep: capacity-C
  what: 'This division of the National Park Service runs the Historic Preservation Fund''s grants: formula grants to State
    and Tribal Historic Preservation Offices, competitive project grants and disaster recovery grants [1691] [1692]. The
    competitive programmes are African American Civil Rights, Save America''s Treasures, Paul Bruhn Historic Revitalization,
    History of Equal Rights, Semiquincentennial, HBCU, Underrepresented Communities and Tribal Heritage grants [1694].'
  how_it_decides: National Park Service personnel, and in some cases independent reviewers, score applications against the
    criteria in each notice; the Save America's Treasures notice uses four criteria at 25 points each [1705].
  cycle: A notice appears only after Congress has provided money [1693]. The FY2025 competitive notices were posted between
    May 15 and June 11, 2026 and had all closed by July 28, 2026; none was open or forecast on the sweep date [1697].
  who_to_talk_to: The division's grants mailbox, STLPG@nps.gov, is the contact on each notice [1696] [1699].
  where_it_posts: All grants are applied for through Grants.gov; when a programme is taking applications, the division's
    how-to-apply page links to the Grants.gov notice [1691] [1693].
