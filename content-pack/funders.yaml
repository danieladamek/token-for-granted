- id: nih-niaid
  name: National Institute of Allergy and Infectious Diseases
  funder_kind: federal
  parent: NIH
  what: |
    NIAID is one of NIH's institutes [143]. Its funding-policy page states rules that go beyond the NIH-wide ones [68].
  how_it_decides: NIAID says it no longer uses a score cut-off as the basis for funding; it weighs the peer review assessment,
    investigator status, balance across its strategic plan, and the investigator's other active funding, and aims for a
    success rate for early stage and new investigators at or above that of established investigators [68].
  cycle: Select R01s are multi-year funded for a maximum of 4 years, and all unsolicited domestic R21 and R03 awards are
    multi-year funded for the full project period; applicants request costs without increases for inflation [68].
  who_to_talk_to: NIAID strongly encourages consultation with its staff at least 15 weeks before a P01 due date and at least
    10 weeks before a clinical trial U01 submission [113] [116].
  where_it_posts: On Grants.gov, like all NIH institutes [9].
