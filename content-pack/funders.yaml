- id: neh
  name: National Endowment for the Humanities
  funder_kind: federal
  what: 'NEH describes itself as the largest federal funder of the humanities; it makes grants to colleges, universities,
    museums, libraries, historic sites, research institutions, independent scholars and other nonprofits [630]. Since August
    20, 2025 its grantmaking sits in four divisions: Federal/State Partnership, Collections & Infrastructure, Lifelong Learning,
    and Research [641]. On the sweep date the Division of Research listed Collaborative Research and Scholarly Editions
    and Translations for organisations, alongside four programmes for individuals [635].'
  how_it_decides: Outside evaluators sit on peer review panels and rate each application; NEH staff recommend applications
    in light of those ratings; the National Council on the Humanities, up to twenty-six members nominated by the President
    and confirmed by the Senate, reviews the recommendations; the Chair makes all final funding decisions [638]. The 2026
    notices state that the Chairman has the sole authority to make final funding decisions [634].
  cycle: Each programme has its own annual deadline [632] [648] [630]. In 2026 the two research programmes for organisations
    closed on September 16, 2026, Collections Stewardship had deadlines on May 11 and December 15, 2026, and the three deadlines
    listed as upcoming on the grants page were all December 9, 2026 in the Division of Lifelong Learning [632] [648] [630].
    The National Council meets at least twice a year [634]. Notification for the September 2026 deadline is expected in
    July 2027 [632].
  who_to_talk_to: 'Programme questions go to the division named in the notice: the Division of Research at research@neh.gov
    or (202) 606-8200, with programme mailboxes collaborative@neh.gov and editions@neh.gov; the Division of Collections
    & Infrastructure at collections@neh.gov or (202) 606-8570 [635] [631] [633] [645]. Administrative and cost questions
    go to the Office of Grant Management at grantmanagement@neh.gov or 202-606-8494 [644].'
