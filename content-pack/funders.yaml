  what_it_funds: Research, by way of requests for applications that the foundation posts. Those listed on 2026-10-04 span
    mathematics and the physical sciences (MPS), plant biology, ecology and evolution, and calls from its SFARI programme
    [2119]. The Pivot Fellowship also names astronomy, biology, chemistry, earth sciences and neuroscience [2122].
