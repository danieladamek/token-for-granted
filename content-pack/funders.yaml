- id: nih-nci
  name: National Cancer Institute
  funder_kind: federal
  parent: NIH
  what: |
    NCI is one of NIH's institutes [143]. It follows the NIH Unified Funding Strategy and publishes the reductions it applies to requested budgets [66] [69].
  how_it_decides: NCI no longer uses paylines to choose competing grants; it weighs scientific merit, public health significance,
    novelty, portfolio representation, career stage and the investigator's funding level [69].
  cycle: New R01 and U01 awards at or under $250,000 in direct costs are reduced by 6.5% (at or under $175,000) or 8.5%
    (over $175,000); new R01 and U01 awards over $250,000 are reduced by 17%; R21 awards by 6.5% or 8.5%; new P01, UM1 and
    R33 awards by 13% or 17%; renewals are funded at an NCI cap [69].
  where_it_posts: NCI states that all notices of funding opportunity are posted by NIH on Grants.gov [66].
