- id: financial-conflict-of-interest-policy
  name: Financial conflict of interest (FCOI) policy for PHS-funded research
  what: An institution that applies for or receives Public Health Service research funding by grant or cooperative agreement
    must have a written, enforced policy on financial conflicts of interest and must post it on a public web site (42 CFR
    50.604(a)) [2002]. Investigators disclose their significant financial interests to the institution, which decides whether
    any of them is a conflict, manages it and reports it to the funding agency [2002] [2003]. Phase I SBIR and STTR applications
    are outside the rule [2002] [2003].
  applies_when: 'The rule applies to each institution applying for or receiving PHS research funding, NIH included, and
    through it to each investigator: the project director or principal investigator and any other person responsible for
    the design, conduct or reporting of the research [2002] [2003]. A subrecipient either follows its own compliant policy
    or the awardee''s, as the written subaward agreement states [2002].'
  who_does_it: both
  steps:
  - The institution adopts a written, enforced policy and posts it on its public web site; NIH also requires the policy
    to be submitted through the eRA Commons Institution Profile (IPF) Module [2002] [2003].
  - Each investigator completes training before engaging in PHS-funded research and at least every four years [2002].
  - Each investigator discloses significant financial interests no later than the time of application and updates the disclosure
    at least annually [2002].
  - A significant financial interest exists when remuneration from a publicly traded entity in the preceding twelve months
    plus equity held exceeds $5,000, when remuneration from a non-publicly traded entity exceeds $5,000, or when the investigator
    holds any equity in a non-publicly traded entity [2002].
  - The institution reports each identified conflict to the awarding component before spending award funds, and within sixty
    days for conflicts identified later; for NIH grants the report is filed in the eRA Commons FCOI Module [2002] [2003].
  - Information on conflicts held by senior/key personnel is made available on a public web site or by written response
    within five business days of a request [2002].
  - By signing an application the Authorized Organization Representative certifies the institution's compliance with the
    regulation [2003].
  cost: No fee is stated; NIH publishes an FCOI Policy Development Checklist, updated 06/29/2026, for institutions writing
    or revising a policy [2003].
  renewal: Training is repeated at least every four years and disclosures are updated at least annually [2002]. The policy
    is kept up to date [2002].
  common_problems: When a conflict is not identified or managed in time, the institution completes a retrospective review
    within 120 days of determining the noncompliance [2002] [2003].
  official_url: https://grants.nih.gov/policy-and-compliance/policy-topics/fcoi
  pending_changes: []
  as_of: '2026-10-04'
  sources:
  - 2002
  - 2003
  sweep: rules-C
- id: nsf-conflict-of-interest-policy
  name: NSF conflict of interest policy requirement
  what: NSF requires each recipient organisation that employs more than fifty persons to maintain a written and enforced
    conflict of interest policy (PAPPG Chapter IX.A) [2004]. The Authorized Organizational Representative certifies with
    each proposal that the policy is in place and that conflicts have been managed [257].
  applies_when: The requirement applies to NSF recipient organisations with more than fifty employees [2004]. An interest
    is not a significant financial interest when it does not exceed $10,000 in value and does not represent more than a
    5% ownership interest in any single entity [2004].
  who_does_it: both
  steps:
  - The organisation maintains a written and enforced policy [2004].
  - Investigators give the organisation their financial disclosures at the time the proposal is submitted to NSF, and update
    them annually or when new reportable interests arise [2004].
  - The organisation tells NSF's Office of the General Counsel if it finds it cannot satisfactorily manage a conflict [2004].
  - Records of disclosures and of actions taken are kept at least three years beyond the end of the award [2004].
  renewal: Disclosures are updated annually during the award [2004].
  official_url: https://www.nsf.gov/policies/pappg/24-1/ch-9-recipient-standards
