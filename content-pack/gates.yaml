- id: common-forms-sciencv
  name: Common Forms (Biographical Sketch; Current and Pending (Other) Support) prepared in SciENcv
  what: The Common Forms are two government-wide disclosure forms, the Biographical Sketch and the Current and Pending (Other)
    Support form, written by the National Science and Technology Council Research Security Subcommittee to implement NSPM-33,
    with NSF as steward [249]. SciENcv, a researcher profile system run by NCBI at the National Library of Medicine, is
    the tool in which they are produced [1943]. NIH states that there is no blank template to complete outside SciENcv [1942].
    Each agency adopts the forms on its own date [249].
  applies_when: 'NSF: the biographical sketch and current and pending (other) support must be prepared in SciENcv under
    the PAPPG in force (NSF 24-1) [257]. NIH: required for due dates and for JIT, RPPR and prior approval submissions on
    or after January 25, 2026, together with the NIH Biographical Sketch Supplement; warnings only through May 7, 2026 and
    system errors that stop submission from May 8, 2026 [31] [1941]. DOE: for funding opportunities published on or after
    January 1, 2026, under FAL 2026-02 of December 3, 2025, for covered individuals at the applicant and at subrecipients
    [1945] [1944]. USDA: under the General Terms and Conditions effective December 31, 2025, at application and updated
    annually [1948]. NASA: NASA-specific forms in SciENcv, accepted alongside Word templates from June 25 to August 31,
    2026 and alone from September 1, 2026 [1946].'
  who_does_it: person
  steps:
  - Sign in to SciENcv with eRA Commons, ORCID, Login.gov, Google, Microsoft or academic institution credentials; NCBI no
    longer supports its own native logins [1980] [1943].
  - 'Complete the form the agency calls for: the Common Form, with the NIH Biographical Sketch Supplement for NIH, or the
    NASA-specific form for NASA [1942] [1946].'
  - Certify the document; NSF requires each person to certify the current and pending (other) support information before
    submission [257].
  - Download the PDF that SciENcv produces and give it to the applicant organisation for the application or report [1942]
    [279].
  time: No time is stated on the pages read [1943].
  cost: No fee is stated on the pages read [1943].
  renewal: The forms are prepared afresh for each submission; USDA requires an update annually during the award, and NIH
    requires them with each RPPR [1948] [31].
  common_problems: An account holder may invite a delegate to manage SciENcv documents, but the person named certifies the
    content [1980] [257]. NIH's notice says failure to use the correct forms causes withdrawal of the application; its implementation
    page says that from May 8, 2026 the system stops any submission without compliant Common Forms [31] [1941]. NASA's forms
    are NASA-specific, so a form produced for another agency is not the NASA form [1946].
  official_url: https://www.ncbi.nlm.nih.gov/sciencv/
