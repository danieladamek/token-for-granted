- id: lobbying-certification
  name: Lobbying certification and disclosure (31 U.S.C. 1352)
  what: A person who requests or receives a federal grant or cooperative agreement of more than $100,000 files a certification,
    and a disclosure form if one is required [2039]. HHS describes the certification as a statement that the applicant has
    not made unallowable lobbying payments and will report non-federal funds used for lobbying [528]. The rule comes from
    section 319 of Public Law 101-121 (31 U.S.C. 1352) and each agency codifies it; HHS's version is 45 CFR part 93 [2039].
  applies_when: The threshold is an award exceeding $100,000 for grants, cooperative agreements and contracts, and $150,000
    for loans and loan guarantees [2039]. HHS applies the certification to applicants with total proposed costs of more
    than $100,000 [528].
  who_does_it: organisation
  steps:
  - Certify when asking for the award and again on receiving it unless already filed; at NSF the governmentwide certification
    is made in SAM.gov [2039] [257].
  - 'File the disclosure form, Standard Form LLL (Disclosure of Lobbying Activities), where it applies: the Office of Justice
    Programs requires it if the applicant has paid or will pay anyone to lobby and the award exceeds $100,000, and an NEH
    notice lists it as conditionally required [619] [648].'
  - Collect certifications from subrecipients above $100,000 and pass disclosure forms up, tier by tier, to the agency [2039].
  renewal: A disclosure is updated at the end of any calendar quarter in which an event materially affects its accuracy,
    such as a cumulative increase of $25,000 or more in lobbying payments [2039].
