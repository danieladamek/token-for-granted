- id: nsf-foreign-financial-disclosure-report
  name: NSF Foreign Financial Disclosure Report (FFDR)
  what: Each institution of higher education that receives NSF funding reports each year its current financial support of
    $50,000 or more from a foreign source associated with a foreign country of concern, under section 10339B of the CHIPS
    and Science Act (42 U.S.C. 19040) [247]. The report is filed in Research.gov [247] [2014].
  applies_when: The report applies to direct recipients of NSF awards that are institutions of higher education [2014].
    The countries of concern named are China, North Korea, Russia and Iran, with others the Secretary of State may designate
    [2014].
  who_does_it: organisation
  steps:
  - File the report in Research.gov for the period July 1 through June 30; for the period ending June 30, 2025 the portal
    opened September 1, 2025 and the report was due October 31, 2025 [2014].
  renewal: The report is annual [247]. The dates for the period ending June 30, 2026 were not found in this sweep [2014].
