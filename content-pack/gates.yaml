- id: grants-gov-registration
  name: Grants.gov organisation registration
  what: Grants.gov is the federal site where most agencies post funding opportunities and receive applications; an organisation
    registers there after SAM.gov, using its UEI [1895]. The person named in SAM.gov as Electronic Business Point of Contact
    (EBiz POC) controls the organisation's Grants.gov roles, and at least one person must hold an Authorized Organization
    Representative (AOR) role to submit [1895] [1916]. Applications are prepared and submitted in Workspace [1915].
  applies_when: Any organisation applying to an agency that takes applications through Grants.gov, which in this pack includes
    NIH, NSF (as an alternative to Research.gov), DOE, CDMRP (full applications from extramural organisations), DOJ (the
    SF-424 step), HRSA, SAMHSA, the Department of Education, NIFA and the NEA (Part 1) [1909] [161] [279] [1923] [619] [1925]
    [548] [1928] [1930] [1934].
  who_does_it: both
  steps:
  - Complete SAM.gov registration, naming the main contact as Electronic Business Point of Contact and receiving the UEI
    [1895].
  - Each user creates a Login.gov account, which Grants.gov requires of all users [1965].
  - The EBiz POC registers on Grants.gov with the same email address as in SAM.gov, validates the address with a temporary
    code, and adds an organisation applicant profile with the UEI [1895] [1965].
  - 'The EBiz POC, who holds the Expanded AOR role automatically, assigns roles to colleagues in the Manage Profiles tab:
    Expanded AOR, Standard AOR, Workspace Manager or a custom role [1895] [1916].'
  - A user with at least the Workspace Manager role creates a workspace for the opportunity; a user with an AOR role submits
    [1916] [1915].
  time: Grants.gov gives no figure of its own beyond the SAM.gov wait; after SAM registration the Department of Education
    says it may be 24 to 48 hours before the information can be used in Grants.gov [1928]. NIH says to allow one business
    day or more, depending on how quickly the EBiz POC responds; DOE says an account can be created online in minutes; CDMRP
    says registration is processed immediately with a UEI [1909] [279] [1923].
  cost: No fee is stated on the Grants.gov pages read; the page describes SAM.gov registration, the prerequisite, as free
    [1895].
  renewal: The registration itself is one-time, but submission depends on an active SAM.gov registration, renewed yearly
    [1895] [1965] [548]. A Grants.gov account is deactivated automatically after 365 days of inactivity [1966].
  common_problems: 'Agencies ask for submission well ahead of the deadline because Grants.gov validates a package after
    receipt: DOJ urges at least 48 hours, SAMHSA 24-72 hours, and NSF at least five business days [619] [548] [161]. The
    Department of Education extends a deadline only for a technical problem with the Grants.gov system that is confirmed
    by a Support Desk case number [1928]. The PDF forms in the Grants.gov forms repository are samples and cannot be submitted
    [1918].'
  official_url: https://www.grants.gov/applicants/applicant-registration
  pending_changes:
  - status: announced
    date: '2027'
    text: The Simpler.Grants.gov roadmap gives 2027 as the stage at which Simpler.Grants.gov replaces legacy Grants.gov
      and becomes the default experience [1919].
