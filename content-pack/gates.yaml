- id: public-access-compliance
  name: NIH Public Access Policy compliance
  what: Under the 2024 NIH Public Access Policy (NOT-OD-25-047), an author accepted manuscript from NIH-funded work that
    is accepted by a journal on or after July 1, 2025 is submitted to PubMed Central on acceptance and is public, without
    embargo, on the official date of publication [125]. The 2024 policy replaces the 2008 policy [125]. The 2022 OSTP memorandum
    had directed agencies to make federally funded publications freely available without embargo [2033].
  applies_when: The policy applies to journal manuscripts arising from NIH funding and accepted on or after July 1, 2025
    [125].
  who_does_it: both
  steps:
  - Submit the author accepted manuscript to PubMed Central when the journal accepts it [125].
  - Show compliance by the PubMed Central identifier (PMCID) of each paper [125].
  - 'Read the two supplements: NOT-OD-25-048 on publication costs and NOT-OD-25-049 on the government use licence and rights
    [125].'
  cost: Submission to PubMed Central carries no fee stated on the page read [125]. Publication charges paid to journals
    are the subject of a pending NIH limit [2030].
  official_url: https://grants.nih.gov/policy-and-compliance/policy-topics/public-access/nih-public-access-policy-overview
  pending_changes:
  - status: announced
    date: '2025-07-08'
    text: The NIH Director said NIH will cap allowable publication costs starting in FY 2026 [2030]. A request for information
      of July 30, 2025 set out five options, from no support for publication costs to limits of $2,000, $3,000 or $6,000
      per publication or 0.8% of direct costs or $20,000, whichever is greater, with January 1, 2026 as the intended effective
      date [2031]. No final policy was found in this sweep, and NIH's list of new initiatives, updated September 17, 2026,
      does not list one [2087].
