- id: unique-entity-identifier
  name: Unique Entity Identifier (UEI)
  what: The Unique Entity Identifier is the identifier SAM.gov assigns to an entity; 2 CFR 25.400 defines it as the universal
    identifier assigned by SAM.gov to uniquely identify an entity [1899]. It replaced the DUNS number on April 4, 2022 [1969]
    [1909]. An entity can get a UEI alone, without a full registration, by giving its legal business name and physical address;
    with a UEI only it cannot apply directly for federal awards [1897].
  applies_when: Every applicant includes its UEI in each application, and every subrecipient must have one before a subaward
    can be made [1899] [1900]. A UEI alone is enough for an organisation that will only be a subrecipient; a prime applicant
    needs the full registration [1897] [1900]. NSF also requires named subrecipients to register in Research.gov, and SAMHSA
    states that a UEI is required for recipients and all sub-recipients [156] [548].
  who_does_it: organisation
  steps:
  - Sign in to SAM.gov with a Login.gov account [1897].
  - Choose 'Get a Unique Entity ID' (UEI only) or 'Register Entity' (full registration, which also assigns the UEI) [1897].
  - Enter the legal business name and physical address; SAM.gov validates them before assigning the identifier [1897] [1898].
  - Use the same UEI in every other registration (Grants.gov, eRA Commons, eBRAP, Research.gov) [784] [358].
  time: No page read gives a separate time for a UEI-only request; within a full registration the UEI is assigned once the
    name and address are validated [1898]. SAMHSA says activation and receipt of the UEI can take up to 10 business days
    [548].
  cost: Free; SAM.gov states there is no charge to get a Unique Entity ID [1898].
  renewal: The UEI itself is not renewed; the registration that carries it is renewed every 365 days [1897]. For an entity
    with no active registration in the past ten years SAM.gov keeps an 'ID Assigned' record with only the UEI, legal name,
    physical address and assignment date [1906].
  common_problems: A recipient may not make a subaward to an organisation that has not obtained a UEI and given it to the
    recipient, and must tell potential subrecipients so [1900]. CDMRP notes that Grants.gov registration takes significantly
    longer without a UEI [1923].
  official_url: https://sam.gov/entity-registration
