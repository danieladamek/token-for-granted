- id: section-117-foreign-gift-reporting
  name: Foreign gift and contract reporting (section 117 of the Higher Education Act)
  what: An institution of higher education that receives federal financial assistance reports to the Secretary of Education
    any gift from, or contract with, a foreign source worth $250,000 or more, alone or combined with others from the same
    source in a calendar year (20 U.S.C. 1011f) [2024] [2025]. The Attorney General enforces the section by civil action
    [2024].
  applies_when: The statute covers institutions that award a bachelor's or higher degree, are accredited and receive federal
    financial assistance [2024]. The reporting duty rests on institutions that meet that definition [2024].
  who_does_it: organisation
  steps:
  - File a disclosure report on January 31 or July 31, whichever is sooner after the gift or contract [2024].
  - File through the Section 117 Foreign Gifts and Contracts Reporting Portal at ForeignFundingHigherEd.gov, which went
    live January 2, 2026 and replaced the portal that closed December 16, 2025 [2026].
  - The institution's Primary Destination Point Administrator authorises its users and attests to submissions [2026].
  - Restricted or conditional gifts are disclosed separately with their conditions [2024].
  renewal: Reports are semiannual [2025].
  common_problems: The Attorney General may bring a civil action to compel compliance, and an institution that knowingly
    or willfully fails to comply pays the full costs of obtaining compliance [2024].
  official_url: https://www.ForeignFundingHigherEd.gov
  pending_changes:
  - status: final
    date: '2026-01-02'
    text: A new reporting portal went live January 2, 2026; the announcement said existing guidance and deadlines initially
      remained unchanged [2026].
  - status: announced
    date: '2026-02-23'
    text: A law firm alert reports that the Departments of Education and State announced an interagency agreement under
      which the State Department assists with section 117 reporting and enforcement, and that Executive Order 14282 of April
      23, 2025 directed enforcement of the section [2027]. The agencies' own documents were not read in this sweep [2027].
  - status: final
    date: '2025-04-23'
    text: Executive Order 14282, "Transparency Regarding Foreign Influence at American Universities", was signed April 23,
      2025 and published April 28, 2025 at 90 FR 17541 [2106]. It directs the Secretary of Education, with the Attorney
      General, to require disclosure of the sources and purposes of foreign funding, to make the information public and
      to use audits and investigations; it directs agencies to treat certification of compliance with section 117 as material
      under the False Claims Act and says federal grant funds are not to be provided in cases of noncompliance [2106]. The
      order as read names no deadline [2106].
  - status: announced
    date: '2026-02-23'
    text: The Department of Education's press release of February 23, 2026 says Education and State are establishing a partnership
      under which State will support Education in managing the section 117 foreign funding reporting portal, review and
      assess compliance with the law, share data with the public and federal stakeholders, and identify potential threats
      [1397]. The release gives no date on which State takes up the work and no change to the reporting deadlines, and does
      not say whether Education keeps an enforcement role [1397].
  - status: final
    date: '2026-07-31'
    text: 'The Department of Education''s announcements of June 18 and July 6, 2026 kept the semiannual date and the $250,000
      threshold: the next deadline was Friday, July 31, 2026, filed in the portal at ForeignFundingHigherEd.gov [2113] [2112].
      Since June 18, 2026 an institution can amend all its earlier reports in the portal, including those made before January
      2, 2026, and questions go to foreignsourcereporting@ed.gov [2113]. An update of July 24, 2026 says the Department
      delayed until August 12, 2026 its planned publication of the names of all foreign sources from prior reporting cycles
      [2112]. On June 29, 2026 the Department sent OMB a renewal of substantially the same information collection, control
      number 1845-0172, on the new portal [2114]. Neither announcement mentions the Department of State [2113] [2112].'
