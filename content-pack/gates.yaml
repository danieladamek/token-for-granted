    date: '2026-01-28'
    text: GSA proposed to revise the Financial Assistance General Representations and Certifications to align with Executive
      Order 14173 and a Department of Justice guidance memorandum of July 29, 2025; comments closed March 30, 2026 and the
      notice states no effective date (91 FR 3726) [1866]. Secondary sources describe three added certifications, on antidiscrimination
