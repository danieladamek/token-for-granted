- id: annual-form-990-filing
  name: Annual Form 990-series return or notice
  what: A tax-exempt organisation files a return or an electronic notice with the IRS every year; which form depends on
    its size and on whether it is a private foundation [2055]. An organisation that does not file for three consecutive
    years automatically loses its tax-exempt status [2057].
  applies_when: 'Gross receipts normally $50,000 or less: Form 990-N, the e-Postcard [2055]. Gross receipts under $200,000
    and total assets under $500,000: Form 990-EZ or Form 990 [2055]. Gross receipts of $200,000 or more, or total assets
    of $500,000 or more: Form 990 [2055]. A private foundation files Form 990-PF whatever its size [2055]. Churches and
    conventions or associations of churches are excepted from filing [2056].'
  who_does_it: organisation
  steps:
  - File the form that matches the organisation's gross receipts and assets each year; an organisation eligible for the
    e-Postcard may choose to file a full return [2055].
  renewal: The filing is annual [2055]. After three consecutive missed years revocation takes effect on the original due
    date of the third return or notice [2057]. The organisation is then removed from the IRS list of organisations eligible
    for deductible contributions, appears on the Automatic Revocation List, and is no longer eligible to receive tax-deductible
    contributions [2057].
  common_problems: A revoked organisation must apply again, with the user fee, to be reinstated [2057] [2058]. Revenue Procedure
    2014-11 gives four routes [2058]. An organisation that was eligible to file Form 990-EZ or 990-N in the three years
    and has not been revoked before may use streamlined retroactive reinstatement if it applies within 15 months [2058].
    Others may seek retroactive reinstatement with a statement of reasonable cause, for at least one year if within 15 months
    and for all three years if later [2058]. Otherwise reinstatement runs only from the post-mark date of the new application
    [2058].
  official_url: https://www.irs.gov/charities-non-profits/form-990-series-which-forms-do-exempt-organizations-file-filing-phase-in
