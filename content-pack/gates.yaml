- id: era-commons
  name: eRA Commons registration
  what: eRA Commons is the system, run by NIH's electronic Research Administration, in which an applicant organisation and
    its people hold accounts for applications, awards and reports [1911] [1910]. The agencies eRA lists as supported are
    NIH, FDA, CDC, SAMHSA, the National Institute of Food and Agriculture (USDA), the Department of Defense, the Uniformed
    Services University, AHRQ, the Department of Veterans Affairs and the Department of Commerce [1913]. eRA describes itself
    as the largest federal grants management system, with 1.3 million registered users [1913].
  applies_when: An organisation applying to NIH or to another agency that uses eRA registers once; every PD/PI, senior/key
    person and other significant contributor named on an application or award then needs a personal account [1909] [1910].
    SAMHSA does not accept an application if the organisation is not registered or lacks an active PI/PD account by the
    deadline [548].
  who_does_it: both
  steps:
  - The organisation first holds an active SAM.gov registration and UEI, which eRA checks [1911].
  - A Signing Official, a business official with authority to bind the organisation, opens the Register Organization link
    and states the purpose (NIH grant or contract, non-NIH grant or contract, or Other Transaction) [1911] [1909].
  - The Signing Official enters and verifies the UEI, enters institution details and contacts, and creates the first account
    for the Signing Official and optionally an Account Administrator [1911].
  - The Signing Official answers the verification email within 8 days, or the request is cancelled; the temporary password
    that follows is valid for two days [1911].
  - After approval the Signing Official or Account Administrator creates accounts for PD/PIs and other personnel [1910]
    [548].
  - Each person who submits a Common Form links an ORCID iD to the eRA Commons profile [31].
  - Users sign in with two-factor authentication through Login.gov or an InCommon federated account [1911] [1914].
  time: NIH says to allow two weeks or more for eRA Commons registration, and six weeks or more for the whole set of registrations
    [1909].
  cost: No fee is stated on the eRA and NIH pages read [1911] [1909].
  renewal: NIH describes registration as typically completed once and then maintained; no renewal period for eRA Commons
    is stated, but the SAM.gov registration it depends on is renewed yearly [1909].
  common_problems: eRA requires PIs and key personnel to move to two-factor authentication 45 days after submitting a competing
    application or an RPPR [1914]. NIH requires the same UEI in every registration [784].
  official_url: https://www.era.nih.gov/register-accounts/register-in-era-commons.htm
