- id: data-management-sharing-plan
  name: Data Management and Sharing (DMS) Plan (NIH)
  what: NIH's Data Management and Sharing Policy, in effect since January 25, 2023 (NOT-OD-21-013), applies to all NIH-funded
    research that generates scientific data, whatever the size of the award [124]. The applicant submits a plan, NIH programme
    staff assess it, and the approved plan becomes a term and condition of the award [124].
  applies_when: Research project applications, some career development awards and research centres need a plan [124]. Training
    (T), fellowship (F), construction (C06), conference (R13), resource (G) and SBIR/STTR activity codes do not [124].
  who_does_it: both
  steps:
  - Write the plan in the 2026 DMS Plan format, required for all competing and non-competing awards under NOT-OD-26-046
    [2029].
  - 'Answer its seven items: maximum appropriate sharing; timing of sharing; how long data stay available; a justification
    of any limits, in 300 words at most; privacy protections for participant data; data types and repositories in a table,
    in 100 words at most; and the Genomic Data Sharing Policy where it applies [2029].'
  - Attach the plan in the "Other Plan(s)" field of the PHS 398 Research Plan and summarise data management costs in the
    budget justification [2029].
  - Programme staff, not peer reviewers, assess the plan, and it must be approved before award [124] [2029].
  - Share the data by the time of publication or, for other findings, by the end of the period of performance, no-cost extensions
    included [2029].
  renewal: Progress against the plan is reported in the annual progress report [124].
  common_problems: NIH may make data sharing an explicit condition of an award where a recipient does not comply [124].
  official_url: https://grants.nih.gov/policy-and-compliance/policy-topics/sharing-policies/dms/policy-overview
  pending_changes:
  - status: announced
    date: '2026-09-17'
    text: NIH's list of initiatives in progress, last updated September 17, 2026, includes eliminating data management and
      sharing plan requirements on career development (K) awards; no effective date is given [2087].
