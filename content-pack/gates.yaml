- id: drug-free-workplace
  name: Drug-free workplace requirements
  what: Under the Drug-Free Workplace Act (41 U.S.C. 8101-8106) and 2 CFR part 182, a grant recipient other than an individual
    publishes a drug-free workplace statement and runs an ongoing drug-free awareness programme [2037].
  applies_when: The requirement applies to recipients of federal financial assistance; an individual recipient has a narrower
    duty not to engage in unlawful drug activity related to the award [2037].
  who_does_it: organisation
  steps:
  - Publish the statement, establish the awareness programme and identify all known workplaces under each award [2037].
  - Tell the agency within ten calendar days of learning that an employee working on the award was convicted of a drug violation,
    and take personnel action or require rehabilitation within 30 calendar days [2037].
  common_problems: Sanctions for a violation include suspension of payments, suspension or termination of the award, and
    suspension or debarment for up to five years [2037].
  official_url: https://www.ecfr.gov/current/title-2/subtitle-A/chapter-I/part-182
