- id: hhs-690-assurance-of-compliance
  name: HHS Assurance of Compliance (Form HHS-690)
  what: Form HHS-690 is the civil rights assurance that an organisation receiving HHS financial assistance files with the
    HHS Office for Civil Rights [2036] [528]. In it the applicant agrees to comply with Title VI of the Civil Rights Act
    of 1964, section 504 of the Rehabilitation Act of 1973, Title IX of the Education Amendments of 1972, the Age Discrimination
    Act of 1975, section 1557 of the Affordable Care Act and federal conscience provisions [2036].
  applies_when: Domestic recipients, subrecipients and contractors under HHS awards file it [528]. At NIH the form must
    be on file with the HHS Office for Civil Rights before an award is made to a domestic organisation, and the Authorized
    Organization Representative's signature on an application certifies that it is [2088].
  who_does_it: organisation
  steps:
  - A person authorised to commit the applicant signs the form [2036].
  - File it once with the Office for Civil Rights, by mail or through its online portal; it is not needed with each application
    [528] [2036].
  renewal: The form is filed once; the assurance binds the applicant's successors and transferees and is a material condition
    of continued federal financial assistance [528] [2036].
  common_problems: The copy of the form read carries an OMB expiry date of 04/30/2026; whether a renewed form has replaced
    it was not established [2036]. Separately, the HHS Grants Policy Statement in force since October 1, 2025 says that
    by accepting an award a recipient certifies compliance with Title IX, including requirements in Executive Order 14168,
    and with Title VI [528]. The change ledger records a court order on new HHS grant conditions under the id ch-sb-hhs-hud-new-grant-conditions-vacated;
    that order was not read in this sweep [528].
