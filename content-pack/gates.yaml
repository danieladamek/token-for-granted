- id: research-misconduct-assurance
  name: Research misconduct assurance filed with the Office of Research Integrity (ORI)
  what: An institution is eligible for Public Health Service funding when it has an assurance on file with the HHS Office
    of Research Integrity that it has written policies and procedures for handling allegations of research misconduct and
    follows them [2009] [2007]. Research misconduct means fabrication, falsification or plagiarism in proposing, performing
    or reviewing research, or in reporting results [2006]. The governing rule, 42 CFR part 93, was revised by a final rule
    published September 17, 2024 [2008].
  applies_when: The assurance is required of institutions that receive PHS support for biomedical or behavioural research
    [2007] [2008].
  who_does_it: organisation
  steps:
  - Adopt written policies and procedures for addressing allegations of research misconduct; ORI publishes a sample document
    titled for 2025 [2007] [2011].
  - Establish the assurance, either by signing the face page of a grant application (SF 424 (R&R) or PHS 398) or by filing
    the Assurance Establishment Form, PHS-7091, on paper or online [2009].
  - The Institutional Certifying Official assures compliance initially and then annually [2007].
  - File the Annual Report on Possible Research Misconduct, PHS-6349, between January 1 and April 30 each year [2009].
  - A small institution, described by ORI as typically 1 to 50 institutional members, may with ORI's approval file a Small
    Institution Statement in place of its own policies; it then reports every allegation to ORI, which works with it on
    the case [2010] [2007].
  cost: The ORI pages read state no fee [2009].
  renewal: The assurance is kept active by the annual report, due between January 1 and April 30, and by keeping policies
    consistent with the regulation [2009] [2007]. The ORI assurance page states no consequence for a missed report [2009].
  common_problems: Under the revised rule an inquiry is completed within 90 days of its start unless circumstances warrant
    longer, an investigation within 180 days, and records are kept for seven years [2006].
  official_url: https://ori.hhs.gov/assurance-program
  pending_changes:
  - status: final
    date: '2026-01-01'
    text: 'The revised 42 CFR part 93 took effect January 1, 2025, and its requirements apply from January 1, 2026: institutions
