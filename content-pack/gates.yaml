- id: mftrp-certification
  name: Malign foreign talent recruitment programme (MFTRP) certification
  what: A person who is a current party to a malign foreign talent recruitment programme may not serve as senior/key personnel
    on an NSF or NIH award [2014] [31]. The prohibition comes from section 10632 of the CHIPS and Science Act of 2022 (42
    U.S.C. 19232) [31]. Both the person and the institution certify [2014] [31].
  applies_when: 'NSF: the prohibition covers proposals and any award made after May 20, 2024 [2014]. NIH: the certifications
    are part of the Common Forms required for due dates on or after January 25, 2026, with a leniency period that ended
    May 7, 2026; from May 8, 2026 NIH''s systems stop a submission that does not use compliant Common Forms [31] [129] [32].
    USDA''s optional deviation effective June 3, 2026 updates its terms on malign foreign talent recruitment programmes
    [2020].'
  who_does_it: both
  steps:
  - The individual certifies non-participation when signing the Biographical Sketch and Current and Pending (Other) Support
    forms; at NIH each person, not a delegate, certifies in SciENcv [31] [247].
  - The institution certifies through the authorised representative's signature that senior/key personnel have been made
    aware of the requirement [31] [257].
  - After award, NSF principal investigators and co-principal investigators on awards made on or after May 20, 2024 certify
    each year in Research.gov; NIH senior/key personnel certify each year by a PDF uploaded to the progress report [2014]
    [31].
  renewal: The post-award certification is annual at both agencies [2014] [31]. NSF's annual certification took effect June
    7, 2025 [247].
