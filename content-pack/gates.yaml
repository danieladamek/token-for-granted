- id: doe-conflict-of-interest-policy
  name: DOE conflict of interest and conflict of commitment policy (2 CFR part 910, subpart C)
  what: The Department of Energy's final rule of July 16, 2026 (91 FR 43511) adds conflict of interest and conflict of commitment
    requirements to its financial assistance regulations as subpart C of 2 CFR part 910 [2096]. A non-Federal entity that
    applies for or holds a DOE financial assistance award must maintain a written policy on both kinds of conflict [2096].
    On its effective date, August 17, 2026, the subpart superseded DOE's interim conflict of interest policy, FAL No. 2022-02
    [2096].
  applies_when: Any non-Federal entity that is an applicant to or recipient of a DOE financial assistance award on or after
    August 17, 2026 [2096]. The rule as read states no minimum award amount and gives no waiver to an entity that already
    follows the Public Health Service or NSF policy; programmes of the DOE Office of Indian Energy are excepted [2096].
    A subrecipient either certifies that its own policy complies or comes under the recipient's policy [2096].
  who_does_it: both
  steps:
  - The organisation adopts a written conflict of interest and conflict of commitment policy (910.210(a) as returned) [2096].
  - Each covered individual, a person who contributes in a substantive, meaningful way to the development or execution of
    the scope of work of a project, discloses significant financial interests; the rule sets the threshold at remuneration
    or equity exceeding $5,000 in the 12 months before disclosure, or any equity interest in a non-publicly traded entity
    [2096] [2096].
  - Covered individuals complete training before engaging in a DOE-funded project [2096].
  - The organisation reports to DOE any conflict that cannot be eliminated or managed, and any conflict involving a foreign
    government, its instrumentalities or a foreign-controlled entity [2096].
  - Disclosures use the uniform Disclosure Certification Statement in Appendix A to the subpart [2096].
  renewal: Covered individuals update their disclosures annually and as soon as practicable, but not later than 15 days,
    after a new conflict arises; refresher training is required at least every two years; organisational conflicts are reported
    within 15 business days of discovery [2096].
  common_problems: DOE declined commenters' request for a one-year lead time and made the rule effective 30 days after publication
    [2096]. The two-year training cycle differs from the four-year cycle commenters asked DOE to match [2096].
