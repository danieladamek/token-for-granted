- id: sam-registration
  name: SAM.gov entity registration
  what: SAM.gov, run by the General Services Administration, is the federal registry in which an organisation must hold
    an active entity registration before it applies for federal financial assistance as a prime awardee [1897] [1899]. Registration
    assigns the organisation its Unique Entity ID and, for a domestic organisation, a CAGE code [1898] [784]. An entity
    may choose a registration for financial assistance awards only, which asks for less than a registration for all awards
    [1898]. SAM.gov states that it is free to register and to keep a registration [1898].
  applies_when: Every organisation that applies to a federal agency for a grant or cooperative agreement, unless the agency
    grants one of the exemptions in 2 CFR 25.110 (national security, a foreign entity with an award under $25,000 performed
    outside the United States, or exigent circumstances) [1899]. A subrecipient needs only a Unique Entity ID, not a full
    registration [1900]. An individual applying on their own behalf through Grants.gov does not register in SAM.gov [1896].
  who_does_it: organisation
  steps:
  - Create a SAM.gov user account, which is done through Login.gov [1897].
  - Gather the data on the Entity Registration Checklist [1897] [1898].
  - 'Choose ''Register Entity'' (not ''Get a Unique Entity ID'') and choose the purpose: financial assistance awards only,
    or all awards [1897] [1898].'
  - Enter the legal business name and physical address, which SAM.gov validates before it assigns the Unique Entity ID;
    if validation fails the entity can open a help ticket and attach documents [1898] [1968].
  - 'Enter Core Data: for a U.S. entity the Taxpayer Identification Number (validated), the CAGE code if one exists (otherwise
    one is assigned), and bank details for electronic funds transfer; a non-U.S. entity first obtains an NCAGE code [1898].'
  - Complete the Representations and Certifications; a financial-assistance registration includes the financial assistance
    certifications in Appendix I of the checklist (authority to apply, access to records, conflicts of interest, compliance
    with federal law, trafficking, drug-free workplace, civil rights) [1898].
  - 'Name the points of contact: Accounts Receivable, Electronic Business and Government Business are mandatory [1898].'
  - Submit, and wait for the registration to become active [1897].
  time: 'SAM.gov says registration can take up to 10 business days to become active, and its checklist says to allow at
    least ten business days [1897] [1898]. Grants.gov adds that it could take weeks or months if information is not available
    or verified [1895]. Agencies give their own, longer planning figures: NIH three weeks or more for first registration
    and two weeks for renewal; NSF at least 90 days before submission; SAMHSA at least six weeks before the due date; DOJ
    30 days before a deadline; the Department of Education approximately 7 to 10 business days; CDMRP several weeks; HRSA
    two weeks for SAM and Grants.gov together [1909] [161] [548] [619] [1928] [1923] [1925].'
  cost: 'Free: SAM.gov states there is no charge to get a Unique Entity ID, to register or to maintain a registration [1898].
    ACF and Grants.gov say the same [1961] [1895].'
  renewal: The registration must be renewed every 365 days to stay active [1897]. 2 CFR 25.200(b)(2) requires the registration
    to be current and active whenever the entity has an active award or an application under consideration [1899]. Under
    2 CFR 25.205 an agency may not issue an award, or add funds to one, to an entity that is not in compliance [1899]. Grants.gov
    allows submission only while the SAM.gov registration is active [1965]. NSF notes that a lapsed registration takes longer
    to reactivate than one renewed while active [156]. Registration records more than ten years past their expiration date
    are destroyed [1906].
  common_problems: DOJ states that failure to register in SAM.gov or Grants.gov in sufficient time is not accepted as a
    reason for a late application [619]. Grants.gov tells the main contact to use the same email address in SAM.gov and
    Grants.gov, because the Electronic Business Point of Contact named in SAM.gov controls the organisation's Grants.gov
    roles [1895] [1965]. GSA tells entities under validation to make the name, address, start year and state of incorporation
    match the documents attached, and to answer emails from fsdsupport@gsa.gov [1968]. Recipients whose active federal awards
    and contracts total more than $10,000,000 must also report civil, criminal and administrative proceedings in SAM [548].
  official_url: https://sam.gov/entity-registration
  pending_changes:
  - status: proposed
    date: '2026-01-28'
    text: GSA asked for comment, until March 30, 2026, on updating the Financial Assistance General Representations and
      Certifications in SAM.gov to align with the Department of Justice guidance of July 29, 2025 on unlawful discrimination
      and with Executive Order 14173; the notice states no effective date [1866].
