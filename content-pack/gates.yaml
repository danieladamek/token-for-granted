- id: irb-registration
  name: Institutional review board (IRB) registration with OHRP
  what: An institutional review board (IRB) reviews and approves research with human subjects; each IRB that reviews HHS-conducted
    or HHS-supported research, and each IRB designated under a Federalwide Assurance, must be registered with OHRP [1983]
    [1989]. Registration records that the required information was provided; it is not a finding by OHRP that the IRB reviews
    research in line with the regulations [1989].
  applies_when: An institution that operates its own IRB registers it [1983]. An institution without its own IRB may rely
    on another registered IRB, with the reliance documented [1981].
  who_does_it: organisation
  steps:
  - Register electronically through http://ohrp.cit.nih.gov/efile; an institution unable to register electronically sends
    the information in writing [1983].
  - Give the institution's name and address, a senior officer and a contact person, the IRB's name and chairperson, approximate
    numbers of active protocols and of those supported by HHS, and the staff time devoted to the IRB [1983].
  - An initial registration covers both the institution or organisation (the IORG) and its IRB or IRBs [1989].
  - Registration is effective when OHRP accepts it; the IRB can then be designated under an FWA [1983].
  cost: The OHRP pages read state no fee [1985] [1989].
  renewal: Registration is effective for 3 years and is renewed every 3 years [1983]. A change of contact person or chairperson
    is reported within 90 days, and the disbanding of an IRB within 30 days after it permanently stops reviewing research
    [1983]. Any electronic update renews the registration of the organisation and its IRBs [1989].
  official_url: https://www.hhs.gov/ohrp/register-irbs-and-obtain-fwas/irb-registration/index.html
