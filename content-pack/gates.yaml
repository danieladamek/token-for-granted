- id: research-security-training
  name: Research security training certification
  what: Section 10634 of the CHIPS and Science Act of 2022 (42 U.S.C. 19234) requires research security training for the
    people named on federal research and development applications [33] [2015]. Each funding agency has put the requirement
    into effect on its own date [2014] [33] [383]. In the agencies read, the individual certifies that the training was
    completed within the 12 months before submission, and the organisation's authorised representative certifies the same
    for all covered people [2014] [33] [383].
  applies_when: 'NSF: all proposals from December 2, 2025, for each senior/key person [2014]. NIH: applications for due
    dates on or after May 25, 2026, for senior/key personnel; NIH''s systems enforce the certification for those due dates
    [33] [32]. NASA: grant and cooperative agreement proposals from August 5, 2026, for all principal investigators and
    co-principal investigators, co-investigators spending 10% or more of their time on the award, and others a notice designates
    [383]. DOE: Financial Assistance Letter 2025-02, dated October 8, 2024, covers covered individuals on applications for
    all research and development financial assistance awards; the landing page read gives no effective date [2019]. A university
    compliance page gives DOE''s effective date as May 1, 2025 [2021]. USDA: an optional deviation to the department''s
    General Terms and Conditions, effective June 3, 2026, updates terms on research security and malign foreign talent recruitment
    programmes [2020]. The Department of Defense announcement of January 8, 2026 lists research security measures and gives
    no date for a training certification [2084]. Read in the letter itself, DOE''s FAL 2025-02 is effective upon issuance
    and makes the training requirement optional until May 1, 2025 and mandatory thereafter, for DOE and NNSA funding opportunities,
    congressionally directed spending projects and non-competitive agreements that include research and development; each
    covered individual certifies, and the applicant certifies for the covered individuals it employs [2107]. The PDF as
    returned gives the issue date as October 7, 2024 [2107]. USDA: section 10.6 of the General Terms and Conditions effective
    December 31, 2025 requires the recipient to certify that each individual it employs to work on the award has completed
    research security training, at the time of application or within the 12 months before work starts, and to recertify
    annually for the duration of the award [1948]. Deviation 2026-USDA-0001-F, effective June 3, 2026, restates the term
    for each covered individual and accepts training from NSF or the SECURE Center [2110].'
  who_does_it: both
  steps:
  - Each covered person completes training that addresses cybersecurity, international collaboration, foreign interference,
    and the rules for proper use of funds, disclosure, conflict of commitment and conflict of interest [2014] [33].
