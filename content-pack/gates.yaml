- id: animal-welfare-assurance
  name: Animal Welfare Assurance (OLAW) and the institutional animal care and use committee
  what: 'An Animal Welfare Assurance is the document in which an institution describes its animal care and use programme
    and commits to the Public Health Service Policy on Humane Care and Use of Laboratory Animals [1994] [1999]. No PHS-supported
    activity with live vertebrate animals may be conducted until the institution has an Assurance acceptable to the PHS,
    negotiated with the NIH Office of Laboratory Animal Welfare (OLAW) [1994]. OLAW''s pages say the same Assurance covers
    NSF- and NASA-funded animal activities [1995]. There are three kinds: Domestic, for a United States institution doing
    the animal work on its own site; Foreign, for an institution outside the United States; and Interinstitutional, for
    an awardee with no animal programme of its own whose animal work is done at an assured institution [1995] [1997].'
  applies_when: The Assurance is needed when a PHS, NSF or NASA award involves live vertebrate animals [1995]. A Domestic
    Assurance requires the institution to have its own animal facilities, an Institutional Official, an institutional animal
    care and use committee (IACUC) and a veterinarian with programme authority [1996]. An IACUC has at least five members,
    including a veterinarian, a practising scientist, a non-scientist and a person not affiliated with the institution [1999].
    An Interinstitutional Assurance is for an institution that has no Assurance, no animal programme, no animal housing
    and no IACUC [1997].
  who_does_it: organisation
  steps:
  - 'An institution cannot apply unasked: OLAW does not accept or process unsolicited applications [1994].'
  - The funding component notifies the institution and OLAW of a pending award, or of animal activities added to an award;
    OLAW then contacts the institution [1994].
  - The institution completes the Assurance form for its type, signed by the Institutional Official; OLAW publishes sample
    documents [1994] [1996].
  - An OLAW reviewer asks for clarifications and the institution returns a revised version with changes marked [1994].
  - The institution provides the final signed version; OLAW signs it and issues an approval letter [1994].
  time: The OLAW pages read give no time for the negotiation [1994].
  cost: The OLAW pages read state no fee [1994].
  renewal: OLAW's pages say Domestic and Foreign Assurances are approved for up to 4 years and Interinstitutional Assurances
    for the life of the grant or contract, up to 5 years [1996] [1998] [1997]. The PHS Policy page, as returned by the fetch,
    says approval is for no longer than five years [1999]. OLAW asks for a renewal 4 months before expiry, and renews a
    Domestic Assurance only if the institution still conducts funded animal work on site [1994] [1996]. An institution with
    a Domestic Assurance sends OLAW an annual report for the federal fiscal year, October 1 to September 30, due by December
    1 [1996] [2000]. A new Interinstitutional Assurance is needed if the institutions involved change [1997].
  common_problems: OLAW states that Assurance materials sent before OLAW has made contact are not processed [1994]. The
    IACUC must review the programme and inspect facilities at least every six months and review each ongoing activity completely
    at least every three years [1999].
  official_url: https://grants.nih.gov/policy-and-compliance/policy-topics/animal-welfare/assurance
