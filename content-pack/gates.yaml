- id: debarment-and-suspension
  name: Debarment and suspension disclosures and checks
  what: An applicant tells the agency whether it or any of its principals is excluded from federal awards, has been convicted
    of or found civilly liable for listed offences within three years, is presently indicted or charged, or has had a public
    transaction terminated for cause or default within three years (2 CFR 180.335) [2038]. A recipient also checks the parties
    it pays under the award [2038].
  applies_when: The disclosure covers the organisation and its principals; HHS names principal investigators and other key
    personnel among them [528]. Agencies follow the governmentwide guidance in 2 CFR part 180 when they review an applicant
    [2023].
  who_does_it: organisation
  steps:
  - Disclose the four matters before entering into the award [2038] [528].
  - Before a covered transaction with a lower-tier party, verify that the party is not excluded by checking SAM.gov Exclusions,
    collecting a certification, or adding a clause or condition to the transaction [2038].
