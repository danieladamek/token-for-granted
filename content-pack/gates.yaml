- id: research-security-program
  name: Research security programme certification (covered institutions)
  what: National Security Presidential Memorandum 33 requires research institutions that receive more than 50 million dollars
    a year in federal science and engineering support to certify to the funding agency that they have established and operate
    a research security programme [247] [2018]. An OSTP memorandum of July 9, 2024 set the content of such a programme and
    a timeline [2017].
  applies_when: A covered institution is an institution of higher education, a federally funded research and development
    centre or a non-profit research institution above the $50 million threshold, measured as a three-year average of federal
    research and development obligations [2017]. The threshold is stated in fiscal year 2022 constant dollars [2017].
  who_does_it: organisation
  steps:
  - 'Establish a programme with four elements: cybersecurity, foreign travel security, research security training and export
    control training [2017].'
  - Certify by a written or electronic attestation to a federal research agency [2017].
  time: Under the OSTP memorandum, agencies were to submit implementation plans within six months, their policies were to
    take effect no later than six months after that, and institutions have not more than 18 months from an agency's effective
    date to implement [2017].
  common_problems: NSF's guidelines page quotes the mandate and gives no NSF date or mechanism [2018]. NIH announced the
    requirement on September 11, 2025 for applications from January 25, 2026, rescinded that notice on September 29, 2025,
    and said an implementation date had not been finalised [2016] [127]. A law firm alert of March 2026 says there is no
    single government-wide deadline, because the 18 months run from each agency's own effective date [2022]. IARPA's page
    on its implementation of NSPM-33 says the research security programme certification deadline has yet to be finalised,
    and that it accepts proposals from covered institutions that are implementing a programme but are not yet certified;
    the page is undated [2111]. NSF's research security page, updated August 6, 2026, quotes the NSPM-33 mandate and gives
    no date or means of certification [247]. NIH's notice of December 2, 2025 covers training only and does not mention
    the programme certification [33]. USDA's General Terms and Conditions effective December 31, 2025 and its research security
    deviation of June 3, 2026 have no term on it [1948] [2110]. NIST's research security questions and answers, last modified
    March 24, 2025, say that at present NIST does not require applicants to demonstrate the existence of a research security
    programme in order to apply for or receive funding [2115].
  official_url: https://www.nsf.gov/research-security/guidelines
  pending_changes:
