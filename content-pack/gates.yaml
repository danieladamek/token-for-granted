- id: orcid-id
  name: ORCID iD
  what: An ORCID iD is a persistent identifier for a researcher, issued by ORCID, a global not-for-profit organisation sustained
    by fees from member organisations [1950]. NIH requires one of every person who submits a Common Form, linked to that
    person's eRA Commons account [31]. DOE requires a persistent identifier field on notices and awards that include research
    and development, and its annual Office of Science notice asks for each senior/key person's ORCID iD if known [1944]
    [279].
  applies_when: 'At NIH: every individual who must submit a Biographical Sketch or Current and Pending (Other) Support Common
    Form, for due dates and for JIT, RPPR and prior approval submissions on or after January 25, 2026 [31]. NIH notices
    also state that all PD/PIs must be registered with ORCID and have the iD linked to the eRA Commons profile [784].'
  who_does_it: person
  steps:
  - Register at orcid.org/register [1910].
  - Link the ORCID iD to the eRA Commons personal profile before submission [31] [1910].
  time: No time is stated on the pages read [1950].
  cost: 'Free to the researcher: ORCID states that researchers create, edit and maintain an identifier and record free of
    charge [1950].'
  renewal: None; the identifier is described as persistent [1950].
  official_url: https://orcid.org/register
