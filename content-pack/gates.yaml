  name: State charitable solicitation registration
  what: 'The IRS states that many states have laws regulating the solicitation of funds for charitable purposes, and that
    these generally require an organisation to register with a state agency before soliciting that state''s residents [2062].
    State statutes exempt certain categories of organisation and may also require periodic financial reports [2062]. '
