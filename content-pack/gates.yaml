- id: federalwide-assurance
  name: Federalwide Assurance (FWA) for the protection of human subjects
  what: A Federalwide Assurance is an institution's written promise to the federal government that it will follow the Common
    Rule, the shared federal regulation on research with human subjects [1981] [1984]. It is filed with the Office for Human
    Research Protections (OHRP) in HHS and is the only kind of assurance OHRP accepts [1988]. Other federal agencies accept
    an assurance on file with OHRP in place of one of their own [1981].
  applies_when: Every institution engaged in non-exempt human subjects research that is conducted or supported by HHS or
    another federal department or agency that follows the Common Rule needs one [1986] [1984]. Research that is exempt under
    45 CFR 46.104 does not require an assurance [1981]. A collaborating investigator at an institution with no assurance
    can be covered by an Individual Investigator Agreement under another institution's FWA; OHRP says an institution where
    HHS-supported research routinely occurs obtains its own [1988].
  who_does_it: organisation
  steps:
  - 'Register the institutional review board the institution will rely on, or identify a registered one: an IRB must be
    registered before it can be designated under an assurance [1983].'
  - Go to OHRP's electronic submission system at ohrp.cit.nih.gov/efile/FwaStart.aspx and choose "I need a submission number"
    [1987].
  - Enter an email address and password; the submission number arrives by email [1987].
  - Return to the site, choose "I have a submission number", and complete and submit the FWA application [1987].
  - The assurance is executed by an individual authorised to act for the institution, called the Signatory Official on OHRP's
    pages [1981] [1984].
  - Where the institution relies on an IRB it does not operate, the reliance and the division of responsibilities are documented
    [1981].
  cost: The OHRP pages read state no fee [1985] [1988].
  renewal: An FWA is effective for 5 years and is renewed every 5 years, even if nothing has changed [1984] [1988]. It is
    updated within 90 days after a change in the institution's legal name, its Human Protections Administrator or its Signatory
    Official [1984]. An approved electronic renewal or update starts a new 5-year period [1988]. OHRP states that failure
    to renew or update while continuing covered research may constitute noncompliance [1984].
  common_problems: Federal support for covered research is given only if the institution has an assurance and, where certification
    is required, has certified that an IRB reviewed and approved the research; the research may not begin before that certification
    [1981].
  official_url: https://www.hhs.gov/ohrp/register-irbs-and-obtain-fwas/fwas/index.html
  pending_changes: []
  as_of: '2026-10-04'
