- id: sam-financial-assistance-certifications
  name: Financial assistance certifications and representations in SAM.gov (successor to the SF-424B)
  what: The governmentwide assurances that applicants once signed on Standard Form 424B, Assurances for Non-Construction
    Programs, are now made in SAM.gov when an organisation registers or renews its registration [2035]. The General Services
    Administration began building the financial assistance certifications into SAM registration on February 2, 2019, and
    by February 2, 2020 every registrant had completed them [2035]. The Uniform Guidance authorises agencies to require
    these certifications yearly (2 CFR 200.209) [2034].
  applies_when: Every organisation that registers in SAM.gov for financial assistance makes the certifications [2035]. NSF's
    policy guide says the governmentwide certifications, including debarment and suspension, lobbying and nondiscrimination,
    are provided annually in SAM [257]. Where an agency excepts an applicant from SAM registration, it collects the assurance
    form itself [2034].
  who_does_it: organisation
  steps:
  - Complete the Financial Assistance General Certifications and Representations while registering or renewing in SAM.gov
    [2035] [1866].
  - Make any further certifications the agency adds in its own application or award terms; NSF lists nine of its own, and
    the Arts Endowment says an applicant certifies by signing and submitting its application on Grants.gov [257] [656].
  time: GSA's 2026 notice estimates 2.75 hours per response for the SAM registration requirements as a whole [1866].
  renewal: The certifications are renewed with the yearly SAM.gov registration [2034] [257].
  official_url: https://sam.gov
  pending_changes:
