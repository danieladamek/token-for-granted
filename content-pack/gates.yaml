- id: responsible-conduct-of-research-training
  name: Responsible conduct of research training (NIH RCR and NSF RECR)
  what: 'NIH''s requirement for instruction in the responsible conduct of research attaches to research training, career
    development, research education and dissertation research grants [2013]. NSF''s, which it calls responsible and ethical
    conduct of research (RECR), attaches to every proposal: the institution certifies a plan to train the undergraduate
    students, graduate students, postdoctoral researchers, faculty and other senior/key personnel supported by the project
    [2004].'
  applies_when: At NIH, instruction is given at least once during each career stage and no less than once every four years
    [2013]. Video conferencing may be part of the instruction and, outside stated circumstances, is not the sole means [2013].
    At NSF, training must include mentor training and mentorship, and the institution designates one or more persons to
    oversee compliance [2004] [2005].
  who_does_it: both
  steps:
  - 'NIH: the institution''s training or career award application describes the instruction; subjects include conflict of
    interest, authorship, misconduct, data management and sharing, and the use of human participants and animals, with conflict
    of commitment, safe research environments and secure data use added in 2022 [2012] [2013].'
  - 'NSF: the Authorized Organizational Representative certifies with each proposal that the institution has a plan for
    RECR training and oversight [2004] [257].'
  renewal: NIH instruction recurs at least every four years [2013]. NSF sets no interval in the chapter read [2004].
  official_url: https://grants.nih.gov/policy-and-compliance/policy-topics/research-integrity/rcr
