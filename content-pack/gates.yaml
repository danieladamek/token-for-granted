- id: recognition-of-exemption-501c3
  name: Recognition of exemption under section 501(c)(3) (Form 1023 or Form 1023-EZ)
  what: An organisation becomes a non-profit under state law and becomes tax-exempt under federal law; the two are separate
    steps [2047]. To be recognised as exempt under section 501(c)(3) of the Internal Revenue Code an organisation applies
    to the IRS on Form 1023 or, if it is small enough, on the shorter Form 1023-EZ [2046] [2049]. Federal notices that admit
    "nonprofits having a 501(c)(3) status with the IRS" rest on this recognition [2064].
  applies_when: Form 1023-EZ is open only to an organisation that answers "No" to every question on its eligibility worksheet
    [2050]. The first three questions ask whether annual gross receipts are projected to exceed $50,000 in any of the next
    3 years, whether they exceeded $50,000 in any of the past 3 years, and whether total assets have a fair market value
    above $250,000 [2050]. Churches, schools, hospitals, foreign organisations, successors to for-profit entities, supporting
    organisations, private operating foundations and limited liability companies cannot use the short form [2050]. Every
    other applicant uses Form 1023 [2049].
  who_does_it: organisation
  steps:
  - Form the organisation under state law as a trust, a corporation or an association, and gather its organising documents
    [2047].
  - Determine the state's registration requirements [2047].
  - Obtain an employer identification number (EIN) for the new organisation; the online application is free, an approved
    EIN is issued immediately, and a corporation is formed with the state before applying [2047] [2089].
  - For the short form, read the instructions and complete the eligibility worksheet [2049].
  - Register for an account on Pay.gov, search for "1023" or "1023-EZ", complete the form and pay the user fee there; Form
    1023 has had to be filed electronically since January 31, 2020 [2048] [2046] [2051].
  - The IRS issues a determination letter; determination letters can be looked up in the Tax Exempt Organization Search
    [2059] [2053].
  time: The IRS says it issues 80% of Form 1023-EZ determinations within 22 days and 80% of Form 1023 determinations within
    191 days; the page was last updated June 28, 2026 [2053]. Form 1023-EZ applications cannot be expedited [2053].
  cost: The user fee is $600 for Form 1023 and $275 for Form 1023-EZ, paid through Pay.gov when the application is filed
    [2051]. Fees are set each year by revenue procedure, for 2026 Revenue Procedure 2026-5 [2052].
  renewal: Recognition is lost automatically if the organisation fails to file its annual return or notice for three consecutive
    years [2057]. If the application is filed within 27 months after the end of the month in which the organisation was
    formed and is approved, exemption runs from the date of formation [2050].
  common_problems: An approved application and its supporting documents are open to public inspection [2050]. A funder or
    donor checks an organisation's standing in the Tax Exempt Organization Search, and the IRS warns of delays in that tool's
    data [2059].
  official_url: https://www.irs.gov/charities-non-profits/applying-for-tax-exempt-status
