- id: research-gov
  name: Research.gov organisation registration and NSF ID
  what: Research.gov is NSF's system for preparing and submitting proposals and for reports after award [161] [1955]. An
    organisation registers there, and each person holds one NSF ID, the identifier NSF assigns to a user [161] [156]. A
    proposal may instead be submitted through Grants.gov, after which it passes to Research.gov for processing [161].
  applies_when: Every organisation that proposes to NSF, and every subrecipient named in a proposal, which must obtain a
    UEI and register in Research.gov without needing a SAM registration [156].
  who_does_it: both
  steps:
  - Hold an active and valid SAM registration and a UEI; NSF recommends starting at least 90 days before submission [161].
  - Register the organisation in Research.gov [161].
  - Each person obtains an NSF ID from a Research.gov account; a person may not have more than one [161] [156].
  - Sign in with multifactor authentication, using NSF credentials, Login.gov credentials or organisation-issued credentials
    through the InCommon Federation [1971] [1972].
  - Prepare and submit the proposal in Research.gov, or submit through Grants.gov with the Authorized Organizational Representative's
    signature [161].
  - 'NSF''s Research.gov Account Management Guide (version 3.4, updated August 22, 2025) gives six steps for a person: confirm
    that no NSF account already exists; open Research.gov and select Register; enter registration information with a unique
    primary email address; set a password from the temporary credentials sent by email; set up a multifactor authentication
    method; add an organisational role, which reviewers and fellowship applicants do not need [2101].'
  time: NSF gives no figure for Research.gov registration itself; it recommends beginning SAM registration at least 90 days
    before submission and, for Grants.gov submissions, starting at least five business days before a deadline [161]. NSF's
    account management guide says an organisation must be registered in SAM.gov with a Unique Entity ID to appear in the
    system, and that completion of the SAM registration process may take up to one month [2101].
  cost: No fee is stated on the NSF pages read [161].
  renewal: No renewal of the Research.gov registration is stated; the SAM registration must stay current at all times while
    the organisation has an active award or a proposal under consideration [156].
  common_problems: 'Multifactor authentication has been required at every Research.gov sign-in since October 27, 2024, and
    users with administrative or financial roles must use a phishing-resistant method [1972] [1971]. A Login.gov address
    must match the primary email address of the NSF account [1972]. NSF''s questions and answers on signing in, published
    January 31, 2025 and revised April 25, 2025, date the email rule from April 26, 2025: all users must verify that their
    NSF primary email address matches their Login.gov email address, and a changed primary email address must be verified
    within four hours or the account reverts to the last verified address [1972]. The guide says ongoing access to the primary
    email address is required for NSF communications and gives the help desk as 1-800-381-1532 and rgov@nsf.gov [2101].'
  official_url: https://www.nsf.gov/funding/submitting-proposal
