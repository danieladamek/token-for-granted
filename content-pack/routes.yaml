- id: humanities-arts-and-cultural-heritage-research
  name: Humanities, arts and cultural heritage research grants
  family: research
  what: NEH funds humanities research by groups of two or more scholars through Collaborative Research, and the preparation
    of editions and translations through Scholarly Editions and Translations [631] [633]. Other NEH programmes pay to preserve
    collections and make them available [647] [649]. NEA has two research programmes, Research Grants in the Arts and NEA
    Research Labs [650]. IMLS's National Leadership Grants for libraries and for museums, and NHPRC's programmes for documentary
    editions and archival projects, complete the route [676] [680] [698] [696].
  who_for: 'The route is for a scholar or research office applying through an organisation: NEA requires the applicant organisation
    to have operated for five years before the deadline, and the IMLS notices apply their own library and museum eligibility
    tests [651] [677] [681].'
  how_it_works:
  - The organisation registers in SAM.gov and Grants.gov before the deadline; NEH states that first-time SAM.gov registration
    may take several weeks and that it grants no extension for late registration [644].
  - 'NEH and IMLS applications go through Grants.gov in one submission [632] [677]. NEA uses two parts: Part 1 through Grants.gov,
    then Part 2 in the NEA Applicant Portal [651] [650].'
  - NHPRC takes an optional draft by a draft deadline before the Grants.gov submission [698] [695].
  - Most of these programmes have one deadline a year; Collections Stewardship had two in its 2026 notice [631] [633] [653]
    [677] [648].
  - 'Cost sharing differs by funder: every NEA research award must be matched at least one to one from nonfederal sources,
    while NEH does not require cost sharing in Collaborative Research unless the applicant requests federal matching funds
    [651] [652] [632].'
  - NHPRC recipients may not use grant funds for indirect costs, and NEH allows a federally negotiated rate or the 15% de
    minimis rate [698] [648] [644].
  watch: Executive Order 14238 of March 14, 2025 directed that IMLS's non-statutory functions be eliminated; a district
    court vacated the implementing actions, and a settlement signed April 9, 2026 keeps IMLS awarding grants to the full
    extent of its appropriation [688] [687] [689]. On September 19, 2025 the District of Rhode Island vacated the NEA's
    April 30, 2025 Final Notice on gender ideology and enjoined its standard as applied to the plaintiffs; a reported appeal
    was filed November 17, 2025 [657] [658]. The 2026 Collaborative Research and Scholarly Editions and Translations competitions
    took only projects on American history and culture or Western civilization [633] [632]. NARA's FY 2027 justification
    requests $0 for NHPRC grants [703].
