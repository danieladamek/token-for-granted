- id: approaching-a-foundation
  name: Approaching a foundation
  family: start
  what: Each foundation states on its own pages how it takes requests; this route sets out the answers of the 65 foundations
    and other private grantmakers in this guide [2124] [2290]. Under the tax code a section 501(c)(3) organisation is a
    private foundation unless it falls into an excluded category, the public charities [2237] [2238]. A community foundation
    that meets a public support test is a public charity, and a company may give through a company-sponsored foundation
    or a giving programme run inside the company [2374] [2408].
  who_for: A researcher, research office or non-profit looking at a foundation for the first time [2124] [2290].
  how_it_works:
  - Twenty-three take applications only under an open call posted on the foundation's site; Simons, Spencer and Knight are
    examples [2119] [2196] [2296].
  - Twenty-three fund by invitation only. Mellon says its staff "seek out and get to know innovative organizations, scholars,
    and creators before inviting them to submit a proposal" [2211] [2210]. Rockefeller and Mott give no route for an uninvited
    request; Moore allows one form of contact, an email of about 100 words [2290] [2298] [2128].
  - Ten begin with a letter of inquiry, after which, in Carnegie Corporation's words, "applicants may be invited via email
    to submit a full proposal" [2216]. Sloan says a reply can take up to 8 weeks, the Commonwealth Fund usually answers
    within six weeks, and Kellogg decides within 30 business days [2124] [2323] [2269].
  - Six accept unsolicited requests, among them The Duke Endowment, the Cleveland Foundation and The New York Community
    Trust [2310] [2426] [2418]. For three no answer is recorded; the page read for the Foundation for the NIH gives no application
    route [2448].
  - Kellogg, Kresge, Mellon and Packard each run a grants portal on the Fluxx system, and an applicant registers separately
    with each [2269] [2273] [2339] [2367].
  - Three free sources hold foundations' Form 990-PF and Form 990 filings, among them the IRS Tax Exempt Organization Search
    and ProPublica's Nonprofit Explorer, whose filings go back as far as 2001 [2059] [2398] [2399].
  watch: Candid launched Candid search, which now holds its funder directory, on January 15, 2026 and says it is free for
    anyone who registers at candid.org [2400] [2402].
