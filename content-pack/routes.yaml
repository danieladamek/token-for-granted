- id: early-career-faculty-award
  name: An award for faculty in their first years
  family: people
  what: An early-career faculty award funds the research of one investigator in the first years of an independent post [814]
    [924]. NSF's CAREER is a five-year award for early-career faculty who combine research and education [814]. The Energy
    Department's Office of Science, the Air Force, Navy and Army research offices, DARPA and NASA each run a counterpart
    [890] [924] [922] [341] [925] [950]. The employing institution submits the proposal on behalf of one investigator [815]
    [924] [921].
  who_for: 'It is for a faculty member early in a tenure-track or equivalent post, and for the research office that submits
    [815] [922]. Each programme measures "early" its own way: CAREER requires an untenured investigator and allows three
    competitions, the Energy Department counts ten years from the doctorate, the Army five [815] [890] [341]. The route
    also holds NSF''s Mid-Career Advancement award, for those at associate professor rank for at least three years [823].'
  how_it_works:
  - 'The career-stage test is set in each year''s notice: the Air Force''s FY 2027 announcement required a doctorate received
    on or after April 1, 2019 [924].'
  - 'A first stage often precedes the full proposal: the Energy Department requires a pre-application, the Air Force a white
    paper, and NASA''s Earth science programme a notice of intent [890] [923] [951].'
  - CAREER proposals are due once a year on the fourth Wednesday in July, with a letter from the department head confirming
    eligibility and stating the department's support [815].
  - The Army's award sits inside a standing announcement that is open continuously; DARPA typically posts its announcement
    between September and October; NASA solicits its Earth science programme every three years [341] [925] [950].
  - 'Faculty at institutions not classified R1 have a separate NSF door: Engineering Research Initiation funds a first project
    of up to $200,000 over two years for an investigator with little federal research support [832] [831].'
  watch: Executive Order 14332, signed August 7, 2025, requires senior appointees to review funding opportunity announcements
    and discretionary awards and directs that awards permit termination for convenience [246]. NSF's pages show CRII, BRC-BIO
    and LEAPS-MPS as archived, and none of the twelve foundational-research notices NSF posted on August 17, 2026 is an
    early-career notice [843] [845] [844] [192]. DOE's FY 2026 Early Career Research Program notice was posted March 3,
    2026 and closed June 2, 2026; no FY 2027 notice was on the Office of Science open list on 2026-10-04 [909] [282]. NSF's
    FY 2027 request of April 3, 2026, a proposal, asks $150.0 million for CAREER [255].
