- id: foundation-fellowship-and-scholar-award
  name: A foundation fellowship or scholar award
  family: people
  what: 'Private foundations and other non-federal funders give fellowships and scholar awards to named researchers, most
    of them faculty in the first years of an independent post [2125] [2149] [2174]. The awards are fixed sums over fixed
    terms, such as $75,000 over two years from the Sloan Foundation and $875,000 over five years from the Packard Foundation
    [2125] [2149]. HHMI works differently: it employs its Investigators, who keep an appointment and laboratory at the home
    institution [2161].'
  who_for: It is mainly for an early-career scientist or scholar at a university or research institution, and for the office
    that runs the institution's internal selection [2174] [2146]. The Guggenheim Fellowship and the HHMI Investigator Program
    are for people further on [2225] [2161]. Some awards are open only to nominees of institutions the funder has invited
    [2149] [2174].
  how_it_works:
  - 'The door differs by award: some need an institutional nomination, some take a direct application, and some start with
    a letter of intent [2146] [2141] [2168].'
  - 'Nominated awards cap what an institution may send: the Dreyfus Foundation takes one nomination per institution a year
    [2146], Pew one nominee from each participating institution [2174], the Packard Foundation up to two from each of 50
    invited universities [2149], and the William T. Grant Foundation one from each major division [2206].'
  - The institution therefore runs an internal selection, and the nominee then completes the funder's own application [2174]
    [2149].
  - 'A direct application still involves the institution: a Cottrell Scholar proposal is approved by the Authorized Organizational
    Representative before submission [2141].'
  - 'Career windows are counted from a stated event: the first tenure-track appointment for the Cottrell and Camille Dreyfus
    awards [2141] [2146], and seven years from the doctorate for the William T. Grant Scholars [2206].'
  - 'Indirect costs are limited or excluded: Sloan, Cottrell and Dreyfus allow none, Pew allows up to 8 percent and the
    American Heart Association 10 percent [2125] [2141] [2146] [2174] [2188].'
  watch: A news report of May 19, 2025 states that HHMI paused applications to the Hanna Gray Fellows programme; HHMI's
    programme page on 2026-10-04 shows the competition reopening on November 3, 2026 [2231] [2163]. HHMI states that beginning
    with the 2028 competition, which opens November 3, 2026, the Freeman Hrabowski Scholars and Hanna H. Gray Fellows programmes
    select scientists through a single, combined competition [2162]. Carnegie Corporation states that 2027 begins a new
    three-year nomination cycle for the Andrew Carnegie Fellows Program [2217].
