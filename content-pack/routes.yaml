- id: arts-humanities-libraries-and-media
  name: An arts, humanities, museum or library programme grant
  family: programme-service
  what: The National Endowment for the Arts (NEA) funds arts projects by organisations through one main programme, Grants
    for Arts Projects [654]. The National Endowment for the Humanities (NEH) funds public humanities programming, residential
    institutes for teachers and faculty, and newspaper digitisation [1363] [1364] [1365]. The Institute of Museum and Library
    Services (IMLS) funds museum projects and Native American and Native Hawaiian library and museum services [686] [1368]
    [1369] [1371]. The Corporation for Public Broadcasting distributed federal appropriations to public media stations and
    producers [1406].
  who_for: For staff at an arts organisation, museum, library or tribal cultural programme, and for a university office
    applying for a museum or institute grant; the two Native American Library Services grants are for libraries run by federally
    recognized Native communities [1369] [1370].
  how_it_works:
  - 'An NEA application has two parts at each of two yearly deadlines, in February and July: a short form through Grants.gov,
    then the full application in the NEA Applicant Portal [654].'
  - Challenge America and Our Town are no longer separate applications; an applicant chooses them as disciplines inside
    Grants for Arts Projects [1357] [1358].
  - NEA awards run from $10,000 to $100,000, need a one-to-one cost share, and are generally limited to one application
    per calendar year [654].
  - In the NEH cycle shown, the Public Humanities Projects application was to become available October 15, 2026 for a December
    9, 2026 deadline [1363].
  - IMLS has one deadline a year in mid-November; cost share is one to one for Museums for America, and none for Inspire!
    requests of $25,000 or less or for the Native American and Native Hawaiian programmes [686] [1367] [1368] [1369] [1371].
  - State arts agencies, state humanities councils and State Library Administrative Agencies receive federal money each
    year and run or fund local work; for that money a local organisation looks to the state body [1359] [1360] [1366] [1372].
  watch: Public Law 119-28 of July 24, 2025 rescinded fiscal year 2026 and 2027 appropriations for the Corporation for Public
    Broadcasting, which announced a wind-down on August 1, 2025 [1407] [1406]. On September 19, 2025 the District of Rhode
    Island vacated and permanently enjoined the NEA's Final Notice on gender ideology; an appeal filed November 17, 2025
    is reported [657] [658]. NEH terminated the state humanities councils' general operating support grants on April 2,
    2025; the District of Oregon preliminarily enjoined the terminations on August 6, 2025, and NEH's FY 2026 spend plan
    holds $34.8 million in escrow due to pending litigation [1448] [1485]. The NEA expects new guidelines by late December
    2026 [654].
