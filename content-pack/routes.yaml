- id: housing-homelessness-and-veterans-services
  name: A housing, homelessness or veterans services grant
  family: programme-service
  what: HUD's Continuum of Care Program funds non-profit providers, states, tribes and local governments to rehouse people
    who are homeless [1347]. The Department of Veterans Affairs (VA) pays non-profits for supportive services to very low-income
    Veteran families, for transitional housing by per diem, and for suicide prevention [1308] [1310] [1314]. FEMA's Nonprofit
    Security Grant Program pays for physical security at non-profits at high risk of terrorist attack [1317].
  who_for: For programme staff at a homeless services provider, fair housing organisation, housing counselling agency or
    organisation serving Veterans; counselling grants go only to an agency HUD approved before the notice was issued [1290].
  how_it_works:
  - A Continuum of Care provider finds the local Continuum and its Collaborative Applicant, follows the local competition,
    and submits its project in HUD's e-snaps system for the consolidated application [1283]. The local Continuum ranks the
    projects and HUD selects in two tiers [1286].
  - HUD's fair housing notices go through Grants.gov, one round a year with a separate notice for each initiative; the FY
    2025 notices were posted July 29 and closed August 21, 2025 [1498] [1497].
  - VA's Supportive Services for Veteran Families notice is posted in November or December and closes in February or March;
    it ranks new applicants fourth, after three classes of existing grantee [1307] [1309]. A Grant and Per Diem application
    may be for transitional housing beds or for a service centre, not both [1313].
  - 'Match differs: Continuum of Care recipients match all funds except leasing funds with no less than 25 percent, and
    the three VA programmes require none [1286] [1308] [1313] [1316].'
  - A non-profit cannot apply to FEMA for a security grant; it applies to its State Administrative Agency, which sets an
    earlier deadline of its own [1320]. CDBG and HOME are formula grants to states and localities, and HUD gives no CDBG
    money directly to non-profits [1292] [1293].
  watch: The District of Rhode Island set aside HUD's November and December 2025 Continuum of Care notices on June 29, 2026
    and the FY 2026 notice on August 7, 2026, and denied a permanent injunction both times [1477] [1478]. On September 16,
    2026 the First Circuit stayed the August 7 ruling pending appeal, and HUD reopened the notice on September 18 with a
    September 30, 2026 deadline [1283]. On September 24, 2025 the same district court vacated the immigration-enforcement
    conditions in DHS's grant terms and permanently enjoined their enforcement against the plaintiff states [1336]. HUD's
    FY2027 budget requests no funding for Continuum of Care, CDBG, HOME or Housing Counseling Assistance [1340] [1341].
