- id: nih-investigator-initiated-grant
  name: An investigator-initiated NIH research grant
  family: research
  what: A parent announcement is a standing, broad notice that an applicant uses for an investigator-initiated application,
    one whose topic the investigator chose and NIH did not ask for [1]. The R01 supports a discrete, specified research
    project, with no budget cap, for up to five years [3] [4]. An R21 runs up to two years with combined direct costs of
    at most $275,000; an R03 allows $50,000 in direct costs a year for at most two years [5] [6]. The R13 supports conferences
    and workshops [3].
  who_for: The route is for an investigator with a self-chosen project, at a university or a non-profit other than an institution
    of higher education, with or without 501(c)(3) status [4].
  how_it_works:
  - The organisation registers in SAM (with a Unique Entity Identifier), Grants.gov and eRA Commons, and each PD/PI (programme
    director/principal investigator) links an ORCID iD to the eRA Commons account [4] [31].
  - The applicant picks the parent notice for the activity code and checks which institutes take part, since not every institute
    joins each one [43] [1].
  - The applicant may contact a programme official, found through the Matchmaker tool or Section VII of the notice, to ask
    whether the plan fits [120] [92].
  - 'Applications go through Grants.gov on standard due dates, three cycles a year: new R01 applications on February 5,
    June 5 and October 5, new R21 and R03 applications on February 16, June 16 and October 16 [1] [2] [121].'
  - The budget uses the modular format when direct costs are $250,000 a year or less [36]. F&A (indirect) costs are paid
    on top of direct costs at the organisation's negotiated rate [64] [36].
  - NIH accepts six applications per principal investigator per calendar year, across all activity codes except T codes
    and R13 [12]. A project with a foreign collaborator uses the PF5, the structure NIH put in place of foreign subawards
    [86].
  watch: NIH's February 7, 2025 guidance announcing a standard 15% indirect cost rate was enjoined on March 5, 2025 and
    later vacated in district court; the First Circuit affirmed on January 5, 2026 [25] [24]. Since September 25, 2025 each
    PD/PI is limited to six new, renewal, resubmission or revision applications per calendar year [12] [140]. NIH reported
    that the research project grant success rate fell from 18.5% in FY 2024 to 13.0% in FY 2025 [81]. A June 8, 2026 notice
    asked for comment on a proposed cap of 2, 3 or 4 research project grants per person; NIH announced no decision on August
    19, 2026 [89] [88].
