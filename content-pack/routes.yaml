- id: nsf-special-and-cross-cutting-solicitations
  name: An NSF special proposal type or cross-directorate solicitation
  family: research
  what: 'PAPPG Chapter II.F defines proposal types beside the standard research proposal: EAGER for exploratory work on
    untested but potentially transformative research ideas, RAPID for time-sensitive work, RAISE, planning proposals, conference
    proposals and GOALI [257] [251] [212]. The route also holds solicitations that span directorates or fund teams, among
    them SaTC 2.0, Growing Convergence Research, DMREF and Expeditions in Computing [265] [266] [275] [191].'
  who_for: The route is for an investigator with an early, urgent or team-based idea; these proposal types take the same
    organisations and investigators as any NSF proposal [156].
  how_it_works:
  - For RAPID, EAGER, RAISE and planning proposals the PI first sends a concept outline to the programme officer; outlines
    are generally limited to two pages or 6000 characters [156] [251] [185].
  - In BIO, approval from the directorate is required before the full proposal is submitted [185].
  - The proposal may then be submitted at any time, prepared in Research.gov under its own proposal type [166] [252].
  - From December 8, 2025 the request ceilings are $300,000 for up to one year for RAPID, $400,000 for up to two years for
    EAGER, and $200,000 per year for up to two years for a planning proposal [149].
  - Conference proposals are accepted at any time in BIO, and ENG asks for them at least a year before the meeting [185]
    [166].
  - 'The cross-directorate and team solicitations set their own dates and limits: SaTC 2.0 has deadlines on the last Monday
    in September and in January, Growing Convergence Research on the second Monday in February, and an organisation may
    lead at most five DMREF proposals [265] [266] [275].'
  watch: PAPPG Supplement 1 (NSF 26-200) of December 8, 2025 raised the ceilings for planning proposals to $200,000 per
    year, RAPID to $300,000 and EAGER to $400,000, and set a minimum of two reviewers, who may be NSF staff [149]. On August
    17, 2026 NSF released twelve Notices of Funding Opportunity for foundational research in BIO, CISE, ENG, GEO and MPS,
    which consolidate earlier publications [192] [185] [197] [199]. SBE programme pages updated in July and September 2026
    show no upcoming due dates and state that each programme is waiting for a new publication, and the CRCNS page carries
    the same notice [224] [226] [225] [274].
