- id: congressionally-directed-project
  name: A project named by Congress in an appropriations act
  family: capacity
  what: 'On this route Congress chooses the project: an organisation has standing when the joint explanatory statement of
    an enacted appropriations act names it as the recipient of a specific project and amount [1686]. The agency then funds
    only the named entity, for the named purpose [1687] [1690]. The request goes through a House Member, as Community Project
    Funding, or a Senator, as congressionally directed spending [1667] [1675].'
  who_for: 'A non-profit, college or local government with one defined project and a Member or Senator willing to request
    it: HUD awards each grant only to the recipient, for the project and in the amount named [1686].'
  how_it_works:
  - The organisation asks a Member of the House or a Senator to request the project, on that office's deadline and with
    evidence of community support [1667] [1674]. Each office sets a deadline earlier than its committee's [1668].
  - 'Requests are capped: in FY27 a House Member could submit at most 20 across all bills [1667], and a Senator at most
    65 in the Labor-HHS-Education bill and 25 in Agriculture [1675].'
  - 'The chambers do not take requests in the same accounts: in FY27 the Senate takes at most eight requests per Senator
    in the SAMHSA account and the House takes none [1675] [1669].'
  - 'A named recipient still applies, and each agency sets its own step: HUD emails a grant package that is returned through
    its DRGR system [1686], HRSA takes applications through Grants.gov under a construction or a non-construction notice
    [1708], and SAMHSA posts one closed announcement open only to the organisations identified [1688].'
  - 'That step can come months after the act: the Labor Department''s FY 2026 guidance letter was issued August 21, 2026,
    about six and a half months after the act was signed on February 3, 2026 [1690].'
  watch: Congress designated no earmarked funds in FY 2025; FY2026 projects were enacted in four laws between November 12,
    2025 and April 30, 2026 [1680] [1708] [1686] [1682] [1677]. The House FY27 guidance of March 19, 2026 excludes non-profits,
    other than fire stations, from Community Facilities requests, and its list of eligible recipients for HUD Economic Development
    Initiatives names governments and certain colleges only [1672] [1671] [1673]. Every committee deadline for fiscal year
    2027 requests has passed, the last on May 7, 2026; FY27 projects are in committee tables and have not been enacted,
    with appropriations continued at FY2026 rates through December 11, 2026 [1668] [1675] [1666] [61] [1683].
