- id: getting-registered-to-apply
  name: Getting registered before a first federal application
  family: start
  what: Before an organisation applies to a federal agency as the prime applicant, it must hold an active registration in
    SAM.gov, the registry run by the General Services Administration [1897] [1899]. Registration assigns the Unique Entity
    ID (UEI), which every later registration uses [1898] [784]. Most agencies then receive applications through Grants.gov,
    and some add a system of their own, such as eRA Commons at NIH or Research.gov at NSF [1895] [1911] [161].
  who_for: An organisation preparing its first federal application, and the people who will be named in it [1897] [1909].
    A person applying on their own behalf adds an Individual Applicant profile to a Grants.gov account and does not register
    with SAM.gov [1896].
  how_it_works:
  - Each person creates a Login.gov account, the sign-in for SAM.gov and Grants.gov [1897] [1965].
  - The organisation registers in SAM.gov with its legal name and physical address, which SAM.gov validates before assigning
    the UEI [1897] [1898]. SAM.gov says activation can take up to 10 business days and that registration is free [1897]
    [1898].
  - The person named in SAM.gov as Electronic Business Point of Contact registers the organisation on Grants.gov and assigns
    roles; someone must hold the Authorized Organization Representative role to submit [1895]. The Department of Education
    says SAM.gov information may take 24 to 48 hours to be usable in Grants.gov [1928].
  - At NIH a Signing Official registers the organisation in eRA Commons, and each person named on an application needs a
    personal account [1911] [1909]. NIH says to allow two weeks or more for eRA Commons and six weeks or more for the whole
    set [1909].
  - At NSF the organisation registers in Research.gov and each person obtains one NSF ID; NSF advises starting SAM registration
    at least 90 days before submission [161] [156].
  - The SAM.gov registration lapses unless renewed every 365 days, and a Grants.gov account is deactivated after 365 days
    of inactivity [1897] [1966].
  watch: NIH requires an ORCID iD, linked to the eRA Commons account, of every person who submits a Common Form for due
    dates on or after January 25, 2026 [31]. NSF requires research security training of each senior/key person on all proposals
    from December 2, 2025 [2014].
