- id: predoctoral-fellowship
  name: A fellowship for a graduate student
  family: people
  what: A predoctoral fellowship supports a graduate student through a research degree, usually with a stipend and a payment
    toward tuition or the cost of education [732] [819]. In some the student is the applicant, as in NSF's Graduate Research
    Fellowship, the defence department's NDSEG fellowship and the Energy Department's computational science fellowship [818]
    [913] [904]. In others the university applies with the student named, as in the NIH F31 and F30, NASA's FINESST and
    the Justice Department's graduate research fellowship [784] [949] [991].
  who_for: 'It is for a student in, or about to enter, a graduate programme, and for the research office when the institution
    is the applicant [818] [784]. Entry points differ: the NSF fellowship takes applicants from the final undergraduate
    year to the end of the first graduate year, while the NIH F31 requires enrolment in a research doctoral programme and
    a named sponsor [818] [736].'
  how_it_works:
  - 'Each programme fixes who submits: the student, the university for a named student, or, under GAANN and NSF''s EPSCoR
    Graduate Fellowship Program, a department or university that then chooses its fellows [818] [784] [1016] [825].'
  - 'A student who applies alone uses the programme''s own portal: the GRFP module of Research.gov, the NDSEG portal run
    by a contractor, or the online system of the Energy Department''s graduate research programme [887] [913] [894].'
  - For an NIH fellowship the university holds registrations in SAM, eRA Commons and Grants.gov, and the student needs an
    eRA Commons account linked to an ORCID iD [784].
  - NIH takes fellowship applications on April 8, August 8 and December 8; NSF's Graduate Research Fellowship runs one competition
    a year under a new solicitation [736] [818] [859].
  - A Knauss applicant applies to a state Sea Grant programme, which then applies to NOAA through Grants.gov for the students
    it puts forward [965].
  - An NIH fellow must be a citizen, a non-citizen national or a permanent resident by the time of award; NDSEG does not
    admit permanent residents [736] [757] [914] [912].
  watch: NSF's FY 2027 GRFP solicitation, posted August 25, 2026, gives an estimated 1,500 awards, moves deadlines to October
    19-23, 2026 and states that second-year graduate students are not eligible [818] [817]. NIH reissued the five parent
    fellowship notices on June 13, 2025, and Grants.gov shows its F31 diversity notice archived with a close date of February
    21, 2025 [736] [737] [739] [738] [784] [800]. The Education Department cancelled the fiscal year 2025 Fulbright-Hays
    Doctoral Dissertation Research Abroad competition on May 9, 2025, and AHRQ declared its dissertation grant notice expired
    on March 6, 2026 [1011] [513]. NOAA's FY 2027 budget justification proposes to terminate the National Sea Grant College
    Program, with a request of $0 [445].
