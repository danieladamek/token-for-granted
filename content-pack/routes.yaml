- id: designated-institution-programmes
  name: Programmes for designated institutions
  family: capacity
  what: 'Each programme here is open to one class of institution, and the classes differ: the class of historically Black
    colleges and universities (HBCUs) is closed, fixed by statute and a list in regulation, not by current enrolment [1649].
    Hispanic-serving status follows enrolment and is shown when an institution applies [1642]. For community colleges each
    programme states its own test [1621] [1615].'
  who_for: A research office at such an institution; some awards go to single investigators, as in NSF's HBCU-EiR, whose
    PI is a full-time faculty member or researcher at the submitting HBCU [1662].
  how_it_works:
  - 'Standing is settled first: HBCUs are listed in 34 CFR 608.2 [1649], a new tribal college obtains an eligibility determination
    from the Bureau of Indian Education [1617], NASA checks its own MSI List [1629], and the Education Department''s eligibility
    designation is checked in its Grant Eligibility Application system [1596].'
  - 'Much of the money is not competed: Title III Part B pays each eligible HBCU a yearly formula grant, on a two-phase
    application for a five-year grant period [1602], and Evans-Allen research funds go by formula to the 1890 land-grant
    institutions [1635] [1637].'
  - 'Competitive notices run beside the formulas: NSF''s HBCU-EiR, yearly with a required letter of intent [1662], NSF''s
    tribal colleges programme in eight tracks [1613], NIFA''s 1890 Capacity Building and Tribal Colleges Research grants
    [1632] [1657], and the Navy''s yearly notice for HBCUs and minority institutions, with a white paper stage [1628].'
  - 'Holding one grant can bar another: a predominantly Black institution funded under section 318 may not at the same time
    receive funds under another Title III Part A programme, Part B, or Title V Part A [1648].'
  - Match runs from none in NIFA's 1890 Capacity Building notice [1632] to 1:1 for the Education Department's research infrastructure
    grants [1616] and 100 percent for Evans-Allen [1635].
  watch: On September 10, 2025 the Education Department announced it would no longer award discretionary grants under seven
    programmes, and on September 18, 2025 it withdrew the FY 2025 notices for Developing HSIs, ANNH, AANAPISI and NASNTI
    and cancelled the competitions [1594] [1643]. Office of Legal Counsel opinions of December 2, 2025 and August 12, 2026
    conclude that seven Education programmes' eligibility provisions, and NSF's Hispanic-serving institutions programme,
    AGEP and LSAMP, are unconstitutional and inseverable; neither addresses HBCU programmes [1592] [876]. Tennessee and
    Students for Fair Admissions sued over the Developing HSIs programme and two others on June 11, 2025; a litigation summary
    reports their summary judgment motion of August 31, 2026 [1607] [1650].
