- id: epscor-and-idea-jurisdictions
  name: Programmes for EPSCoR and IDeA states and territories
  family: capacity
  what: NSF's EPSCoR is a programme to raise the research competitiveness of targeted jurisdictions, each a state, territory
    or commonwealth [866]. NIH's counterpart, IDeA, was authorised by Congress in 1993 to build biomedical research capacity
    in states with historically low NIH grant funding success rates [1545]. An institution qualifies by its location [1546].
  who_for: 'A research office or investigator at an institution in a listed state or territory: an institution of higher
    education may apply to DEPSCoR, the Defense programme, only if its state or territory is on the list in the year''s
    notice [1565].'
  how_it_works:
  - 'Each agency keeps its own list, and the lists differ: NSF''s has 28 jurisdictions [1517], DEPSCoR''s 36 entries [1565],
    NASA''s twenty-five states, Puerto Rico, the US Virgin Islands and Guam [1570], USDA''s 19 EPSCoR states for FY 2026
    [1576], and the Energy Department currently follows NSF''s criteria [1567].'
  - 'Some awards serve a whole jurisdiction: NSF''s E-CORE builds research infrastructure cores across one [1518], and NIH''s
    INBRE funds one statewide network in each IDeA state and Puerto Rico [1547].'
  - 'Others go to teams or single investigators: NSF''s FEC funds teams from at least two EPSCoR jurisdictions [1523], and
    DEPSCoR Research Collaboration pairs a faculty member who has never been PI on a directly funded DoD research prime
    award with a mentor who has [1566].'
  - 'Lead roles are limited: one application per institution for NIH''s COBRE Development phase [1545], one FEC or E-RISE
    proposal per lead organisation [1524] [1522]. A primarily undergraduate institution joins INBRE under its state''s lead
    institution, which sends the federal application [1547] [1543].'
  - Cost sharing runs from none for DEPSCoR and COBRE [1565] [1545] to 20 percent for NASA's RID awards and 50 percent for
    NASA EPSCoR Research awards [1571]; E-CORE and E-RISE renewals require 20% [1520] [1522].
  watch: E-CORE and E-RISE were posted on December 13, 2024, and NSF states that together they replaced RII Track-1 [1519]
    [1521] [255]. NIH posted new COBRE notices on June 18 and August 19, 2026; the INBRE notice expired on May 23, 2025,
    and a forecast estimates that the next will be posted February 18, 2027 [1546] [1545] [1548] [1549]. As read on 2026-10-04,
    the newest NASA EPSCoR notices on Grants.gov are the two FY 2025 notices posted in October and November 2024 [1572]
    [1571]. NASA's FY 2027 budget request, a proposal, asks $0.0 million for STEM Engagement and states that it terminates
    funding for the office under which NASA EPSCoR is funded [1585] [1573].
