- id: food-environment-and-community-development
  name: A food, environment or community development grant
  family: programme-service
  what: USDA funds community food projects, nutrition incentives, farm to school projects, rural community facilities and
    support for rural small businesses [1416] [1417] [1414] [1410] [1509]. EPA funds brownfields assessment and cleanup,
    brownfields job training and environmental education [1420] [1456] [1419]. The Economic Development Administration (EDA),
    the Appalachian and Delta regional bodies, the CDFI Fund, SBA and the IRS fund infrastructure, community lenders, business
    counselling centres and free tax help [1431] [1445] [1447] [1433] [1441] [1437].
  who_for: For staff at a food, environmental, rural or economic development non-profit, or a university hosting a clinic
    or centre; for-profit entities and individuals are not eligible for Rural Business Development Grants, and SBA says
    it gives no grants for starting or expanding a business [1509] [1441].
  how_it_works:
  - 'The yearly Grants.gov competitions have had windows of about a month: Community Food Projects ran June 15 to July 16,
    2026, the nutrition incentive notice May 13 to June 16, 2026, and the IRS tax assistance grants take applications from
    May 1 to May 31 [1416] [1417] [1460].'
  - 'Several programmes start with a regional or state office: USDA Rural Development tells applicants to contact the state
    office first, and an Appalachian Regional Commission application starts with the state''s programme manager and needs
    state approval [1410] [1445].'
  - Community Facilities applications are taken all year, and EDA's Public Works and Economic Adjustment Assistance notice
    has no submission deadlines [1410] [1430].
  - A CDFI Fund Financial Assistance applicant must be a certified community development financial institution, and EDA
    limits its grants to regions that meet a distress test [1434] [1432].
  - 'Match is common and differs: dollar for dollar for Community Food Projects, low income taxpayer clinics and volunteer
    tax assistance (VITA); 25 percent of total project cost for farm to school and environmental education grants; none
    for brownfields job training [1416] [1459] [1460] [1414] [1419] [1456].'
  - 4-H is delivered by the Cooperative Extension Service of the land-grant universities [1454].
  watch: The Digital Equity Competitive Grant Program was cancelled on May 9, 2025; on July 15, 2026 the District of Columbia
    district court held the Act's racial classification provision unconstitutional and severable, and trade press reports
    that NTIA targets a December 2026 reopening [1426] [1429]. Public Law 119-21 of July 4, 2025 includes a section headed
    rescission of funding for environmental and climate justice block grants [1422]. On July 2, 2026 the Rural Housing Service
    rescinded the fiscal year 2025 Rural Community Development Initiative notice [1412]. The FY 2027 Budget proposes to
    eliminate the Economic Development Administration and to cancel $2.2 billion for the Digital Equity programme [1463].
