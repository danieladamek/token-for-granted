- id: agriculture-environment-and-physical-science-agencies
  name: Research competitions at USDA, NOAA, EPA, NIST, USGS, DOT and DHS
  family: research
  what: AFRI, the Agriculture and Food Research Initiative, is NIFA's main competitive grants programme for agricultural
    science [406] [404]. NOAA competes research through topic-specific notices such as the NCCOS Competitive Research Program
    [477]. USGS holds an annual competition for earthquake hazards research, and the FAA keeps a standing announcement for
    research that supports civil aviation [481] [482] [498]. EPA describes its STAR programme as competitive and peer-reviewed
    [453].
  who_for: 'The route is for an investigator or research office at a university or non-profit research institution; eligibility
    is set notice by notice: NOAA''s bycatch programme takes individuals and for-profit organisations too, while the FAA
    programme takes colleges, universities and other non-profit research institutions qualifying under section 501(c)(3)
    [479] [498].'
  how_it_works:
  - The organisation registers in SAM.gov and Grants.gov, plus eRA Commons for NOAA notices; NIFA says to allow 4-6 weeks
    for SAM.gov [421] [477].
  - 'Calendars differ: AFRI Foundational and Applied Science gives each programme area priority its own code and deadline,
    and USGS posts one earthquake hazards announcement a year for the following fiscal year [424] [406] [482].'
  - 'Several competitions open with a short first stage: a letter of intent for NCCOS, a pre-application for the Specialty
    Crop Research Initiative and the NIST Precision Measurement grant [477] [414] [471].'
  - 'Matching varies: the NIFA page for organic research gives 100%, USGS water grants need a 1:1 non-federal match and
    most Sea Grant notices 50%, while the NCCOS notice requires none [415] [485] [436] [477].'
  - 'Two are reached through an intermediary: USGS 104(g) water grants through the state''s Water Resources Research Institute,
    which submits the application, and Sea Grant research through each of the 34 Sea Grant programmes'' own opportunities
    [485] [483] [437].'
  - Centres are competed at long intervals, NOAA Cooperative Institutes one at a time and University Transportation Centers
    once per authorization period [440] [492]. USDA's non-assistance cooperative agreements are not opened by a public solicitation
    [428] [427].
  watch: DOT's list of centres marks grants terminated on May 2, 2025; on December 22, 2025 DOT reopened competition for
    five vacant University Transportation Center slots [496] [495] [492] [493]. A USDA memorandum of December 30, 2025 named
