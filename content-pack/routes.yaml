- id: workforce-and-education-programmes
  name: A workforce or education programme grant
  family: programme-service
  what: The Labor Department's competitions here pay organisations to run YouthBuild pre-apprenticeship programmes, reentry
    employment services and apprenticeship incentive payments [1298] [1299] [1301]. The Education Department's pay for the
    TRIO programmes, GEAR UP, Promise Neighborhoods, community schools and the scaling of evidence-based practices in schools
    [1383] [1402] [1395] [1400] [1401].
  who_for: For programme staff at a community non-profit and for a college's sponsored programmes office; Student Support
    Services is open only to institutions of higher education, and a Full-Service Community Schools applicant is a consortium
    of school districts and community organisations [1388] [1400].
  how_it_works:
  - Labor posts one funding announcement for a programme round, and the application goes through Grants.gov; the applicant
    keeps an active SAM.gov registration through the end of the award [1297] [1305].
  - 'Recent Labor windows ran seven to ten weeks: the YouthBuild round was posted December 23, 2025 and closed March 2,
    2026, and the reentry announcement ran from February 25 to April 15, 2026 [1297] [1299]. In Program Year 2026 the farmworker
    jobs programme issued allotment instructions open only to current grantees [1511].'
  - Education announces a competition in the Federal Register with a short notice; the full notice is on the Department's
    programme page, the Labor Department's site or Grants.gov, and the application goes through Grants.gov [1382].
  - The TRIO competitions for Talent Search, Educational Opportunity Centers and Upward Bound come every four years [1383]
    [1385] [1387].
  - 'Match differs widely: none for those TRIO programmes, 10 percent of the grant for Education Innovation and Research,
    25 percent of the federal share for YouthBuild, and at least 50 percent of total project cost for GEAR UP [1383] [1401]
    [1356] [1402].'
  - WIOA training funds and 21st Century Community Learning Centers money go by formula to states, and a local provider
    is funded by the state or locally; Charter Schools grants go to a state entity that makes subgrants [1304] [1399] [1396].
  watch: In July 2025 the Education Department denied new FY 2025 Student Support Services applications and in summer 2025
    discontinued existing TRIO grants; on January 16, 2026 the District of Columbia district court vacated those decisions
    for the plaintiff association's named members [1389]. Interagency agreements announced November 18, 2025, recorded as
    pending implementation, place the Department's elementary and secondary and its postsecondary programmes with the Labor
    Department, whose Employment and Training Administration ran FY 2026 competitions noticed from March 23, 2026 [672]
    [1382] [1384] [1396] [1395]. The FY 2027 requests, both proposals, ask $0 for the Federal TRIO Programs and GEAR UP
    at Education and $0 for YouthBuild and Reentry Employment Opportunities at Labor [1404] [1405] [1342].
