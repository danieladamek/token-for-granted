- id: research-instrumentation-and-facilities
  name: A research instrument, shared equipment or a research facility
  family: capacity
  what: 'These grants pay for an instrument, equipment or research space, not for a research project: NIH''s S10 Shared
    Instrumentation Grant buys one commercially available instrument for a group of NIH-funded investigators to share [1534].
    NSF''s Major Research Instrumentation programme (MRI) pays for a single shared instrument, bought, upgraded or built
    [1516]. NIH''s C06 awards pay for construction, renovation and modernisation of biomedical research space [1541].'
  who_for: 'A research office and a group of investigators with a shared need: an S10 Shared Instrumentation application
    names at least three NIH-funded Major Users [1536], and the Defense University Research Instrumentation Program (DURIP)
    equips universities in areas of interest to the Department of War [1562].'
  how_it_works:
  - 'Size sorts the programmes: S10 Seed Instrumentation covers $50,000 to $400,000 [1537], S10 Shared Instrumentation $300,000
    to $5,000,000 [1536], DURIP $50,000 to $3,000,000 [1563], and MRI more than $100,000 up to $4,000,000 [1513] [1516].'
  - 'Several programmes cap applications per institution: one for S10 Seed Instrumentation, S15 and C06 [1537] [1540] [1542],
    and under the last MRI solicitation two in Track 1 and one each in Tracks 2 and 3 [1516]. DURIP states no limit [1563].'
  - 'The rhythm is yearly: one receipt date for the S10 notices [1535], one DURIP announcement [1563], one MRI window in
    October–November [1514].'
  - 'Doors differ: DURIP goes through Grants.gov only, under the number of the office (ONR, ARO or AFOSR) whose research
    the instrument serves [1563], and MRI proposals under NSF 23-519 went through Research.gov or Grants.gov [1516].'
  - 'Cost rules differ: S10 awards allow no indirect costs [1536], DURIP requires no cost sharing [1563], and the Energy
    Department''s nuclear energy infrastructure notice requires 50% cost sharing in one topic area above $250,000 [1588].'
  - 'Some programmes are limited to a class of institution: one Defense equipment notice of 2026 names historically Black
    and tribal colleges [1627].'
  watch: NSF states that a federal court vacated its 15% indirect cost policy and that it reverted to negotiated rates as
    of May 19, 2025 [154]. NSF announced on July 2, 2025 that it would not accept new MRI proposals in the FY 2026 window,
    October 15 to November 14, 2025; on 2026-10-04 the solicitation was labelled Archived, and NSF anticipates an updated
    one for proposals in FY 2027 [1514] [1513]. On June 25, 2026 NIH posted PAR-27-022, which consolidates the Shared, High-End
    and Basic Instrumentation Grant programmes into one S10 notice [1536] [1537]. NSF's FY 2027 request of April 3, 2026,
    a proposal, asks $20.00 million for MRI [255].
