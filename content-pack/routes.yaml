- id: foundation-research-grant
  name: A research grant from a private foundation
  family: research
  what: Private foundations and other private grantmakers fund research through their own programmes, which on this route
    range from Keck Foundation grants of about $1 million for basic research in science and engineering to Spencer Foundation
    education research projects with budgets up to $50,000 [2133] [2194]. Some programmes are standing, such as Russell
    Sage Foundation Core Research Grants with three letter-of-inquiry deadlines a year [2201]. Others are single calls on
    a set topic, such as the Arnold Ventures request for proposals issued in September 2026 [2321] [2318].
  who_for: 'The route is for a faculty investigator or a researcher at a non-profit research organisation, and some programmes
    add a career test: the American Cancer Society Research Scholar Grant is for an independent investigator within 8 years
    of the first independent appointment [2191].'
  how_it_works:
  - 'Most programmes here run in two stages: a letter of inquiry, letter of intent or pre-proposal, then a full proposal
    by invitation [2201] [2121] [2321] [2180] [2196] [2207].'
  - A few take a full application on fixed dates, such as American Cancer Society Research Scholar Grants on June 1 and
    December 1 each year [2191].
  - 'Some limit applications per institution: Keck accepts up to three per institution per cycle, submitted by the institution''s
    designated liaison [2133] [2134].'
  - Applications go through each foundation's own online system, for example rsf.fluxx.io at Russell Sage and my.rwjf.org
    at the Robert Wood Johnson Foundation [2200] [2336].
  - 'Each foundation sets its own indirect cost rule: none at Keck [2133] or on Spencer small grants [2194], up to 15% on
    Spencer large grants [2195] and William T. Grant awards [2207], and 20 percent at Simons [2121].'
  - 'Investigator rules also vary: Spencer requires PIs and Co-PIs to hold an earned doctorate, and a Simons Collaboration
    director must hold a tenured faculty position, or equivalent [2195] [2121].'
  watch: The Spencer Foundation states that from 2026 its Large Research Grants on Education run on a single cycle per year
    [2195]. The American Cancer Society's grant policies state that the Research Scholar Grant eligibility cutoff was reduced
    from 10 years to 8 years starting with the Summer 2026 application cycle [2248]. The W. M. Keck Foundation's Research
    Program page states that concept consultations are no longer hosted, and its application instructions dated 8/26/26
    describe a single six-page application per cycle [2133] [2249]. In August 2025 the Robert Wood Johnson Foundation issued
    a call for health equity research that had lost federal funding, with a deadline of October 1, 2025 [2337].
