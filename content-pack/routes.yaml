- id: health-workforce-training-and-loan-repayment
  name: Loan repayment, service scholarships and health-workforce training
  family: people
  what: 'This route gathers money tied to a person''s work in a field and not to a research project [762]. Loan repayment
    pays down educational debt in return for a period of work: NIH repays up to $50,000 a year for health professionals
    doing research, and HRSA up to $40,000 over two years for faculty at health professions schools [762] [763] [1033].
    Workforce training grants go to schools and training programmes [1031] [1032]. Two scholarships outside health carry
    a like service obligation, the defence SMART scholarship and NSF''s Noyce teacher scholarships [917] [858].'
  who_for: Loan repayment is for an individual with a health-professional or doctoral degree and qualifying debt; an NIH
    grant is not needed to qualify [762] [1033]. The training grants are for schools, training programmes and, in the SAMHSA
    Minority Fellowship Program, national professional organisations [1032] [1031] [1037].
  how_it_works:
  - The person applies for loan repayment and for a SMART scholarship; a school or organisation applies for a training grant
    [763] [1033] [917] [1032].
  - An NIH loan repayment applicant picks a subcategory, contacts the institute's scientific liaison and submits in ASSIST
    during the yearly period, September 1 to mid-November [765] [763] [766].
  - 'The obligation is stated at the outset: an NIH awardee does qualified research for at least 20 hours a week for at
    least two years, and an HRSA awardee serves as faculty at an eligible school under a contract of two years or more [763]
    [1033].'
  - 'HRSA takes workforce grant applications through Grants.gov, and not every programme is competed yearly: its primary
    care training award was competed in 2011, 2015, 2020 and 2026 [1031] [1028] [1046].'
  - Under the SAMHSA Minority Fellowship Program a student applies to one of the eight grantee organisations, not to SAMHSA
    [1035].
  - NIOSH funds occupational safety and health training through two institutional awards, limits the applications an institution
    may submit and requires no payback from trainees [1060] [1061] [1063].
  watch: NIH opened the FY27 extramural loan repayment cycle on September 1, 2026 with three subcategories, saying the programme
    had been consolidated; FOCUS (L70) is marked as new, and the 2025 cycle had six programme notices [1085] [762] [766].
    HRSA competed its primary care National Research Service Award under notice HRSA-26-035; the previous listing found
    was posted September 10, 2020 [1046] [1027] [1028]. The NSF Noyce page, last updated June 27, 2025, shows "waiting for
    new publication" and no upcoming due dates [857]. An Office of Legal Counsel opinion of August 12, 2026, which is not
    a court ruling, concludes that Noyce may continue without regard to race or sex [876].
