- id: joining-as-a-subrecipient-or-partner
  name: Joining someone else's application as a subrecipient or partner
  family: start
  what: A subrecipient receives a subaward from a pass-through entity, the body that passes federal money on, to carry out
    part of a federal award; the federal terms flow down to it [1799] [1805]. A contractor sells goods or services to the
    recipient and is not subject to the programme's compliance requirements [1822]. Which of the two an organisation is
    decides whether the money counts toward the single audit threshold [1845].
  who_for: 'An organisation that takes part in an application led by another body: a local provider funded from a state''s
    formula grant, a project inside a Continuum of Care''s consolidated application, or a partner named in a research proposal
    [1280] [1283] [156].'
  how_it_works:
  - A subrecipient needs a Unique Entity ID (UEI) before a subaward can be made; under 2 CFR 25.300 it is not required to
    complete full SAM.gov registration [1899]. The identifier is free [1898].
  - At NSF a subrecipient named in a proposal obtains a UEI and registers in Research.gov without needing a SAM registration
    [156].
  - VOCA victim assistance grants go by formula to the states and territories, which make subgrants to local organisations;
    those subrecipients contribute not less than twenty percent, in cash or in kind, with exceptions [1280] [1351].
  - A subrecipient with no negotiated indirect cost rate may elect the de minimis rate of up to 15 percent of modified total
    direct costs, and its closing reports are due 90 calendar days after the period of performance ends [1802] [1830].
  - The recipient reports each subaward of $30,000 or more in federal funds and collects lobbying certifications from subrecipients
    above $100,000 [1908] [2039].
  - A University Transportation Center must be a consortium of two or more non-profit institutions of higher education under
    one lead institution [493]. Several capacity programmes reach a local organisation only as training, technical assistance
    or a subgrant from a national or regional body [1712] [1704]. Among foundations, Spencer funds partnerships between
    researchers and practitioners in education [2196].
  watch: NIH no longer makes awards that include a subaward to a foreign entity; paid foreign collaborators are funded through
    linked awards [106] [22] [86].
