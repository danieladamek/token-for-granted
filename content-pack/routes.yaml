- id: nih-r15-for-institutions-with-little-nih-funding
  name: An NIH R15 award for an institution with little NIH funding
  family: research
  what: 'The R15 supports small-scale research projects at educational institutions that train many of the nation''s research
    scientists but have not been major recipients of NIH support [3]. It comes in two versions: AREA, for undergraduate-focused
    institutions, and REAP, for health professional schools and graduate schools that have received limited NIH support
    [7] [8]. Either award is up to $375,000 in direct costs for a project of up to three years [7] [8].'
  who_for: The route is for a faculty member at an institution that passes the eligibility test and who is not PD/PI (programme
    director/principal investigator) of an active NIH research grant [7] [45]. For AREA the PD/PI holds a primary appointment
    at a non-health-professional school or college of the applicant institution [7].
  how_it_works:
  - 'The institution checks its standing first: an AREA institution grants baccalaureate degrees in biomedical sciences
    and enrols more undergraduates than graduate students, a REAP institution grants baccalaureate or advanced degrees in
    health professions or biomedical and behavioral sciences, and both are accredited public or non-profit private schools
    that have had limited NIH support [7] [8].'
  - For REAP the institution confirms that all its components together stayed at or under the NIH support threshold [8]
    [45]. A signed letter from the provost or similar official verifying eligibility goes in the application [45].
  - A budget of $250,000 or less in direct costs uses the modular format; $250,001 to $375,000 uses the R&R budget form
    [45]. F&A (indirect) costs are paid at the institution's negotiated rate, and the $375,000 limit counts direct costs
    only [7] [64].
  - 'The application is submitted through Grants.gov on an R15 due date: February 25, June 25 and October 25 for all R15
    application types [2] [121].'
  - A PD/PI may hold only one R15 at a time, and the limit of six applications per PD/PI per calendar year also applies
    [7] [45] [12].
  watch: 'NIH''s guidance of February 7, 2025 announcing a standard 15% indirect cost rate was enjoined by a district court
    on March 5, 2025 and later vacated; the First Circuit affirmed on January 5, 2026 [25] [24]. Since September 25, 2025
    each PD/PI is limited to six new, renewal, resubmission or revision applications per calendar year [12] [140]. The simplified
    peer review framework took effect for due dates from January 25, 2025: two factors scored 1 to 9 and a third rated sufficient
    or insufficient [39] [41]. NOT-OD-26-029 of January 28, 2026 ended separate AIDS application due dates, beginning with
    the January 2027 advisory council round [17] [2].'
