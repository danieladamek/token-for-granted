- id: health-and-behavioural-health-services
  name: A health or behavioural health service grant, direct from the federal agency
  family: programme-service
  what: SAMHSA funds mental health and substance use services, such as setting up a Certified Community Behavioral Health
    Clinic (CCBHC) or expanding medications for opioid use disorder [1112] [1208]. HRSA funds health centres, rural health
    networks, HIV care and maternal health projects [1150] [1162] [1157] [1169]. CDC, the Office of the Assistant Secretary
    for Health, the Indian Health Service and CMS add notices for prevention coalitions, family planning, tribal health
    and insurance Navigators [1220] [1180] [1188] [1190].
  who_for: For staff at a non-profit clinic, treatment provider or coalition, and for a university that runs services; some
    notices are narrow, with Building Communities of Recovery limited by statute to Recovery Community Organizations and
    the 988 follow-up notice to 988 Lifeline network crisis centres [1118] [1122].
  how_it_works:
  - 'The applicant registers in SAM.gov, Grants.gov and the agency''s system: eRA Commons at SAMHSA, where one notice says
    to register at least six weeks before the deadline, and the Electronic Handbooks at HRSA [1112] [1204].'
  - SAMHSA's FY 2026 notices here were posted between June 15 and July 1, 2026, and most closed in about a month; two ran
    from July 1 to July 27 [1109] [1208] [1207].
  - HRSA takes an application in two phases, in Grants.gov then, by a later deadline, in the Electronic Handbooks [1150].
    A health centre grant is competed by service area, and the current recipient and new organizations may both apply [1150]
    [1204].
  - 'Some programmes are not competed yearly: the latest New Access Points notice closed August 30, 2024, and the latest
    Healthy Start notice December 15, 2023 [1153] [1170].'
  - 'Match differs: most SAMHSA notices here require none, Building Communities of Recovery caps the federal share at 85
    percent, and CDC''s Drug-Free Communities page requires a 100% match from non-federal sources [1208] [1206] [1496].'
  - The two SAMHSA block grants, State Opioid Response and the Title V block grant are awarded to states and territories,
    and a state agency applies [1130] [1219] [1201] [1168].
  watch: On September 21, 2026 a district court vacated HHS's July 14, 2025 notice adding 13 programmes, among them the
    Health Center Program and CCBHCs, to PRWORA's "federal public benefit", and permanently enjoined enforcement against
    the plaintiff states and the District of Columbia [1175] [1177] [1178] [1479]. A May 16, 2025 preliminary injunction
    covers 23 states and the District of Columbia against HHS's March 24-25, 2025 termination of about $11 billion in CDC
    and SAMHSA grants [544] [1210]. FY 2026 SAMHSA notices state that applications must not support harm reduction as an
    April 24, 2026 letter outlines it [1135] [548] [1112]. The FY 2027 budget request asks $0 for Title X and Teen Pregnancy
    Prevention [535] [533].
