- id: national-service
  name: Hosting AmeriCorps members or older volunteers
  family: programme-service
  what: AmeriCorps State and National grants pay an organisation to engage AmeriCorps members in service using evidence-based
    interventions; members receive a living allowance and, after service, an education award [1374]. VISTA places full-time
    members with a sponsoring organisation for at least a year to strengthen efforts against poverty [1379]. Two AmeriCorps
    Seniors programmes, RSVP and the Foster Grandparent Program, pay a sponsor to place volunteers aged 55 and older [1376]
    [1451].
  who_for: For a non-profit, a college, or a state, local or tribal government body that can host members or older volunteers;
    an organisation applies to be a VISTA sponsor, and its members may not displace employed workers [1379].
  how_it_works:
  - State and National money is split by regulation between a population formula to States, a competition among States,
    and direct competitive grants [1377]. For the formula share and the share competed among States, an organisation's door
    is the State service commission [1377].
  - 'AmeriCorps posts one competitive State and National notice a year: the FY 2025 deadline was January 23, 2025, and the
    FY 2027 notice, posted August 28, 2026, set a deadline of January 13, 2027 [1373] [1374].'
  - A State and National grantee meets at least 15 percent of member support costs in non-Federal cash, and the Federal
    share of operating costs may not exceed 67 percent [1377].
  - RSVP grants are chosen competitively and typically last three years with renewal; the sponsor finds 10 percent of project
    cost from non-federal sources [1378]. The FY 2027 RSVP notice was posted August 20, 2026 with a closing date of October
    20, 2026 [1376].
  - A Foster Grandparent sponsor contributes at least 10 percent of total project cost from non-Federal sources, and its
    volunteers receive a stipend [1451].
  - 'VISTA starts with a concept paper: the last request found was for FY 2025 and closed March 27, 2025 [1373].'
  watch: AmeriCorps terminated 1,031 grants, approximately $396.5 million, on April 25, 2025 [1380]. On June 5, 2025 the
    District of Maryland enjoined the closure of the terminated programmes in 24 plaintiff States and the District of Columbia
    until notice-and-comment rulemaking is completed, and denied relief as to NCCC members and staff reductions [1380].
    AmeriCorps posted the FY 2027 State and National competitive notice on August 28, 2026, closing January 13, 2027, and
    the FY 2027 RSVP notice on August 20, 2026, closing October 20, 2026 [1374] [1376].
