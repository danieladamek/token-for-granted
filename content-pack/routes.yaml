- id: institutional-training-grant
  name: A training grant an institution applies for
  family: people
  what: 'An institutional training grant goes to a university or other organisation, which then selects the trainees and
    pays them [750] [828]. The NIH T32 shows the pattern: an institution, through a programme director, applies to run a
    research training programme for predoctoral students, postdoctoral researchers or both, and appoints trainees who receive
    NIH stipends [750] [732]. Relatives include the short-term T35, the K12 for postdoctoral and junior faculty scholars,
    the R25 research education grant, NSF''s Research Traineeship and the Education Department''s GAANN [751] [753] [734]
    [828] [1017].'
  who_for: 'It is for a faculty member able to direct a programme, with the research office; the T32 notice asks for an
    established investigator as director [750]. A student or postdoctoral researcher does not apply to the funder: the institution
    holds the award and appoints its own trainees [750] [1016].'
  how_it_works:
  - 'The institution settles internally who applies, since several programmes cap applications: NSF''s Research Traineeship
    allows an institution two proposals per competition, and the NIOSH centres notice and the NIGMS undergraduate programme
    one application [828] [1060] [797].'
  - For NIH the organisation holds registrations in SAM, eRA Commons and Grants.gov, and the programme director needs an
    eRA Commons account [750].
  - T32, T35 and R25 applications are due January 25, May 25 and September 25, though institutes in the T32 notice may accept
    applications on only some of those dates [750] [751] [756].
  - 'Other funders compete at irregular intervals: Grants.gov shows GAANN competitions posted in 2009, 2011, 2015, 2018,
    2021 and 2024 [1018].'
  - NIH, NIOSH and HRSA limit indirect costs on training grants to 8 percent of modified total direct costs, and GAANN requires
    the institution to match at least 25 percent of the grant from non-federal funds [750] [1061] [1028] [1017].
  - On an NIH training grant a trainee must be a citizen, a noncitizen national or a permanent resident at appointment [750].
  watch: NSF's priorities page, published April 18, 2025, says awards not aligned with agency priorities have been terminated
    and that 114 awards were being reinstated as of June 30, 2025 under a preliminary injunction of June 23, 2025 [154].
    A March 18, 2026 notice set the FY 2026 predoctoral NRSA stipend at $29,364 for awards made on or after October 1, 2025
    [732]. NIH posted NIH-wide parent notices for K12 on June 22, 2026 and for three R25 research education programmes on
    June 8, 2026 [753] [752] [1] [754] [756]. The NSF Research Traineeship and Noyce pages, both last updated June 27, 2025,
    show "waiting for new publication" and no upcoming due dates [827] [857].
