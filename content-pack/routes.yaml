- id: foundation-programme-grant
  name: A programme grant from a private, community or corporate foundation
  family: programme-service
  what: The foundation programmes on this route take applications from organisations through an open call, a request for
    proposals or a standing online form [2355] [2438] [2340]. They range from store-level grants of $250 to $5,000 at Walmart
    to a single $100 million award in MacArthur's 100&Change competition [2434] [2435] [2266]. A community foundation and
    a bank foundation direct their requests for proposals to non-profits in their own region and local markets [2412] [2438].
  who_for: For programme staff at a non-profit looking for foundation money that has an open application; some calls are
    tied to place, as with the Knight Cities Challenge, which is limited to projects in the 26 Knight communities [2355].
  how_it_works:
  - 'Each foundation has its own portal: Bank of America takes applications in CyberGrants after registration in its NPO
    Hub, Knight at kf.submittable.com, Mellon''s Humanities in Place at mellon.fluxx.io/apply/hip, and Walmart through a
    Spark Good account [2437] [2438] [2355] [2340] [2434].'
  - 'Some set a step before the application: Bank of America has an online eligibility quiz, Walmart has applicants verified
    by Deed, its third-party verification partner, and 100&Change sets a registration deadline ahead of the application
    deadline [2437] [2434] [2266].'
  - 'Calendars differ: Bank of America has two application periods a year, Walmart ran three cycles in its fiscal year 2027,
    the Silicon Valley Community Foundation issues one request for proposals a year, and Humanities in Place has no deadline
    [2438] [2434] [2412] [2340].'
  - 'Some funders limit repeat requests: Bank of America funds an organisation no more than once in a calendar year, with
    rare exceptions, and Walmart allows at most 25 applications in pending or approved status at any time [2438] [2434].'
  - MacArthur says the 100&Change cycle repeats every three years, and its third cycle closed to applications on September
    5, 2024 [2264] [2266]. Yield Giving's one open call, completed in 2024, selected 361 community-led non-profits from
    more than 6,000 applicants [2316] [2358].
  watch: The Knight Foundation relaunched the Knight Cities Challenge with $10 million for two cohorts over three years
    [2355]. The first round took applications from April 1 to April 30, 2026, for up to $200,000 per project, in the 26
    Knight communities [2355].
