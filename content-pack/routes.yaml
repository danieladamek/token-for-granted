- id: general-operating-support
  name: General operating support
  family: start
  what: General operating support pays for an organisation's running costs; the Open Society Foundations describe it as
    support "that cover the day-to-day costs of operations" [2293]. Ford makes general operating support grants, often as
    multi-year commitments, beside time-bound project grants [2261]. Federal programmes on this route pay for the ongoing
    operation of a named service, such as a health centre, a Head Start programme or civil legal services in a defined service
    area [1150] [1251] [1324].
  who_for: A non-profit looking for money that is not tied to a single project, from a foundation or from a programme that
    pays for ongoing operation [2261] [1150].
  how_it_works:
  - 'Among foundations the door is mostly invitation: Hewlett, which says it "Provides long-term, general operating support
    whenever possible", gives no route for an uninvited request, and Ford does not accept unsolicited proposals [2280] [2259].
    Hilton gives a route only in its Good Neighbor Program, whose grants are general operating support at a fixed $10,000,
    or $5,000 for Title 1 schools [2343].'
  - Yield Giving's gifts are for use "however they choose"; its one open call, completed in 2024, selected 361 non-profits
    from more than 6,000 applicants [2316] [2358].
  - 'Some foundations rule it out: the Commonwealth Fund does not fund ongoing activities, and the Woodruff Foundation says
    most of its grants support one-time needs [2324] [2313].'
  - On project grants Ford sets a minimum indirect cost rate of 25 percent and MacArthur allows non-profits 29 percent;
    neither rate applies to general operating support [2332] [2265].
  - 'Federal competitions run by service area: HRSA announces the health centre areas open to the current recipient and
    to new organisations, and a Head Start agency is designated for five years and renewed without competition unless it
    meets one of seven conditions [1150] [1204] [1226].'
  - 'Formula money reaches a provider through the state: states pass no less than 90 percent of the Community Services Block
    Grant to local eligible entities, mostly Community Action Agencies [1240].'
  watch: Public Law 119-28 rescinded the Corporation for Public Broadcasting's appropriations for fiscal years 2026 and
    2027, and on August 1, 2025 the Corporation announced an orderly wind-down of its operations [1407].
