- id: mentored-career-development-award
  name: A mentored career development award
  family: people
  what: 'A mentored career development award gives a researcher salary and research support, with protected time, for supervised
    career development under a mentor [744]. NIH''s K awards make up most of the route: the K01 for researchers with a doctorate,
    the K08 and K23 for clinicians, the K25 for quantitative scientists moving into health research, and the K99/R00 for
    a postdoctoral researcher moving to a faculty post [744] [745] [746] [748] [743]. Two codes are not mentored: the K02
    and K24 give salary support to scientists who already hold independent, peer-reviewed research funding [749] [747].'
  who_for: It is for a researcher with a research or health-professional doctorate, and for the research office of the institution
    that applies; a K01 candidate holds a full-time appointment at that institution at the time of award [744]. The institution
    submits the application for the named candidate [744] [743].
  how_it_works:
  - The candidate names a mentor before applying and commits at least 75 percent of full-time professional effort for the
    K01's three to five years [744].
  - The applicant organisation holds registrations in SAM, eRA Commons and Grants.gov, and the candidate needs an eRA Commons
    account and an ORCID registration [744].
  - Salary and research support levels are set by each participating institute, so the candidate checks the institute's
    entry in the Table of IC-Specific Information [744].
  - New applications are due February 12, June 12 and October 12, and a person may have only one career development application
    under review at a time [744].
  - Mentored K candidates must be citizens, non-citizen nationals or permanent residents; the K99 has no citizenship requirement
    and limits candidates to four years of postdoctoral research experience [744] [743].
  - 'Outside NIH the rules differ: the Institute of Education Sciences takes a letter of intent and then a Grants.gov application
    for its mentored early career award, and the defence medical research programmes take a pre-application in eBRAP [995]
    [937].'
  watch: From the September 25, 2025 receipt date NIH limits each principal investigator to six new, renewal, resubmission
    or revision applications per calendar year, and career applications count [12]. AHRQ's K01 notice reached its expiration
    date of November 10, 2025, and AHRQ declared its K08 and K18 notices expired effective immediately on March 17 and March
    20, 2026 [782] [812] [770] [783] [771] [772]. NIH announced on August 12, 2026 that for due dates on or after October
    12, 2027 individual K awards are consolidated into KR1, KC1, KS1 and KT1/R00; active notices under the current codes,
    except K00, K12, K43 and K76, expire by July 13, 2027 [742] [758].
