- id: nasa-research-announcements
  name: A NASA research proposal under ROSES
  family: research
  what: 'ROSES (Research Opportunities in Space and Earth Science) is the Science Mission Directorate''s omnibus research
    solicitation: one NASA Research Announcement holding many programme elements, each with its own scope and due dates
    [371]. NASA issues one omnibus solicitation a year and amends it through the year as elements are added or changed [294].
    Across ROSES-2025, annual award sizes ranged from under $100K to more than $1M, typically for three years [372].'
  who_for: The route is for an investigator and research office at an organisation of any type, for-profit and not-for-profit
    included [393] [377]. NASA does not award grants to individuals [380].
  how_it_works:
  - Every team member registers in NSPIRES, affiliated there with the proposing organisation [388] [393].
  - The proposer reads the programme element and contacts its programme officer from the directorate's list [390].
  - Where the element requires one, a notice of intent or a Step-1 proposal is submitted before the full proposal [377]
    [374].
  - Some elements, mainly in planetary science, take proposals at any time while ROSES is open, generally without a notice
    of intent or Step-1 proposal [376]. No-due-date reviews are held when a critical mass of proposals has arrived, and
    flexible-due-date reviews on a regular cadence [376].
  - Proposers budget at their institution's approved indirect rates; NASA calls inaccurate budget rates the number one cause
    of grant delays [389]. A ROSES-2025 element listing shows no cost sharing or matching requirement [393].
  - Subject experts review each proposal against intrinsic merit, programmatic relevance and cost reasonableness, and a
    selection official decides [386]. Dual-anonymous peer review is the default under ROSES-2025 [375].
  watch: 'GIC 26-01 of January 14, 2026 revised NASA''s award terms: an award may be terminated when it no longer effectuates
    programme goals or agency priorities, and recipients need NASA''s authorisation and a written justification for each
    payment request [382] [381]. ROSES-2025 was released on July 10, 2025, and NASA announced on January 23, 2026 that ROSES-2026
    would be released in July 2026 [372] [294]. At the last check a Grants.gov search for NNH26ZDA001N returned nothing,
    and ROSES-2025 received a new programme element on October 2, 2026 [395] [374]. NASA''s research security training certification
    took effect August 5, 2026 [383].'
