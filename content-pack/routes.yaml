- id: preservation-facilities-and-capital-grants
  name: Preservation, collections, facilities and other capital grants
  family: capacity
  what: 'These grants pay for a lasting physical asset or its care: Save America''s Treasures pays for bricks-and-mortar
    preservation of nationally significant historic properties and for conservation of nationally significant collections
    [1694]. NEH''s Preservation Assistance Grants help small and mid-sized institutions care for humanities collections
    [1728]. USDA''s Tribal College Initiative Grants pay for capital improvements to the educational facilities of the 1994
    land-grant tribal colleges [1791].'
  who_for: 'A non-profit, college, tribe or local government that holds a historic property, a collection or a building:
    the National Park Service''s African American Civil Rights grants, for one, document, interpret and preserve sites and
    stories [1694].'
  how_it_works:
  - 'The property or collection is tested first: Save America''s Treasures preservation grants are for properties listed
    in the National Register for national significance or designated a National Historic Landmark [1695] [1696], and a resource
    that has had one such grant is not eligible for another [1695] [1705].'
  - 'National Park Service notices follow appropriations: the FY2025 competitive notices were posted between May 15 and
    June 11, 2026 and all had closed by July 28, 2026 [1697].'
  - 'Match rules differ: Save America''s Treasures requires a dollar-for-dollar non-federal match [1696] [1705]; the HBCU,
    History of Equal Rights and Underrepresented Communities grants require no cost sharing [1699] [1702] [1703]; NEH endowment
    grants are matched one to one [1729].'
  - 'Some capital money arrives through another body: a Paul Bruhn prime grantee runs a subgrant programme and cannot use
    the money for its own properties [1704], and states, territories and tribes apply to FEMA''s BRIC with local governments
    as subapplicants [1750].'
  - Tribal College Initiative Grant applications are taken all year through the local Rural Development office [1791].
  - 'One foundation programme sits here: Home Depot Foundation Veteran Housing Grants, in three cycles a year, typically
    $100,000 to $500,000 [2443].'
  watch: FEMA announced on April 4, 2025 that it was ending BRIC; in State of Washington v. FEMA the court granted the States
    summary judgment and a permanent injunction on December 11, 2025, and FEMA's combined FY 2024 and FY 2025 notice opened
    March 25, 2026 and closed July 23, 2026 [1750] [1777] [1778] [1776]. The National Park Service posted its FY2025 Historic
    Preservation Fund competitive notices between May 15 and June 11, 2026, and all had closed by July 28, 2026 [1697].
    The President's FY2027 Budget, a request, reduces FEMA non-disaster grant programmes by $1.3 billion and carries an
    entry 'Community Facilities Grant Earmarks' at minus $659 million [1710].
