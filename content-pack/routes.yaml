- id: research-at-a-nonprofit-that-is-not-a-university
  name: Research at a non-profit that is not a university
  family: start
  what: 'Federal notices list non-profits apart from universities: Grants.gov has two non-profit applicant categories, those
    with 501(c)(3) status and those without, each other than institutions of higher education [2064]. NSF has a category
    of its own, the non-profit, non-academic organisation: independent museums, observatories, research laboratories, professional
    societies and similar organisations directly associated with educational or research activities [156].'
  who_for: A researcher or grants officer at an independent research institute, museum, laboratory, professional society
    or similar non-profit that is not an institution of higher education [156] [4].
  how_it_works:
  - In an NIH notice the class appears as two lines of the eligibility section, non-profits with and without 501(c)(3) status,
    other than institutions of higher education [4].
  - DOE notices read for this guide admit non-profits other than section 501(c)(4) organisations that lobby, and the eligibility
    sentence IES uses across its research competitions does not restrict applicants by type of organisation [278] [301]
    [663] [662].
  - 'Some programmes are closed to the class: MURI funds go to U.S. institutions of higher education, NIH R15 awards go
    to schools that grant degrees, and VA intramural funding attaches to a person with a VA-paid appointment [325] [7] [8]
    [584] [583].'
  - NEA research guidelines require five years of operation before the deadline [651]. NEH has a class for independent research
    institutions, research bodies that are not universities, which could apply to run their own humanities fellowships [1047]
    [1050]. HHMI appoints scientists only at institutions on its own list [2161] [2162].
  - 'Research money brings institution-level duties: a Federalwide Assurance, renewed every 5 years, for non-exempt human
    subjects research, where an institution without its own review board may rely on another registered one; and a written,
    enforced financial conflict of interest policy for Public Health Service funding [1986] [1984] [1981] [2002].'
  - An organisation with no negotiated indirect cost rate may charge the de minimis rate, up to 15 percent of modified total
    direct costs, or submit a proposal to its cognizant agency [1802] [163] [2070].
  watch: DOE's final rule of July 16, 2026 (91 FR 43511) requires any non-Federal entity that applies for or holds a DOE
    financial assistance award on or after August 17, 2026 to maintain a written policy on conflict of interest and conflict
    of commitment [2096].
