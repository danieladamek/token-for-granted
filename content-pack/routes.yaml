- id: justice-victim-services-and-legal-aid
  name: A justice, victim services or legal aid grant
  family: programme-service
  what: The Justice Department's Office on Violence Against Women (OVW) pays organisations for legal assistance, transitional
    housing and rural services for victims of domestic violence, dating violence, sexual assault and stalking [1263] [1268]
    [1507]. Its Office of Justice Programs (OJP) pays for reentry mentoring, youth mentoring, school violence prevention
    and services for trafficking victims [1273] [1278] [1506] [1275]. The Legal Services Corporation (LSC), a separate funder,
    makes grants for civil legal aid by service area [1324].
  who_for: For programme staff at a victim service provider, a reentry or mentoring organisation, or a legal aid office;
    some notices set a test of their own, such as three years of delivering a standalone mentoring programme [1277].
  how_it_works:
  - 'A Justice Department application has two steps: the SF-424 form goes into Grants.gov by a first deadline, and the full
    application into JustGrants by a second, one week later in the FY2026 notices read [1273] [1278]. OJP applicants start
    SAM.gov registration at least 30 days before the Grants.gov deadline [619].'
  - 'A programme has one notice a year: OVW released its FY2026 notices between June 2 and September 1, 2026, and OJP''s
    FY2026 notices carried deadlines from late September to November [1266] [612].'
  - Most notices here require no match; the trafficking services notice requires 25 percent of total project costs [1274]
    [1267] [1276].
  - 'LSC runs a yearly cycle in its GrantEase system: a request for proposals in April, a pre-application in May for service
    areas in competition, applications in June and decisions in December [1325] [1326]. Its other grant lines are open only
    to organisations that already hold an LSC grant [1323].'
  - Byrne JAG, Title II juvenile justice, VOCA victim assistance and STOP are formula grants; a local organisation's door
    is the state agency or, for JAG, a local government that holds an award [1343] [1344] [1279] [1269].
  watch: In April 2025 OJP terminated 376 discretionary awards; the District Court for the District of Columbia dismissed
    the suit on July 7, 2025, and the appeal was argued October 14, 2025 with no decision found [1281] [1282]. On August
    8, 2025 the District of Rhode Island stayed several of OVW's "out-of-scope activities" conditions and the related certification
    for all FY2025 grants [1271]. FY2026 OJP notices list as unallowable any activity that violates federal immigration
    law or federal civil rights law; in one notice DOJ states it has stipulated not to enforce those paragraphs while the
    amended preliminary injunction of July 2, 2026 in Freedom Network v. Trump remains in effect [1274] [1276].
