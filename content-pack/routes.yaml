- id: formula-money-through-the-state
  name: Federal formula money that reaches a non-profit through a state, tribe or local government
  family: programme-service
  what: On this route federal money goes by formula or block grant to a state, territory, tribe or local government, and
    that body, not the federal agency, funds local organisations [1280] [1241] [1292]. Older Americans Act money passes
    from ACL to 56 state agencies on aging, then to 618 area agencies on aging, then to nearly 20,000 local service providers
    [1260]. The SAMHSA block grants, the Title V block grant and 21st Century Community Learning Centers likewise go to
    states, which fund local organisations [1130] [1168] [1399]. FEMA's notice for the Nonprofit Security Grant Program
    says non-profit organisations may not apply to FEMA directly [1320].
  who_for: For a non-profit delivering a local service, such as a shelter, a meals programme or a treatment provider; HUD
    gives no CDBG money directly to non-profits [1292].
  how_it_works:
  - 'The state, tribe or local government applies to the federal agency, often against a plan: child care (CCDF) plans are
    submitted every three years, and the two SAMHSA block grants take a two-year application [1248] [1219].'
  - Each record names the body a non-profit goes to, such as the State Mental Health Authority for the mental health block
    grant, the state VOCA administrator for victim assistance, or the state educational agency for 21st Century Community
    Learning Centers (21st CCLC) [1219] [1279] [1399].
  - 'Some federal pages help find that body: ACF links a "Find Your CAA" tool for Community Action Agencies, and OVC lists
    state contacts on its State Support map [1239] [1279].'
  - 'The calendar belongs to that body: each state sets its own 21st CCLC competition dates, and the State Administrative
    Agency for the Nonprofit Security Grant Program sets its own earlier deadline for non-profits [1399] [1320].'
  - 'Federal terms can follow the money: a VOCA subrecipient contributes not less than twenty percent in cash or in kind,
    with stated exceptions [1351].'
  - 'Federal pages do not always describe the local step: those for Title V and Ryan White Parts A and B do not say how
    a local organisation applies [1168] [1158] [1156].'
  watch: On September 21, 2026 the District of Rhode Island vacated the 2025 PRWORA "federal public benefit" notices of
    five departments and permanently enjoined their enforcement against the plaintiff states and the District of Columbia
    [1479]. A preliminary injunction of May 16, 2025 covers 23 plaintiff states, the District of Columbia and their local
    health jurisdictions against HHS's March 24 and 25, 2025 termination of about $11 billion in CDC and SAMHSA public health
    grants [544] [1210]. FY 2027 requests, all proposals, ask $0 for CSBG, LIHEAP, CDBG, HOME and the WIOA Adult, Youth
    and Dislocated Worker lines, and consolidate the two SAMHSA block grants into a new block grant [1339] [1340] [1341]
    [1342] [535] [533].
