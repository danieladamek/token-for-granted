- id: humanities-arts-and-international-fellowships
  name: Fellowships for scholars, writers and artists, and awards for work abroad
  family: people
  what: 'These fellowships give a scholar, writer or artist a stretch of months to work on one project [986] [2225]. Most
    go to the person and not to an employer: NEH Fellowships pay an individual for six to twelve months of full-time research
    and writing, and an organisation cannot apply [986] [987]. Residential fellowships place the scholar at a host such
    as the Library of Congress, the Wilson Center or the Smithsonian [999] [1001] [984]. The two Fulbright programmes send
    United States citizens abroad [1025] [1022].'
  who_for: 'It is for an individual scholar or writer, with or without a university post: ACLS funds independent scholars,
    and NEH Public Scholars requires one earlier sole-authored nonfiction book and no degree [2228] [1003]. An institution
    applies in some cases, such as the NEH grant to independent research institutions that run their own fellowships [1047].'
  how_it_works:
  - For an NEH award the person creates a Login.gov account and an individual applicant profile in Grants.gov; the notice
    does not ask individuals for SAM.gov registration [987].
  - NEH's programmes for individuals run under a combined notice with one deadline a year, and a person may submit one application
    at a deadline [987] [986].
  - 'Awards are sized by the month: $5,000 per month to a maximum of $60,000 at NEH in the 2026 competition, and $10,000
    per month at the Wilson Center for 2027-2028 [987] [1001].'
  - 'Other hosts use their own system and calendar: the Smithsonian''s online appointment system with one deadline a year,
    and the Guggenheim Foundation''s competition from mid-August to mid-September [984] [2223].'
  - For Fulbright the Institute of International Education administers the application; an enrolled student applies through
    the home campus and its Fulbright Program Adviser, and others apply at-large [1022] [1023].
  - Both Fulbright programmes require United States citizenship; NEH also admits foreign nationals resident for three years
    [1025] [1023] [987].
  watch: On April 1 to 3, 2025 NEH terminated more than 1,400 grants, among them awards to individual scholars; the Southern
    District of New York vacated the terminations, and a docket summary dates the judgment May 7, 2026 and records an appeal
    to the Second Circuit filed July 6, 2026 [642] [643]. The 2026 competitions for NEH Fellowships, Public Scholars and
    Awards for Faculty at HBCUs accepted only projects in American history and culture and Western civilization [986] [1003]
    [1004]. The Education Department cancelled the fiscal year 2025 Fulbright-Hays competitions on May 9, 2025 [1011]. On
    2026-10-04 the NEA's grants page listed neither Creative Writing Fellowships nor Translation Projects [653] [1006] [1008].
