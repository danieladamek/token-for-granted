- id: student-pipeline-and-access-programmes
  name: Programmes that bring students into research or through a degree
  family: people
  what: This route gathers programmes that bring students into research or carry them through a degree [829] [855]. It has
    two doors. Through the first an institution applies for a grant and recruits the students, as with NSF's Research Experiences
    for Undergraduates Sites, its S-STEM scholarships and the NIGMS training programme BURT [830] [855] [797]. Through the
    second the student applies to a federal agency for a paid internship or scholarship, as with the Energy Department's
    laboratory internships, the NIST summer fellowship and NOAA's Hollings scholarship [897] [979] [969].
  who_for: The first door is for a faculty member or research office at a college or university that hosts or supports students
    [829] [855]. The second is for the undergraduate; no institution applies on the student's behalf for an Energy Department
    internship or a NIST fellowship [897] [979].
  how_it_works:
  - For an REU Site the organisation submits a proposal built around a theme and a cohort of students by the third Wednesday
    in August [830] [829].
  - Students then find Sites in NSF's directory and apply to the Site; NSF does not select them [869] [829].
  - An investigator with an NSF award may ask for an REU Supplement, inside a research proposal or as supplemental funding
    on an existing award [830].
  - BURT is open only to institutions that enrol undergraduates and have averaged less than $50 million a year in NIH research
    project grant funding, with one application per organisation; S-STEM allows an institution two proposals [797] [856].
  - 'A student applying directly follows the agency''s calendar: the undergraduate laboratory internships have three terms
    a year, the NIST fellowship is announced each autumn on USAJOBS, and the Hollings application closes at the end of January
    [898] [979] [968].'
  - The REU solicitation gives a student stipend of approximately $700 a week and allows no indirect costs on participant
    support [830].
  watch: On August 12, 2026 the Office of Legal Counsel concluded that NSF must cease administering LSAMP and IUSE-HSI;
    this is a legal opinion of the executive branch, not a court ruling [876]. The MARC T34 notice has a close date of February
    21, 2025, and NIGMS posted the BURT T34 notice on December 29, 2025 with a first due date of February 25, 2026 [802]
    [796] [797]. The Education Department announced on November 18, 2025 that the Department of Labor administers most postsecondary
    grant programmes under the Higher Education Act [672]. NOAA's FY 2027 budget justification proposes to terminate its
    Office of Education, which is listed with the Hollings Scholarship [445].
