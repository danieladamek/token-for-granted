- id: education-social-and-justice-research
  name: Education, social policy and justice research
  family: research
  what: The Institute of Education Sciences (IES) funds education research through requests for applications from its National
    Center for Education Research and its National Center for Special Education Research [714] [668] [663]. NIJ funds social
    and physical science research, development and evaluation on criminal justice through topic-specific notices, each with
    one deadline pair [600] [602] [603] [612]. ACF's Office of Planning, Research, and Evaluation (OPRE) funds small grants
    for secondary analyses of existing data [628] [627].
  who_for: The route is for an investigator and research office at a university or non-profit research organisation; IES
    does not restrict applicants by type of organisation and asks for the ability and capacity to conduct rigorous research
    [663] [662].
  how_it_works:
  - The organisation registers in SAM.gov, which IES says can take up to 2 weeks and 5 more if an EIN is needed, then in
    Grants.gov, where only a user with the Authorized Organization Representative role can submit [665].
  - For IES a letter of intent is submitted at iesreview.ed.gov by the date in the request for applications; the application
    goes through Grants.gov, and IES does not accept late applications [663] [715] [665].
  - 'NIJ and the Bureau of Justice Statistics use two steps with separate deadlines: the SF-424 in Grants.gov, then the
    full application in JustGrants [619].'
  - NIJ states that most notices are typically released December through May, subject to appropriations, with forthcoming
    notices listed in late fall [601] [610] [607].
  - OPRE notices are forecast and posted on Grants.gov by topic [627]. The Labor Department's Chief Evaluation Office invites
    researchers to register for notice of funding opportunities [629].
  - Minerva is described on its own site as a university-based social science research initiative launched by the Secretary
    of Defense; when read, the site showed no notice dated 2025 or 2026 [329].
  watch: In April 2025 the Office of Justice Programs terminated 376 grant awards worth over $820 million; on July 7, 2025
    the district court denied a preliminary injunction and dismissed the recipients' suit [621] [622]. The Social Security
    Administration announced on February 21, 2025 that it was terminating its Retirement and Disability Research Consortium
    cooperative agreements [626]. IES announced on August 6, 2026 that FY 2027 grantmaking runs in three tranches, with
    Education Research Grants (84.305A, 84.324A) planned for December 2026 [661] [662]. NIJ's FY2026 research notices list
    agency funding priorities and unallowable uses, among them programmes that violate federal immigration law [607].
