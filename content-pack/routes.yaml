- id: health-services-and-public-health-research
  name: Health services and public health research outside NIH
  family: research
  what: NIDILRR, the National Institute on Disability, Independent Living, and Rehabilitation Research, funds Field Initiated
    Projects, projects on topics it sets, and five-year engineering centres [578] [581] [582]. FDA pays for clinical studies
    of products for rare diseases and issues single-topic requests for research cooperative agreements [561] [564]. HRSA
    funds research on maternal and child health and on autism [570] [574]. AHRQ's R01, R03 and R18 were standing announcements
    for health services research [507] [508] [509]. PCORI runs three cycles a year [590] [591].
  who_for: 'The route is for an investigator at a university or non-profit research organisation, except for VA research
    money, which is intramural: the principal investigator must hold at least a 5/8ths VA-paid appointment, and a university
    or non-profit cannot apply in its own right [585] [583] [584].'
  how_it_works:
  - The organisation registers in SAM and Grants.gov, and for AHRQ and FDA notices in eRA Commons as well; one FDA notice
    warns that registration can take 6 weeks or more [507] [561] [564].
  - 'Most competitions here are single notices on a set topic: CDC injury research is competed by single-year requests for
    applications, and HRSA states that not all its research projects are competed each year [560] [559] [568].'
  - NIDILRR's Field Initiated Projects take a letter of intent about four weeks before the application date, and a separate
    competition is open only to minority entities and Indian tribes [578] [579].
  - FDA's orphan products clinical trial grants have one new-application date each October; in most cases the study needs
    an active IND or IDE, with the protocol filed at least 30 days before the deadline [561] [562].
  - 'PCORI uses its own portal: the organisation registers in PCORI Connect and begins a letter of intent, and a full application
    follows if invited [595] [591].'
  - A VA Merit Review proposal needs approval by the local Research and Development Committee [585].
  watch: Plaintiffs in Society of General Internal Medicine v. Kennedy state that AHRQ issued no new-project awards from
    April 1 to mid-August 2025; these are a party's statements, not court findings, and no ruling on the motion to dismiss
    was read [524]. Between March 6 and March 17, 2026 AHRQ ended its standing R18, R01 and R03 announcements by notices
    of early expiration that give no reason and no reissue date [512] [515] [516] [513] [514] [517]. The NIOSH standing
    R01 and R21 announcements expired on November 21, 2025, and no reissue was found [556] [558] [557]. PCORI moved new
    and resubmitted applications to a new portal, PCORI Connect, starting with Cycle 3 2026 [595].
