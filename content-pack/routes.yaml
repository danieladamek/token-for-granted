- id: postdoctoral-fellowship
  name: A fellowship for a postdoctoral researcher
  family: people
  what: 'A postdoctoral fellowship supports a researcher with a doctorate through a further period of research, most often
    two or three years [737] [837] [842]. NSF''s fellowships are submitted by the person, who is paid directly [837] [880].
    The NIH F32 is submitted by the applicant organisation, and its first 12 months carry a service payback obligation [784]
    [737]. A third group places the fellow inside a federal agency: the NASA Postdoctoral Program, the NIST associateships
    and the USGS Mendenhall fellowships [941] [978] [983].'
  who_for: 'It is for a researcher finishing a doctorate or within a few years of it, and for the research office where
    the host institution applies [737] [784]. Each programme sets its own window: 15 full-time months in doctoral-level
    posts for NSF''s biology fellowship, under five years since the doctorate for NASA''s programme, three years for NOAA''s
    climate fellowship [837] [942] [973].'
  how_it_works:
  - The candidate first arranges a host and a sponsoring scientist, a step the NSF fellowships and the NIH F32 share [837]
    [840] [737].
  - For an NSF fellowship the person submits through Research.gov, and NSF makes the award to the individual [840] [837].
  - For an NIH F32 the organisation holds registrations in SAM, eRA Commons and Grants.gov, the candidate needs an eRA Commons
    account linked to an ORCID iD, and due dates are April 8, August 8 and December 8 [784] [737].
  - 'Agency-hosted fellowships use other doors: Oak Ridge Associated Universities administers the NASA programme, and a
    Mendenhall applicant applies through USAJOBS to a named research opportunity [941] [981] [980].'
  - NSF's atmospheric and geospace fellowship takes proposals at any time, its astronomy fellowship from August 15 to October
    15, and NIST sets deadlines of February 1 and August 1 [880] [841] [978].
  - The NIH F32 and the NSF fellowships are limited to citizens, nationals and permanent residents; NIST requires citizenship;
    the Hubble and NOAA climate fellowships do not [737] [837] [978] [946] [973].
  watch: NIH reissued its parent fellowship notices on June 13, 2025, open July 8, 2025 and expiring May 8, 2028 [736] [737]
    [739] [738] [784]. NSF's Earth Sciences fellowship page, last updated January 22, 2026, shows NSF 25-500 as archived,
    and the Ocean Sciences fellowship page is labelled archived [849] [848]. Pages updated February 7 and February 25, 2025
    show MPS-Ascend and the two STEM Education postdoctoral fellowships as archived, and the SBE postdoctoral fellowship
    page, last updated January 5, 2026, shows "waiting for new publication" [838] [851] [852] [826]. NSF 26-504 of February
    5, 2026 replaced NSF 24-593 for the biology postdoctoral fellowships, with one focus area on artificial intelligence
    and biological sciences [837].
