- id: children-family-and-ageing-services
  name: A children, family or ageing services grant from ACF or ACL
  family: programme-service
  what: The Administration for Children and Families (ACF) and the Administration for Community Living (ACL) pay local organisations
    to run a Head Start programme, a shelter for runaway and homeless youth, culturally specific services for survivors
    of domestic violence, refugee resettlement, or dementia-capable community services [1251] [1238] [1346] [1246] [1257].
    A programme has its own notice on Grants.gov, in most cases once a year [1233] [1257].
  who_for: For programme staff at a community non-profit serving children, youth, families, older people or people with
    disabilities; a centre for independent living grant goes only to a consumer-controlled, community-based, cross-disability,
    non-residential private non-profit [1258].
  how_it_works:
  - ACF requires every applicant to complete Grants.gov registration; the Head Start steps call for a Unique Entity Identifier
    and SAM.gov and Grants.gov registration at least one month before a notice opens [1224] [1229].
  - 'Windows have been short: the Basic Center notice for runaway and homeless youth stayed open about two months a year
    until 2024, then 19 days in 2025 and 25 days in 2026 [1233]. Family violence discretionary notices had windows of two
    to four weeks, and ACL''s FY2026 dementia notice 30 days [1345] [1257].'
  - 'Head Start is not a yearly competition: an agency is designated for a service area for five years and is renewed without
    competition unless it meets one of seven conditions, when the area is opened to other applicants [1226].'
  - 'Match differs: 20 percent of programme cost for Head Start, 10 percent of project cost for the Basic Center Program,
    none for the culturally specific family violence grant or the refugee Placement and Coordination Program [1249] [1235]
    [1346] [1245].'
  - Child care, Community Services Block Grant, family violence formula, Social Services Block Grant and Older Americans
    Act Title III money is paid to states, territories or tribes; a provider's door is the state or local agency [1248]
    [1239] [1243] [1242] [1260].
  watch: On September 21, 2026 the District of Rhode Island vacated HHS's July 14, 2025 notice adding Head Start and the
    Community Services Block Grant to PRWORA's "federal public benefit"; its permanent injunction bars enforcement against
    the plaintiff states and the District of Columbia [1175] [1230] [1479]. On August 14, 2026 the same court vacated the
    "New Conditions" HHS and HUD had added to grants and denied a permanent injunction [1272]. A January 6, 2026 preliminary
    injunction in Washington State Association of Head Start v. Kennedy bars HHS from requiring a DEIA certification of
    Head Start agencies [1253]. The FY2027 request, a proposal, sets CSBG, LIHEAP and Preschool Development Grants at $0
    [1339].
