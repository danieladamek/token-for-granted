- id: research-centres-and-institutional-research-capacity
  name: A research centre or an institution-wide research capacity award
  family: capacity
  what: 'These awards fund an organisation''s research base and not one project: an NIH P30 Center Core Grant supports shared
    resources and facilities for a group of investigators working on a joint or common research problem [3]. NSF''s Accelerating
    Research Translation (ART) builds an institution''s capacity to turn research results into products and services [1528].
    NSF''s GRANTED funds work on research administration, technology transfer and compliance, and not discipline-specific
    research [1529].'
  who_for: A research office at a university or a research non-profit; two NIH awards here fund research by individual faculty
    at resource-limited institutions, SuRE and, for faculty with no prior independent external research grant, SuRE-First
    [1555] [1556].
  how_it_works:
  - Each competition has its own notice with its own eligibility, limits and dates, as every P30 or P20 does [1545].
  - 'Eligibility often turns on a measure of the institution: SuRE sets a ceiling on NIH research project grant funding
    and a floor on the share of students with Pell grants [1555], budgets for a Clinical and Translational Science Award
    hub are tiered by five-year average NIH direct costs [1559], and Native American Research Centers for Health (NARCH)
    is for federally recognized Tribes and tribal entities [1790].'
  - 'Limits per institution are usual: one ART proposal for Track 1 or Track 2 [1528], and under the last solicitation for
    NSF''s CREST centres one preliminary proposal per due date [1664].'
  - 'Large awards are reached in stages: the second NSF Engines competition ran from letters of intent through invited full
    proposals, semifinalists and finalists to 12 awards [1583], and a NARCH planning grant helps a tribal applicant prepare
    a centre application [1624].'
  - 'Some capacity money is not competed: Hatch Act funds are divided by a statutory formula, and each State Agricultural
    Experiment Station answers a yearly request for applications to receive its share [1794].'
  watch: On August 12, 2026 the Office of Legal Counsel concluded that NSF's AGEP programme is unconstitutional and inseverable;
    the opinion does not mention CREST [876]. As read on 2026-10-04, NSF's EPIIC solicitation was archived, and GRANTED
    and CREST were waiting for a new publication [1530] [1529] [1612]. EDA's University Center page states that funding
    is not available to continue support for the programme [1722]. NSF's FY 2027 request of April 3, 2026, a proposal, asks
    $181.78 million for Integrative Activities and $350.00 million for the TIP directorate, against $481.32 million and
    $617.90 million in the FY 2025 current plan [255].
