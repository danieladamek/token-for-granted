- id: defense-basic-research
  name: Basic research money from the Defense Department
  family: research
  what: 'A broad agency announcement (BAA) is a standing notice that invites research proposals across an office''s fields
    of interest [334]. ONR, AFOSR and the Army Research Office each fund basic research through one [334] [340] [342]. DARPA''s
    technical offices keep office-wide announcements for ideas outside their current programmes [344]. Two other doors sit
    here: MURI, which funds multidisciplinary university teams on topics set by the service offices, and the Congressionally
    Directed Medical Research Programs (CDMRP), paid from money Congress adds to the defense appropriation each year [325]
    [351].'
  who_for: The route is for an investigator and research office at a university or non-profit; ONR states that a grantee
    can be a university, non-profit organisation or commercial entity [336]. MURI funds go only to United States institutions
    of higher education with degree-granting programmes in science or engineering [325].
  how_it_works:
  - The investigator finds the research area and its programme officer in the announcement; the offices encourage contact
    before a proposal [339] [334] [341].
  - 'A white paper usually comes next: ONR takes one of at most 5 pages through the ONR Submission Portal, and the programme
    officer gives informal feedback [334] [336]. At the Army office whitepapers are encouraged but not required, and proposals
    may be submitted at any time while the announcement is open [341].'
  - The organisation registers in SAM with a Unique Entity Identifier and sets up Grants.gov; AFOSR also asks for a CAGE
    code, and ONR says to allow at least 21 days [339] [336].
  - MURI runs as one joint announcement a year with a white-paper date and a proposal date [325] [335].
  - DARPA applicants may attend a Proposers Day or use DARPAConnect to reach programme managers [345].
  - CDMRP's cycle follows the defense appropriation; the applicant submits a pre-application through eBRAP, then the full
    application through Grants.gov [295] [330] [356].
  watch: Memoranda of May 14 and June 12, 2025 capped indirect costs at 15% on assistance awards to institutions of higher
    education; the District of Massachusetts vacated the policy on October 10, 2025 [293]. Executive Order 14332 of August
    7, 2025 requires senior appointee review of funding announcements and discretionary awards [315]. AFOSR's open announcement
    closed on March 23, 2026 with a notice citing that order, and its successor was posted June 4, 2026 [319] [320]. CDMRP
    received $650 million for 12 programmes in FY 2025 and $1.27 billion for 34 in FY 2026, under appropriations measures
    signed March 15, 2025 and February 3, 2026 [353] [295].
