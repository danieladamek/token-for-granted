- id: becoming-an-eligible-nonprofit
  name: Becoming a non-profit that can receive a grant
  family: start
  what: An organisation becomes a non-profit under state law and tax-exempt under federal law, in two separate steps [2047].
    For recognition under section 501(c)(3) it applies to the IRS on Form 1023 or, if it is small enough, on the shorter
    Form 1023-EZ [2046]. Grants.gov lists two non-profit applicant categories, those with 501(c)(3) status and those without,
    each other than institutions of higher education [2064].
  who_for: A group forming a non-profit, a non-profit that has not yet applied to the IRS, and a project that works under
    a fiscal sponsor [2047] [2046] [2065].
  how_it_works:
  - The founders form the organisation under state law as a trust, a corporation or an association, and gather its organising
    documents [2047].
  - The organisation files Form 1023, with a user fee of $600, or Form 1023-EZ, with a fee of $275, paid through Pay.gov
    [2051]. The short form is open only to an organisation that answers "No" to every question on its eligibility worksheet
    [2050].
  - The IRS says it issues 80% of Form 1023-EZ determinations within 22 days and 80% of Form 1023 determinations within
    191 days, on a page last updated June 28, 2026 [2053].
  - Once exempt, the organisation files a Form 990-series return or electronic notice every year; one with gross receipts
    normally $50,000 or less files Form 990-N, the e-Postcard [2055]. Three consecutive years without a filing end the exemption
    automatically [2057].
  - The IRS states that many states require registration with a state agency before an organisation solicits their residents
    [2062].
  - A fiscal sponsor, in the Arts Endowment's words, oversees the fiscal activities of another organisation, company, or
    group of independent artists or projects [2065]. The two federal pages read on the point do not accept an application
    made through one [2065] [648]. One foundation call requires a fiscal sponsor of an individual who reaches its second
    phase [2336].
