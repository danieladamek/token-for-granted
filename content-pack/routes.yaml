- id: nsf-core-research-proposal
  name: A research proposal to an NSF core programme
  family: research
  what: 'The research proposal is NSF''s ordinary route to a research grant: an organisation submits a full proposal to
    a programme description, programme announcement or solicitation, and NSF may fund it as a grant after merit review [156]
    [157]. Several directorates gather core research in a few solicitations: BIO Core and GEO Core are single solicitations
    for biology and for geoscience, and Future CoRe is the CISE core-research solicitation [185] [205] [189]. ENG and MPS
    each have several, among them CBET and MPS Physics [196] [211].'
  who_for: The route is for an investigator at an institution of higher education, a non-profit non-academic organisation
    such as an independent museum, observatory or research laboratory, or a Tribal Nation [156]. Unaffiliated individuals
    are not eligible for direct funding [158].
  how_it_works:
  - The organisation obtains a UEI (Unique Entity Identifier) and an active SAM registration; NSF advises doing so at least
    90 days before submission [161].
  - The investigator finds a funding opportunity through the NSF Funding Search or a directorate page and contacts a programme
    officer listed on it [155] [158].
  - 'Each opportunity sets its timing: a deadline date, a target date, a submission window, or acceptance at any time [156].
    BIO Core, GEO Core and the ENG solicitations take proposals at any time, and Future CoRe adds target dates in September
    and February [185] [206] [197] [199] [201] [189] [190].'
  - 'Limits per person differ: two proposals in any consecutive 12-month period across Future CoRe, one per fiscal year
    as PI or co-PI in MPS Materials, and none in BIO Core [189] [215] [185].'
  - Indirect costs are budgeted at the organisation's federally negotiated rate unless a solicitation says otherwise, and
    voluntary committed cost sharing is prohibited [257].
  - Faculty at predominantly undergraduate institutions send proposals to the same disciplinary programmes under the RUI
    solicitation, adding an eligibility certification and an RUI Impact Statement [253] [254].
  watch: Policy Notice NSF 25-034 capped indirect costs at 15 percent on new awards to institutions of higher education
    from May 5, 2025; the District of Massachusetts vacated it on June 20, 2025 [237] [238]. On August 17, 2026 NSF released
    twelve notices for foundational research, most accepting proposals at any time; none is for SBE, EDU or TIP [192] [185]
    [197] [199]. SBE programme pages updated in July and September 2026 show no upcoming due dates and state that each programme
    is waiting for a new publication [224] [226] [225]. NSF's FY 2027 request of April 3, 2026, a proposal, asks $0 for
    SBE and says NSF will close out that directorate in FY 2027 [255].
