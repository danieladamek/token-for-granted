- id: energy-department-research
  name: A research award from the Department of Energy
  family: research
  what: The Office of Science keeps one funding notice open all year for research proposals in the fields of its programme
    offices, and also issues targeted notices with fixed dates on a named topic [277] [283]. ARPA-E issues a notice for
    each focused technology programme and funds teams by cooperative agreement [301]. DOE's applied offices post competitive
    notices on DOE eXCHANGE sites [307] [306]. NNSA's Stewardship Science Academic Alliances funds academic research in
    fields such as radiochemistry [312].
  who_for: The route is for an investigator and research office at a university or non-profit research organisation; DOE
    notices admit non-profit organisations but exclude one class of them, the section 501(c)(4) organisation that lobbies
    [278] [301].
  how_it_works:
  - For the Office of Science the organisation obtains a Unique Entity Identifier and registers in SAM, FedConnect and Grants.gov,
    and in PAMS for pre-applications [364] [279].
  - The annual notice lists programme manager contacts by programme office, and a pre-application is submitted where a panel
    requires one [281] [277] [278].
  - One annual notice is posted per fiscal year at the end of September and stays open twelve months; applications go through
    Grants.gov at any time [277] [364].
  - 'A targeted notice has fixed dates: any required letter of intent or pre-application goes in PAMS, then the application
    through Grants.gov [366] [364].'
  - 'An ARPA-E notice runs in three stages: a concept paper, a full application, and a reply to reviewer comments; the applicant
    creates an eXCHANGE account [301].'
  - Cost sharing is not required for basic and fundamental research at the Office of Science; DOE's rule elsewhere is at
    least 20 percent for research and development and at least 50 percent for demonstration or commercial application, unless
    excluded or reduced [278] [299].
  watch: DOE Policy Flash 2025-22 of April 11, 2025 set a 15 percent indirect cost rate for grants to institutions of higher
    education; the District of Massachusetts enjoined it on May 15, 2025 and, per DOE's own page, vacated it on June 30,
    2025 [288] [360]. Policy Flash 2026-30 of January 27, 2026 states that Policy Flash 2025-22 and four other flashes are
    no longer in effect as of January 23, 2026 [289]. ARPA-E removed a 15% indirect cost cap from open notices by modification,
    in one notice on February 6, 2026 [301] [302]. DOE's research security training certification became mandatory after
    May 1, 2025 [310].
