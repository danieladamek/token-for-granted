- id: nih-targeted-and-large-awards
  name: A targeted or large NIH award under an institute's own notice
  family: research
  what: The P01 and the R34 have no parent announcement; each institute that uses the code issues its own notice [1]. The
    U01 funds the same kind of discrete research project as the R01, under a cooperative agreement instead of a grant [49].
    The P01 funds several related projects and shared resources, the R61/R33 is a two-phase award, and the R35 supports
    an investigator's whole research programme within one institute's mission [48] [3]. Four NIH Director's awards (Pioneer,
    New Innovator, Early Independence, Transformative Research) each run under a yearly notice with a single due date [75]
    [102] [104] [103].
  who_for: The route is for an investigator answering an institute's own notice, or a team building a larger application;
    each P01 project is usually led by an established investigator [48]. The PD/PI (programme director/principal investigator)
    of a New Innovator Award is an Early Stage Investigator [102].
  how_it_works:
  - The applicant finds the institute's notice for the activity code on Grants.gov [109] [111] [108].
  - The notice sets the dates; where it uses standard dates, new U01 applications are due February 5, June 5 and October
    5, and P series applications January 25, May 25 and September 25 [2].
  - A cooperative agreement's terms name the NIH staff roles; in a NIAID U01 example a Project Scientist monitors the trial
    and a Program Official provides normal stewardship [116].
  - A phased R61/R33 application states milestones for the first phase, and the second phase is funded only if they are
    met [115].
  - A Pioneer application enters $3,500,000 as total federal funds requested and files no detailed budget forms, and an
    institution may submit only two Early Independence applications [75] [104].
  - Foreign organizations may not apply for programme project grants [107] [113]. For a foreign collaborator, a domestic
    organization submits one multi-component PF5 application, and each foreign part is issued after review as its own linked
    RF2 award [23] [86].
  watch: NIH's February 7, 2025 guidance on a standard 15% indirect cost rate was vacated in district court; the First Circuit
    affirmed on January 5, 2026 [25] [24]. Since May 1, 2025 NIH issues no awards that include a foreign subaward; a September
    12, 2025 notice set out the replacement, a linked award to each foreign collaborator [22] [86]. A December 3, 2025 notice
    ended the institute agreement once required before an unsolicited application requesting $500,000 or more in direct
    costs in any year [37]. A June 8, 2026 notice asked for comment on a proposed cap on research project grants per person;
    NIH announced no decision on August 19, 2026 [89] [88].
