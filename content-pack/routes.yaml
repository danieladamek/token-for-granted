- id: nonprofit-capacity-building-and-technical-assistance
  name: Capacity building and technical assistance for non-profits
  family: capacity
  what: 'Much federal capacity-building money goes to an intermediary that then helps other organisations: HUD''s Section
    4 money goes to three national non-profits named in the statute, which pay for training, technical assistance and pass-through
    grants to local groups [1712]. A HUD Community Compass winner provides assistance to others; the award is not for the
    applicant''s own capacity [1715]. Fewer programmes build the applicant itself, as the CDFI Fund''s Technical Assistance
    grants for community development financial institutions do [1433].'
  who_for: 'A non-profit on either side, assisted or provider: SAMHSA''s Rural Opioid Technical Assistance Centers are one
    example of a federal technical-assistance centre that a non-profit can apply to run [1746].'
  how_it_works:
  - 'A local group''s door is often the intermediary: Enterprise Community Partners, Local Initiatives Support Corporation
    and Habitat for Humanity International each run their own process under Section 4 [1712], and only State Service Commissions
    may apply to AmeriCorps for the Volunteer Generation Fund [1796].'
  - 'Awards to run an assistance body are competed directly: HRSA''s Primary Care Association awards fund an organisation
    in each state or region to assist health centres, not to build the applicant''s own services [1741].'
  - 'Help for the applicant itself can come as people: an AmeriCorps VISTA project brings members, not cash, after a concept
    paper and then an application [1723].'
  - 'Notices come at uneven intervals: HUD''s Section 4 notice appears every two to three years [1713] [1712], and SBA''s
    PRIME had no notice between December 2019 and July 2026 [1797].'
  - 'Match rules differ: Section 4 requires three dollars from private sources for each dollar awarded [1783], Museums Empowered
    requires non-federal funds at least equal to the request [1732], and Community Compass requires none [1715].'
  - 'One foundation programme sits here: in Lowe''s Foundation Gable Grants only the round for community and technical colleges
    is an open application [2444].'
  watch: HUD's Section 4 notice (FY 2024 and FY 2025 funds) and FY 2025 Rural Capacity Building notice both closed July
    6, 2026; HUD forecast the FY2026/2027 Community Compass notice for November 5, 2026 and the Distressed Cities Technical
    Assistance notice for January 11, 2027 [1712] [1714] [1715] [1716]. The Office on Violence Against Women's FY 2026 list
    marks its Training and Technical Assistance Initiative as not currently accepting applications [1263]. The House committee's
    summary of its FY27 Transportation-HUD bill, a proposal, gives $42 million for Section 4 [1785]. The President's FY2027
    Budget, a request, carries an Economic Development Administration entry at minus $449 million [1710].
