# scope.yaml — Token for Granted · topic mode · written 2026-10-05. Counts are computed from the pack by source/t5/make_manifest_scope.py.
topic: 'A sister to FAR Out for academic and non-profit grant money: a public site, something very much like FAR Out, that
  helps a university researcher, a research office or a non-profit find and follow a route to grant money, with an opportunity
  search built in'
topic_note: Daniel's first message is not preserved word for word in the session record; this is the request as the requirements
  note recorded it on 2026-10-04. The phrase "something very much like FAR Out" is his.
question: For a university researcher, a research office or a non-profit that wants grant money in the United States, what
  routes exist (research project grants, fellowships and training awards, programme and service grants, capacity and infrastructure
  money, from federal agencies and from foundations), what does each require, who actually decides, and what changed in
  2025-26 that the official pages have not caught up with?
purpose: orientation
boundary:
  in:
  - 'federal grant-making agencies, every field: research, health, education, arts and humanities, agriculture, environment,
    justice, housing, labour'
  - 'private, community and corporate foundations and other private grantmakers: 65 recorded as a labelled editorial sample'
  - 'four route families: research project grants; fellowships, career and training awards; programme and service grants;
    capacity and infrastructure'
  - 'the entry routes: registration, becoming an eligible non-profit, joining as a subrecipient, approaching a foundation,
    general operating support, research at a non-profit that is not a university'
  - 'standing: eligibility that belongs to the institution or its state (EPSCoR and IDeA lists, designated institutions,
    tax status)'
  - 'the gates: registrations, identifiers, assurances and audits'
  - 'the rules beneath every federal award: the Uniform Guidance, indirect costs, termination, and what changed or is contested
    in 2025-26'
  - 'federal formula and pass-through programmes as far as the federal page: who receives the money and whom a non-profit
    applies to'
  out:
  - state and local government grant programmes, and any state's own process for passing federal money on
  - contracts, SBIR/STTR from the firm's side, other transactions and procurement (covered by the sister guide FAR Out)
  - loans, loan guarantees, tax credits and benefits paid to individuals
  - grant-writing technique, and any recommendation of a paid database, consultant or grant writer
  - foundations beyond the sample of 65 (reached through the directory the site builds from IRS data, not through records)
  - funders outside the United States, and United States awards to foreign organisations except where an eligibility rule
    mentions them
  - post-award administration in depth (effort reporting, procurement standards, property), beyond the rules a newcomer
    meets before and at award
  rationale: 'Daniel, 2026-10-04: federal plus foundations, state and local out for the first release; both academic and
    non-profit readers, split by the pathfinder; all four route families in depth; all fields. On 2026-10-05 he ruled that
    pass-through programmes stop at the state door and that the foundations stay as a labelled sample. The rest of the out-list
    was proposed by the builder and not objected to.'
level: 'the applicant organisation and the person named in its application: what each must be, hold and do to enter a route;
  the funder: how it posts, reviews and decides'
time_window:
  current_from: 2024
  seminal: statute, regulation, court rulings and policy guides of any age that govern a route
stance: navigation-with-provenance
depth: deep
anchors:
- citation: FAR Out, the sister guide (danieladamek/far-out)
  why: Daniel asked for something very much like it; its spine, reading level and provenance rules were carried over
- citation: 2 CFR part 200, the Uniform Guidance
  why: the rulebook beneath every federal award; chosen by the builder
- citation: Grants.gov, the NIH Grants Policy Statement and the NSF PAPPG
  why: the official front door and the two largest research funders' policy guides; chosen by the builder
- citation: IRS pages on private foundations and Form 990-PF
  why: the legal ground for the foundation records; chosen by the builder
excluded:
- what: law-firm, association and trade-press commentary as a source of fact
  why: carried only as pointers to a primary source or as flags of a pending change; labelled secondary
- what: third-party foundation directories as the only source for what a foundation funds
  why: foundations are described from their own sites and filings
- what: pages that could not be read by automated fetch (see known_gaps)
  why: read on an official mirror where one exists and marked for re-reading otherwise
assumed: false
interview:
- q: Which funders should the first release cover?
  answer: Federal plus foundations. (Chosen from the options offered; state and local money is out for the first release.)
  asked: '2026-10-04'
- q: Who is the reader?
  answer: Both academic and non-profit, split by the pathfinder. (Chosen from the options offered.)
  asked: '2026-10-04'
- q: How deep should the first release go?
  answer: All four route families in depth. (Chosen from the options offered.)
  asked: '2026-10-04'
- q: Which fields?
  answer: All fields. (Chosen from the options offered.)
  asked: '2026-10-04'
- q: Name?
  answer: 'First "Taken for Granted"; on 2026-10-05: "Want to replace every instance of taken with token / As the naming
    convention goes, that is / Obviously not find and replace in the content"'
  asked: '2026-10-04'
- q: 'Three recommendations: stop pass-through programmes at the state door; list on route pages only programmes a reader
    can act on and let search reach the rest; keep the 65 foundations as a labelled editorial sample?'
  answer: Agree with your recommendation
  asked: '2026-10-05'
- q: Add a question about field to the pathfinder?
  answer: 'no'
  asked: '2026-10-05'
- q: Self-check questions on the primers?
  answer: And let's keep the primer section BUT not include the questions. and let's make that toggle on future builds as
    well
  asked: '2026-10-05'
- q: Where does that toggle sit?
  answer: I guess that's in the "concepts" area? Wherever the questions get presented let's make that something to add rather
    than a default
  asked: '2026-10-05'
- q: 'The outline of eleven sections, one claim each, shown before any prose (TOPIC-WORKFLOW T4): any change?'
  answer: No change asked for; he answered "proceed".
  asked: '2026-10-05'
carried_from_far_out:
- 'situation-first spine: a pathfinder leading into a route catalogue'
- layered reading level
- gates as checklists shown on every route that needs them
- public repository and GitHub Pages
- no connection to any specific university or non-profit in content, examples, branding or repository
- anything personal stays in the visitor's browser
- no reference-manager sync
still_open:
- funders set up by Congress that are neither agency nor foundation (PCORI, the Legal Services Corporation, the Corporation
  for Public Broadcasting) are kept as independent-nonprofit and counted on the federal side by the pathfinder
- edge cases between families (research centres, NIH DP2 and DP5, preservation grants, NIH SuRE) stand as recorded
- the label no-current-notice (82 programmes) reports an absence on the funder's page and on Grants.gov; the alternative
  label would be unconfirmed
