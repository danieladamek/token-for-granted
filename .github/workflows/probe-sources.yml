name: Probe opportunity sources

on:
  workflow_dispatch:
  push:
    paths: ['scripts/probe-sources.mjs', '.github/workflows/probe-sources.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Exits non-zero when any harvest or live source is not 2xx (206 counts) or errors, so a blocked feed shows red.
      # CORS preflight checks are informational and never fail the run.
      - run: node scripts/probe-sources.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-results
          path: probe-results.json
